    var row = o.querySelector('div > div');
    function mk(label, primary, fn) {
      var b = document.createElement('button');
      b.textContent = label;
      b.setAttribute('style', 'border:0;border-radius:99px;padding:9px 16px;font-size:.88rem;cursor:pointer;' + (primary ? 'background:#7b3fa0;color:#fff;' : 'background:#efe2f7;color:#7b3fa0;'));
      b.addEventListener('click', fn);
      row.appendChild(b);
    }
    mk('Обновить страницу', true, function () { location.reload(); });
    mk('Закрыть', false, function () { o.remove(); shown = false; });
    document.body.appendChild(o);

  window.__toast = function (text) {
    var t = document.createElement('div');
    t.textContent = text;
    t.setAttribute('style', 'position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:99998;background:rgba(40,28,52,.94);color:#fff;font:13px system-ui,sans-serif;padding:9px 16px;border-radius:12px;max-width:90vw;text-align:center');

    if (e.message === 'Script error.' && !e.lineno) return;

    window.__toast('Что-то пошло не так. Если зависло - обнови страницу, прогресс сохранён.');
  });

  // Если основной скрипт так и не дошёл до конца — показываем заглушку.
  setTimeout(function () {

  }, 10000);
})();

async function verifySiteAccessCode(candidate) {
  // Проверяем пароль тем же защищённым endpoint, что и остальные запросы.
  // При неверном пароле backend вернёт { ok:false, error:"unauthorized" }.

  u.searchParams.set('access', candidate);

  const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timeout = controller ? setTimeout(() => controller.abort(), 20000) : null;
  try {
    const response = await fetch(u.toString(), {
      cache: 'no-store',
      ...(controller ? { signal: controller.signal } : {}),

    const data = await response.json();
    if (data && data.now != null && Number.isFinite(Number(data.now))) {

    if (data && data.error === 'unauthorized') return { valid: false, networkError: false };
    return { valid: false, networkError: true };

    return { valid: false, networkError: true };
  } finally {
    if (timeout) clearTimeout(timeout);

  // Он используется клиентом для авторизации последующих запросов к Apps Script.
  try { localStorage.setItem(SITE_ACCESS_STORAGE_KEY, candidate); } catch (error) {}

  // Проверка пароля уже вернула доверенное серверное время — не делаем лишний запрос.
  SERVER_TIME_AT_START = result.serverTime;
  PERF_TIME_AT_START = performance.now();
  SERVER_TIME_READY = true;
  SERVER_TIME_FAILED = false;

  if (typeof SITE_ACCESS_RESOLVE === 'function') {
    const resolve = SITE_ACCESS_RESOLVE;
    SITE_ACCESS_RESOLVE = null;
    resolve(SITE_ACCESS_CODE);
  }
}

function ensureSiteAccess() {
  if (SITE_ACCESS_CODE) return Promise.resolve(SITE_ACCESS_CODE);
  if (SITE_ACCESS_PROMISE) return SITE_ACCESS_PROMISE;

  SITE_ACCESS_PROMISE = new Promise((resolve) => {
    SITE_ACCESS_RESOLVE = resolve;
  });

  let savedCode = '';
  try { savedCode = localStorage.getItem(SITE_ACCESS_STORAGE_KEY) || ''; } catch (error) {}

  if (savedCode) {
    showAccessChecking();
    verifySiteAccessCode(savedCode).then((result) => {
      if (result.valid) {
        acceptVerifiedSiteAccess(savedCode, result);
        return;
      }
      // При сетевой ошибке пароль не стираем: сервер мог быть временно недоступен.
      if (!result.networkError) {
        try { localStorage.removeItem(SITE_ACCESS_STORAGE_KEY); } catch (error) {}
      }
      showAccessForm(result.networkError
        ? 'Не удалось связаться с сервером. Проверь соединение и повтори попытку.'
        : 'Сохранённый пароль больше не подходит. Введи актуальный пароль.');
    });
  } else {
    showAccessForm();
  }

  return SITE_ACCESS_PROMISE;
}

async function fetchWithTimeout(url, opts = {}, ms = 20000) {
  // Автоматически добавляем пароль только к API нашего Apps Script, не к аудио и внешним сервисам.
  const isQuestApi = typeof CONFIG !== 'undefined' &&
    (String(url).startsWith(CONFIG.serverEndpoint) || String(url).startsWith(CONFIG.timeEndpoint));
  let requestUrl = url;
  let requestOpts = { ...opts };
  if (isQuestApi) {
    const access = await ensureSiteAccess();
    try {
      const u = new URL(String(url));
      u.searchParams.set('access', access);
      requestUrl = u.toString();
    } catch (e) {
      requestUrl = String(url) + (String(url).includes('?') ? '&' : '?') + 'access=' + encodeURIComponent(access);
    }
    if (typeof requestOpts.body === 'string') {
      try {
        const body = JSON.parse(requestOpts.body);
        body.access = access;
        requestOpts.body = JSON.stringify(body);
      } catch (e) {}
    }
  }
  const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), ms) : null;
  try {
    return await fetch(requestUrl, ctrl ? { ...requestOpts, signal: ctrl.signal } : requestOpts);
  } finally {
    if (timer) clearTimeout(timer);
  }
}

let TIME_RETRY = null;
function scheduleTimeRetry() {
  if (TIME_RETRY) return;
  TIME_RETRY = setTimeout(() => { TIME_RETRY = null; syncTrustedTime(); }, 15000);
}

async function syncTrustedTime() {
  try {
    const res = await fetchWithTimeout(CONFIG.timeEndpoint + '?action=time', {
      cache: 'no-store',
    }, 20000);

    if (!res.ok) {
      throw new Error('Time request failed');
    }

    const data = await res.json();
    const serverTime = Number(data.now);

    if (!Number.isFinite(serverTime)) {
      throw new Error('Invalid server time');
    }

    SERVER_TIME_AT_START = serverTime;
    PERF_TIME_AT_START = performance.now();
    SERVER_TIME_READY = true;
    SERVER_TIME_FAILED = false;

  } catch (e) {
    SERVER_TIME_FAILED = true;
    console.error('Trusted time sync failed:', e);
    scheduleTimeRetry(); // пробуем снова автоматически, пока время не придёт
  }

  if (S.screen === 'v2quiz') {
    render();
  } else if (typeof mountSkipButton === 'function') {
    mountSkipButton();
  }
}

function trustedNowMs() {
  if (!SERVER_TIME_READY) return null;

  return SERVER_TIME_AT_START +
    (performance.now() - PERF_TIME_AT_START);
}

function trustedNow() {
  const ms = trustedNowMs();

  if (ms === null) return null;

  return new Date(ms);
}

/* =======================================================================
   ХРАНЕНИЕ ПРОГРЕССА
   ======================================================================= */
const STORE_PREFIX = 'quest_v1_';

function storeKey(nick) {
  return STORE_PREFIX + nick.trim().toLowerCase().replace(/\s+/g, '_');
}

function makeProgressSnapshot(overrides = {}) {
  return {
    nick: S.nick,
    screen: S.screen,
    index: S.index,
    answers: S.answers,
    unlocked: S.unlocked,
    v2Index: S.v2Index,
    v2Answers: S.v2Answers,
    v2TotalQuestions: V2_QUESTIONS.length,
    preodolevatelPoints: Number(S.preodolevatelPoints) || 0,
    preodolevatelRequiredPoints: Number(CONFIG.preodolevatelRequiredPoints) || 0,
    preodolevatelPassed: !!S.preodolevatelPassed,
    v3Index: S.v3Index,
    v3Answers: S.v3Answers,
    timerRevealed: S.timerRevealed,
    termSeen: S.termSeen,
    questionNavUnlocked: !!S.questionNavUnlocked,
    updatedAt: Date.now(),
    ...overrides,
  };
}

function progressRouteStage(progress) {
  const order = { intro: 0, quiz: 1, final: 2, v2intro: 3, v2quiz: 4, v3transition: 5, v3quiz: 6, v3final: 7 };
  return progress && Object.prototype.hasOwnProperty.call(order, progress.screen)
    ? order[progress.screen]
    : -1;
}

function applyProgress(saved) {
  if (!saved) return false;
  S.index = saved.index || 0;
  S.answers = saved.answers || {};
  S.unlocked = saved.unlocked || false;
  S.v2Index = saved.v2Index || 0;
  S.v2Answers = saved.v2Answers || {};
  S.preodolevatelPoints = Number(saved.preodolevatelPoints ?? saved.preodolevatelCount) || 0;
  S.preodolevatelPassed = !!saved.preodolevatelPassed;
  S.v3Index = saved.v3Index || 0;
  S.v3Answers = saved.v3Answers || [];
  S.timerRevealed = saved.timerRevealed || false;
  S.termSeen = Array.isArray(saved.termSeen) ? saved.termSeen : [];
  S.screen = saved.screen || 'quiz';
  S.questionNavUnlocked = !!saved.questionNavUnlocked || S.screen === 'final';
  if (saved.unlocked) V2_SELF.savedAt[Number(saved.v2Index) || 0] = 1;

  // Восстановление старых сохранений: до фикса перехода II→III мог сохраниться
  // как v2quiz даже после правильного ответа на II-5. Такое состояние продолжается в III.
  const savedFinalV2 = S.v2Answers && S.v2Answers[5];
  const finalV2Passed = !!(savedFinalV2 && (savedFinalV2.passed === true || savedFinalV2.passed === 1 || String(savedFinalV2.passed).toLowerCase() === 'true'));
  if (S.screen === 'v2quiz' && Number(S.v2Index) === 4 && finalV2Passed) {
    S.screen = 'v3transition';
    S.v3Index = 0;
    setTimeout(() => {
      if (S.screen !== 'v3transition' || !S.nick) return;
      saveProgress();
      void syncPlayerToServer('resume-v3-after-interrupted-transition', { screen: 'v3transition', v3Index: 0 });
    }, 0);
  }
  return true;
}

function loadProgress(nick) {
  try {
    const raw = localStorage.getItem(storeKey(nick));
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function saveProgress() {
  if (!S.nick) return;
  try {
    localStorage.setItem(storeKey(S.nick), JSON.stringify(makeProgressSnapshot()));
  } catch (e) {
    /* приватный режим браузера — квест всё равно работает, просто без локального сохранения */
  }
}

function serverSyncEnabled() {
  return Boolean(CONFIG.serverEndpoint) && !CONFIG.serverEndpoint.includes('YOUR-DEPLOYMENT-ID');
}

/* =======================================================================
   ANSWER BANK — ответы/ключи приходят из Google Таблицы, а не из HTML
   ======================================================================= */
let QUESTION_BANK = null;
let QUESTION_BANK_FAILED = false;
let QUESTION_BANK_LOADING = null;

function isValidBank(data) {
  return !!(data && data.v1 && data.v1['1'] && data.v2 && data.v2['1'] && data.codes && data.codes.v2Unlock);
}

/* Банк кэшируется в localStorage: у вернувшихся игроков он появляется мгновенно,
   а свежая версия докачивается в фоне и тихо заменяет кэш. Ждать приходится
   только при самом первом визите на устройстве. */
const BANK_CACHE_KEY = 'quest_bank_cache_v1';

function readBankCache() {
  try {
    const raw = localStorage.getItem(BANK_CACHE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    return isValidBank(d) ? d : null;
  } catch (e) { return null; }
}

function writeBankCache(d) {
  try { localStorage.setItem(BANK_CACHE_KEY, JSON.stringify(d)); } catch (e) {}
}

function fetchBankFromNetwork() {
  if (QUESTION_BANK_LOADING) return QUESTION_BANK_LOADING;
  QUESTION_BANK_LOADING = (async () => {
    try {
      const res = await fetchWithTimeout(CONFIG.serverEndpoint + '?action=question_bank', {
        cache: 'no-store',
      }, 20000);
      if (!res.ok) throw new Error('Question bank request failed');
      const data = await res.json();
      if (!isValidBank(data)) throw new Error('Invalid or empty question bank');
      QUESTION_BANK = data;
      QUESTION_BANK_FAILED = false;
      writeBankCache(data);
      return true;
    } catch (e) {
      console.error('Question bank load failed:', e);
      if (!QUESTION_BANK) QUESTION_BANK_FAILED = true;
      return false;
    } finally {
      QUESTION_BANK_LOADING = null;
    }
  })();
  return QUESTION_BANK_LOADING;
}

async function loadQuestionBank() {
  if (!serverSyncEnabled()) return false;
  if (QUESTION_BANK) return true;
  const cached = readBankCache();
  if (cached) {
    QUESTION_BANK = cached;
    QUESTION_BANK_FAILED = false;
    void fetchBankFromNetwork(); // освежаем в фоне
    return true;
  }
  return fetchBankFromNetwork();
}

function bankEntry(version, n) {
  if (!QUESTION_BANK || !QUESTION_BANK[version]) return null;
  return QUESTION_BANK[version][String(n)] || QUESTION_BANK[version][n] || null;
}

function bankData(version, n) {
  const entry = bankEntry(version, n);
  return entry && entry.data ? entry.data : {};
}

function bankMessage(version, n) {
  const entry = bankEntry(version, n);
  return (entry && entry.success) || 'Правильно!';
}

function bankBadMessage(version, n) {
  const entry = bankEntry(version, n);
  return (entry && entry.bad) || 'Неправильно!';
}

function normalizeBankValue(value, mode) {
  if (mode === 'digits') return digits(value);
  if (mode === 'norm') return norm(value);
  return tight(value);
}

function bankCheck(version, n, value) {
  const entry = bankEntry(version, n);
  if (!entry) return false;

  const mode = entry.mode || 'tight';
  const accepted = Array.isArray(entry.accepted) ? entry.accepted : [];

  if (mode === 'free') return String(value || '').trim().length > 0;

  if (mode === 'contains_tight_any') {
    const t = tight(value);
    return accepted.some(x => t.includes(tight(x)));
  }

  if (mode === 'norm_groups' || mode === 'tight_groups') {
    const probe = normalizeBankValue(value, mode === 'norm_groups' ? 'norm' : 'tight');
    return accepted.some(group =>
      Array.isArray(group) && group.some(x => normalizeBankValue(x, mode === 'norm_groups' ? 'norm' : 'tight') === probe)
    );
  }

  const probe = normalizeBankValue(value, mode);
  return accepted.some(x => normalizeBankValue(x, mode) === probe);
}

function bankMatchGroup(version, n, value) {
  const entry = bankEntry(version, n);
  if (!entry) return null;

  const mode = entry.mode;
  if (mode !== 'norm_groups' && mode !== 'tight_groups') return null;

  const probe = normalizeBankValue(value, mode === 'norm_groups' ? 'norm' : 'tight');
  for (let i = 0; i < entry.accepted.length; i++) {
    const group = entry.accepted[i];
    if (Array.isArray(group) && group.some(x =>
      normalizeBankValue(x, mode === 'norm_groups' ? 'norm' : 'tight') === probe
    )) {
      return i;
    }
  }
  return null;
}

/* ---------- Журнал ответов версии I ----------
   Раньше каждый ответ уходил отдельным запросом (лишняя нагрузка на Apps Script).
   Теперь ответы копятся на устройстве и уходят одним пакетом: при завершении v1,
   при закрытии/сворачивании вкладки и при следующем заходе, если что-то осталось. */
const V1LOG_PREFIX = 'quest_v1log_';
const V1LOG = { nick: null, buffer: [], pending: null, inflight: false };

function v1LogKey(nick) { return V1LOG_PREFIX + storeKey(nick); }

function v1LogPersist() {
  if (!V1LOG.nick) return;
  try {
    if (!V1LOG.buffer.length && !V1LOG.pending) localStorage.removeItem(v1LogKey(V1LOG.nick));
    else localStorage.setItem(v1LogKey(V1LOG.nick), JSON.stringify({ buffer: V1LOG.buffer, pending: V1LOG.pending }));
  } catch (e) {}
}

function v1LogLoad(nick) {
  V1LOG.nick = nick;
  V1LOG.buffer = [];
  V1LOG.pending = null;
  try {
    const r = JSON.parse(localStorage.getItem(v1LogKey(nick)) || 'null');
    if (r && typeof r === 'object') {
      V1LOG.buffer = Array.isArray(r.buffer) ? r.buffer : [];
      V1LOG.pending = r.pending && Array.isArray(r.pending.entries) ? r.pending : null;
    }
  } catch (e) {}
}

function recordV1Answer(question, answer, correct, passed, details = {}) {
  if (!S.nick || !serverSyncEnabled()) return Promise.resolve();
  const a = answer == null ? '' : String(answer);
  if (!a) return Promise.resolve();
  if ((CONFIG.v1NoLogQuestions || []).includes(Number(question))) return Promise.resolve();
  if (V1LOG.nick !== S.nick) v1LogLoad(S.nick);
  V1LOG.buffer.push({ q: Number(question), a: a });
  v1LogPersist();
  return Promise.resolve();
}

async function flushV1Log(keepalive) {
  const L = V1LOG;
  if (!L.nick || !serverSyncEnabled()) return;
  if (L.inflight && Date.now() - (L.inflightAt || 0) < 25000) return;
  if (!L.pending) {
    if (!L.buffer.length) return;
    // id пакета остаётся тем же при повторной отправке — сервер отбросит дубль
    L.pending = {
      id: L.nick + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      entries: L.buffer,
    };
    L.buffer = [];
    v1LogPersist();
  }
  const batch = L.pending;
  L.inflight = true; L.inflightAt = Date.now(); L.bg = !!keepalive || document.hidden;
  if (!L.bg) SaveBanner.saving();
  try {
    const res = await fetchWithTimeout(CONFIG.serverEndpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'record_v1_answers',
        nick: L.nick,
        batchId: batch.id,
        entries: batch.entries,
        sentAt: Date.now(),
      }),
      cache: 'no-store',
      keepalive: !!keepalive,
    }, 25000);
    if (!res.ok) throw new Error('v1 log failed: ' + res.status);
    const data = await res.json();
    if (!data || data.ok !== true) throw new Error('v1 log rejected');
    if (L.pending === batch) L.pending = null;
    v1LogPersist();
  } catch (e) {
    /* пакет остаётся на устройстве и уйдёт при следующей попытке */
  } finally {
    L.inflight = false; const wasBg = L.bg; L.bg = false;
    if (!wasBg && !SAVE_Q.busy) SaveBanner.done();
  }
}

function isV2UnlockCode(value) {
  return !!(QUESTION_BANK && QUESTION_BANK.codes && value === QUESTION_BANK.codes.v2Unlock);
}

// Возвращает: объект игрока | null (игрока нет на сервере) | { __error: true } (сервер не ответил).
// Различие важно: при ошибке сети нельзя считать игрока «новым» и затирать его прогресс.
async function loadServerProgress(nick) {
  if (!serverSyncEnabled()) return null;
  try {
    const url = CONFIG.serverEndpoint + '?action=player&nick=' + encodeURIComponent(nick);
    const res = await fetchWithTimeout(url, { cache: 'no-store' }, 20000);
    if (!res.ok) return { __error: true };
    const data = await res.json();
    if (!data || data.error || data.ok === false) return { __error: true };
    return data.found ? data.player : null;
  } catch (e) {
    return { __error: true };
  }
}

/* ---------- Предзагрузка прогресса, пока игрок вводит ник ---------- */
const PLAYER_PREFETCH = {};
function prefetchServerProgress(nick) {
  if (!serverSyncEnabled()) return Promise.resolve(null);
  const key = nick.trim().toLowerCase();
  const hit = PLAYER_PREFETCH[key];
  if (hit && Date.now() - hit.at < 60000) return hit.p;
  const p = loadServerProgress(nick).then(r => {
    if (r && r.__error) delete PLAYER_PREFETCH[key]; // ошибку не кэшируем
    return r;
  });
  PLAYER_PREFETCH[key] = { at: Date.now(), p };
  return p;
}

/* ---------- Плашка «идёт сохранение» ---------- */
// Плашку не показываем на версии III и во время заставок/переходов (раскрытие версии II,
// переключение версий, трещины и вспышка), чтобы не ломать атмосферу. Сохранение при этом идёт
// как обычно; если оно ещё не закончилось к концу перехода — плашка появится потом.
function saveBannerSuppressed() {
  const sc = S.screen;
  if (sc === 'v3transition' || sc === 'v3quiz' || sc === 'v3final') return true;
  const b = document.body.classList;
  if (b.contains('v2-reveal-seq') || b.contains('version-switching') || b.contains('version-switch-in')) return true;
  // Переход II→III: пауза после верного ответа на II-5 и сама белая заливка с тряской.
  if (b.contains('epic-shake-long')) return true;
  if (sc === 'v2quiz' && S.v2Answers && S.v2Answers[5] && S.v2Answers[5].passed) return true;
  return !!document.querySelector('.crack-overlay, .flash-overlay, .version-switch-overlay, .v3-wash');
}

const SaveBanner = (function () {
  let node = null, showTimer = null, hideTimer = null, visible = false, autoTimer = null, muted = false;

  function ensure() {
    if (node && node.isConnected) return node;
    if (!document.getElementById('save-banner-css')) {
      const st = document.createElement('style');
      st.id = 'save-banner-css';
      st.textContent = '@keyframes sbspin{to{transform:rotate(360deg)}}' +
        '#save-banner{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:99990;' +
        'display:flex;align-items:center;gap:9px;padding:8px 14px;border-radius:99px;' +
        'font:13px/1.3 system-ui,sans-serif;color:#fff;background:rgba(40,28,52,.92);' +
        'box-shadow:0 6px 20px rgba(0,0,0,.28);max-width:92vw;pointer-events:none;' +
        'transition:opacity .25s;opacity:0}' +
        '#save-banner.on{opacity:1}' +
        '#save-banner.warn{background:rgba(150,70,20,.95)}' +
        '#save-banner .sp{width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,255,255,.35);' +
        'border-top-color:#fff;animation:sbspin .8s linear infinite;flex:none}';
      document.head.appendChild(st);
    }
    node = document.createElement('div');
    node.id = 'save-banner';
    document.body.appendChild(node);
    return node;
  }

  function show(text, warn, spin) {
    const n = ensure();
    n.className = warn ? 'warn' : '';
    n.innerHTML = (spin ? '<span class="sp"></span>' : '') + '<span></span>';
    n.lastChild.textContent = text;
    void n.offsetWidth;
    n.classList.add('on');
    visible = true;
  }

  function hide() {
    if (node) node.classList.remove('on');
    visible = false;
  }

  return {
    saving() {
      if (muted || document.hidden) return;
      clearTimeout(hideTimer);
      if (visible) return;
      if (showTimer) return;
      // быстрые сохранения не мигают — плашка появляется, только если ждать дольше ~0.7 с
      showTimer = setTimeout(() => {
        showTimer = null;
        if (saveBannerSuppressed()) return;
        show('Идёт сохранение данных, не закрывайте страницу', false, true);
        clearTimeout(autoTimer);
        autoTimer = setTimeout(() => { muted = true; hide(); }, 4000);
      }, 700);
    },
    retry() {
      if (document.hidden) return;
      clearTimeout(showTimer); showTimer = null;
      clearTimeout(hideTimer);
      if (saveBannerSuppressed()) { hide(); return; }
      show('Не удалось сохранить. Пробуем снова. Не закрывайте страницу', true, true);
    },
    done() {
      muted = false; clearTimeout(autoTimer);
      clearTimeout(showTimer); showTimer = null;
      if (!visible) return;
      if (saveBannerSuppressed()) { hide(); return; }
      show('Всё сохранено ✓', false, false);
      hideTimer = setTimeout(hide, 1500);
    },
    // Вызывается по таймеру: прячет плашку при входе в заставку/версию III и возвращает,
    // если сохранение всё ещё идёт после выхода из неё.
    refresh() {
      if (saveBannerSuppressed()) {
        clearTimeout(showTimer); showTimer = null;
        if (visible) hide();
        return;
      }
      const working = (typeof SAVE_Q !== 'undefined' && (SAVE_Q.busy || SAVE_Q.items.length)) ||
                      (typeof V1LOG !== 'undefined' && V1LOG.inflight && !V1LOG.bg);
      if (!working) muted = false;
      if (working && !visible && !showTimer) this.saving();
    },
  };
})();

/* ---------- Очередь сохранений ----------
   Квест не ждёт ответа сервера: снимок прогресса кладётся в очередь и уходит
   в фоне, по одному, с повтором при сбое. Пока в очереди что-то есть, у
   игрока на устройстве стоит метка «dirty» — при следующем заходе локальный
   прогресс не будет затёрт более старой серверной копией. */
const SAVE_Q = { items: [], busy: false, failStreak: 0 };
let LAST_SENT_SIG = '';
function stateSig(state) {
  try { return JSON.stringify({ ...state, updatedAt: 0 }); } catch (e) { return String(Date.now()); }
}

function dirtyKey(nick) { return 'quest_dirty_' + storeKey(nick); }
function markDirty(nick) { try { localStorage.setItem(dirtyKey(nick), String(Date.now())); } catch (e) {} }
function clearDirty(nick) { try { localStorage.removeItem(dirtyKey(nick)); } catch (e) {} }
function isDirty(nick) { try { return !!localStorage.getItem(dirtyKey(nick)); } catch (e) { return false; } }

function syncPlayerToServer(checkpoint, overrides = {}) {
  if (!S.nick || !serverSyncEnabled()) return Promise.resolve(false);
  void flushV1Log(false);
  const nick = S.nick;
  const payload = {
    action: 'save_player',
    nick: nick,
    checkpoint: checkpoint || 'progress',
    state: makeProgressSnapshot(overrides),
    sentAt: Date.now(),
  };
  markDirty(nick);
  return new Promise(resolve => {
    // Два ожидающих сохранения с одним и тем же чекпойнтом схлопываем в последнее.
    const dup = SAVE_Q.items.find(it => !it.sending && it.nick === nick && it.payload.checkpoint === payload.checkpoint);
    if (dup) {
      dup.payload = payload;
      dup.waiters.push(resolve);
    } else {
      SAVE_Q.items.push({ nick, payload, waiters: [resolve], sending: false });
    }
    void pumpSaves();
  });
}

async function sendSaveNow(item) {
  try {
    // Content-Type: text/plain — принципиально важно для Apps Script: запрос с
    // application/json — это "непростой" CORS-запрос, браузер шлёт перед ним
    // preflight OPTIONS, а Apps Script не умеет на него правильно отвечать
    // (запрос молча падает). text/plain не требует preflight; тело всё равно
    // содержит JSON — Code.gs сам парсит e.postData.contents как JSON.
    const res = await fetchWithTimeout(CONFIG.serverEndpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(item.payload),
      cache: 'no-store',
    }, 25000);
    if (!res.ok) throw new Error('Save failed: ' + res.status);
    const data = await res.json();
    if (!data || data.ok !== true || data.error) throw new Error((data && data.error) || 'Server rejected save');
    LAST_SENT_SIG = stateSig(item.payload.state);
    noteV2Saved(item.payload.state);
    if (data && data.player && data.player.state) {
      // Ответ сервера пишем в localStorage, только если он не старее того,
      // что игрок успел наиграть, пока запрос летел.
      const local = loadProgress(item.nick);
      const localAt = (local && local.updatedAt) || 0;
      const srvAt = Number(data.player.state.updatedAt) || 0;
      if (SAVE_Q.items.length <= 1 && srvAt >= localAt) {
        try { localStorage.setItem(storeKey(item.nick), JSON.stringify(data.player.state)); } catch (e) {}
      }
    }
    return true;
  } catch (e) {
    return false;
  }
}

async function pumpSaves() {
  if (SAVE_Q.busy) return;
  SAVE_Q.busy = true;
  let lastNick = null;
  while (SAVE_Q.items.length) {
    const it = SAVE_Q.items[0];
    lastNick = it.nick;
    it.sending = true;
    SaveBanner.saving();
    const ok = await sendSaveNow(it);
    it.sending = false;
    if (ok) {
      SAVE_Q.items.shift();
      SAVE_Q.failStreak = 0;
      it.waiters.forEach(w => w(true));
    } else {
      SAVE_Q.failStreak += 1;
      SaveBanner.retry();
      await new Promise(r => setTimeout(r, Math.min(3000 * SAVE_Q.failStreak, 15000)));
    }
  }
  SAVE_Q.busy = false;
  if (lastNick) clearDirty(lastNick);
  if (!V1LOG.inflight) SaveBanner.done();
}

window.addEventListener('online', () => { void pumpSaves(); void flushV1Log(false); });
setInterval(() => SaveBanner.refresh(), 500);
document.addEventListener('visibilitychange', () => { if (!document.hidden) void pumpSaves(); });
setInterval(() => { if (S.screen === 'v2quiz' && !document.hidden) void freezeStageStats((Number(S.v2Index) || 0) + 1); }, 20000); // повтор только если снимка ещё нет

// Закрытие вкладки при несохранённых данных: спрашиваем подтверждение и,
// если всё-таки закрыли, пытаемся дослать остаток через keepalive-запрос.
window.addEventListener('beforeunload', (e) => {
  if (SAVE_Q.items.length) { e.preventDefault(); e.returnValue = ''; }
});

/* Версия I не пишет на сервер после каждого ответа. Вместо этого при закрытии или
   сворачивании вкладки (visibilitychange надёжнее beforeunload, особенно на телефонах)
   одним запросом уходят: пакет ответов + текущая позиция в квесте. Если состояние с
   прошлой отправки не менялось — запрос не делается. */
function flushOnHide() {
  if (!S.nick || !serverSyncEnabled()) return;
  void flushV1Log(true);
  if (S.screen === 'quiz') {
    const state = makeProgressSnapshot();
    const sig = stateSig(state);
    if (sig !== LAST_SENT_SIG) {
      LAST_SENT_SIG = sig;
      markDirty(S.nick); // если запрос не дойдёт, при следующем заходе локальный прогресс не потеряется
      try {
        fetch(CONFIG.serverEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'save_player', nick: S.nick, checkpoint: 'v1-exit', state: state, sentAt: Date.now(), access: getSiteAccessCode() }),
          cache: 'no-store',
          keepalive: true,
        });
      } catch (e) {}
    }
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flushOnHide();
});
window.addEventListener('pagehide', () => {
  flushOnHide();
  for (const it of SAVE_Q.items) {
    try {
      fetch(CONFIG.serverEndpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ ...it.payload, access: getSiteAccessCode() }),
        keepalive: true,
      });
    } catch (e) {}
  }
});

  return (v || '').toString().trim().toLowerCase()
    .replace(/ё/g, 'е')
    .replace(/[.,!?;:"'`«»\-–—()]/g, '')
    .replace(/\s+/g, ' ');
}
function tight(v) { return norm(v).replace(/\s+/g, ''); }
function digits(v) { return (v || '').toString().replace(/\D/g, ''); }

/* ---------- Финал III: сообщение и мои ответы приходят с сервера ----------
   В HTML их нет, чтобы нельзя было подсмотреть до конца квеста. Сервер отдаёт их, только если
   игрок дошёл до версии III. Запрос стартует на заставке перед вопросами, так что к финалу данные
   обычно уже готовы. */
let FINALE = null;
let FINALE_LOADING = null;

function loadFinale() {
  if (FINALE) return Promise.resolve(FINALE);
  if (FINALE_LOADING) return FINALE_LOADING;
  if (!S.nick || !serverSyncEnabled()) return Promise.resolve(null);
  FINALE_LOADING = (async () => {
    try {
      const url = CONFIG.serverEndpoint + '?action=finale&nick=' + encodeURIComponent(S.nick);
      const res = await fetchWithTimeout(url, { cache: 'no-store' }, 15000);
      if (!res.ok) throw new Error('finale request failed');
      const data = await res.json();
      if (data && data.locked === false) { FINALE = data; return data; }
      // Помогает понять, почему не пришло личное сообщение: locked (+reason) или error (старый деплой Code.gs).
      console.warn('Finale not available:', data);
      return null;
    } catch (e) {
      console.warn('Finale request failed:', e);
      return null;
    } finally {
      FINALE_LOADING = null;
    }
  })();
  return FINALE_LOADING;
}

/* ---------- Статистика «дошли до вопроса»: игрок всегда считает сам себя ---------- */
const V2_SELF = { savedAt: {}, statsStartedAt: 0, lastFetch: 0 };
let STATS_INFLIGHT = false;

// Приводит ответ ?action=stats к виду «reached[n] = сколько игроков ДОШЛИ до вопроса n».
// Новый Code.gs (v:2) уже присылает именно это. Старый присылал reached[n] = сколько игроков
// ПРОШЛИ вопрос n (q{n}_passed) — из-за этого тот, кто сидит на вопросе и ещё не ответил, не считался.
// Для старого сервера «дошли до n» = «прошли n-1» (а до первого вопроса дошли все, кто в таблице).
function normalizeV2Stats(data) {
  if (!data || !data.reached || data.v >= 2) return data;
  const passed = data.reached;
  const total = Number(data.total) || 0;
  const count = (typeof V2_QUESTIONS !== 'undefined' && V2_QUESTIONS.length) || 5;
  const reached = {};
  for (let n = 1; n <= count; n++) reached[n] = n === 1 ? total : (Number(passed[n - 1]) || 0);
  return Object.assign({}, data, { reached: reached, passed: passed, total: total, v: 2 });
}

function noteV2Saved(state) {
  if (!state || !state.unlocked) return;
  V2_SELF.savedAt[Number(state.v2Index) || 0] = Date.now();
  void refreshV2Stats(true);
}

// «Х из Y дошли до этого вопроса» — СТАТИЧНЫЙ снимок. Считается один раз при заходе на вопрос
// (после того как моё сохранение «я на вопросе N» ушло на сервер) и дальше не меняется:
// ни перерисовки, ни смена вкладки, ни фоновые обновления статистики его не трогают.
// Сбрасывается только при переходе на другой вопрос (или перезагрузке страницы).
const STAGE_SNAP = { n: 0, text: '', busy: false };

function stageStatsText(n) {
  return STAGE_SNAP.n === n ? STAGE_SNAP.text : '';
}

async function waitSavesIdle(ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < ms) {
    if (!SAVE_Q.busy && !SAVE_Q.items.length) return true;
    await new Promise(r => setTimeout(r, 300));
  }
  return false;
}

async function freezeStageStats(n) {
  if (STAGE_SNAP.n === n && (STAGE_SNAP.text || STAGE_SNAP.busy)) return;
  if (STAGE_SNAP.n !== n) { STAGE_SNAP.n = n; STAGE_SNAP.text = ''; }
  STAGE_SNAP.busy = true;
  try {
    // Сначала дожидаемся, пока сервер узнает, что я уже на этом вопросе.
    const synced = await waitSavesIdle(8000);
    let ok = false;
    for (let i = 0; i < 4 && !ok; i++) {
      if (STATS_INFLIGHT) { await new Promise(r => setTimeout(r, 600)); continue; }
      ok = await refreshV2Stats(true);
    }
    if (!ok || !LIVE_V2_STATS || STAGE_SNAP.n !== n) return; // не вышло — повторим позже
    let reached = LIVE_V2_STATS.reached[n] || 0;
    let total = LIVE_V2_STATS.total || 0;
    if (!synced) reached += 1;           // сохранение ещё в пути — считаем себя сами
    reached = Math.max(reached, 1);      // я точно на этом вопросе
    total = Math.max(total, reached);
    STAGE_SNAP.text = reached + ' из ' + total + ' дошли до этого вопроса';
    updateStageStats();
  } finally {
    STAGE_SNAP.busy = false;
  }
}

function updateStageStats() {
  const e = document.querySelector('.stage-stats');
  if (e && e.dataset.n) e.textContent = stageStatsText(Number(e.dataset.n));

async function refreshV2Stats(force) {
  if (!serverSyncEnabled() || STATS_INFLIGHT) return false;
  if (!force && Date.now() - V2_SELF.lastFetch < 15000) return false;
  STATS_INFLIGHT = true;
  const started = Date.now();
  try {
    const res = await fetchWithTimeout(CONFIG.serverEndpoint + '?action=stats', { cache: 'no-store' }, 20000);
    if (!res.ok) return false;
    const data = await res.json();
    if (data && data.reached) {
      LIVE_V2_STATS = normalizeV2Stats(data);
      V2_SELF.statsStartedAt = started;
      V2_SELF.lastFetch = Date.now();
      updateStageStats();
      return true;
    }
    return false;
  } catch (e) {
    /* нет сети — остаёмся на прежних данных */
    return false;
  } finally {
    STATS_INFLIGHT = false;
  }
}

async function refreshChallengeProgress(force = false) {
  if (!serverSyncEnabled()) return null;
  if (CHALLENGES_LOADING && !force) return CHALLENGES_LOADING;

  CHALLENGES_LOADING = (async () => {
    try {
      const url = CONFIG.serverEndpoint + '?action=challenges';
      const res = await fetchWithTimeout(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('Challenges request failed');
      const data = await res.json();
      if (!data || !Array.isArray(data.items)) throw new Error('Invalid challenges data');

      const oldKey = LIVE_CHALLENGES ? JSON.stringify(LIVE_CHALLENGES) : '';
      LIVE_CHALLENGES = data;
      S.preodolevatelPoints = Number(data.completedPoints ?? data.completedCount) || 0;
      S.preodolevatelPassed =
        S.preodolevatelPoints >= Number(CONFIG.preodolevatelRequiredPoints || 0);
      saveProgress();

      if (oldKey !== JSON.stringify(data) && S.screen === 'v2quiz') render();
      return data;
    } catch (e) {
      console.error('Challenge progress load failed:', e);
      return LIVE_CHALLENGES;
    } finally {
      CHALLENGES_LOADING = null;
    }
  })();

  return CHALLENGES_LOADING;
}

// Сколько осталось до срока «Преодолевателя» (до 00:00 04.11 по серверному времени). После срока проходить ещё можно, до preodolevatelEnd.
function preoTimeLeftText(short) {
  const now = trustedNow();
  if (!now) return '…';
  const ms = new Date(CONFIG.preodolevatelDeadline) - now;
  if (ms <= 0) return 'время вышло';
  const s = Math.floor(ms / 1000);
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  const p = n => String(n).padStart(2, '0');
  if (d >= 1) return short ? d + ' д ' + h + ' ч' : d + ' д ' + h + ' ч ' + p(m) + ' мин';
  return p(h) + ':' + p(m) + ':' + p(s % 60);
}

/* =======================================================================
   САУНД-ДИЗАЙН
   Короткие UI-звуки и фон Версии II генерируются через Web Audio API.
   Сюжетный переход I→II и музыка/переход III используют MP3 из CONFIG.
   ======================================================================= */
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const LITE = !!(window.matchMedia && window.matchMedia('(pointer: coarse), (max-width: 640px)').matches); // облегчённые эффекты на телефонах
try { if (IS_IOS && navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (_) {} // звук работает и при беззвучном режиме

// iOS не умеет менять audio.volume (всегда 1). Прогоняем элемент через Web Audio и подменяем volume на GainNode.
function iosRoute(a) {
  if (!IS_IOS || !a || a.__routed) return a;
  const ctx = audioCtx();
  if (!ctx) return a;
  try {
    const src = ctx.createMediaElementSource(a);
    const g = ctx.createGain();
    src.connect(g); g.connect(ctx.destination);
    Object.defineProperty(a, 'volume', {
      configurable: true,
      get() { return g.gain.value; },
      set(v) { g.gain.value = Math.max(0, Math.min(1, Number(v) || 0)); },
    });
    a.__routed = true;
  } catch (_) {}
  return a;
}

const AUDIO = {
  ctx: null,
  master: null,
  ambient: null,
  ambientPulse: null,
  v3Music: null,
  v3MusicPathIndex: 0,
  v2ToV3Sfx: null,
  v2ToV3SfxPathIndex: 0,

const MAMBO = { unlocked: false, on: false, vol: 0.6, bgVol: 0.2, open: false, introPending: false, answerFeedbackHandled: false, lastScreen: 'intro', menuRemountTimer: null };

function preloadV2UnlockSounds() {

function audioCtx() {
  if (AUDIO.ctx) return AUDIO.ctx;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return null;
  try {
    AUDIO.ctx = new Ctx();
    AUDIO.master = AUDIO.ctx.createGain();
    AUDIO.master.gain.value = 0.32;
    AUDIO.master.connect(AUDIO.ctx.destination);
  } catch (_) {
    return null;
  }
  return AUDIO.ctx;
}

function audioResume() {
  const ctx = audioCtx();
  if (!ctx) return null;
  if (ctx.state === 'suspended') ctx.resume().catch(() => {});
  return ctx;
}

function tone(freq, duration, opts = {}) {
  if (MAMBO.on) return;
  const ctx = audioResume();
  if (!ctx || !AUDIO.master) return;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  const filter = ctx.createBiquadFilter();
  const t = ctx.currentTime;
  const endFreq = Math.max(20, opts.toFreq || freq);
  const volume = opts.volume ?? 0.1;
  const attack = opts.attack ?? 0.012;
  const release = opts.release ?? Math.min(0.22, duration * .55);

  o.type = opts.type || 'sine';
  o.frequency.setValueAtTime(Math.max(20, freq), t);
  if (endFreq !== freq) o.frequency.exponentialRampToValueAtTime(endFreq, t + Math.max(.03, duration));
  filter.type = 'lowpass';
  filter.frequency.value = opts.filter || 3200;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0001, volume), t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(attack + .02, duration - release));

  o.connect(filter).connect(g).connect(AUDIO.master);
  o.start(t);
  o.stop(t + duration + .05);
}

function noise(duration = .12, opts = {}) {
  if (MAMBO.on) return;
  const ctx = audioResume();
  if (!ctx || !AUDIO.master) return;
  const len = Math.max(1, Math.floor(ctx.sampleRate * duration));
  const buffer = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource();
  const filter = ctx.createBiquadFilter();
  const g = ctx.createGain();
  const t = ctx.currentTime;
  filter.type = opts.filterType || 'bandpass';
  filter.frequency.value = opts.filter || 1800;
  filter.Q.value = opts.q || 0.7;
  const volume = opts.volume ?? 0.035;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(.0001, volume), t + .008);
  g.gain.exponentialRampToValueAtTime(.0001, t + Math.max(.012, duration - .025));
  src.buffer = buffer;
  src.connect(filter).connect(g).connect(AUDIO.master);
  src.start(t);
  src.stop(t + duration + .03);
}

function startV2Ambient() {

  bus.connect(AUDIO.master);
  const low = ctx.createOscillator();
  const high = ctx.createOscillator();
  const lf = ctx.createBiquadFilter();
  const hg = ctx.createGain();
  const lfo = ctx.createOscillator();

  high.type = 'sine'; high.frequency.value = 104;
  hg.gain.value = 0.035;
  lfo.type = 'sine'; lfo.frequency.value = 0.08;
  lfoGain.gain.value = 0.03;
  humGain.connect(lf).connect(bus);

function stopV2Ambient() {

  if (!AUDIO.ambient) return;
  const ctx = AUDIO.ctx;
  const a = AUDIO.ambient;

/* =======================================================================
   MAMBOMODE — пасхалка. Сюжетные звуки ответа подменяются на ohyeah / wow,
   остальные UI-звуки — на mambo. Общий щелчок пропускается для звука ответа.
   Активация: ввести "mambo" в любое поле (или набрать на клавиатуре вне полей),
   либо вызвать activateMambo() откуда угодно — условие можно поменять тут.
   ======================================================================= */
const MAMBO_KEY = 'quest_mambomode_v2';
const MAMBO_LEGACY_KEY = 'quest_mambomode_v1';
const MAMBO_BASE = {};

function mamboBase(name) {
  if (MAMBO_BASE[name]) return MAMBO_BASE[name];
  const url = CONFIG.mamboSfx && CONFIG.mamboSfx[name];
  if (!url) return null;
  const a = new Audio();
  a.preload = 'auto';
  a.addEventListener('error', () => {
    if (url.startsWith('audio/') && !a.dataset.fb) { a.dataset.fb = '1'; a.src = url.slice(6); a.load(); }
  });
  a.src = url;
  MAMBO_BASE[name] = a;
  return a;
}

function mamboPreload() { if (IS_IOS) ['mambo', 'ohyeah', 'wow'].forEach(mamboLoadBuf); else ['mambo', 'ohyeah', 'wow'].forEach(mamboBase); }

// iOS: короткие звуки Mambomode играем через Web Audio (громкость и высота тона работают).
const MAMBO_BUFFERS = {};
function mamboLoadBuf(name) {
  if (MAMBO_BUFFERS[name] !== undefined) return;
  const ctx = audioCtx(), url = CONFIG.mamboSfx && CONFIG.mamboSfx[name];
  if (!ctx || !url) { MAMBO_BUFFERS[name] = null; return; }
  MAMBO_BUFFERS[name] = 'loading';
  const get = (u, fb) => fetch(u).then(r => { if (!r.ok) throw new Error('bad'); return r.arrayBuffer(); })
    .then(ab => new Promise((res, rej) => ctx.decodeAudioData(ab, res, rej)))
    .catch(e => fb ? get(fb) : Promise.reject(e));
  get(url, url.startsWith('audio/') ? url.slice(6) : null)
    .then(b => { MAMBO_BUFFERS[name] = b; }).catch(() => { MAMBO_BUFFERS[name] = null; });
}
function mamboPlayBuf(name, rate, vol) {
  const b = MAMBO_BUFFERS[name], ctx = audioCtx();
  if (!ctx || !(b instanceof AudioBuffer)) { if (b === undefined) mamboLoadBuf(name); return false; }
  audioResume();
  const src = ctx.createBufferSource(), g = ctx.createGain();
  src.buffer = b; src.playbackRate.value = rate || 1;
  g.gain.value = Math.max(0, Math.min(1, (vol == null ? 1 : vol) * MAMBO.vol));
  src.connect(g); g.connect(ctx.destination); src.start(0);
  return true;
}

function mamboPlay(name, rate, vol) {
  if (IS_IOS && mamboPlayBuf(name, rate, vol)) return;
  const base = mamboBase(name);
  if (!base) return;
  try {
    const a = base.cloneNode(true);
    a.volume = Math.max(0, Math.min(1, (vol == null ? 1 : vol) * MAMBO.vol));
    a.preservesPitch = false; a.mozPreservesPitch = false; a.webkitPreservesPitch = false;
    a.defaultPlaybackRate = rate || 1;
    a.playbackRate = rate || 1;
    a.play().catch(() => {});
  } catch (_) {}
}

function mamboRand(lo, hi) { return lo + Math.random() * (hi - lo); }

function mamboBump() {
  const m = document.querySelector('.mambo-menu');
  if (!m) return;
  m.classList.remove('bump'); void m.offsetWidth; m.classList.add('bump');
  clearTimeout(m.__bumpTimer);
  m.__bumpTimer = setTimeout(() => m.classList.remove('bump'), 260);
}

const MAMBO_MAP = {
  button: () => { mamboPlay('mambo', mamboRand(0.88, 1.2), .8); mamboBump(); },
  correctV1: () => mamboPlay('ohyeah', 1),
  correctV2: () => mamboPlay('ohyeah', 1),
  wrongV1: () => mamboPlay('wow', 1),
  wrongV2: () => mamboPlay('wow', 1),
  apple: () => mamboPlay('mambo', mamboRand(1.3, 1.5), .7),
  record: () => mamboPlay('ohyeah', 1.12),
  clickerDone: () => mamboPlay('ohyeah', .95),
  v2UnlockStart: () => mamboPlay('mambo', 1),
  crack: (level) => mamboPlay('mambo', level === 1 ? .9 : level === 2 ? .75 : .6),
  collapse: () => mamboPlay('mambo', .5),
  v3Transition: () => mamboPlay('mambo', .8),
  versionSwitch: (toV2) => mamboPlay('mambo', toV2 ? .7 : 1.25),
};

// Оборачиваем каждый звук из SFX: в обычном режиме играет оригинал, в mambo — подмена.
Object.keys(SFX).forEach(k => {
  const orig = SFX[k];
  SFX[k] = function () {
    if (MAMBO.on) {
      if (['correctV1', 'wrongV1', 'correctV2', 'wrongV2'].includes(k)) {
        // Не даём общему document-click обработчику успеть проиграть mambo
        // поверх звука ответа. Сбрасываем флаг таймером, а не microtask:
        // microtask может выполниться до всплытия click до document.
        MAMBO.answerFeedbackHandled = true;
        setTimeout(() => { MAMBO.answerFeedbackHandled = false; }, 0);
      }
      const m = MAMBO_MAP[k];
      if (m) m.apply(null, arguments); else mamboPlay('mambo', mamboRand(0.9, 1.2));
      return;
    }
    return orig.apply(SFX, arguments);
  };
});

function saveMambo() {
  try { localStorage.setItem(MAMBO_KEY, JSON.stringify({ unlocked: MAMBO.unlocked, on: MAMBO.on, vol: MAMBO.vol, bgVol: MAMBO.bgVol, vv: 2 })); } catch (_) {}
}

function isMamboV2Screen(screen = S.screen) {
  return screen === 'v2intro' || screen === 'v2quiz';
}
function isMamboV3Screen(screen = S.screen) {
  return screen === 'v3transition' || screen === 'v3quiz' || screen === 'v3final';
}
function isMamboMenuHiddenScreen(screen = S.screen) {
  // В версии II меню доступно; выбранное состояние режима сохраняется.
  // В версии III меню больше не возвращается, но сохранённое состояние не сбрасывается.
  return isMamboV3Screen(screen);
}

function loadMambo() {
  let migrated = false;
  try {
    let raw = localStorage.getItem(MAMBO_KEY);
    if (!raw) {
      raw = localStorage.getItem(MAMBO_LEGACY_KEY);
      migrated = !!raw;
    }
    const r = JSON.parse(raw || 'null');
    if (r && typeof r === 'object') {
      MAMBO.unlocked = !!r.unlocked;
      MAMBO.on = !!r.on;
      if (r.vv === 2 && r.bgVol != null && Number.isFinite(Number(r.bgVol))) MAMBO.bgVol = Math.max(0, Math.min(1, Number(r.bgVol)));
      // Сохраняем старое открытие пасхалки, но старое значение громкости .9
      // не переносим: новое исходное значение — 20%.
      if (!migrated && r.vv === 2 && Number.isFinite(Number(r.vol))) MAMBO.vol = Math.max(0, Math.min(1, Number(r.vol)));
      else MAMBO.vol = 0.6;
    }
    if (migrated) {
      saveMambo();
      localStorage.removeItem(MAMBO_LEGACY_KEY);
    }
  } catch (_) {}
  document.body.classList.toggle('mambo-on', MAMBO.on);
  document.body.classList.toggle('has-mambo', MAMBO.unlocked);
  if (MAMBO.unlocked) mamboPreload();
}

function setMamboOn(v, silent) {
  // Состояние сохраняется между версиями. В версии III переключатель скрыт,
  // но переход туда сам по себе не сбрасывает ранее выбранное значение.
  if (v && isMamboV3Screen()) v = false;
  MAMBO.on = !!v;
  saveMambo();
  document.body.classList.toggle('mambo-on', MAMBO.on);
  // Фоновый гул Версии II независим от Mambomode и не отключается вместе с ним.
  if (termInV2() && !document.body.classList.contains('v2-reveal-seq')) startV2Ambient();
  if (!silent) mamboPlay(MAMBO.on ? 'ohyeah' : 'wow', 1);
  const m = document.querySelector('.mambo-menu');
  if (m) {
    m.classList.toggle('on', MAMBO.on);
    const st = m.querySelector('.mambo-state');
    if (st) st.textContent = MAMBO.on ? 'ON' : 'OFF';
  }
  mamboBgSync();

}

// Звук вспышки (синтезируется, файлов не нужно). Таймлайн совпадает с CSS-анимацией:
//   0 → BURST  нарастающий «заряд»;  BURST  удар и треск вспышки;
//   дальше     искрящиеся ноты и аккорд, в который вспышка перетекает.
// ctx — любой BaseAudioContext (так звук можно отрендерить и проверить без колонок).
const MAMBO_BURST = 0.4;
function mamboFlashSound(ctx, dest, t0, level) {
  const B = t0 + MAMBO_BURST;
  // Слои -> компрессор -> мягкий ограничитель (выход не выше ±1) -> громкость SFX -> выход.
  // Громкость стоит ПОСЛЕ ограничителя, поэтому пик никогда не превысит выставленный уровень.
  const out = ctx.createGain();
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 6; comp.attack.value = 0.002; comp.release.value = 0.2;
  const soft = ctx.createWaveShaper();
  const curve = new Float32Array(2049);
  for (let i = 0; i < curve.length; i++) { const x = i / 1024 - 1; curve[i] = Math.tanh(1.6 * x) / Math.tanh(1.6); }
  soft.curve = curve;
  const master = ctx.createGain();
  master.gain.value = Math.max(0.0001, Math.min(1, level));
  out.connect(comp); comp.connect(soft); soft.connect(master); master.connect(dest);

  // 1) заряд: пила взлетает вверх, фильтр раскрывается
  const riser = ctx.createOscillator(), riserG = ctx.createGain(), riserF = ctx.createBiquadFilter();
  riser.type = 'sawtooth';
  riser.frequency.setValueAtTime(140, t0);
  riser.frequency.exponentialRampToValueAtTime(1900, B);
  riserF.type = 'lowpass'; riserF.Q.value = 4;
  riserF.frequency.setValueAtTime(300, t0);
  riserF.frequency.exponentialRampToValueAtTime(7000, B);
  riserG.gain.setValueAtTime(0.0001, t0);
  riserG.gain.exponentialRampToValueAtTime(0.24, B - 0.03);
  riserG.gain.exponentialRampToValueAtTime(0.0001, B + 0.04);
  riser.connect(riserF); riserF.connect(riserG); riserG.connect(out);
  riser.start(t0); riser.stop(B + 0.06);

  // 2) удар: низкий «бум» + яркий треск шума
  const thump = ctx.createOscillator(), thumpG = ctx.createGain();
  thump.type = 'sine';
  thump.frequency.setValueAtTime(130, B);
  thump.frequency.exponentialRampToValueAtTime(40, B + 0.32);
  thumpG.gain.setValueAtTime(0.0001, B - 0.005);
  thumpG.gain.exponentialRampToValueAtTime(0.65, B + 0.01);
  thumpG.gain.exponentialRampToValueAtTime(0.0001, B + 0.45);
  thump.connect(thumpG); thumpG.connect(out);
  thump.start(B - 0.01); thump.stop(B + 0.5);

  const len = Math.floor(ctx.sampleRate * 0.7);
  const nb = ctx.createBuffer(1, len, ctx.sampleRate);
  const nd = nb.getChannelData(0);
  for (let i = 0; i < len; i++) nd[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource(), noiseF = ctx.createBiquadFilter(), noiseG = ctx.createGain();
  noise.buffer = nb;
  noiseF.type = 'highpass';
  noiseF.frequency.setValueAtTime(5000, B);
  noiseF.frequency.exponentialRampToValueAtTime(1200, B + 0.6);
  noiseG.gain.setValueAtTime(0.0001, B - 0.005);
  noiseG.gain.exponentialRampToValueAtTime(0.38, B + 0.008);
  noiseG.gain.exponentialRampToValueAtTime(0.0001, B + 0.6);
  noise.connect(noiseF); noiseF.connect(noiseG); noiseG.connect(out);
  noise.start(B - 0.01); noise.stop(B + 0.7);

  // 3) искры: быстрые высокие ноты (E-мажор) вверх
  [1318.51, 1567.98, 1975.53, 2637.02, 3135.96, 3951.07].forEach((f, i) => {
    const st = B + 0.02 + i * 0.055;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, st);
    g.gain.exponentialRampToValueAtTime(0.16, st + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, st + 0.38);
    o.connect(g); g.connect(out);
    o.start(st); o.stop(st + 0.4);
  });

  // 4) аккорд, в который вспышка перетекает вместе с меню
  const chord = ctx.createGain(), chordF = ctx.createBiquadFilter();
  chordF.type = 'lowpass'; chordF.frequency.value = 2400;
  chord.gain.setValueAtTime(0.0001, B);
  chord.gain.exponentialRampToValueAtTime(0.5, B + 0.08);
  chord.gain.exponentialRampToValueAtTime(0.0001, B + 1.5);
  chord.connect(chordF); chordF.connect(out);
  [110, 164.81, 220, 329.63, 440, 659.25].forEach((f, i) => {
    const st = B + 0.02 + i * 0.05;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = i < 2 ? 'triangle' : 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, st);
    g.gain.exponentialRampToValueAtTime(0.4, st + 0.07);
    g.gain.exponentialRampToValueAtTime(0.0001, B + 1.4);
    o.connect(g); g.connect(chord);
    o.start(st); o.stop(B + 1.45);
  });
}

/* ---------- Фоновый трек Mambomode (mamboBg.mp3) ----------
   Играет по кругу, пока режим включён. Не играет в версии III (там своя музыка),
   во время кинематографичной заставки версии II и в неактивной вкладке. */
let mamboBgAudio = null;
let mamboBgFade = null;
let mamboBgRetryArmed = false;

function mamboBgEl() {
  if (mamboBgAudio) return mamboBgAudio;
  const url = CONFIG.mamboBg;
  if (!url) return null;
  const a = new Audio();
  iosRoute(a);
  a.loop = true;
  a.preload = 'auto';
  a.volume = 0;
  a.addEventListener('error', () => {
    if (url.startsWith('audio/') && !a.dataset.fb) {
      a.dataset.fb = '1'; a.src = url.slice(6); a.load();
      if (a.__want) mamboBgSync();
    }
  });
  a.src = url;
  mamboBgAudio = a;
  return a;
}

function mamboBgWanted() {
  const b = document.body;
  return MAMBO.on && MAMBO.unlocked && !document.hidden &&
    !isMamboV3Screen() && !b.classList.contains('v3-theme') && !b.classList.contains('v2-reveal-seq');
}

function mamboBgRamp(target, ms, done) {
  const a = mamboBgAudio;
  if (!a) return;
  if (mamboBgFade) { clearInterval(mamboBgFade); mamboBgFade = null; }
  const from = a.volume, t0 = performance.now();
  if (ms <= 0 || Math.abs(from - target) < 0.005) {
    a.volume = Math.max(0, Math.min(1, target));
    if (done) done();
    return;
  }
  mamboBgFade = setInterval(() => {
    const k = Math.min(1, (performance.now() - t0) / ms);
    a.volume = Math.max(0, Math.min(1, from + (target - from) * k));
    if (k >= 1) { clearInterval(mamboBgFade); mamboBgFade = null; if (done) done(); }
  }, 40);
}

// Если браузер заблокировал автозапуск — стартуем при первом жесте пользователя.
function mamboBgArmRetry() {
  if (mamboBgRetryArmed) return;
  mamboBgRetryArmed = true;
  const evs = ['pointerdown', 'keydown', 'touchend'];
  const go = () => {
    mamboBgRetryArmed = false;
    evs.forEach(ev => document.removeEventListener(ev, go, true));
    mamboBgSync();
  };
  evs.forEach(ev => document.addEventListener(ev, go, true));
}

function mamboBgSync() {
  const want = mamboBgWanted();
  if (!want && !mamboBgAudio) return;
  const a = mamboBgEl();
  if (!a) return;
  a.__want = want;
  if (want) {
    if (a.paused) {
      a.volume = 0;
      const p = a.play();
      if (p && p.catch) p.catch(() => { if (!(a.error && a.dataset.fb)) mamboBgArmRetry(); });
      mamboBgRamp(MAMBO.bgVol, 1200);
    } else {
      mamboBgRamp(MAMBO.bgVol, 400);
    }
  } else if (!a.paused) {
    mamboBgRamp(0, 450, () => { if (!a.__want) a.pause(); });
  }
}

function mamboBgApplyVolume() {
  if (mamboBgAudio && mamboBgAudio.__want) mamboBgRamp(MAMBO.bgVol, 0);
}

if (IS_IOS) ['touchend', 'pointerdown', 'click'].forEach(ev => document.addEventListener(ev, () => {
  const c = AUDIO.ctx; if (c && c.state !== 'running') c.resume().catch(() => {}); // iOS любит «усыплять» контекст

function unlockAllAudio() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (_) {}
  const ctx = audioResume();
  try {
    if (ctx) {
      const src = ctx.createBufferSource();
      src.buffer = ctx.createBuffer(1, 1, 22050);
      src.connect(ctx.destination);
      src.start(0);
    }
  } catch (_) {}
  const list = [];
  Object.keys(CONFIG.v2UnlockSfx || {}).forEach(k => { const a = prepareV2UnlockSfx(k); if (a) list.push(a); });
  [prepareV2ToV3Sfx(), ensureV3Music(), ensureMemories(), mamboBgEl()].forEach(a => { if (a) list.push(a); });
  ['mambo', 'ohyeah', 'wow'].forEach(mamboLoadBuf);
  // «Праймим» каждый элемент: беззвучный play/pause внутри жеста снимает блокировку iOS.
  list.forEach(a => {
    try {
      const was = a.muted;
      a.muted = true;
      const done = () => { try { a.pause(); a.currentTime = 0; } catch (_) {} a.muted = was; };
      const p = a.play();
      if (p && p.then) p.then(done).catch(() => { a.muted = was; }); else done();
    } catch (_) {}
  });
}

function handleSecretCodeValue(value) {
  if (!S.unlocked && isV2UnlockCode(value)) triggerV2Unlock();

  const t = e.target;
  if (!t || (t.tagName !== 'INPUT' && t.tagName !== 'TEXTAREA')) return;
  if (t.dataset && t.dataset.nickField) return;

  const v = t.value.trim();
  if (QUESTION_BANK) {
    handleSecretCodeValue(v);
    return;
  }

  // Если игрок успел ввести код во время загрузки Answer Bank,
  // проверим текущее значение сразу после загрузки.
  if (v.length >= 8) {
    void loadQuestionBank().then(() => {
      if (t.isConnected && t.value.trim() === v) handleSecretCodeValue(v);
    });
  }
});

function triggerV2Unlock() {
  if (S.unlocked) return;
  closeSoftKeyboard();
  hideMamboForTransition(false);
  if (MAMBO.on) setMamboOn(false, true); // на переходе I-II Mambomode выключается: без мамбо-музыки и мамбо-звуков
  S.unlocked = true;
  saveProgress();

  const crackLayer = el('div', 'crack-overlay');
  document.body.appendChild(crackLayer);

  const flash = el('div', 'flash-overlay');
  flash.style.background = '#000';
  flash.style.opacity = '0';
  document.body.appendChild(flash);

  const allTimers = [];

  function addCracks(count, spread, duration, delayStep = 0) {
    const baseAngles = [6, -18, 34, -46, 71, -63, 108, 152, -12, 89, 24, -78, 136, -35, 58, -106, 166, -2, 47, -58];
    for (let i = 0; i < count; i++) {
      allTimers.push(setTimeout(() => {
        const line = el('div', 'crack-line');
        const angle = baseAngles[i % baseAngles.length] + (Math.random() * spread * 2 - spread);
        line.style.transform = 'rotate(' + angle.toFixed(1) + 'deg)';
        line.style.top = (12 + Math.random() * 76) + '%';
        line.style.left = (5 + Math.random() * 70) + '%';
        line.style.animationDuration = duration + 'ms';
        crackLayer.appendChild(line);
      }, delayStep * i));
    }
  }

  function burst(className, at, crackCount, spread, crackDuration, extraClass = '') {
    allTimers.push(setTimeout(() => {
      document.body.classList.add(className);
      if (extraClass) document.body.classList.add(extraClass);
      addCracks(crackCount, spread, crackDuration, className === 'v2-shake-large' ? 32 : 48);
      allTimers.push(setTimeout(() => {
        document.body.classList.remove(className);
        if (extraClass) document.body.classList.remove(extraClass);
      }, className === 'v2-shake-large' ? 1380 : className === 'v2-shake-medium' ? 780 : 520));
    }, at));
  }

  // Этап 1: лёгкие трещины + 1.mp3.
  playV2UnlockSfx('crack1');
  allTimers.push(setTimeout(() => {
    burst('v2-shake-small', 0, 4, 4, 280);
  }, 180));

  // Этап 2: уже серьёзно + 2.mp3.
  allTimers.push(setTimeout(() => {
    playV2UnlockSfx('crack2');
  
    setTimeout(() => {
      burst('v2-shake-medium', 0, 8, 9, 360);
    }, 180);
  }, 1450));

  // Этап 3: большой выброс — много трещин, сильная тряска, глитч и 3.mp3.
  allTimers.push(setTimeout(() => {
    playV2UnlockSfx('crack3');
  
    setTimeout(() => {
      burst('v2-shake-large', 0, 20, 28, 520, 'v2-catastrophe');
    }, 220);
  }, 3150));

  // Этап 4: интерфейс первой версии медленно срывается вниз целыми элементами.
  allTimers.push(setTimeout(() => {
    // Финальный коллапс + 4.mp3.
    playV2UnlockSfx('collapse');
    crackLayer.style.transition = 'opacity .95s ease';
    crackLayer.style.opacity = '1';

    const fallLayer = el('div', 'v1-fall-layer');
    document.body.appendChild(fallLayer);

    const originals = Array.from(app.children);
    // Кнопка навигации и открытая панель находятся прямо в body, а не внутри #app.
    // Добавляем их в ту же физическую анимацию падения, если они сейчас видимы.
    Array.from(document.querySelectorAll('.quest-nav-fab, .quest-nav-panel')).forEach((node) => {
      if (!node || !node.isConnected || node.hidden) return;
      const style = getComputedStyle(node);
      if (style.display === 'none' || style.visibility === 'hidden' || Number(style.opacity) === 0) return;
      if (!originals.includes(node)) originals.push(node);
    });
    const falling = [];

    originals.forEach((original, i) => {
      const rect = original.getBoundingClientRect();
      if (!rect.width || !rect.height) return;

      const copy = original.cloneNode(true);
      copy.classList.add('v1-falling-copy');
      copy.removeAttribute('id');
      copy.style.position = 'fixed';
      copy.style.left = rect.left + 'px';
      copy.style.top = rect.top + 'px';
      copy.style.width = rect.width + 'px';
      copy.style.height = rect.height + 'px';
      copy.style.margin = '0';
      copy.style.boxSizing = 'border-box';
      copy.style.zIndex = String(3 + i);

      // Физика падения: каждому элементу задаём собственную горизонтальную скорость,
      // начальную скорость вверх и постоянное ускорение вниз. Никаких промежуточных
      // keyframe-точек — движение рассчитывается непрерывно каждый кадр.
      const dir = Math.random() < 0.5 ? -1 : 1;
      const vx = dir * (85 + Math.random() * 135); // медленно уходим влево/вправо
      const vy0 = -(720 + Math.random() * 230);       // стартовый импульс вверх
      const gravity = 1550 + Math.random() * 350;    // постоянное ускорение вниз
      const delay = i * 45 + Math.random() * 90;
      const rotation = (Math.random() * 2 - 1) * 9;

      copy.style.transform = 'translate3d(0,0,0) rotate(0deg) scale(1)';
      if (!LITE) copy.style.filter = 'blur(0) brightness(1)';
      fallLayer.appendChild(copy);
      falling.push({ copy, rect, vx, vy0, gravity, delay, rotation, startX: rect.left, startY: rect.top, started: false, startTime: 0 });
      original.style.visibility = 'hidden';
    });

    // Запускаем непрерывную физическую траекторию.
    const fallStartedAt = performance.now();
    const animateFalls = (nowTime) => {
      let active = false;
      falling.forEach((item) => {
        const elapsedMs = nowTime - fallStartedAt - item.delay;
        if (elapsedMs < 0) {
          active = true;
          return;
        }
        if (!item.started) {
          item.started = true;
          item.startTime = nowTime;
        }

        const t = (nowTime - item.startTime) / 1000;
        // x = v*t
        // y = v0*t + 1/2*g*t^2
        const x = item.vx * t;
        const y = item.vy0 * t + 0.5 * item.gravity * t * t;
        const rotation = item.rotation * Math.min(1, t / 1.5) + (item.vx < 0 ? -1 : 1) * 2.5 * t;

        item.copy.style.transform = `translate3d(${x.toFixed(2)}px, ${y.toFixed(2)}px, 0) rotate(${rotation.toFixed(2)}deg) scale(${(1 - Math.min(.1, t * .025)).toFixed(3)})`;
        if (!LITE) item.copy.style.filter = `blur(${Math.min(3, t * 0.9).toFixed(2)}px) brightness(${Math.max(.68, 1 - t * .14).toFixed(3)})`;

        const stillVisible = item.startY + y < window.innerHeight + 500;
        if (stillVisible) active = true;
      });

      if (active) requestAnimationFrame(animateFalls);
    };

    requestAnimationFrame(animateFalls);

    // Пока интерфейс падает, экран постепенно уходит в чёрный.
    allTimers.push(setTimeout(() => {
      flash.style.transition = 'opacity 2.8s cubic-bezier(.55,0,.22,1)';
      flash.style.opacity = '1';
    }, 1450));

    allTimers.push(setTimeout(() => {
      fallLayer.remove();
      originals.forEach((p) => { p.style.visibility = ''; });
    }, 4200));
  }, 5150));

  // Только после полного затемнения загружаем тему/DOM Версии II.
  // Чёрная заливка уже должна полностью закрыть старый интерфейс.
  allTimers.push(setTimeout(() => {
    document.body.classList.remove('v2-shake-small', 'v2-shake-medium', 'v2-shake-large', 'v2-catastrophe', 'epic-shake');
    document.body.classList.add('v2-theme', 'v2-reveal-seq');
    crackLayer.remove();
    S.screen = 'v2intro';
    render();
    void syncPlayerToServer('v2-unlock', { screen: 'v2intro' });

    // Пока экран полностью чёрный, проигрываем одноразовый гул перехода (5.mp3).
    // Он остаётся частью самого перехода и не переносится в момент появления UI.
    setTimeout(() => {
      playV2UnlockSfx('blackHum');
    }, 350);

    // Затем начинаем постоянный гул Версии II ещё до появления первого UI-элемента.
    // Он постепенно подмешивается во время затемнения/рассеивания чёрного экрана.
    setTimeout(() => {
      startV2Ambient();
    }, 5200);

    // После нескольких секунд полной темноты начинаем уводить чёрный экран.
    // UI всё ещё скрыт классом v2-reveal-seq и начнёт появляться позже.
    setTimeout(() => {
      flash.style.transition = 'opacity 3.8s cubic-bezier(.2,.75,.25,1)';
      flash.style.opacity = '0';
    }, 3000);

    setTimeout(() => {
      flash.remove();
    }, 6900);

    // Завершаем кинематографичное появление после того, как все элементы успели войти.
    setTimeout(() => {
      document.body.classList.remove('v2-reveal-seq');
      document.body.classList.add('v2-reveal-done');
    }, 14000);
  }, 9500));
}

const TERM = { timer: null, hideTimer: null, typing: null, log: [], openUntil: 0 };

function termInV2() { return S.screen === 'v2intro' || S.screen === 'v2quiz'; }

function termSchedule(delay) {
  clearTimeout(TERM.timer);
  const d = delay != null ? delay : 120000 + Math.random() * 180000; // 2–5 минут
  TERM.timer = setTimeout(termFire, d);
}

function termFire() {
  // Показываем только в Версии II, на видимой вкладке и не во время заставки появления.
  if (!termInV2() || document.hidden || document.body.classList.contains('v2-reveal-seq') || !document.querySelector('.v2-terminal')) {
    TERM.timer = setTimeout(termFire, 15000);
    return;
  }
  if (termDone()) return;
  const shown = termEmit();
  if (shown !== null) termSchedule(); // null — фразы закончились, больше не планируем
}

const TERM_FINAL_TEXT = 'Ладно. Дальше ты сам.';
function termFinalOnII5() { return S.screen === 'v2quiz' && Number(S.v2Index) === 4; }
function termDone() { return Array.isArray(S.termSeen) && S.termSeen.includes('final'); }

function termEmit() {
  let text;
  if (termDone()) return null; // после финальной фразы терминал молчит
  if (termFinalOnII5()) {
    if (!Array.isArray(S.termSeen)) S.termSeen = [];
    S.termSeen.push('final');
    saveProgress();
    text = TERM_FINAL_TEXT;
  } else {
    const seen = Array.isArray(S.termSeen) ? S.termSeen : (S.termSeen = []);
    const pool = [];
    for (let i = 0; i < TERMINAL_MESSAGES.length; i++) if (!seen.includes(i)) pool.push(i);
    if (!pool.length) return null;
    const idx = pool[Math.floor(Math.random() * pool.length)];
    seen.push(idx);
    saveProgress();
    text = TERMINAL_MESSAGES[idx];
  }
  TERM.log.push({ text });
  while (TERM.log.length > 3) TERM.log.shift();
  TERM.openUntil = Date.now() + 22000;
  termPaint(true);
  clearTimeout(TERM.hideTimer);
  TERM.hideTimer = setTimeout(() => {
    const t = document.querySelector('.v2-terminal');
    if (t) t.classList.remove('open');
    document.body.classList.remove('v2-terminal-open');
  }, 22000);
  return true;
}

function termPaint(typeLast) {
  const box = document.querySelector('.v2-terminal');
  if (!box) return;
  document.body.classList.add('v2-terminal-open');
  const log = box.querySelector('.t-log');
  log.innerHTML = '';
  if (TERM.typing) { clearInterval(TERM.typing); TERM.typing = null; }
  TERM.log.forEach((m, i) => {
    const line = el('div', 't-line');
    const txt = document.createElement('span');
    txt.textContent = m.text;
    line.appendChild(txt);
    log.appendChild(line);
    if (typeLast && i === TERM.log.length - 1) {
      let k = 0;
      TERM.typing = setInterval(() => {
        if (!txt.isConnected) { clearInterval(TERM.typing); TERM.typing = null; return; }
        k++;
        txt.textContent = m.text.slice(0, k);
        if (k >= m.text.length) { clearInterval(TERM.typing); TERM.typing = null; }
      }, 45);
    } else {
      txt.textContent = m.text;
    }
  });
  box.classList.add('open');
}

function mountTerminal() {
  if (!document.body.classList.contains('v2-theme')) return;
  if (document.querySelector('.v2-terminal')) return;
  const box = el('div', 'v2-terminal');
  const head = el('div', 't-head');
  head.innerHTML = '&gt;_ TERMINAL <span class="t-cur">█</span>';
  box.appendChild(head);
  box.appendChild(el('div', 't-log'));
  document.body.appendChild(box);
  if (TERM.log.length && Date.now() < TERM.openUntil) termPaint(false); // после перерисовки экрана возвращаем открытое окно
  if (!termDone()) {
    if (!TERM.timer) termSchedule();
    // Попали на II-5 — через несколько секунд терминал говорит последнюю фразу и замолкает.
    if (termFinalOnII5() && !TERM.finalTimer) {
      const tryFinal = () => {
        TERM.finalTimer = null;
        if (termDone() || !termFinalOnII5()) return;
        if (document.hidden || document.body.classList.contains('v2-reveal-seq') || !document.querySelector('.v2-terminal')) {
          TERM.finalTimer = setTimeout(tryFinal, 4000);
          return;
        }
        termEmit(false);
      };
      TERM.finalTimer = setTimeout(tryFinal, 6000);
    }
  } else {
    clearTimeout(TERM.timer); TERM.timer = null;
  }
}

/* ---------- Кнопка «Пропустить квест» ----------
   Появляется после CONFIG.skipQuestFrom по серверному времени.
   Ведёт сразу на Версию III. */
function skipAvailable() {
  const t = trustedNow();
  return !!t && t >= new Date(CONFIG.skipQuestFrom);
}

function mountSkipButton() {
  if (!['quiz', 'final', 'v2intro', 'v2quiz'].includes(S.screen)) return;
  if (!S.nick || !skipAvailable()) return;
  if (document.querySelector('.skip-quest')) return;
  const b = el('button', 'skip-quest', 'Пропустить квест →');
  b.title = 'Перейти сразу к версии III';
  b.addEventListener('click', () => {
    if (!window.confirm('Пропустить весь квест и перейти сразу к версии III?')) return;
    closeSoftKeyboard();
    stopChallengePolling();
    S.screen = 'v3transition';
    S.v3Index = 0;
    saveProgress();
    void syncPlayerToServer('skip-to-v3', { screen: 'v3transition' });
    render();
  });
  document.body.appendChild(b);
}

/* ---------- Навигация по вопросам для всех игроков после финала Версии I ---------- */
let QUESTION_NAV_OPEN = false;
let QUESTION_NAV_PANEL = null;

function v2QuestionPassed(n) {
  const value = S.v2Answers && S.v2Answers[n] ? S.v2Answers[n].passed : false;
  return value === true || value === 1 || String(value).toLowerCase() === 'true';
}

function getNavigableV2Questions() {
  const passed = V2_QUESTIONS.map(q => v2QuestionPassed(q.n));
  const firstUnpassed = passed.findIndex(value => !value);
  return V2_QUESTIONS.filter((q, index) => passed[index] || index === firstUnpassed);
}

function paintQuestionNavigator(panel) {
  if (!panel) return;
  panel.innerHTML = '';
  const isV2 = S.screen === 'v2quiz';
  const items = isV2 ? getNavigableV2Questions() : QUESTIONS;
  const currentIndex = isV2 ? Number(S.v2Index) : (S.screen === 'quiz' ? Number(S.index) : -1);

  const head = el('div', 'quest-nav-head');
  head.appendChild(el('div', 'quest-nav-title', isV2 ? 'Навигация · Версия II' : 'Выбор вопроса'));
  const close = el('button', 'quest-nav-close', '×');
  close.type = 'button';
  close.setAttribute('aria-label', 'Закрыть навигацию');
  close.addEventListener('click', () => {
    QUESTION_NAV_OPEN = false;
    if (QUESTION_NAV_PANEL) QUESTION_NAV_PANEL.hidden = true;
    const fab = document.querySelector('.quest-nav-fab');
    if (fab) fab.setAttribute('aria-expanded', 'false');
  });
  head.appendChild(close);
  panel.appendChild(head);

  panel.appendChild(el('p', 'quest-nav-note', isV2
    ? 'Доступны пройденные испытания и ближайшее ещё не пройденное.'
    : 'Выбери вопрос для перехода.'));

  const grid = el('div', 'quest-nav-grid');
  items.forEach(q => {
    const passed = isV2 && v2QuestionPassed(q.n);
    const btn = el('button', 'quest-nav-chip' + (passed ? ' is-passed' : '') + (q.n - 1 === currentIndex ? ' is-current' : ''),
      (isV2 ? 'II-' : '') + q.n + (passed ? ' ✓' : ''));
    btn.type = 'button';
    btn.setAttribute('aria-current', q.n - 1 === currentIndex ? 'page' : 'false');
    btn.addEventListener('click', () => {
      if (isV2) {
        // Повторная проверка перед переходом, чтобы устаревшая открытая панель
        // не позволяла выбрать вопрос, ставший недоступным после обновления состояния.
        const available = getNavigableV2Questions().some(item => item.n === q.n);
        if (!available) {
          paintQuestionNavigator(panel);
          return;
        }
        S.screen = 'v2quiz';
        S.v2Index = q.n - 1;
        saveProgress();
        void syncPlayerToServer('v2-question-navigation', { screen: 'v2quiz' });
      } else {
        S.screen = 'quiz';
        S.index = q.n - 1;
        saveProgress();
        void syncPlayerToServer('v1-question-navigation', { screen: 'quiz' });
      }
      QUESTION_NAV_OPEN = false;
      render();
    });
    grid.appendChild(btn);
  });
  panel.appendChild(grid);
}

function refreshQuestionNavigator() {
  if (QUESTION_NAV_OPEN && QUESTION_NAV_PANEL && QUESTION_NAV_PANEL.isConnected) {
    paintQuestionNavigator(QUESTION_NAV_PANEL);
  }
}

function mountQuestionNavigator() {
  if (!S.questionNavUnlocked || !S.nick) return;
  if (!['quiz', 'final', 'v2quiz'].includes(S.screen)) return;

  const fab = el('button', 'quest-nav-fab', 'Вопросы');
  fab.type = 'button';
  fab.setAttribute('aria-haspopup', 'dialog');
  fab.setAttribute('aria-expanded', 'false');
  fab.setAttribute('aria-controls', 'quest-nav-panel');

  const panel = el('div', 'quest-nav-panel');
  panel.id = 'quest-nav-panel';
  panel.setAttribute('role', 'dialog');
  panel.setAttribute('aria-label', 'Навигация по вопросам');
  panel.hidden = true;
  QUESTION_NAV_PANEL = panel;
  QUESTION_NAV_OPEN = false;
  paintQuestionNavigator(panel);

  fab.addEventListener('click', () => {
    QUESTION_NAV_OPEN = !QUESTION_NAV_OPEN;
    panel.hidden = !QUESTION_NAV_OPEN;
    fab.setAttribute('aria-expanded', QUESTION_NAV_OPEN ? 'true' : 'false');
    if (QUESTION_NAV_OPEN) paintQuestionNavigator(panel);
  });

  document.body.appendChild(fab);
  document.body.appendChild(panel);

function formatTimerParts(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return {
    h: Math.floor(s / 3600),
    m: Math.floor((s % 3600) / 60),
    sec: s % 60,
  };
}

function setTimerPart(node, value, key, state) {
  const text = key === 'h' ? String(value) : String(value).padStart(2, '0');
  if (state[key] !== value) {
    node.textContent = text;
    node.classList.remove('timer-tick');
    void node.offsetWidth;
    node.classList.add('timer-tick');
  }
  state[key] = value;
}

function mountGlobalTimer() {
  if (!S.timerRevealed) return;
  if (S.screen === 'v3transition' || S.screen === 'v3quiz' || S.screen === 'v3final') return;
  if (document.querySelector('.global-timer')) return;
  const start = new Date(CONFIG.birthdayStart);
  const end = new Date(CONFIG.birthdayEnd);
  const bar = el('div', 'global-timer');
  const icon = el('span', null);
  const value = el('span', null);
  bar.appendChild(icon);
  bar.appendChild(value);
  document.body.appendChild(bar);

  value.innerHTML = '<span class="timer-h"></span>:<span class="timer-m"></span>:<span class="timer-sec"></span>';
  const h = value.querySelector('.timer-h');
  const m = value.querySelector('.timer-m');
  const sec = value.querySelector('.timer-sec');
  const state = { h: null, m: null, sec: null, mode: null };

  function tick() {
    if (!document.body.contains(bar)) { clearInterval(globalTimerInterval); globalTimerInterval = null; return; }
    const t = trustedNow();
    if (t >= end) {
      icon.textContent = '';
      value.textContent = 'С днём рождения!';
      value.classList.remove('timer-tick');
      state.mode = 'done';
      return;
    }

    const before = t < start;
    const ms = before ? start - t : end - t;
    const mode = before ? 'before' : 'during';
    if (state.mode !== mode) {
      icon.textContent = before ? '' : '🎉 ';
      state.mode = mode;
      state.h = state.m = state.sec = null;
    }
    const parts = formatTimerParts(ms);
    setTimerPart(h, parts.h, 'h', state);
    setTimerPart(m, parts.m, 'm', state);
    setTimerPart(sec, parts.sec, 'sec', state);
  }
  tick();
  globalTimerInterval = setInterval(tick, 1000);
}

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

// Закрываем экранную клавиатуру при смене экрана/вопроса.
function isEditableFocus(node) {
  if (!(node instanceof HTMLElement)) return false;
  const tag = node.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || node.isContentEditable;
}

function closeSoftKeyboard() {
  const active = document.activeElement;
  if (isEditableFocus(active)) {
    try { active.blur(); } catch (_) {}
  }
  updateQuestViewportGap();
  setTimeout(updateQuestViewportGap, 120);
}

// visualViewport позволяет учесть часть нижней панели браузера на мобильных устройствах.
// CSS также оставляет резервный отступ, поскольку не все браузеры сообщают об этой панели.
function updateQuestViewportGap() {
  let gap = 0;
  const vv = window.visualViewport;
  const mobile = !!(window.matchMedia && window.matchMedia('(max-width: 640px), (pointer: coarse)').matches);
  if (mobile && vv) {
    const active = document.activeElement;
    const keyboardLikelyOpen = isEditableFocus(active) && vv.height < window.innerHeight * 0.72;
    if (!keyboardLikelyOpen) {
      gap = Math.max(0, window.innerHeight - (vv.height + vv.offsetTop));
    }
  }
  document.documentElement.style.setProperty('--quest-vv-bottom-gap', Math.round(Math.min(140, gap)) + 'px');
}

window.addEventListener('resize', updateQuestViewportGap, { passive: true });
window.addEventListener('orientationchange', () => setTimeout(updateQuestViewportGap, 120), { passive: true });
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', updateQuestViewportGap, { passive: true });
  window.visualViewport.addEventListener('scroll', updateQuestViewportGap, { passive: true });
}
updateQuestViewportGap();
