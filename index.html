<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Опросик в честь 20-летия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdf7ef;
    --bg-alt: #f6ecdd;
    --card: #ffffff;
    --ink: #2f2038;
    --ink-soft: #6b5a76;
    --accent: #7b3fa0;
    --accent-soft: #efe2f7;
    --gold: #e0a52e;
    --ok: #2f8f5b;
    --ok-bg: #e4f5ea;
    --bad: #c0503f;
    --bad-bg: #fbe8e4;
    --line: #e7dbcb;
    --code-bg: #2f2038;
    --code-ink: #ffd479;
    --display: 'Fraunces', Georgia, serif;
    --body: 'Nunito', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
 
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 12% 8%, rgba(224,165,46,.16), transparent 42%),
      radial-gradient(circle at 88% 4%, rgba(123,63,160,.14), transparent 40%),
      var(--bg);
    color: var(--ink);
    font-family: var(--body);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 64px;
  }

  .wrap { width: 100%; max-width: 620px; }

  .topbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
    font-size: .85rem;
    color: var(--ink-soft);
  }
  .topbar strong { color: var(--accent); font-weight: 700; }

  .track { height: 6px; background: var(--bg-alt); border-radius: 99px; overflow: hidden; margin-bottom: 18px; }
  .track > div { height: 100%; background: linear-gradient(90deg, var(--gold), var(--accent)); border-radius: 99px; transition: width .35s ease; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 28px 26px 26px;
    box-shadow: 0 14px 34px -22px rgba(47,32,56,.4);
    position: relative;
    animation: rise .34s ease;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  h1 { font-family: var(--display); font-size: clamp(1.7rem, 5.5vw, 2.3rem); margin: 0 0 12px; line-height: 1.15; }
  h2 { font-family: var(--display); font-size: clamp(1.25rem, 4.4vw, 1.6rem); margin: 0 0 8px; line-height: 1.25; font-weight: 700; }
  .q { font-family: var(--display); font-size: clamp(1.2rem, 4.2vw, 1.5rem); font-weight: 700; line-height: 1.3; margin: 0; }
  .hint { color: var(--ink-soft); font-size: .92rem; margin: 10px 0 0; line-height: 1.5; }
  p.lead { font-size: 1.02rem; line-height: 1.6; margin: 0 0 6px; }

  label.field { display: block; margin-top: 18px; }
  input[type=text], textarea {
    width: 100%;
    font-family: var(--body);
    font-size: 1rem;
    color: var(--ink);
    background: var(--bg);
    border: 1.5px solid var(--line);
    border-radius: 11px;
    padding: 12px 14px;
    outline: none;
    transition: border-color .18s ease;
  }
  input[type=text]:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 86px; }

  .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; align-items: center; }

  button {
    font-family: var(--body);
    font-size: .97rem;
    font-weight: 700;
    border: none;
    border-radius: 11px;
    padding: 11px 20px;
    cursor: pointer;
    transition: transform .12s ease, filter .18s ease;
  }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: default; }
  .primary { background: var(--accent); color: #fff; }
  .primary:hover:not(:disabled) { filter: brightness(1.08); }
  .ghost { background: var(--accent-soft); color: var(--accent); }
  .ghost:hover:not(:disabled) { filter: brightness(.97); }
  .wide { width: 100%; }

  .verdict { margin-top: 14px; font-weight: 700; font-size: 1rem; }
  .verdict.ok { color: var(--ok); animation: popIn .4s ease; }
  .verdict.bad { color: var(--bad); animation: shakeX .45s ease; }
  .verdict.neutral { color: var(--accent); animation: popIn .4s ease; }
  @keyframes popIn { 0% { opacity: 0; transform: scale(.85); } 60% { opacity: 1; transform: scale(1.05); } 100% { transform: scale(1); } }
  @keyframes shakeX {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); } 40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); } 80% { transform: translateX(4px); }
  }

  button.q {
    font-family: var(--display); font-weight: 700; line-height: 1.3;
    color: var(--ink); background: none; border: 2px dashed var(--accent); border-radius: 12px;
    padding: 14px 16px; cursor: pointer; display: block; width: 100%; text-align: center;
    transition: background .2s ease, transform .15s ease;
  }
  button.q:hover { background: var(--accent-soft); }
  button.q:active { transform: scale(.98); }

  .stage-stats { font-size: .78rem; color: var(--ink-soft); margin-top: 8px; }

  .stealth { color: var(--card); transition: color .45s ease; cursor: default; }
  .stealth:hover { color: var(--ink); }

  .codebox {
    margin-top: 14px;
    font-family: var(--mono);
    font-size: .88rem;
    background: var(--code-bg);
    color: var(--code-ink);
    border-radius: 10px;
    padding: 12px 14px;
    overflow-x: auto;
    white-space: pre;
  }

  .guesses { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
  .chip { font-size: .82rem; font-weight: 700; padding: 5px 11px; border-radius: 8px; }
  .chip.ok { background: var(--ok-bg); color: var(--ok); }
  .chip.bad { background: var(--bad-bg); color: var(--bad); }
  .counter { margin-top: 12px; font-size: .9rem; color: var(--ink-soft); font-weight: 600; }

  /* Q4 — фейковая реклама */
  .ad {
    position: absolute;
    top: -14px;
    right: -10px;
    background: #d62300;
    color: #ffc72c;
    font-family: var(--body);
    font-weight: 700;
    font-size: .82rem;
    line-height: 1.25;
    text-align: center;
    padding: 9px 13px;
    border-radius: 12px;
    box-shadow: 0 8px 20px -8px rgba(0,0,0,.45);
    cursor: pointer;
    transform: rotate(4deg);
    animation: rise .4s ease;
    z-index: 5;
  }
  .ad span { display: block; font-size: .95rem; letter-spacing: .01em; }
  @media (max-width: 520px) { .ad { top: -12px; right: -4px; font-size: .74rem; padding: 7px 10px; } }

  /* Q8 — кликер */
  .clicker-stage { position: relative; min-height: 360px; margin-top: 16px; overflow: hidden; border-radius: 12px; background: var(--bg-alt); }
  .clicker-core { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 3; }
  .bigbutton {
    width: 118px; height: 118px; border-radius: 50%;
    background: var(--accent);
    color: #fff; font-size: 1.05rem; font-weight: 700;
    box-shadow: 0 10px 22px -10px rgba(123,63,160,.8);
  }
  .clicks { font-family: var(--display); font-size: 2rem; font-weight: 700; }
  .noise { position: absolute; font-family: var(--body); font-weight: 700; color: var(--accent); opacity: .55; pointer-events: none; z-index: 2; white-space: normal; max-width: calc(100% - 16px); overflow-wrap: anywhere; text-align: center; }
  .noise.code { font-family: var(--mono); font-weight: 600; color: var(--ink-soft); opacity: .5; font-size: .78rem; }

  .timer-tick { animation: timerTick .34s ease; }
  @keyframes timerTick {
    0% { opacity: .45; transform: scale(1.08); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* Q18 — скрытые надписи */
  .haystack { position: relative; min-height: 480px; margin-top: 14px; border-radius: 12px; overflow: hidden; }
  .straw { position: absolute; white-space: nowrap; cursor: default; transition: color .25s ease, transform .25s ease, opacity .25s ease, text-shadow .25s ease; }
  .straw:hover { color: var(--ink-soft) !important; }
  .straw.correct-target:hover {
    color: rgba(123,63,160,.42) !important;
    transform: scale(1.06);
    text-shadow: 0 0 10px rgba(123,63,160,.16);
  }
  body.v2-theme .straw.correct-target:hover {
    color: rgba(201,166,255,.48) !important;
    text-shadow: 0 0 12px rgba(201,166,255,.18);
  }

  .final-secret {
    display: block;
    margin-top: 34px;
    font-family: var(--mono);
    font-size: .74rem;
    line-height: 1.6;
    white-space: pre-wrap;
    color: #fbf6ee;
    transition: color .5s ease;
    cursor: default;
  }
  .final-secret:hover { color: var(--ink-soft); }

  .switchline { margin-top: 20px; font-size: .84rem; color: var(--ink-soft); text-align: center; }
  .switchline button { background: none; color: var(--accent); padding: 4px 6px; text-decoration: underline; font-size: .84rem; }

  /* ===================== ВЕРСИЯ II — тёмная тема ===================== */
  body.v2-theme {
    --bg: #17101f;
    --bg-alt: #221733;
    --card: #221733;
    --ink: #f2e9ff;
    --ink-soft: #b6a0cf;
    --accent: #c9a6ff;
    --accent-soft: #33234a;
    --gold: #f2b705;
    --ok: #8fd19e;
    --ok-bg: #223529;
    --bad: #e98a7e;
    --bad-bg: #3a2224;
    --line: #3a2850;
    --code-bg: #0f0a17;
    --code-ink: #f2b705;
  }
  body.v2-theme .card {
    box-shadow: 0 18px 40px -20px rgba(0,0,0,.6);
    position: relative;
    animation: v2Materialize .75s cubic-bezier(.2,.8,.3,1);
  }
  body.v2-theme .topbar { animation: v2FadeIn .5s ease; }
  @keyframes v2Materialize {
    0% { opacity: 0; transform: scale(.92) translateY(16px); filter: blur(6px); }
    60% { filter: blur(0); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes v2FadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  body.v2-theme { padding-top: 46px; }
  body.v2-theme .q { text-align: center; font-size: clamp(1.5rem, 6vw, 2.1rem); }
  body.v2-theme .row { justify-content: center; }
  body.v2-theme .hint { text-align: center; }

  /* ===================== ЭПИЧНОЕ РАЗРУШЕНИЕ ===================== */
  @keyframes epicShake {
    0%, 100% { transform: translate(0,0); }
    10% { transform: translate(-4px,3px) rotate(-.18deg); }
    20% { transform: translate(5px,-4px) rotate(.18deg); }
    30% { transform: translate(-7px,2px) rotate(-.24deg); }
    40% { transform: translate(8px,6px) rotate(.22deg); }
    50% { transform: translate(-6px,-7px) rotate(-.18deg); }
    60% { transform: translate(10px,3px) rotate(.28deg); }
    70% { transform: translate(-8px,-5px) rotate(-.2deg); }
    80% { transform: translate(6px,7px) rotate(.16deg); }
    90% { transform: translate(-4px,2px) rotate(-.12deg); }
  }
  body.epic-shake { animation: epicShake .85s linear 1; }
  body.epic-shake-long { animation: epicShake .82s linear infinite; }

  @keyframes v2ShakeSmall {
    0%,100% { transform: translate(0,0) rotate(0); }
    20% { transform: translate(-2px,1px) rotate(-.08deg); }
    40% { transform: translate(3px,-2px) rotate(.09deg); }
    60% { transform: translate(-3px,2px) rotate(-.07deg); }
    80% { transform: translate(2px,1px) rotate(.06deg); }
  }
  @keyframes v2ShakeMedium {
    0%,100% { transform: translate(0,0) rotate(0); }
    16% { transform: translate(-6px,3px) rotate(-.2deg); }
    32% { transform: translate(6px,-5px) rotate(.22deg); }
    48% { transform: translate(-7px,4px) rotate(-.2deg); }
    64% { transform: translate(8px,5px) rotate(.24deg); }
    80% { transform: translate(-5px,-4px) rotate(-.16deg); }
  }
  @keyframes v2ShakeLarge {
    0%,100% { transform: translate(0,0) rotate(0) scale(1); filter: none; }
    10% { transform: translate(-12px,7px) rotate(-.5deg) scale(1.002); filter: contrast(1.08); }
    22% { transform: translate(10px,-9px) rotate(.55deg) scale(.998); }
    34% { transform: translate(-15px,4px) rotate(-.58deg) scale(1.003); filter: saturate(1.35); }
    46% { transform: translate(14px,10px) rotate(.52deg) scale(.998); }
    58% { transform: translate(-11px,-8px) rotate(-.48deg) scale(1.004); filter: contrast(1.18); }
    70% { transform: translate(16px,5px) rotate(.6deg) scale(.997); }
    82% { transform: translate(-9px,8px) rotate(-.42deg) scale(1.003); filter: saturate(1.5) contrast(1.1); }
  }
  body.v2-shake-small { animation: v2ShakeSmall .48s cubic-bezier(.36,.07,.19,.97) 1; }
  body.v2-shake-medium { animation: v2ShakeMedium .72s cubic-bezier(.36,.07,.19,.97) 1; }
  body.v2-shake-large { animation: v2ShakeLarge 1.35s cubic-bezier(.36,.07,.19,.97) 1; }

  /* Третий удар — уже почти поломка: вспышки, цветовой сдвиг и короткие рывки. */
  body.v2-catastrophe {
    animation: v2ShakeLarge 1.35s cubic-bezier(.36,.07,.19,.97) 1, v2Catastrophe .23s steps(2,end) 4;
  }
  body.v2-catastrophe::after {
    content: ''; position: fixed; inset: 0; z-index: 54; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent 0 7px, rgba(255,255,255,.055) 7px 9px);
    mix-blend-mode: screen;
    animation: v2ScanBurst .18s steps(2,end) 6;
  }
  @keyframes v2Catastrophe {
    0%,100% { opacity: 1; }
    50% { opacity: .62; }
  }
  @keyframes v2ScanBurst {
    0%,100% { transform: translateY(0); opacity: .05; }
    50% { transform: translateY(8px); opacity: .7; }
  }

  body.v2-reveal-seq .hud-ticker,
  body.v2-reveal-seq .hud-telemetry,
  body.v2-reveal-seq .hud-wave,
  body.v2-reveal-seq .version-toggle,
  body.v2-reveal-seq .debug-fab,
  body.v2-reveal-seq .card,
  body.v2-reveal-seq .topbar,
  body.v2-reveal-seq .global-timer {
    opacity: 0;
    animation-fill-mode: forwards;
  }
  body.v2-reveal-seq .hud-ticker { animation: v2UiIn .9s cubic-bezier(.16,1,.3,1) 2.7s forwards !important; }
  body.v2-reveal-seq .hud-telemetry { animation: v2TelemetryIn 1.1s cubic-bezier(.16,1,.3,1) 3.25s forwards !important; }
  body.v2-reveal-seq .hud-wave { animation: v2WaveIn 1.2s cubic-bezier(.16,1,.3,1) 3.75s forwards !important; }
  body.v2-reveal-seq .version-toggle { animation: v2UiIn .95s cubic-bezier(.16,1,.3,1) 4.25s forwards !important; }
  body.v2-reveal-seq .debug-fab { animation: v2UiIn .95s cubic-bezier(.16,1,.3,1) 4.65s forwards !important; }
  body.v2-reveal-seq .topbar { animation: v2TopbarIn 1.05s cubic-bezier(.16,1,.3,1) 5.05s forwards !important; }
  body.v2-reveal-seq .card { animation: v2CardIn 1.35s cubic-bezier(.16,1,.3,1) 5.65s forwards !important; }
  body.v2-reveal-seq .global-timer { animation: v2UiIn 1s cubic-bezier(.16,1,.3,1) 6.35s forwards !important; }
  body.v2-reveal-seq .card h1 { opacity: 0; animation: v2TextIn .9s cubic-bezier(.16,1,.3,1) 6.75s forwards !important; }
  body.v2-reveal-seq .card p { opacity: 0; animation: v2TextIn .85s cubic-bezier(.16,1,.3,1) 7.2s forwards !important; }
  body.v2-reveal-seq .card button { opacity: 0; animation: v2ButtonIn 1s cubic-bezier(.16,1,.3,1) 7.75s forwards !important; }
  /* После кинематографичного появления не запускаем базовые анимации повторно при снятии v2-reveal-seq. */
  body.v2-reveal-done .hud-ticker,
  body.v2-reveal-done .hud-telemetry,
  body.v2-reveal-done .hud-wave,
  body.v2-reveal-done .version-toggle,
  body.v2-reveal-done .debug-fab,
  body.v2-reveal-done .card,
  body.v2-reveal-done .topbar,
  body.v2-reveal-done .global-timer {
    opacity: 1;
    animation: none !important;
  }
  body.v2-reveal-done .hud-wave {
    transform: translateX(-50%) !important;
  }
  body.v2-reveal-done .card h1,
  body.v2-reveal-done .card p,
  body.v2-reveal-done .card button {
    opacity: 1;
    animation: none !important;
    transform: none !important;
    filter: none !important;
    clip-path: none !important;
  }
  @keyframes v2UiIn {
    0% { opacity: 0; transform: translateY(14px) scale(.94); filter: blur(10px); clip-path: inset(0 38% 0 38%); }
    58% { opacity: .92; transform: translateY(-2px) scale(1.015); filter: blur(1px); clip-path: inset(0 0 0 0); }
    78% { transform: translateY(1px) scale(.997); }
    100% { opacity: 1; transform: none; filter: blur(0); clip-path: inset(0 0 0 0); }
  }
  @keyframes v2TelemetryIn {
    0% { opacity: 0; transform: translateX(26px) scaleX(.55); filter: blur(10px); }
    40% { opacity: .75; transform: translateX(-4px) scaleX(1.03); filter: blur(2px); }
    70% { transform: translateX(3px); }
    100% { opacity: 1; transform: none; filter: blur(0); }
  }
  @keyframes v2WaveIn {
    0% { opacity: 0; transform: translateX(-50%) translateY(16px) scale(.75); filter: blur(12px); }
    35% { opacity: 1; transform: translateX(-50%) translateY(-3px) scale(1.08); filter: blur(1px); }
    55% { transform: translateX(-50%) translateY(2px) scale(.98); }
    100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); filter: blur(0); }
  }
  @keyframes v2TopbarIn {
    0% { opacity: 0; transform: translateY(-22px) scaleY(.7); filter: blur(12px); }
    45% { opacity: 1; transform: translateY(3px) scaleY(1.04); filter: blur(2px); }
    65% { transform: translateY(-2px) scaleY(.99); }
    100% { opacity: 1; transform: none; filter: blur(0); }
  }
  @keyframes v2CardIn {
    0% { opacity: 0; transform: perspective(900px) rotateX(7deg) scale(.78) translateY(45px); filter: blur(18px) brightness(.2); box-shadow: 0 0 0 rgba(0,0,0,0); }
    35% { opacity: .45; transform: perspective(900px) rotateX(-2deg) scale(.98) translateY(-8px); filter: blur(5px) brightness(.65); box-shadow: 0 0 55px rgba(201,166,255,.18); }
    62% { opacity: 1; transform: perspective(900px) rotateX(1deg) scale(1.025) translateY(2px); filter: blur(1px) brightness(1.12); box-shadow: 0 0 100px rgba(201,166,255,.22); }
    78% { transform: perspective(900px) rotateX(0) scale(.997); }
    100% { opacity: 1; transform: perspective(900px) rotateX(0) scale(1); filter: blur(0) brightness(1); box-shadow: 0 18px 40px -20px rgba(0,0,0,.6); }
  }
  @keyframes v2TextIn {
    0% { opacity: 0; transform: translateY(18px) scale(.96); filter: blur(10px); }
    55% { opacity: 1; transform: translateY(-3px) scale(1.015); filter: blur(1px); }
    100% { opacity: 1; transform: none; filter: blur(0); }
  }
  @keyframes v2ButtonIn {
    0% { opacity: 0; transform: translateY(16px) scale(.82); filter: blur(8px); }
    45% { opacity: 1; transform: translateY(-5px) scale(1.08); filter: blur(0); }
    68% { transform: translateY(2px) scale(.98); }
    100% { opacity: 1; transform: none; filter: blur(0); }
  }

  .crack-overlay { position: fixed; inset: 0; z-index: 55; pointer-events: none; overflow: hidden; }
  .crack-line {
    position: absolute; height: 3px; width: 0;
    background: linear-gradient(90deg, transparent, #fff, #fff, transparent);
    box-shadow: 0 0 12px 2px rgba(255,255,255,.8);
    transform-origin: left center;
    animation: crackGrow .3s ease-out forwards;
  }
  @keyframes crackGrow { from { width: 0; opacity: 1; } to { width: 150vmax; opacity: .85; } }

  .flash-overlay { position: fixed; inset: 0; z-index: 56; background: #000; opacity: 0; pointer-events: none; }

    /* Одна непрерывная траектория: сначала резкий подъём по диагонали,

    animation: v1OvalFall 2.15s linear var(--fall-delay) forwards;

    0% {
      opacity: 1;
      transform: translate3d(0, 0, 0) rotate(0deg) scale(1);

    16% {
      opacity: 1;
      transform: translate3d(var(--fall-x1), var(--fall-y1), 0) rotate(calc(var(--fall-rotate) * -.18)) scale(1.015);
      filter: blur(0) brightness(1.03);
    }
    32% {
      opacity: 1;
      transform: translate3d(var(--fall-x2), var(--fall-y2), 0) rotate(calc(var(--fall-rotate) * -.35)) scale(1.025);
      filter: blur(0) brightness(1.04);

    48% {

      filter: blur(.15px) brightness(1);

    64% {
      opacity: .985;
      transform: translate3d(var(--fall-x4), var(--fall-y4), 0) rotate(calc(var(--fall-rotate) * .5)) scale(.98);
      filter: blur(.5px) brightness(.92);

    82% {
      opacity: .97;
      transform: translate3d(var(--fall-x5), var(--fall-y5), 0) rotate(calc(var(--fall-rotate) * .78)) scale(.95);
      filter: blur(1px) brightness(.82);
    }
    100% {
      opacity: .92;
      transform: translate3d(var(--fall-x6), var(--fall-distance), 0) rotate(var(--fall-rotate)) scale(.9);
      filter: blur(2.5px) brightness(.68);

  /* ---------- Переход между версиями по кнопке ---------- */

  .version-switch-overlay::before {
    content: '';

    background: repeating-linear-gradient(0deg, transparent 0 5px, rgba(255,255,255,.045) 5px 6px);
    opacity: .35;
    transform: translateY(-100%);
  }
  .version-switch-overlay::after {
    content: '';
    position: absolute;
    width: 22vw; height: 22vw; min-width: 140px; min-height: 140px;

    border-radius: 50%;

    animation: versionCurtainIn 1.05s cubic-bezier(.22,.7,.25,1) forwards;
  }
  body.version-switching .version-switch-overlay::before {
    animation: versionScanIn 1.05s cubic-bezier(.22,.7,.25,1) forwards;
  }
  body.version-switching .version-switch-overlay::after {
    animation: versionPulseIn 1.05s cubic-bezier(.2,.8,.25,1) forwards;
  }
  body.version-switch-in #app {
    animation: none;
    transform: none;
    filter: none;
  }
  body.version-switch-in .version-switch-overlay {
    opacity: 1;
    animation: versionCurtainOut 1.15s cubic-bezier(.22,.7,.25,1) .05s forwards;
  }
  body.version-switch-in .version-switch-overlay::before {
    animation: versionScanOut 1.15s cubic-bezier(.22,.7,.25,1) forwards;
  }
  body.version-switch-in .version-switch-overlay::after {
    animation: versionPulseOut 1.15s cubic-bezier(.2,.8,.25,1) forwards;
  }
  @keyframes versionSwitchOut {
    0% { opacity: 1; transform: scale(1) rotate(0deg); filter: blur(0); }

    72% { opacity: .48; transform: scale(.965) rotate(.45deg); filter: blur(2px); }

  @keyframes versionCurtainIn {
    0% { opacity: 0; transform: scale(1.08); }
    42% { opacity: .36; transform: scale(1); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes versionScanIn {

  @keyframes versionPulseIn {

    64% { opacity: 1; transform: scale(.998) translateY(0); filter: blur(.5px); }
    100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
  }
  @keyframes versionCurtainOut {
    0% { opacity: 1; transform: scale(1); }
    38% { opacity: .95; transform: scale(1.01); }
    100% { opacity: 0; transform: scale(1.035); }
  }
  @keyframes versionScanOut {
    0% { transform: translateY(-100%) skewY(-4deg); opacity: .3; }
    100% { transform: translateY(100%) skewY(-4deg); opacity: 0; }

  @keyframes versionPulseOut {

/* =======================================================================
   ВРЕМЯ
   Статический html-файл не может иметь по-настоящему доверенное серверное
   время — это best-effort синхронизация с публичным time-API с откатом на
   локальные часы устройства, если запрос не прошёл (нет сети/офлайн/блок).
   ======================================================================= */
let SERVER_TIME_AT_START = null;
let PERF_TIME_AT_START = null;
let SERVER_TIME_READY = false;
let SERVER_TIME_FAILED = false;

async function syncTrustedTime() {
  try {
    const res = await fetch(CONFIG.timeEndpoint, {
      cache: 'no-store',
    });

    if (!res.ok) {
      throw new Error('Time request failed');
    }

    const data = await res.json();
    const serverTime = Number(data.now);

    if (!Number.isFinite(serverTime)) {
      throw new Error('Invalid server time');
    }

    SERVER_TIME_AT_START = serverTime;
    PERF_TIME_AT_START = performance.now();
    SERVER_TIME_READY = true;

  } catch (e) {
    SERVER_TIME_FAILED = true;
    console.error('Trusted time sync failed:', e);
  }

  if (S.screen === 'v2quiz') {
    render();
  }
}

function trustedNowMs() {
  if (!SERVER_TIME_READY) return null;

  return SERVER_TIME_AT_START +
    (performance.now() - PERF_TIME_AT_START);
}

function trustedNow() {
  const ms = trustedNowMs();

  if (ms === null) return null;

  return new Date(ms);
}

const STORE_PREFIX = 'quest_v1_';

function storeKey(nick) {
  return STORE_PREFIX + nick.trim().toLowerCase().replace(/\s+/g, '_');
}

function makeProgressSnapshot(overrides = {}) {
  return {
    nick: S.nick,
    screen: S.screen,
    index: S.index,
    answers: S.answers,
    unlocked: S.unlocked,
    v2Index: S.v2Index,
    v2Answers: S.v2Answers,
    v3Index: S.v3Index,
    v3Answers: S.v3Answers,
    timerRevealed: S.timerRevealed,
    updatedAt: Date.now(),
    ...overrides,
  };
}

function applyProgress(saved) {
  if (!saved) return false;
  S.index = saved.index || 0;
  S.answers = saved.answers || {};
  S.unlocked = saved.unlocked || false;
  S.v2Index = saved.v2Index || 0;
  S.v2Answers = saved.v2Answers || {};
  S.v3Index = saved.v3Index || 0;
  S.v3Answers = saved.v3Answers || [];
  S.timerRevealed = saved.timerRevealed || false;
  S.screen = saved.screen || 'quiz';
  return true;
}

function loadProgress(nick) {
  try {
    const raw = localStorage.getItem(storeKey(nick));
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function saveProgress() {
  if (!S.nick) return;
  try {
    localStorage.setItem(storeKey(S.nick), JSON.stringify(makeProgressSnapshot()));
  } catch (e) {
    /* приватный режим браузера — квест всё равно работает, просто без локального сохранения */
  }
}

function serverSyncEnabled() {
  return Boolean(CONFIG.serverEndpoint) && !CONFIG.serverEndpoint.includes('YOUR-WORKER');
}

async function loadServerProgress(nick) {
  if (!serverSyncEnabled()) return null;
  try {
    const url = CONFIG.serverEndpoint + '?nick=' + encodeURIComponent(nick);
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) return null;
    const data = await res.json();
    return data && data.found ? data.player : null;
  } catch (e) {
    return null;
  }
}

async function syncPlayerToServer(checkpoint, overrides = {}) {
  if (!S.nick || !serverSyncEnabled()) return false;
  const state = makeProgressSnapshot(overrides);
  const payload = {
    nick: S.nick,
    checkpoint: checkpoint || 'progress',
    state,
    sentAt: Date.now(),
  };
  try {
    const res = await fetch(CONFIG.serverEndpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      cache: 'no-store',
    });
    if (!res.ok) return false;
    const data = await res.json();
    if (data && data.player) {
      try {
        localStorage.setItem(storeKey(S.nick), JSON.stringify(data.player.state || state));
      } catch (e) {}
    }
    return true;
  } catch (e) {
    return false;
  }
}

function norm(v) {
  return (v || '').toString().trim().toLowerCase()
    .replace(/ё/g, 'е')
    .replace(/[.,!?;:"'`«»\-–—()]/g, '')
    .replace(/\s+/g, ' ');
}
function tight(v) { return norm(v).replace(/\s+/g, ''); }
function digits(v) { return (v || '').toString().replace(/\D/g, ''); }

/* =======================================================================
   САУНД-ДИЗАЙН
   Короткие UI-звуки и фон Версии II генерируются через Web Audio API.
   Сюжетный переход I→II и музыка/переход III используют MP3 из CONFIG.

const AUDIO = {
  ctx: null,
  master: null,
  ambient: null,
  ambientPulse: null,
  v3Music: null,
  v3MusicPathIndex: 0,
  v2ToV3Sfx: null,
  v2ToV3SfxPathIndex: 0,
  v2UnlockSfx: {},

function preloadV2UnlockSounds() {

function audioCtx() {
  if (AUDIO.ctx) return AUDIO.ctx;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return null;
  try {
    AUDIO.ctx = new Ctx();
    AUDIO.master = AUDIO.ctx.createGain();
    AUDIO.master.gain.value = 0.32;
    AUDIO.master.connect(AUDIO.ctx.destination);
  } catch (_) {
    return null;
  }
  return AUDIO.ctx;
}

function audioResume() {
  const ctx = audioCtx();
  if (!ctx) return null;
  if (ctx.state === 'suspended') ctx.resume().catch(() => {});
  return ctx;
}

function tone(freq, duration, opts = {}) {
  const ctx = audioResume();
  if (!ctx || !AUDIO.master) return;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  const filter = ctx.createBiquadFilter();
  const t = ctx.currentTime;
  const endFreq = Math.max(20, opts.toFreq || freq);
  const volume = opts.volume ?? 0.1;
  const attack = opts.attack ?? 0.012;
  const release = opts.release ?? Math.min(0.22, duration * .55);

  o.type = opts.type || 'sine';
  o.frequency.setValueAtTime(Math.max(20, freq), t);
  if (endFreq !== freq) o.frequency.exponentialRampToValueAtTime(endFreq, t + Math.max(.03, duration));
  filter.type = 'lowpass';
  filter.frequency.value = opts.filter || 3200;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0001, volume), t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(attack + .02, duration - release));

  o.connect(filter).connect(g).connect(AUDIO.master);
  o.start(t);
  o.stop(t + duration + .05);
}

function noise(duration = .12, opts = {}) {
  const ctx = audioResume();
  if (!ctx || !AUDIO.master) return;
  const len = Math.max(1, Math.floor(ctx.sampleRate * duration));
  const buffer = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource();
  const filter = ctx.createBiquadFilter();
  const g = ctx.createGain();
  const t = ctx.currentTime;
  filter.type = opts.filterType || 'bandpass';
  filter.frequency.value = opts.filter || 1800;
  filter.Q.value = opts.q || 0.7;
  const volume = opts.volume ?? 0.035;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(.0001, volume), t + .008);
  g.gain.exponentialRampToValueAtTime(.0001, t + Math.max(.012, duration - .025));
  src.buffer = buffer;
  src.connect(filter).connect(g).connect(AUDIO.master);
  src.start(t);
  src.stop(t + duration + .03);
}

function startV2Ambient() {
  const ctx = audioResume();
  if (!ctx || !AUDIO.master || AUDIO.ambient) return;
  const bus = ctx.createGain();
  bus.gain.value = 0.0001;
  bus.connect(AUDIO.master);
  const low = ctx.createOscillator();
  const high = ctx.createOscillator();
  const lf = ctx.createBiquadFilter();
  const hg = ctx.createGain();
  const lfo = ctx.createOscillator();
  const lfoGain = ctx.createGain();
  const humGain = ctx.createGain();
  const t = ctx.currentTime;
  low.type = 'sawtooth'; low.frequency.value = 52;
  lf.type = 'lowpass'; lf.frequency.value = 360;
  humGain.gain.value = 0.12;
  high.type = 'sine'; high.frequency.value = 104;
  hg.gain.value = 0.035;
  lfo.type = 'sine'; lfo.frequency.value = 0.08;
  lfoGain.gain.value = 0.03;
  humGain.connect(lf).connect(bus);
  hg.connect(bus);
  lfo.connect(lfoGain).connect(humGain.gain);
  low.connect(humGain);
  high.connect(hg);
  low.start(t); high.start(t); lfo.start(t);
  bus.gain.linearRampToValueAtTime(document.hidden ? 0.0001 : 0.15, t + 1.8);
  AUDIO.ambient = { bus, low, high, lfo };

  const pulse = () => {
    if (!AUDIO.ambient || document.hidden || !(S.screen === 'v2intro' || S.screen === 'v2quiz')) return;
    tone(205 + Math.random() * 18, .045, { type: 'sine', volume: .011, toFreq: 185, filter: 900 });
    AUDIO.ambientPulse = setTimeout(pulse, 3200 + Math.random() * 2600);
  };
  AUDIO.ambientPulse = setTimeout(pulse, 2600);
}

function stopV2Ambient() {
  if (AUDIO.ambientPulse) { clearTimeout(AUDIO.ambientPulse); AUDIO.ambientPulse = null; }
  if (!AUDIO.ambient) return;
  const ctx = AUDIO.ctx;
  const a = AUDIO.ambient;
  try {
    const t = ctx.currentTime;
    a.bus.gain.cancelScheduledValues(t);
    a.bus.gain.linearRampToValueAtTime(0.0001, t + .65);
    [a.low, a.high, a.lfo].forEach(n => n.stop(t + .72));
  } catch (_) {}
  AUDIO.ambient = null;
}

function ensureV3Music() {
  if (!CONFIG.calmMusicUrl) return null;
  if (AUDIO.v3Music) return AUDIO.v3Music;
  const audio = document.createElement('audio');
  audio.loop = true;
  audio.preload = 'auto';
  audio.volume = 0;
  audio.muted = false;
  audio.src = CONFIG.calmMusicUrl;
  audio.dataset.v3Music = '1';
  audio.addEventListener('error', () => {
    if (AUDIO.v3MusicPathIndex === 0 && CONFIG.calmMusicUrl.startsWith('audio/')) {
      AUDIO.v3MusicPathIndex = 1;
      audio.src = CONFIG.calmMusicUrl.slice(6);
      audio.load();
      audio.play().catch(() => {});
    }
  });
  document.body.appendChild(audio);
  AUDIO.v3Music = audio;
  return audio;
}

function prepareV3MusicForLaunch() {
  const audio = ensureV3Music();
  if (!audio) return;
  audio.volume = 0;
  audio.currentTime = 0;
  audio.play().catch(() => {});
}

function startV3Music(reset = false) {
  const audio = ensureV3Music();
  if (!audio) return;
  if (reset) audio.currentTime = 0;
  audio.volume = 0.72;
  audio.play().catch(() => {});
}

function stopV3Music() {
  if (!AUDIO.v3Music) return;
  AUDIO.v3Music.pause();
  AUDIO.v3Music.currentTime = 0;
  AUDIO.v3Music.volume = 0;
}

function prepareV2ToV3Sfx() {

}

function playV2ToV3Sfx() {
  const audio = prepareV2ToV3Sfx();
  if (!audio) return;
  try {
    audio.currentTime = 0;
    audio.play().catch(() => {});
  } catch (_) {}
}

function stopV2ToV3Sfx() {

}

function prepareV2UnlockSfx(key) {
  const url = CONFIG.v2UnlockSfx && CONFIG.v2UnlockSfx[key];
  if (!url) return null;
  if (AUDIO.v2UnlockSfx[key]) return AUDIO.v2UnlockSfx[key];
  const audio = document.createElement('audio');
  audio.preload = 'auto';
  audio.loop = false;
  audio.volume = 0.9;
  audio.src = url;
  audio.dataset.v2UnlockSfx = key;
  audio.addEventListener('error', () => {
    if (url.startsWith('audio/')) {
      audio.src = url.slice(6);
      audio.load();
    }
  });
  document.body.appendChild(audio);
  AUDIO.v2UnlockSfx[key] = audio;
  return audio;
}

function playV2UnlockSfx(key) {
  const audio = prepareV2UnlockSfx(key);
  if (!audio) return;
  try {
    audio.currentTime = 0;
    audio.play().catch(() => {});
  } catch (_) {}
}

function stopV2UnlockSfx() {
  Object.values(AUDIO.v2UnlockSfx).forEach((audio) => {
    try { audio.pause(); audio.currentTime = 0; } catch (_) {}
  });
}
preloadV2UnlockSounds();
  
document.addEventListener('visibilitychange', () => {
  const ctx = AUDIO.ctx;
  if (!ctx || !AUDIO.ambient) return;
  const t = ctx.currentTime;
  try {
    AUDIO.ambient.bus.gain.cancelScheduledValues(t);
    if (document.hidden) {
      AUDIO.ambient.bus.gain.linearRampToValueAtTime(0.0001, t + 0.12);
    } else if (S.screen === 'v2intro' || S.screen === 'v2quiz') {
      AUDIO.ambient.bus.gain.linearRampToValueAtTime(0.15, t + 0.7);
      if (!AUDIO.ambientPulse) {
        const pulse = () => {
          if (!AUDIO.ambient || document.hidden || !(S.screen === 'v2intro' || S.screen === 'v2quiz')) return;
          tone(205 + Math.random() * 18, .045, { type: 'sine', volume: .008, toFreq: 185, filter: 900 });
          AUDIO.ambientPulse = setTimeout(pulse, 3200 + Math.random() * 2600);
        };
        AUDIO.ambientPulse = setTimeout(pulse, 1200);
      }
    }
  } catch (_) {}
});

window.addEventListener('pagehide', () => {
  stopV2Ambient();
  stopV3Music();
  stopV2ToV3Sfx();
  stopV2UnlockSfx();
});

document.addEventListener('click', (e) => {

   РЕНДЕР
   ======================================================================= */
function render() {
  saveProgress();
  if (snakeKeyHandler) { document.removeEventListener('keydown', snakeKeyHandler); snakeKeyHandler = null; }
  if (globalTimerInterval) { clearInterval(globalTimerInterval); globalTimerInterval = null; }
  app.innerHTML = '';
  document.body.classList.toggle('v2-theme', S.screen === 'v2intro' || S.screen === 'v2quiz');
  document.body.classList.toggle('v3-theme', S.screen === 'v3transition' || S.screen === 'v3quiz' || S.screen === 'v3final');
  if ((S.screen === 'v2intro' || S.screen === 'v2quiz') && !document.body.classList.contains('v2-reveal-seq')) startV2Ambient();
  else stopV2Ambient();
  if (S.screen === 'v3transition') startV3Music();
  else if (S.screen === 'v3quiz' || S.screen === 'v3final') startV3Music();
  else stopV3Music();
  document.querySelectorAll('.version-toggle, .hud-ticker, .hud-telemetry, .hud-wave, .debug-fab, .debug-panel, .global-timer, .v3-blob-field').forEach(n => n.remove());
  if (S.screen === 'intro') { renderIntro(); return; }
  if (S.screen === 'final') { renderFinal(); mountVersionToggle(); mountDebugPanel(); mountGlobalTimer(); return; }
  if (S.screen === 'v2intro') { renderV2Intro(); mountVersionToggle(); mountHudChrome(); mountDebugPanel(); mountGlobalTimer(); return; }
  if (S.screen === 'v2quiz') { renderV2Question(); mountVersionToggle(); mountHudChrome(); mountDebugPanel(); mountGlobalTimer(); return; }
  if (S.screen === 'v3transition') { renderV3Transition(); mountDebugPanel(); mountV3Decor(); return; }
  if (S.screen === 'v3quiz') { renderV3Question(); mountDebugPanel(); mountV3Decor(); return; }
  if (S.screen === 'v3final') { renderV3Final(); mountDebugPanel(); mountV3Decor(); return; }
  renderQuestion();
  mountVersionToggle();
  mountDebugPanel();
  mountGlobalTimer();
}

/* =======================================================================
   ОТКРЫТИЕ ВЕРСИИ II
   Код можно ввести в ЛЮБОЕ поле сайта, кроме поля с ником.
   ======================================================================= */
document.addEventListener('input', (e) => {
  const t = e.target;
  if (!t || (t.tagName !== 'INPUT' && t.tagName !== 'TEXTAREA')) return;
  if (t.dataset && t.dataset.nickField) return;
  const v = t.value.trim();
  if (v === CONFIG.debugCode) {
    activateDebugMode();
    return;
  }
  if (!S.unlocked && v === CONFIG.v2Code) {
    triggerV2Unlock();
  }
});

function activateDebugMode() {
  const wasUnlocked = S.unlocked;
  S.unlocked = true;
  S.debugAll = true;
  saveProgress();
  if (!wasUnlocked) render();
  else { mountVersionToggle(); mountHudChrome(); mountDebugPanel(); }
}

function triggerV2Unlock() {
  if (S.unlocked) return;
  S.unlocked = true;
  saveProgress();

  const crackLayer = el('div', 'crack-overlay');
  document.body.appendChild(crackLayer);

  const flash = el('div', 'flash-overlay');
  flash.style.background = '#000';
  flash.style.opacity = '0';
  document.body.appendChild(flash);

  const allTimers = [];

  function addCracks(count, spread, duration, delayStep = 0) {
    const baseAngles = [6, -18, 34, -46, 71, -63, 108, 152, -12, 89, 24, -78, 136, -35, 58, -106, 166, -2, 47, -58];
    for (let i = 0; i < count; i++) {
      allTimers.push(setTimeout(() => {
        const line = el('div', 'crack-line');
        const angle = baseAngles[i % baseAngles.length] + (Math.random() * spread * 2 - spread);
        line.style.transform = 'rotate(' + angle.toFixed(1) + 'deg)';
        line.style.top = (12 + Math.random() * 76) + '%';
        line.style.left = (5 + Math.random() * 70) + '%';
        line.style.animationDuration = duration + 'ms';
        crackLayer.appendChild(line);
      }, delayStep * i));
    }
  }

  function burst(className, at, crackCount, spread, crackDuration, extraClass = '') {
    allTimers.push(setTimeout(() => {
      document.body.classList.add(className);
      if (extraClass) document.body.classList.add(extraClass);
      addCracks(crackCount, spread, crackDuration, className === 'v2-shake-large' ? 32 : 48);
      allTimers.push(setTimeout(() => {
        document.body.classList.remove(className);
        if (extraClass) document.body.classList.remove(extraClass);
      }, className === 'v2-shake-large' ? 1380 : className === 'v2-shake-medium' ? 780 : 520));
    }, at));
  }

  // Этап 1: лёгкие трещины + 1.mp3.
  playV2UnlockSfx('crack1');
  allTimers.push(setTimeout(() => {
    burst('v2-shake-small', 0, 4, 4, 280);
  }, 180));

  // Этап 2: уже серьёзно + 2.mp3.
  allTimers.push(setTimeout(() => {
    playV2UnlockSfx('crack2');
  
    setTimeout(() => {
      burst('v2-shake-medium', 0, 8, 9, 360);
    }, 180);
  }, 1450));

  // Этап 3: большой выброс — много трещин, сильная тряска, глитч и 3.mp3.
  allTimers.push(setTimeout(() => {
    playV2UnlockSfx('crack3');
  
    setTimeout(() => {
      burst('v2-shake-large', 0, 20, 28, 520, 'v2-catastrophe');
    }, 220);
  }, 3150));

  // Этап 4: интерфейс первой версии медленно срывается вниз целыми элементами.
  allTimers.push(setTimeout(() => {
    // Финальный коллапс + 4.mp3.
    playV2UnlockSfx('collapse');
    crackLayer.style.transition = 'opacity .95s ease';
    crackLayer.style.opacity = '1';

    const fallLayer = el('div', 'v1-fall-layer');
    document.body.appendChild(fallLayer);

    const originals = Array.from(app.children);
    const falling = [];

    originals.forEach((original, i) => {
      const rect = original.getBoundingClientRect();
      if (!rect.width || !rect.height) return;

      const copy = original.cloneNode(true);
      copy.classList.add('v1-falling-copy');
      copy.removeAttribute('id');
      copy.style.position = 'fixed';
      copy.style.left = rect.left + 'px';
      copy.style.top = rect.top + 'px';
      copy.style.width = rect.width + 'px';
      copy.style.height = rect.height + 'px';
      copy.style.margin = '0';
      copy.style.boxSizing = 'border-box';
      copy.style.zIndex = String(3 + i);

      // Физика падения: каждому элементу задаём собственную горизонтальную скорость,
      // начальную скорость вверх и постоянное ускорение вниз. Никаких промежуточных
      // keyframe-точек — движение рассчитывается непрерывно каждый кадр.
      const dir = Math.random() < 0.5 ? -1 : 1;
      const vx = dir * (85 + Math.random() * 135); // медленно уходим влево/вправо
      const vy0 = -(720 + Math.random() * 230);       // стартовый импульс вверх
      const gravity = 1550 + Math.random() * 350;    // постоянное ускорение вниз
      const delay = i * 45 + Math.random() * 90;
      const rotation = (Math.random() * 2 - 1) * 9;

      copy.style.transform = 'translate3d(0,0,0) rotate(0deg) scale(1)';
      copy.style.filter = 'blur(0) brightness(1)';
      fallLayer.appendChild(copy);
      falling.push({ copy, rect, vx, vy0, gravity, delay, rotation, startX: rect.left, startY: rect.top, started: false, startTime: 0 });
      original.style.visibility = 'hidden';
    });

    // Запускаем непрерывную физическую траекторию.
    const fallStartedAt = performance.now();
    const animateFalls = (nowTime) => {
      let active = false;
      falling.forEach((item) => {
        const elapsedMs = nowTime - fallStartedAt - item.delay;
        if (elapsedMs < 0) {
          active = true;
          return;
        }
        if (!item.started) {
          item.started = true;
          item.startTime = nowTime;
        }

        const t = (nowTime - item.startTime) / 1000;
        // x = v*t
        // y = v0*t + 1/2*g*t^2
        const x = item.vx * t;
        const y = item.vy0 * t + 0.5 * item.gravity * t * t;
        const rotation = item.rotation * Math.min(1, t / 1.5) + (item.vx < 0 ? -1 : 1) * 2.5 * t;

        item.copy.style.transform = `translate3d(${x.toFixed(2)}px, ${y.toFixed(2)}px, 0) rotate(${rotation.toFixed(2)}deg) scale(${(1 - Math.min(.1, t * .025)).toFixed(3)})`;
        item.copy.style.filter = `blur(${Math.min(3, t * 0.9).toFixed(2)}px) brightness(${Math.max(.68, 1 - t * .14).toFixed(3)})`;

        const stillVisible = item.startY + y < window.innerHeight + 500;
        if (stillVisible) active = true;
      });

      if (active) requestAnimationFrame(animateFalls);
    };

    requestAnimationFrame(animateFalls);

    // Пока интерфейс падает, экран постепенно уходит в чёрный.
    allTimers.push(setTimeout(() => {
      flash.style.transition = 'opacity 2.8s cubic-bezier(.55,0,.22,1)';
      flash.style.opacity = '1';
    }, 1450));

    allTimers.push(setTimeout(() => {
      fallLayer.remove();
      originals.forEach((p) => { p.style.visibility = ''; });
    }, 4200));
  }, 5150));

  // Только после полного затемнения загружаем тему/DOM Версии II.
  // Чёрная заливка уже должна полностью закрыть старый интерфейс.
  allTimers.push(setTimeout(() => {
    document.body.classList.remove('v2-shake-small', 'v2-shake-medium', 'v2-shake-large', 'v2-catastrophe', 'epic-shake');
    document.body.classList.add('v2-theme', 'v2-reveal-seq');
    crackLayer.remove();
    S.screen = 'v2intro';
    render();

    // 5.mp3 звучит на полностью чёрном экране в течение своих 3 секунд.
    playV2UnlockSfx('blackHum');

    // Держим экран полностью чёрным все 3 секунды, затем открываем Версию II.
    setTimeout(() => {
      flash.style.transition = 'opacity 3.8s cubic-bezier(.2,.75,.25,1)';
      flash.style.opacity = '0';
    }, 3000);

    // Держим анимацию появления дольше, чем сам fade из чёрного.
    setTimeout(() => {
      flash.remove();
    }, 7200);

    setTimeout(() => {
      document.body.classList.remove('v2-reveal-seq');
      document.body.classList.add('v2-reveal-done');
      startV2Ambient();
    }, 9000);
  }, 9500));
}

function formatTimerParts(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return {
    h: Math.floor(s / 3600),
    m: Math.floor((s % 3600) / 60),
    sec: s % 60,
  };
}

function setTimerPart(node, value, key, state) {
  const text = key === 'h' ? String(value) : String(value).padStart(2, '0');
  if (state[key] !== value) {
    node.textContent = text;
    node.classList.remove('timer-tick');
    void node.offsetWidth;
    node.classList.add('timer-tick');
  }
  state[key] = value;
}

function mountGlobalTimer() {
  if (!S.timerRevealed) return;
  if (S.screen === 'v3transition' || S.screen === 'v3quiz' || S.screen === 'v3final') return;
  if (document.querySelector('.global-timer')) return;
  const start = new Date(CONFIG.birthdayStart);
  const end = new Date(CONFIG.birthdayEnd);
  const bar = el('div', 'global-timer');
  const icon = el('span', null);
  const value = el('span', null);
  bar.appendChild(icon);
  bar.appendChild(value);
  document.body.appendChild(bar);

  value.innerHTML = '<span class="timer-h"></span>:<span class="timer-m"></span>:<span class="timer-sec"></span>';
  const h = value.querySelector('.timer-h');
  const m = value.querySelector('.timer-m');
  const sec = value.querySelector('.timer-sec');
  const state = { h: null, m: null, sec: null, mode: null };

  function tick() {
    if (!document.body.contains(bar)) { clearInterval(globalTimerInterval); globalTimerInterval = null; return; }
    const t = trustedNow();
    if (t >= end) {
      icon.textContent = '';
      value.textContent = 'С днём рождения!';
      value.classList.remove('timer-tick');
      state.mode = 'done';
      return;
    }

    const before = t < start;
    const ms = before ? start - t : end - t;
    const mode = before ? 'before' : 'during';
    if (state.mode !== mode) {
      icon.textContent = before ? '' : '🎉 ';
      state.mode = mode;
      state.h = state.m = state.sec = null;
    }
    const parts = formatTimerParts(ms);
    setTimerPart(h, parts.h, 'h', state);
    setTimerPart(m, parts.m, 'm', state);
    setTimerPart(sec, parts.sec, 'sec', state);
  }
  tick();
  globalTimerInterval = setInterval(tick, 1000);
}

      const errorCard = el('div', 'card');

        'lead',

      return;
    }
    
    btn.disabled = true;
    note.textContent = 'Синхронизация с сервером…';

    const localSaved = loadProgress(v);
    const serverSaved = await loadServerProgress(v);

    S.nick = v;
    if (serverSaved && serverSaved.state) {
      // Сервер — основной источник истины при наличии записи.
      applyProgress(serverSaved.state);
    } else if (localSaved) {
      // Первый запуск новой серверной версии: переносим старый localStorage на сервер.

function buildText(q, body, card) {
  const free = q.kind === 'free';
  const st = slot(q.n);

  const label = el('label', 'field');
  const input = el(free ? 'textarea' : 'input');
  if (!free) input.type = 'text';
  input.placeholder = free ? 'Пиши что угодно…' : 'Твой ответ…';
  input.value = st.value || '';
  label.appendChild(input);
  body.appendChild(label);

  const row = el('div', 'row');
  const answerBtn = el('button', 'ghost', 'Ответить');
  row.appendChild(answerBtn);
  body.appendChild(row);

  const out = el('div');
  body.appendChild(out);

  if (q.extra === 'ad' && st.adUnlocked) mountAd(card, st);

  function showVerdict() {
    out.innerHTML = '';
    if (st.lastCorrect === undefined) return;
    if (st.lastCorrect) {
      const html = q.okHtml || (q.ok ? q.ok() : 'Правильно!');
      out.appendChild(verdict(free ? 'neutral' : 'ok', html));
    } else {
      out.appendChild(verdict('bad', q.bad ? q.bad() : 'Неправильно!'));
    }
    if (st.codeShown) out.appendChild(el('div', 'codebox', st.codeShown));
  }

  function submit() {
    const v = input.value;
    st.value = v;
    if (free) {
      if (!v.trim()) return;
      st.lastCorrect = true;
      st.passed = true;
      SFX.correctV1();
    } else {
      const correct = !!q.check(v);
      st.lastCorrect = correct;
      if (correct) { st.passed = true; SFX.correctV1(); }
      else SFX.wrongV1();
    }
    if (q.extra === 'ad' && !st.adUnlocked) {
      st.adUnlocked = true;
      mountAd(card, st);
    }
    if (!row.contains(nextBtn)) row.appendChild(nextBtn);
    showVerdict();
    saveProgress();
  }

  const nextBtn = nextButton();
  answerBtn.addEventListener('click', submit);
  if (!free) input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });

  if (st.lastCorrect !== undefined) { row.appendChild(nextBtn); showVerdict(); }
}

/* ---------- Вопрос 6: секции ---------- */
function buildSports(q, body) {
  const st = slot(q.n);
  if (!st.found) st.found = [];
  if (!st.log) st.log = [];

  const row = el('div', 'row');
  const input = el('input');
  input.type = 'text';
  input.placeholder = 'Секция или кружок…';
  input.style.flex = '1 1 200px';
  const btn = el('button', 'ghost', 'Угадать');
  row.appendChild(input);
  row.appendChild(btn);
  body.appendChild(row);

  const out = el('div');
  body.appendChild(out);
  const chips = el('div', 'guesses');
  body.appendChild(chips);
  const nav = el('div', 'row');
  nav.appendChild(nextButton());
  body.appendChild(nav);

  function paint() {
    out.innerHTML = '';
    if (st.lastMsg) {
      const v = verdict(st.lastOk ? 'ok' : 'bad', st.lastMsg);
      v.style.cursor = 'help';
      v.addEventListener('mouseenter', () => {
        v.innerHTML = st.found.length + '/10';
      });
      v.addEventListener('mouseleave', () => {
        v.innerHTML = st.lastMsg;
      });
      out.appendChild(v);
    }
    if (st.found.length >= CONFIG.sportsTarget) {
      out.appendChild(verdict('ok', 'Ого. Похоже, ты знаешь обо мне довольно много.'));
      out.appendChild(el('div', 'codebox', 'diversity = bigmak ** 2 - 5'));
    }
    chips.innerHTML = '';
    st.log.slice(-12).forEach(g => {
      chips.appendChild(el('span', 'chip ' + (g.ok ? 'ok' : 'bad'), g.text));
    });
  }

  function guess() {
    const v = input.value.trim();
    if (!v) return;
    const n = norm(v);
    const isRight = SPORTS.includes(n);
    if (isRight && !st.found.includes(n)) {
      st.found.push(n);
      st.passed = true;
      st.lastOk = true;
      SFX.correctV1();
      st.lastMsg = st.found.length >= CONFIG.sportsTarget
        ? 'Верно!'
        : SPORTS_YES[(st.found.length - 1) % SPORTS_YES.length];
    } else if (isRight) {
      st.lastOk = true;
      st.lastMsg = 'Это ты уже называл :)';
    } else {
      st.lastOk = false;
      st.lastMsg = 'Нет, не угадал.';
      SFX.wrongV1();
    }
    st.log.push({ text: v, ok: isRight });
    input.value = '';
    saveProgress();
    paint();
    input.focus();
  }

  btn.addEventListener('click', guess);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') guess(); });
  paint();
}

/* ---------- Вопрос 11: игры ---------- */
function buildGames(q, body) {
  const st = slot(q.n);
  if (!st.found) st.found = [];
  if (!st.log) st.log = [];

  const row = el('div', 'row');
  const input = el('input');
  input.type = 'text';
  input.placeholder = 'Название игры…';
  input.style.flex = '1 1 200px';
  const btn = el('button', 'ghost', 'Ответить');
  row.appendChild(input);
  row.appendChild(btn);
  body.appendChild(row);

  const counter = el('p', 'counter');
  body.appendChild(counter);
  const out = el('div');
  body.appendChild(out);
  const chips = el('div', 'guesses');
  body.appendChild(chips);
  const nav = el('div', 'row');
  body.appendChild(nav);

  function paint() {
    const left = Math.max(0, CONFIG.gamesTarget - st.found.length);
    counter.textContent = st.found.length >= CONFIG.gamesTarget
      ? 'Названо игр: ' + st.found.length
      : 'Названо: ' + st.found.length + ' из ' + CONFIG.gamesTarget;
    out.innerHTML = '';
    if (st.lastMsg) out.appendChild(verdict(st.lastOk ? 'ok' : 'bad', st.lastMsg));
    chips.innerHTML = '';
    st.log.slice(-12).forEach(g => {
      chips.appendChild(el('span', 'chip ' + (g.ok ? 'ok' : 'bad'), g.text));
    });
    nav.innerHTML = '';
    if (st.passed) {
      nav.appendChild(nextButton());
    } else {
      const locked = el('p', 'hint', 'Осталось назвать ещё ' + left + ', чтобы пройти дальше.');
      nav.appendChild(locked);
    }
  }

  function guess() {
    const v = input.value.trim();
    if (!v) return;
    const idx = matchGame(v);
    if (idx !== null && !st.found.includes(idx)) {
      st.found.push(idx);
      SFX.correctV1();
      const left = CONFIG.gamesTarget - st.found.length;
      if (st.found.length < CONFIG.gamesTarget) {
        st.lastMsg = 'Правильно! Назови ещё ' + left;
      } else if (st.found.length === CONFIG.gamesTarget) {
        st.lastMsg = 'Правильно! Это уже пять :)';
        st.passed = true;
      } else {
        st.lastMsg = 'Ещё одна? Круто!';
      }
      st.lastOk = true;
    } else if (idx !== null) {
      st.lastOk = true;
      st.lastMsg = 'Эту ты уже называл :)';
    } else {
      st.lastOk = false;
      st.lastMsg = 'Нет, не угадал.';
      SFX.wrongV1();
    }
    st.log.push({ text: v, ok: idx !== null });
    // После первой попытки вопрос можно пропустить независимо от правильности ответа.
    if (st.log.length === 1) st.passed = true;
    input.value = '';
    saveProgress();
    paint();
    input.focus();
  }

  btn.addEventListener('click', guess);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') guess(); });
  paint();
}

/* ---------- Вопрос 8: кликер ---------- */
function buildClicker(q, body) {
  const st = slot(q.n);

  const stage = el('div', 'clicker-stage');
  const core = el('div', 'clicker-core');
  const counterEl = el('div', 'clicks', '0');
  const bigBtn = el('button', 'primary bigbutton', 'Жми!');
  const timeEl = el('p', 'hint', CONFIG.clickerSeconds + ' сек');
  core.appendChild(counterEl);
  core.appendChild(bigBtn);
  core.appendChild(timeEl);
  stage.appendChild(core);
  body.appendChild(stage);

  const out = el('div');
  body.appendChild(out);
  const nav = el('div', 'row');
  body.appendChild(nav);

  if (st.done) {
    core.innerHTML = '';
    core.appendChild(el('div', 'clicks', String(st.clicks || 0)));
    core.appendChild(el('p', 'hint', 'нажатий'));
    out.appendChild(verdict(st.clicks > 0 ? 'ok' : 'bad',
      st.clicks > 0 ? 'Отличный результат!' : 'Ну нажми, хоть разочек :('));
    const replay = el('button', 'ghost', 'Сыграть ещё раз');
    replay.addEventListener('click', () => {
      st.done = false;
      saveProgress();
      render();
    });
    nav.appendChild(replay);
    nav.appendChild(nextButton());
    return;
  }

  let clicks = 0;
  let left = CONFIG.clickerSeconds;
  let running = false;
  const timers = [];

  const CORNER_ZONES = [
    { top: [4, 20], left: [2, 20] },
    { top: [4, 20], left: [78, 95] },
    { top: [80, 95], left: [2, 20] },
    { top: [80, 95], left: [78, 95] },
    { top: [42, 58], left: [2, 14] },
    { top: [42, 58], left: [84, 95] },
  ];
  function randIn(range) { return range[0] + Math.random() * (range[1] - range[0]); }

  function spawnNoise(text, opts) {
    const o = opts || {};
    const n = el('div', 'noise' + (o.isCode ? ' code' : ''), text);
    let top, left2;
    if (o.top !== undefined) {
      top = o.top; left2 = o.left;
    } else {
      const zone = CORNER_ZONES[Math.floor(Math.random() * CORNER_ZONES.length)];
      top = randIn(zone.top);
      left2 = randIn(zone.left);
    }
    n.style.top = top + '%';
    n.style.left = Math.max(1, Math.min(62, left2)) + '%';
    if (!o.isCode) {
      n.style.fontSize = (0.8 + Math.random() * 0.75).toFixed(2) + 'rem';
      n.style.transform = 'rotate(' + Math.round(-25 + Math.random() * 50) + 'deg)';
    } else {
      n.style.transform = 'rotate(-13deg)';
    }
    stage.appendChild(n);
    timers.push(setTimeout(() => n.remove(), o.life || 1400));
  }

  function startRun() {
    if (running) return;
    running = true;

    const tick = setInterval(() => {
      left -= 1;
      timeEl.textContent = left + ' сек';
      if (left <= 0) {
        clearInterval(tick);
        finish();
      }
    }, 1000);
    timers.push(tick);

    // мусорные сообщения
    const noiseTimer = setInterval(() => {
      spawnNoise(CLICK_NOISE[Math.floor(Math.random() * CLICK_NOISE.length)], { life: 650 });
    }, 650);
    timers.push(noiseTimer);

    // фрагмент кода: не первым, у края, дважды в одном месте, с разрывом 11 сек
    const codePos = { top: 6, left: 1.5, isCode: true, life: 1000 };
    timers.push(setTimeout(() => spawnNoise('teto = diversity // 5', codePos), 5000));
    timers.push(setTimeout(() => spawnNoise('teto = diversity // 5', codePos), 16000));
  }

  function finish() {
    timers.forEach(t => { clearTimeout(t); clearInterval(t); });
    stage.querySelectorAll('.noise').forEach(n => n.remove());
    st.done = true;
    st.clicks = clicks;
    st.attempts = (st.attempts || 0) + clicks;
    if (clicks > 0) st.passed = true;
    saveProgress();
    render();
  }

  bigBtn.addEventListener('click', () => {
    startRun();
    clicks += 1;
    counterEl.textContent = String(clicks);
  });
}

/* ---------- Вопрос 10: "Вы уверены?" ---------- */
function buildConfirm(q, body) {
  const st = slot(q.n);
  const step = st.step || 0;

  const titleEl = document.querySelector('.card .q');
  titleEl.textContent = CONFIRM_PHRASES[Math.min(step, CONFIRM_PHRASES.length - 1)];

  const out = el('div');
  const row = el('div', 'row');
  body.appendChild(row);
  body.appendChild(out);

  // провал — показываем сообщение и кнопку перезапуска

    out.appendChild(verdict('bad', st.failMsg));
    if (st.codeShown) out.appendChild(el('div', 'codebox', st.codeShown));
    const b = el('button', 'ghost', 'Начать заново');
    b.addEventListener('click', () => {
      st.failed = false; st.failMsg = ''; st.step = 0;
      render();
    });
    row.appendChild(b);
    if (st.passed) row.appendChild(nextButton());
    return;
  }

  // пройдено до конца
  if (step >= CONFIRM_PHRASES.length) {
    titleEl.textContent = 'Ты действительно уверен.';
    st.passed = true;
    saveProgress();
    const replay = el('button', 'ghost', 'Прокликать ещё раз');
    replay.addEventListener('click', () => {
      st.step = 0;
      render();
    });
    row.appendChild(replay);
    row.appendChild(nextButton());
    return;
  }

  const counter = el('p', 'counter', 'Шаг ' + (step + 1) + ' из ' + CONFIRM_PHRASES.length);

  const yes = el('button', 'primary', 'Да');
  yes.addEventListener('click', () => {
    st.step = step + 1;
    render();
  });

  no.addEventListener('click', () => {
    st.failed = true;
    if (step === CONFIRM_TRICK) {
      st.failMsg = 'Ну раз нет…';
      st.codeShown = 'zzz = teto * bigmak + diversity';
    } else {
      st.failMsg = 'Тебе не хватает решительности!';

    render();
  });
  row.appendChild(yes);
  row.appendChild(no);
  if (st.passed) {
    row.appendChild(nextButton());
  }
  body.appendChild(counter);
}

/* ---------- Вопрос 18: скрытые надписи ---------- */
function buildHaystack(q, body) {
  const st = slot(q.n);

  const hay = el('div', 'haystack');

  // размещение по сетке, чтобы надписи не накладывались друг на друга
  const cols = 5, rows = 14;
  const cells = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) cells.push({ r, c });
  }
  // перемешиваем ячейки
  for (let i = cells.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cells[i], cells[j]] = [cells[j], cells[i]];
  }

  // Sparkle — в первой строке (рядом с текстом вопроса), sparxie — в нижней трети
  const topCells = cells.filter(c => c.r === 0);
  const lowCells = cells.filter(c => c.r >= 7);
  const sparkleCell = topCells[0] || cells[0];
  const sparxieCell = lowCells[0] || cells[cells.length - 1];

  const used = new Set([sparkleCell.r + ':' + sparkleCell.c, sparxieCell.r + ':' + sparxieCell.c]);

  function place(text, cell, opts) {
    const o = opts || {};
    const s = el('span', 'straw' + (o.correct ? ' correct-target' : ''), text);
    const jitterR = (Math.random() - 0.5) * (100 / rows) * 0.6;
    const jitterC = (Math.random() - 0.5) * (100 / cols) * 0.5;
    s.style.top = Math.max(1, Math.min(97, cell.r * (100 / rows) + 1 + jitterR)) + '%';
    s.style.left = Math.max(1, Math.min(90, cell.c * (100 / cols) + 1 + jitterC)) + '%';
    s.style.fontSize = o.size || (0.72 + Math.random() * 0.45).toFixed(2) + 'rem';
    s.style.color = o.color || 'rgba(47,32,56,' + (0.012 + Math.random() * 0.045).toFixed(3) + ')';
    if (o.mono) s.style.fontFamily = 'var(--mono)';
    if (o.rotate) s.style.transform = 'rotate(' + o.rotate + 'deg)';
    hay.appendChild(s);
  }

  // самый скрытый уровень для ответа и кода
  place('Sparkle', sparkleCell, { color: 'rgba(47,32,56,0.011)', size: '0.85rem', correct: true });
  place('sparxie = hanged_man - teto', sparxieCell, { color: 'rgba(47,32,56,0.012)', size: '0.7rem', mono: true, correct: true });

  let ti = 0;
  cells.forEach(cell => {
    const key = cell.r + ':' + cell.c;
    if (used.has(key)) return;
    if (ti >= STRAW_TEXTS.length) return;
    place(STRAW_TEXTS[ti++], cell, {});
  });

  body.appendChild(hay);
  const label = el('label', 'field');
  const input = el('input');
  input.type = 'text';
  input.placeholder = 'Что ты нашёл?';
  input.value = st.value || '';
  label.appendChild(input);
  body.appendChild(label);

  const row = el('div', 'row');
  const answerBtn = el('button', 'ghost', 'Ответить');
  row.appendChild(answerBtn);
  body.appendChild(row);
  const out = el('div');
  body.appendChild(out);

  const nextBtn = nextButton();

  function showVerdict() {
    out.innerHTML = '';
    if (st.lastCorrect === undefined) return;
    out.appendChild(st.lastCorrect
      ? verdict('ok', q.ok())
      : verdict('bad', 'Неправильно!'));
  }

  function submit() {
    st.value = input.value;
    st.lastCorrect = !!q.check(input.value);
    if (st.lastCorrect) st.passed = true;
    if (!row.contains(nextBtn)) row.appendChild(nextBtn);
    showVerdict();
    saveProgress();
  }

  answerBtn.addEventListener('click', submit);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  if (st.lastCorrect !== undefined) { row.appendChild(nextBtn); showVerdict(); }
}

function buildV2Countdown(q, body) {
  const st = v2slot(q.n);
  const start = new Date(CONFIG.birthdayStart);
  const end = new Date(CONFIG.birthdayEnd);

  if (!S.timerRevealed) { S.timerRevealed = true; saveProgress(); }

  const box = el('div', 'countdown-box');
  const label = el('p', 'hint');
  label.style.textAlign = 'center';
  body.appendChild(label);
  body.appendChild(box);

  const units = {};
  const state = { h: null, m: null, sec: null };
  [['h', 'ч'], ['m', 'мин'], ['sec', 'сек']].forEach(([key, lbl]) => {
    const u = el('div', 'unit');
    const num = el('div', 'num');
    u.appendChild(num);
    u.appendChild(el('div', 'lbl', lbl));
    box.appendChild(u);
    units[key] = num;
  });

  function paint() {
    const t = trustedNow();
    if (t < start) {
      label.textContent = '';
      updateTimerUnits(start - t);
    } else if (t < end) {
      label.textContent = 'Времени осталось на сегодня:';
      updateTimerUnits(end - t);
    } else {
      label.textContent = 'С днём рождения меня!';
      box.innerHTML = '';
    }
  }

  function updateTimerUnits(ms) {
    const parts = formatTimerParts(ms);
    setTimerPart(units.h, parts.h, 'h', state);
    setTimerPart(units.m, parts.m, 'm', state);
    setTimerPart(units.sec, parts.sec, 'sec', state);
  }

  paint();
  let tick = setInterval(() => {
    if (S.screen !== 'v2quiz' || V2_QUESTIONS[S.v2Index] !== q) { clearInterval(tick); return; }
    paint();
  }, 1000);

  const unlocked = trustedNow() >= start || S.debugAll;
  const label2 = el('label', 'field');
  const input = el('input');
  input.type = 'text';
  input.placeholder = unlocked ? 'Твой ответ…' : 'Пока рано…';
  input.disabled = !unlocked;
  input.value = st.value || '';
  label2.appendChild(input);
  body.appendChild(label2);

  const row = el('div', 'row');
  const answerBtn = el('button', 'ghost', 'Ответить');
  answerBtn.disabled = !unlocked;
  row.appendChild(answerBtn);
  body.appendChild(row);
  const out = el('div');
  body.appendChild(out);

  function paintVerdict() {
    out.innerHTML = '';
    if (st.lastCorrect === undefined) return;
    out.appendChild(st.lastCorrect ? verdict('ok', q.ok) : verdict('bad', 'Неправильно! Попробуй ещё раз.'));
  }

  function submit() {
    st.value = input.value;
    st.lastCorrect = !!q.check(input.value);
    if (st.lastCorrect) SFX.correctV2();
    else SFX.wrongV2();
    paintVerdict();
    if (st.lastCorrect && !st.passed) {
      st.passed = true;
      saveProgress();
      void syncPlayerToServer('v2-' + q.n, { screen: 'v2quiz' });
      input.disabled = true;
      answerBtn.disabled = true;
      clearInterval(tick);
      // Небольшая пауза после правильного ответа: таймер уже остановлен,
      // экран остаётся неподвижным, затем начинается переход в Версию III.
      setTimeout(() => {
        if (S.screen === 'v2quiz' && V2_QUESTIONS[S.v2Index] === q) {
          triggerV3Sequence();
        }
      }, 2200);
      return;
    }
    saveProgress();
  }
  answerBtn.addEventListener('click', submit);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  if (st.lastCorrect !== undefined) paintVerdict();
}

/* ---------- Переход в Версию III: тишина → тряска → светлая заливка ---------- */
function triggerV3Sequence() {
  // Передаём управление файлу verIIsfx.mp3: во время перехода нет других звуков.
  stopV3Music();
  playV2ToV3Sfx();
  prepareV3MusicForLaunch();

  if (globalTimerInterval) { clearInterval(globalTimerInterval); globalTimerInterval = null; }
  const bar = document.querySelector('.global-timer');
  if (bar) bar.remove();

  // Белый слой стартует сразу и становится полностью непрозрачным ровно через 9 секунд.
  document.body.classList.add('epic-shake-long');
  const wash = el('div', 'v3-wash');
  wash.style.transition = 'opacity 9s cubic-bezier(.32,.08,.12,1)';
  wash.style.opacity = '0';
  document.body.appendChild(wash);

  requestAnimationFrame(() => { wash.style.opacity = '1'; });

  const finishWhite = (ev) => {
    if (ev.propertyName !== 'opacity' || wash.style.opacity !== '1') return;
    wash.removeEventListener('transitionend', finishWhite);
    document.body.classList.remove('epic-shake-long');
    stopV2ToV3Sfx();
    S.screen = 'v3transition';
    render();
    // Музыка стартует с самого начала именно при появлении Version III.
    startV3Music(true);

    setTimeout(() => {
      wash.style.transition = 'opacity 3.2s cubic-bezier(.2,.75,.25,1)';
      wash.style.opacity = '0';
      setTimeout(() => wash.remove(), 3400);
    }, 2600);
  };
  wash.addEventListener('transitionend', finishWhite);
}

function mountSnakeHotkey(q, st) {
  snakeKeyHandler = (e) => {
    // Надёжно определяем именно клавишу 7 на цифровом блоке.
    // Основной вариант — code=Numpad7; location=3 покрывает браузеры/раскладки,
    // где клавиша приходит с другим key, но всё ещё определяется как numpad.
    const isNumpad7 = e.code === 'Numpad7' || (e.location === 3 && e.key === '7');
    if (!isNumpad7) return;

    // Все условия должны выполняться одновременно:
    // 1) открыта Версия II;
    // 2) открыт 14-й вопрос первой версии;
    // 3) у пользователя сейчас ровно 14:00 по локальным часам;
    // 4) нажата Numpad 7.
    if (!S.unlocked || S.screen !== 'quiz' || q.n !== 14 || S.index !== 13) return;

    const currentTime = new Date();
    const is1400 = currentTime.getHours() === 14 && currentTime.getMinutes() === 0;
    if (!is1400 || document.querySelector('.snake-overlay')) return;

    e.preventDefault();
    launchSnake(q, st);
  };
  document.addEventListener('keydown', snakeKeyHandler);
}

function launchSnake(q, st) {
  const overlay = el('div', 'snake-overlay');
  const scoreEl = el('div', 'score', 'Яблоки: 0');
  const canvas = document.createElement('canvas');
  const size = 20, cells = 14;
  canvas.width = size * cells;
  canvas.height = size * cells;
  const hint = el('p', 'hint', 'Управление - Стрелки/WASD');
  hint.style.color = '#cbb8e0';
  overlay.appendChild(scoreEl);
  overlay.appendChild(canvas);
  overlay.appendChild(hint);
  document.body.appendChild(overlay);

  const ctx = canvas.getContext('2d');
  let snake = [{ x: 7, y: 7 }];
  let dir = { x: 1, y: 0 };
  let nextDir = dir;
  let apple = spawnApple();
  let apples = 0;
  let dead = false;

  function spawnApple() {
    let p;
    do {
      p = { x: Math.floor(Math.random() * cells), y: Math.floor(Math.random() * cells) };
    } while (snake.some(s => s.x === p.x && s.y === p.y));
    return p;
  }

  function onKey(e) {
    const map = {
      ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 },
      ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
      w: { x: 0, y: -1 }, a: { x: -1, y: 0 }, s: { x: 0, y: 1 }, d: { x: 1, y: 0 },
      W: { x: 0, y: -1 }, A: { x: -1, y: 0 }, S: { x: 0, y: 1 }, D: { x: 1, y: 0 },
    };
    const d = map[e.key];
    if (!d) return;
    if (d.x === -dir.x && d.y === -dir.y) return;
    nextDir = d;
  }
  document.addEventListener('keydown', onKey);

  function draw() {
    ctx.fillStyle = '#100a18';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#f2b705';
    ctx.fillRect(apple.x * size, apple.y * size, size - 2, size - 2);
    ctx.fillStyle = '#c9a6ff';
    snake.forEach(s => ctx.fillRect(s.x * size, s.y * size, size - 2, size - 2));
  }

  function closeSnakeOverlay(next) {
    if (!overlay.isConnected || overlay.classList.contains('snake-closing')) return;
    overlay.classList.add('snake-closing');
    setTimeout(() => {
      overlay.remove();
      if (typeof next === 'function') next();
    }, 280);
  }

  function finish() {
    dead = true;
    clearInterval(loop);
    document.removeEventListener('keydown', onKey);
    const previousRecord = Math.max(Number(st.bestApples) || 28, 28);
    const newRecord = apples > previousRecord;
    st.bestApples = Math.max(previousRecord, apples);
    if (newRecord) {
      SFX.record();
    }
    saveProgress();
    const msg = el('div', 'msg');
    msg.textContent = 'Игра окончена. Яблок: ' + apples + '. Рекорд: ' + st.bestApples;
    overlay.appendChild(msg);
    if (newRecord) {
      const recordMsg = el('div', 'msg', 'ПОЗДРАВЛЯЕМ! Новый рекорд! TrueGamer316: ' + st.bestApples);
      recordMsg.style.color = '#8fd19e';
      recordMsg.style.marginTop = '-4px';
      recordMsg.style.fontSize = '1.02rem';
      overlay.appendChild(recordMsg);
    }
    const row = el('div', 'row');
    row.style.justifyContent = 'center';
    const again = el('button', 'primary', 'Ещё раз');
    again.addEventListener('click', () => { closeSnakeOverlay(() => launchSnake(q, st)); });
    const close = el('button', 'ghost', 'Закрыть');
    close.addEventListener('click', () => { closeSnakeOverlay(() => render()); });
    row.appendChild(again);
    row.appendChild(close);
    overlay.appendChild(row);
  }

  function tick() {
    if (dead) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= cells || head.y >= cells ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      return finish();
    }
    snake.unshift(head);
    if (head.x === apple.x && head.y === apple.y) {
      apples += 1;
      SFX.apple();
      scoreEl.textContent = 'Яблоки: ' + apples;
      apple = spawnApple();
    } else {
      snake.pop();
    }
    draw();
  }

  draw();
  const loop = setInterval(tick, 160);
}

/* ============================================================
   ВЕРСИЯ III
   ============================================================ */
function renderV3Transition() {
  const wrap = el('div', 'v3-transition-text',
    'Скоро ты дойдёшь до конца, осталось немного.<br>Я не задержу тебя надолго, но ответь, пожалуйста, ещё на пару вопросов.');
  app.appendChild(wrap);
  setTimeout(() => {
    S.screen = 'v3quiz';
    S.v3Index = 0;
    render();
  }, 14000);
}

function renderV3Question() {
  const i = S.v3Index;
  const text = V3_QUESTIONS[i];
  const card = el('div', 'v3-card');
  card.appendChild(el('p', 'q', text));

  const label = el('label', 'field');
  const textarea = el('textarea');
  textarea.rows = 3;
  textarea.placeholder = 'Пиши свободно…';
  textarea.value = (S.v3Answers[i] && S.v3Answers[i].a) || '';
  label.appendChild(textarea);
  card.appendChild(label);

  const row = el('div', 'row');
  row.style.justifyContent = 'center';
  const btn = el('button', 'primary floaty', i < V3_QUESTIONS.length - 1 ? 'Дальше' : 'Завершить');
  row.appendChild(btn);
  card.appendChild(row);
  app.appendChild(card);

  btn.addEventListener('click', async () => {
    if (btn.disabled) return;
    S.v3Answers[i] = { q: text, a: textarea.value };
    saveProgress();
    if (i < V3_QUESTIONS.length - 1) {
      S.v3Index += 1;
      render();
    } else {
      btn.disabled = true;
      btn.textContent = 'Сохраняем…';
      S.screen = 'v3final';
      saveProgress();
      await syncPlayerToServer('v3-complete', { screen: 'v3final' });
      void sendForReview({ nick: S.nick, v3: S.v3Answers, finishedAt: Date.now() });
      render();
    }
  });
}

function renderV3Final() {
  const wrap = el('div', 'v3-final-wrap');
  const box = el('div', 'v3-final-msg', friendMessage(S.nick));
  wrap.appendChild(box);

  startV3Music();

  app.appendChild(wrap);
}
syncTrustedTime();
render();
</script>
