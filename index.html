<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Опросик в честь 20-летия</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdf7ef;
    --bg-alt: #f6ecdd;
    --card: #ffffff;
    --ink: #2f2038;
    --ink-soft: #6b5a76;
    --accent: #7b3fa0;
    --accent-soft: #efe2f7;
    --gold: #e0a52e;
    --ok: #2f8f5b;
    --ok-bg: #e4f5ea;
    --bad: #c0503f;
    --bad-bg: #fbe8e4;
    --line: #e7dbcb;
    --code-bg: #2f2038;
    --code-ink: #ffd479;
    --display: 'Fraunces', Georgia, serif;
    --body: 'Nunito', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
 
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 12% 8%, rgba(224,165,46,.16), transparent 42%),
      radial-gradient(circle at 88% 4%, rgba(123,63,160,.14), transparent 40%),
      var(--bg);
    color: var(--ink);
    font-family: var(--body);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 64px;
  }

  .wrap { width: 100%; max-width: 620px; }

  .topbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
    font-size: .85rem;
    color: var(--ink-soft);
  }
  .topbar strong { color: var(--accent); font-weight: 700; }

  .track { height: 6px; background: var(--bg-alt); border-radius: 99px; overflow: hidden; margin-bottom: 18px; }
  .track > div { height: 100%; background: linear-gradient(90deg, var(--gold), var(--accent)); border-radius: 99px; transition: width .35s ease; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 28px 26px 26px;
    box-shadow: 0 14px 34px -22px rgba(47,32,56,.4);
    position: relative;
    animation: rise .34s ease;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  h1 { font-family: var(--display); font-size: clamp(1.7rem, 5.5vw, 2.3rem); margin: 0 0 12px; line-height: 1.15; }
  h2 { font-family: var(--display); font-size: clamp(1.25rem, 4.4vw, 1.6rem); margin: 0 0 8px; line-height: 1.25; font-weight: 700; }
  .q { font-family: var(--display); font-size: clamp(1.2rem, 4.2vw, 1.5rem); font-weight: 700; line-height: 1.3; margin: 0; }
  .hint { color: var(--ink-soft); font-size: .92rem; margin: 10px 0 0; line-height: 1.5; }
  p.lead { font-size: 1.02rem; line-height: 1.6; margin: 0 0 6px; }

  label.field { display: block; margin-top: 18px; }
  input[type=text], textarea {
    width: 100%;
    font-family: var(--body);
    font-size: 1rem;
    color: var(--ink);
    background: var(--bg);
    border: 1.5px solid var(--line);
    border-radius: 11px;
    padding: 12px 14px;
    outline: none;
    transition: border-color .18s ease;
  }
  input[type=text]:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 86px; }

  .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; align-items: center; }

  button {
    font-family: var(--body);
    font-size: .97rem;
    font-weight: 700;
    border: none;
    border-radius: 11px;
    padding: 11px 20px;
    cursor: pointer;
    transition: transform .12s ease, filter .18s ease;
  }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: default; }
  .primary { background: var(--accent); color: #fff; }
  .primary:hover:not(:disabled) { filter: brightness(1.08); }
  .ghost { background: var(--accent-soft); color: var(--accent); }
  .ghost:hover:not(:disabled) { filter: brightness(.97); }
  .wide { width: 100%; }

  .verdict { margin-top: 14px; font-weight: 700; font-size: 1rem; }
  .verdict.ok { color: var(--ok); animation: popIn .4s ease; }
  .verdict.bad { color: var(--bad); animation: shakeX .45s ease; }
  .verdict.neutral { color: var(--accent); animation: popIn .4s ease; }
  @keyframes popIn { 0% { opacity: 0; transform: scale(.85); } 60% { opacity: 1; transform: scale(1.05); } 100% { transform: scale(1); } }
  @keyframes shakeX {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); } 40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); } 80% { transform: translateX(4px); }
  }

  button.q {
    font-family: var(--display); font-weight: 700; line-height: 1.3;
    color: var(--ink); background: none; border: 2px dashed var(--accent); border-radius: 12px;
    padding: 14px 16px; cursor: pointer; display: block; width: 100%; text-align: center;
    transition: background .2s ease, transform .15s ease;
  }
  button.q:hover { background: var(--accent-soft); }
  button.q:active { transform: scale(.98); }

  .stage-stats { font-size: .78rem; color: var(--ink-soft); margin-top: 8px; }

  .stealth { color: var(--card); transition: color .45s ease; cursor: default; }
  .stealth:hover { color: var(--ink); }

  .codebox {
    margin-top: 14px;
    font-family: var(--mono);
    font-size: .88rem;
    background: var(--code-bg);
    color: var(--code-ink);
    border-radius: 10px;
    padding: 12px 14px;
    overflow-x: auto;
    white-space: pre;
  }

  .guesses { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
  .chip { font-size: .82rem; font-weight: 700; padding: 5px 11px; border-radius: 8px; }
  .chip.ok { background: var(--ok-bg); color: var(--ok); }
  .chip.bad { background: var(--bad-bg); color: var(--bad); }
  .counter { margin-top: 12px; font-size: .9rem; color: var(--ink-soft); font-weight: 600; }

  /* Q4 — фейковая реклама */
  .ad {
    position: absolute;
    top: -14px;
    right: -10px;
    background: #d62300;
    color: #ffc72c;
    font-family: var(--body);
    font-weight: 700;
    font-size: .82rem;
    line-height: 1.25;
    text-align: center;
    padding: 9px 13px;
    border-radius: 12px;
    box-shadow: 0 8px 20px -8px rgba(0,0,0,.45);
    cursor: pointer;
    transform: rotate(4deg);
    animation: rise .4s ease;
    z-index: 5;
  }
  .ad span { display: block; font-size: .95rem; letter-spacing: .01em; }
  @media (max-width: 520px) { .ad { top: -12px; right: -4px; font-size: .74rem; padding: 7px 10px; } }

  /* Q8 — кликер */
  .clicker-stage { position: relative; min-height: 360px; margin-top: 16px; overflow: hidden; border-radius: 12px; background: var(--bg-alt); }
  .clicker-core { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 3; }
  .bigbutton {
    width: 118px; height: 118px; border-radius: 50%;
    background: var(--accent);
    color: #fff; font-size: 1.05rem; font-weight: 700;
    box-shadow: 0 10px 22px -10px rgba(123,63,160,.8);
  }
  .clicks { font-family: var(--display); font-size: 2rem; font-weight: 700; }
  .noise { position: absolute; font-family: var(--body); font-weight: 700; color: var(--accent); opacity: .55; pointer-events: none; z-index: 2; white-space: normal; max-width: calc(100% - 16px); overflow-wrap: anywhere; text-align: center; }
  .noise.code { font-family: var(--mono); font-weight: 600; color: var(--ink-soft); opacity: .5; font-size: .78rem; }

  .timer-tick { animation: timerTick .34s ease; }
  @keyframes timerTick {
    0% { opacity: .45; transform: scale(1.08); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* Q18 — скрытые надписи */
  .haystack { position: relative; min-height: 480px; margin-top: 14px; border-radius: 12px; overflow: hidden; }
  .straw { position: absolute; white-space: nowrap; cursor: default; transition: color .25s ease, transform .25s ease, opacity .25s ease, text-shadow .25s ease; }
  .straw:hover { color: var(--ink-soft) !important; }
  .straw.correct-target:hover {
    color: rgba(123,63,160,.42) !important;
    transform: scale(1.06);
    text-shadow: 0 0 10px rgba(123,63,160,.16);
  }
  body.v2-theme .straw.correct-target:hover {
    color: rgba(201,166,255,.48) !important;
    text-shadow: 0 0 12px rgba(201,166,255,.18);
  }

  .final-secret {
    display: block;
    margin-top: 34px;
    font-family: var(--mono);
    font-size: .74rem;
    line-height: 1.6;
    white-space: pre-wrap;
    color: #fbf6ee;
    transition: color .5s ease;
    cursor: default;
  }
  .final-secret:hover { color: var(--ink-soft); }

  .final-screen-center {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .final-screen-center .card {
    width: min(620px, 100%);
  }

  .switchline { margin-top: 20px; font-size: .84rem; color: var(--ink-soft); text-align: center; }
  .switchline button { background: none; color: var(--accent); padding: 4px 6px; text-decoration: underline; font-size: .84rem; }

  /* ===================== ВЕРСИЯ II — тёмная тема ===================== */
  body.v2-theme {
    --bg: #17101f;
    --bg-alt: #221733;
    --card: #221733;
    --ink: #f2e9ff;
    --ink-soft: #b6a0cf;
    --accent: #c9a6ff;
    --accent-soft: #33234a;
    --gold: #f2b705;
    --ok: #8fd19e;
    --ok-bg: #223529;
    --bad: #e98a7e;
    --bad-bg: #3a2224;
    --line: #3a2850;
    --code-bg: #0f0a17;
    --code-ink: #f2b705;
  }
  body.v2-theme .card {
    box-shadow: 0 18px 40px -20px rgba(0,0,0,.6);
    position: relative;
    animation: v2Materialize .75s cubic-bezier(.2,.8,.3,1);
  }
  body.v2-theme .topbar { animation: v2FadeIn .5s ease; }
  @keyframes v2Materialize {
    0% { opacity: 0; transform: scale(.92) translateY(16px); filter: blur(6px); }
    60% { filter: blur(0); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes v2FadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  body.v2-theme { padding-top: 46px; }
  body.v2-theme .q { text-align: center; font-size: clamp(1.5rem, 6vw, 2.1rem); }
  body.v2-theme .row { justify-content: center; }
  body.v2-theme .hint { text-align: center; }

  /* ===================== ЭПИЧНОЕ РАЗРУШЕНИЕ ===================== */
  @keyframes epicShake {
    0%, 100% { transform: translate(0,0); }
    10% { transform: translate(-4px,3px) rotate(-.18deg); }
    20% { transform: translate(5px,-4px) rotate(.18deg); }
    30% { transform: translate(-7px,2px) rotate(-.24deg); }
    40% { transform: translate(8px,6px) rotate(.22deg); }
    50% { transform: translate(-6px,-7px) rotate(-.18deg); }
    60% { transform: translate(10px,3px) rotate(.28deg); }
    70% { transform: translate(-8px,-5px) rotate(-.2deg); }
    80% { transform: translate(6px,7px) rotate(.16deg); }
    90% { transform: translate(-4px,2px) rotate(-.12deg); }
  }
  body.epic-shake { animation: epicShake .85s linear 1; }
  body.epic-shake-long { animation: epicShake .82s linear infinite; }

  @keyframes v2ShakeSmall {
    0%,100% { transform: translate(0,0) rotate(0); }
    20% { transform: translate(-2px,1px) rotate(-.08deg); }
    40% { transform: translate(3px,-2px) rotate(.09deg); }
    60% { transform: translate(-3px,2px) rotate(-.07deg); }
    80% { transform: translate(2px,1px) rotate(.06deg); }
  }
  @keyframes v2ShakeMedium {
    0%,100% { transform: translate(0,0) rotate(0); }
    16% { transform: translate(-6px,3px) rotate(-.2deg); }
    32% { transform: translate(6px,-5px) rotate(.22deg); }
    48% { transform: translate(-7px,4px) rotate(-.2deg); }
    64% { transform: translate(8px,5px) rotate(.24deg); }
    80% { transform: translate(-5px,-4px) rotate(-.16deg); }
  }
  @keyframes v2ShakeLarge {
    0%,100% { transform: translate(0,0) rotate(0) scale(1); filter: none; }
    10% { transform: translate(-12px,7px) rotate(-.5deg) scale(1.002); filter: contrast(1.08); }
    22% { transform: translate(10px,-9px) rotate(.55deg) scale(.998); }
    34% { transform: translate(-15px,4px) rotate(-.58deg) scale(1.003); filter: saturate(1.35); }
    46% { transform: translate(14px,10px) rotate(.52deg) scale(.998); }
    58% { transform: translate(-11px,-8px) rotate(-.48deg) scale(1.004); filter: contrast(1.18); }
    70% { transform: translate(16px,5px) rotate(.6deg) scale(.997); }
    82% { transform: translate(-9px,8px) rotate(-.42deg) scale(1.003); filter: saturate(1.5) contrast(1.1); }
  }
  body.v2-shake-small { animation: v2ShakeSmall .48s cubic-bezier(.36,.07,.19,.97) 1; }
  body.v2-shake-medium { animation: v2ShakeMedium .72s cubic-bezier(.36,.07,.19,.97) 1; }
  body.v2-shake-large { animation: v2ShakeLarge 1.35s cubic-bezier(.36,.07,.19,.97) 1; }

  /* Третий удар — уже почти поломка: вспышки, цветовой сдвиг и короткие рывки. */
  body.v2-catastrophe {
    animation: v2ShakeLarge 1.35s cubic-bezier(.36,.07,.19,.97) 1, v2Catastrophe .23s steps(2,end) 4;
  }
  body.v2-catastrophe::after {
    content: ''; position: fixed; inset: 0; z-index: 54; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent 0 7px, rgba(255,255,255,.055) 7px 9px);
    mix-blend-mode: screen;
    animation: v2ScanBurst .18s steps(2,end) 6;
  }
  @keyframes v2Catastrophe {
    0%,100% { opacity: 1; }
    50% { opacity: .62; }
  }
  @keyframes v2ScanBurst {
    0%,100% { transform: translateY(0); opacity: .05; }
    50% { transform: translateY(8px); opacity: .7; }
  }

  body.v2-reveal-seq .hud-ticker,
  body.v2-reveal-seq .hud-telemetry,
  body.v2-reveal-seq .hud-wave,
  body.v2-reveal-seq .version-toggle,
  body.v2-reveal-seq .debug-fab,
  body.v2-reveal-seq .card,
  body.v2-reveal-seq .topbar,
  body.v2-reveal-seq .global-timer {
    opacity: 0;
    animation-fill-mode: forwards;
  }
  body.v2-reveal-seq .hud-ticker { animation: v2UiIn .9s cubic-bezier(.16,1,.3,1) 7.2s forwards !important; }
  body.v2-reveal-seq .hud-telemetry { animation: v2TelemetryIn 1.1s cubic-bezier(.16,1,.3,1) 7.75s forwards !important; }
  body.v2-reveal-seq .hud-wave { animation: v2WaveIn 1.2s cubic-bezier(.16,1,.3,1) 8.25s forwards !important; }
  body.v2-reveal-seq .version-toggle { animation: v2UiIn .95s cubic-bezier(.16,1,.3,1) 8.75s forwards !important; }
  body.v2-reveal-seq .debug-fab { animation: v2UiIn .95s cubic-bezier(.16,1,.3,1) 9.15s forwards !important; }
  body.v2-reveal-seq .topbar { animation: v2TopbarIn 1.05s cubic-bezier(.16,1,.3,1) 9.55s forwards !important; }
  body.v2-reveal-seq .card { animation: v2CardIn 1.35s cubic-bezier(.16,1,.3,1) 10.15s forwards !important; }
  body.v2-reveal-seq .global-timer { animation: v2UiIn 1s cubic-bezier(.16,1,.3,1) 10.85s forwards !important; }
  body.v2-reveal-seq .card h1 { opacity: 0; animation: v2TextIn .9s cubic-bezier(.16,1,.3,1) 11.25s forwards !important; }
  body.v2-reveal-seq .card p { opacity: 0; animation: v2TextIn .85s cubic-bezier(.16,1,.3,1) 11.7s forwards !important; }
  body.v2-reveal-seq .card button { opacity: 0; animation: v2ButtonIn 1s cubic-bezier(.16,1,.3,1) 12.25s forwards !important; }
  /* После кинематографичного появления не запускаем базовые анимации повторно при снятии v2-reveal-seq. */
  body.v2-reveal-done .hud-ticker,
  body.v2-reveal-done .hud-telemetry,
  body.v2-reveal-done .hud-wave,
  body.v2-reveal-done .version-toggle,
  body.v2-reveal-done .debug-fab,
  body.v2-reveal-done .card,
  body.v2-reveal-done .topbar,
  body.v2-reveal-done .global-timer {
    opacity: 1;
    animation: none !important;
  }
  body.v2-reveal-done .hud-wave {
    transform: translateX(-50%) !important;
  }
  body.v2-reveal-done .card h1,
  body.v2-reveal-done .card p,
  body.v2-reveal-done .card button {
    opacity: 1;
    animation: none !important;
    transform: none !important;
    filter: none !important;
    clip-path: none !important;
  }
  @keyframes v2UiIn {
    0% { opacity: 0; transform: translateY(14px) scale(.94); filter: blur(10px); clip-path: inset(0 38% 0 38%); }
    58% { opacity: .92; transform: translateY(-2px) scale(1.015); filter: blur(1px); clip-path: inset(0 0 0 0); }
    78% { transform: translateY(1px) scale(.997); }
    100% { opacity: 1; transform: none; filter: blur(0); clip-path: inset(0 0 0 0); }
  }
  @keyframes v2TelemetryIn {
    0% { opacity: 0; transform: translateX(26px) scaleX(.55); filter: blur(10px); }
    40% { opacity: .75; transform: translateX(-4px) scaleX(1.03); filter: blur(2px); }
    70% { transform: translateX(3px); }
    100% { opacity: 1; transform: none; filter: blur(0); }
  }
  @keyframes v2WaveIn {
    0% { opacity: 0; transform: translateX(-50%) translateY(16px) scale(.75); filter: blur(12px); }
    35% { opacity: 1; transform: translateX(-50%) translateY(-3px) scale(1.08); filter: blur(1px); }
    55% { transform: translateX(-50%) translateY(2px) scale(.98); }
    100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); filter: blur(0); }
  }
  @keyframes v2TopbarIn {
    0% { opacity: 0; transform: translateY(-22px) scaleY(.7); filter: blur(12px); }
    45% { opacity: 1; transform: translateY(3px) scaleY(1.04); filter: blur(2px); }
    65% { transform: translateY(-2px) scaleY(.99); }
    100% { opacity: 1; transform: none; filter: blur(0); }
  }
  @keyframes v2CardIn {
    0% { opacity: 0; transform: perspective(900px) rotateX(7deg) scale(.78) translateY(45px); filter: blur(18px) brightness(.2); box-shadow: 0 0 0 rgba(0,0,0,0); }
    35% { opacity: .45; transform: perspective(900px) rotateX(-2deg) scale(.98) translateY(-8px); filter: blur(5px) brightness(.65); box-shadow: 0 0 55px rgba(201,166,255,.18); }
    62% { opacity: 1; transform: perspective(900px) rotateX(1deg) scale(1.025) translateY(2px); filter: blur(1px) brightness(1.12); box-shadow: 0 0 100px rgba(201,166,255,.22); }
    78% { transform: perspective(900px) rotateX(0) scale(.997); }
    100% { opacity: 1; transform: perspective(900px) rotateX(0) scale(1); filter: blur(0) brightness(1); box-shadow: 0 18px 40px -20px rgba(0,0,0,.6); }
  }
  @keyframes v2TextIn {
    0% { opacity: 0; transform: translateY(18px) scale(.96); filter: blur(10px); }
    55% { opacity: 1; transform: translateY(-3px) scale(1.015); filter: blur(1px); }
    100% { opacity: 1; transform: none; filter: blur(0); }
  }
  @keyframes v2ButtonIn {
    0% { opacity: 0; transform: translateY(16px) scale(.82); filter: blur(8px); }
    45% { opacity: 1; transform: translateY(-5px) scale(1.08); filter: blur(0); }
    68% { transform: translateY(2px) scale(.98); }
    100% { opacity: 1; transform: none; filter: blur(0); }
  }

  .crack-overlay { position: fixed; inset: 0; z-index: 55; pointer-events: none; overflow: hidden; }
  .crack-line {
    position: absolute; height: 3px; width: 0;
    background: linear-gradient(90deg, transparent, #fff, #fff, transparent);
    box-shadow: 0 0 12px 2px rgba(255,255,255,.8);
    transform-origin: left center;
    animation: crackGrow .3s ease-out forwards;
  }
  @keyframes crackGrow { from { width: 0; opacity: 1; } to { width: 150vmax; opacity: .85; } }

  .flash-overlay { position: fixed; inset: 0; z-index: 56; background: #000; opacity: 0; pointer-events: none; }

  /* Медленное падение интерфейса первой версии перед уходом в чёрный экран. */
  .v1-fall-layer {
    position: fixed;
    inset: 0;
    z-index: 55;
    pointer-events: none;
    overflow: hidden;
  }
  .v1-falling-copy {
    will-change: transform, opacity, filter;
    contain: layout style paint;
    transform-origin: 50% 50%;
    pointer-events: none;
    backface-visibility: hidden;
    opacity: 1;
    transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
  }
  .v1-falling-copy-active {
    /* Одна непрерывная траектория: сначала резкий подъём по диагонали,
       затем плавная дуга и без остановки — ускоряющееся падение вниз. */
    animation: v1OvalFall 2.15s linear var(--fall-delay) forwards;
  }
  @keyframes v1OvalFall {
    0% {
      opacity: 1;
      transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
      filter: blur(0) brightness(1);
    }
    16% {
      opacity: 1;
      transform: translate3d(var(--fall-x1), var(--fall-y1), 0) rotate(calc(var(--fall-rotate) * -.18)) scale(1.015);
      filter: blur(0) brightness(1.03);
    }
    32% {
      opacity: 1;
      transform: translate3d(var(--fall-x2), var(--fall-y2), 0) rotate(calc(var(--fall-rotate) * -.35)) scale(1.025);
      filter: blur(0) brightness(1.04);
    }
    48% {
      opacity: .995;
      transform: translate3d(var(--fall-x3), var(--fall-y3), 0) rotate(calc(var(--fall-rotate) * .05)) scale(1.01);
      filter: blur(.15px) brightness(1);
    }
    64% {
      opacity: .985;
      transform: translate3d(var(--fall-x4), var(--fall-y4), 0) rotate(calc(var(--fall-rotate) * .5)) scale(.98);
      filter: blur(.5px) brightness(.92);
    }
    82% {
      opacity: .97;
      transform: translate3d(var(--fall-x5), var(--fall-y5), 0) rotate(calc(var(--fall-rotate) * .78)) scale(.95);
      filter: blur(1px) brightness(.82);
    }
    100% {
      opacity: .92;
      transform: translate3d(var(--fall-x6), var(--fall-distance), 0) rotate(var(--fall-rotate)) scale(.9);
      filter: blur(2.5px) brightness(.68);
    }
  }

  .version-toggle {
    position: fixed; right: 14px; bottom: 14px; z-index: 30;
    background: var(--accent); color: var(--card);
    padding: 9px 16px; border-radius: 99px; font-size: .82rem;
    box-shadow: 0 8px 18px -8px rgba(0,0,0,.4);
  }


  /* ---------- Переход между версиями по кнопке ---------- */
  .version-switch-overlay {
    position: fixed;
    inset: 0;
    z-index: 95;
    pointer-events: none;
    overflow: hidden;
    opacity: 0;
    background:
      radial-gradient(circle at 50% 50%, var(--switch-center, rgba(214,205,224,.92)) 0%, rgba(18,12,27,.82) 42%, rgba(4,3,8,.98) 100%);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }
  .version-switch-overlay::before {
    content: '';
    position: absolute;
    inset: -20%;
    background: repeating-linear-gradient(0deg, transparent 0 5px, rgba(255,255,255,.045) 5px 6px);
    opacity: .35;
    transform: translateY(-100%);
  }
  .version-switch-overlay::after {
    content: '';
    position: absolute;
    width: 22vw; height: 22vw; min-width: 140px; min-height: 140px;
    left: 50%; top: 50%;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.28);
    box-shadow:
      0 0 0 1px rgba(197,157,255,.12),
      0 0 45px rgba(177,118,235,.22),
      inset 0 0 35px rgba(255,255,255,.06);
    transform: translate(-50%,-50%) scale(.05);
    opacity: 0;
  }
  body.version-switching #app {
    animation: none;
    transform: none;
    filter: none;
  }
  body.version-switching .version-switch-overlay {
    animation: versionCurtainIn 1.05s cubic-bezier(.22,.7,.25,1) forwards;
  }
  body.version-switching .version-switch-overlay::before {
    animation: versionScanIn 1.05s cubic-bezier(.22,.7,.25,1) forwards;
  }
  body.version-switching .version-switch-overlay::after {
    animation: versionPulseIn 1.05s cubic-bezier(.2,.8,.25,1) forwards;
  }
  body.version-switch-in #app {
    animation: none;
    transform: none;
    filter: none;
  }
  body.version-switch-in .version-switch-overlay {
    opacity: 1;
    animation: versionCurtainOut 1.15s cubic-bezier(.22,.7,.25,1) .05s forwards;
  }
  body.version-switch-in .version-switch-overlay::before {
    animation: versionScanOut 1.15s cubic-bezier(.22,.7,.25,1) forwards;
  }
  body.version-switch-in .version-switch-overlay::after {
    animation: versionPulseOut 1.15s cubic-bezier(.2,.8,.25,1) forwards;
  }
  @keyframes versionSwitchOut {
    0% { opacity: 1; transform: scale(1) rotate(0deg); filter: blur(0); }
    38% { opacity: .92; transform: scale(.985) rotate(-.25deg); filter: blur(.4px); }
    72% { opacity: .48; transform: scale(.965) rotate(.45deg); filter: blur(2px); }
    100% { opacity: 0; transform: scale(.91) rotate(-.7deg); filter: blur(8px); }
  }
  @keyframes versionCurtainIn {
    0% { opacity: 0; transform: scale(1.08); }
    42% { opacity: .36; transform: scale(1); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes versionScanIn {
    0% { transform: translateY(-100%) skewY(-4deg); opacity: 0; }
    35% { opacity: .65; }
    100% { transform: translateY(100%) skewY(-4deg); opacity: .15; }
  }
  @keyframes versionPulseIn {
    0% { transform: translate(-50%,-50%) scale(.05); opacity: 0; }
    42% { opacity: .8; }
    100% { transform: translate(-50%,-50%) scale(16); opacity: 0; }
  }
  @keyframes versionSwitchIn {
    0% { opacity: 0; transform: scale(1.055) translateY(10px); filter: blur(8px); }
    28% { opacity: .65; transform: scale(1.018) translateY(2px); filter: blur(3px); }
    64% { opacity: 1; transform: scale(.998) translateY(0); filter: blur(.5px); }
    100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
  }
  @keyframes versionCurtainOut {
    0% { opacity: 1; transform: scale(1); }
    38% { opacity: .95; transform: scale(1.01); }
    100% { opacity: 0; transform: scale(1.035); }
  }
  @keyframes versionScanOut {
    0% { transform: translateY(-100%) skewY(-4deg); opacity: .3; }
    100% { transform: translateY(100%) skewY(-4deg); opacity: 0; }
  }
  @keyframes versionPulseOut {
    0% { transform: translate(-50%,-50%) scale(.15); opacity: .7; }
    100% { transform: translate(-50%,-50%) scale(18); opacity: 0; }
  }

  /* ===================== ВЕРСИЯ II — декоративный HUD-мусор ===================== */
  body.v2-theme::before {
    content: ''; position: fixed; inset: 0; z-index: 4; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0px, rgba(255,255,255,.025) 1px, transparent 1px, transparent 3px);
    mix-blend-mode: overlay;
  }
  body.v2-theme .q {
    position: relative;
    animation: glitchFlicker 6.5s infinite;
  }
  @keyframes glitchFlicker {
    0%, 95%, 100% { text-shadow: none; transform: none; }
    96% { text-shadow: -2px 0 #ff5e7a, 2px 0 #5ecbff; transform: translateX(1px); }
    97% { text-shadow: 2px 0 #ff5e7a, -2px 0 #5ecbff; transform: translateX(-1px); }
    98% { text-shadow: -1px 0 #ff5e7a, 1px 0 #5ecbff; transform: translateX(1px); }
    99% { text-shadow: none; transform: none; }
  }

  .hud-ticker {
    position: fixed; top: 0; left: 0; right: 0; z-index: 25;
    background: #0f0a17; color: #8267a8; font-family: var(--mono); font-size: .7rem;
    padding: 5px 0; overflow: hidden; white-space: nowrap; border-bottom: 1px solid var(--line);
  }
  .hud-ticker span { display: inline-block; padding-left: 100%; animation: hudScroll 26s linear infinite; }
  @keyframes hudScroll { from { transform: translateX(0); } to { transform: translateX(-100%); } }

  .hud-telemetry {
    position: fixed; top: 34px; left: 8px; z-index: 25;
    font-family: var(--mono); font-size: .65rem; color: #7a5ea3; line-height: 1.55;
    pointer-events: none; opacity: .85;
  }
  .hud-telemetry b { color: var(--accent); }
  @media (max-width: 640px) { .hud-telemetry { display: none; } }

  .hud-corner { position: absolute; width: 14px; height: 14px; border-color: var(--accent); opacity: .8; pointer-events: none; }
  .hud-tl { top: -2px; left: -2px; border-top: 2px solid; border-left: 2px solid; }
  .hud-tr { top: -2px; right: -2px; border-top: 2px solid; border-right: 2px solid; }
  .hud-bl { bottom: -2px; left: -2px; border-bottom: 2px solid; border-left: 2px solid; }
  .hud-br { bottom: -2px; right: -2px; border-bottom: 2px solid; border-right: 2px solid; }

  .hud-wave {
    position: fixed; left: 50%; bottom: 58px; transform: translateX(-50%); z-index: 22;
    display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; opacity: .85;
  }
  .hud-wave .bars { display: flex; align-items: flex-end; gap: 2px; height: 20px; }
  .hud-wave .bars span { width: 3px; background: var(--accent); border-radius: 2px; animation: waveBounce 1.1s ease-in-out infinite; }
  @keyframes waveBounce { 0%, 100% { height: 4px; } 50% { height: 18px; } }
  .hud-wave .lbl { font-family: var(--mono); font-size: .6rem; color: #7a5ea3; letter-spacing: .04em; }

  .global-timer {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 21;
    background: var(--card); border: 1px solid var(--line); color: var(--ink);
    font-family: var(--mono); font-size: .78rem; padding: 7px 14px; border-radius: 99px;
    box-shadow: 0 8px 18px -8px rgba(0,0,0,.35); white-space: nowrap;
    animation: globalTimerIn .4s ease;
  }
  @keyframes globalTimerIn {
    from { opacity: 0; transform: translate(-50%, 10px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }
  .global-timer span { color: var(--accent); font-weight: 700; display: inline-block; }

  /* ===================== ПРЕОДОЛЕВАТЕЛЬ — выпадающая панель Версии II ===================== */
  .challenge-drawer {
    position: fixed;
    top: 64px;
    right: 14px;
    left: auto;
    transform: none;
    width: min(390px, calc(100vw - 28px));
    z-index: 27;
    font-family: var(--body);
    color: var(--ink);
  }
  .challenge-tab {
    width: fit-content;
    min-width: 210px;
    margin-left: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 14px;
    border-radius: 0 0 12px 12px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--ink);
    box-shadow: 0 8px 20px -14px rgba(0,0,0,.65);
    cursor: pointer;
    font-size: .78rem;
    letter-spacing: .02em;
  }
  .challenge-tab strong { color: var(--accent); }
  .challenge-tab .challenge-arrow {
    font-size: .75rem;
    transition: transform .22s ease;
  }
  .challenge-drawer.open .challenge-tab .challenge-arrow { transform: rotate(180deg); }
  .challenge-panel {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    background: var(--card);
    border: 0 solid var(--line);
    border-top: 0;
    border-radius: 0 0 14px 14px;
    box-shadow: 0 18px 36px -20px rgba(0,0,0,.7);
    transition: max-height .28s ease, opacity .2s ease, border-width .2s ease;
  }
  .challenge-drawer.open .challenge-tab { width: 100%; }
  .challenge-drawer.open .challenge-panel {
    max-height: min(65vh, 560px);
    overflow-y: auto;
    opacity: 1;
    border-width: 0 1px 1px;
  }
  .challenge-inner { padding: 12px 14px 14px; }
  .challenge-intro { margin: 0 0 10px; color: var(--ink-soft); font-size: .8rem; line-height: 1.45; }
  .challenge-progress {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 10px; font-size: .78rem; font-weight: 700;
  }
  .challenge-progress strong { color: var(--accent); }
  .challenge-progress-bar {
    height: 5px; flex: 1; background: var(--bg-alt); border-radius: 99px; overflow: hidden;
  }
  .challenge-progress-bar > div {
    height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), var(--accent));
    transition: width .3s ease;
  }
  .challenge-list { display: flex; flex-direction: column; gap: 6px; }
  .challenge-item {
    display: grid; grid-template-columns: 22px 28px 1fr auto; gap: 8px;
    padding: 7px 8px; border-radius: 9px; background: var(--bg);
    font-size: .78rem; line-height: 1.4;
  }
  .challenge-number {
    font-family: var(--mono); font-weight: 700; color: var(--ink-soft); text-align: center;
  }
  .challenge-item.done { background: var(--ok-bg); }
  .challenge-item .mark { font-weight: 800; color: var(--ink-soft); text-align: center; }
  .challenge-item.done .mark { color: var(--ok); }
  .challenge-item .note { color: var(--ink-soft); font-size: .7rem; margin-top: 2px; }
  .challenge-points { font-family: var(--mono); font-weight: 700; color: var(--accent); white-space: nowrap; text-align: right; }
  .challenge-deadline { margin-top: 9px; color: var(--ink-soft); font-family: var(--mono); font-size: .65rem; text-align: center; }
  .challenge-drawer.complete .challenge-tab { border-color: var(--ok); }
  .challenge-drawer.complete .challenge-tab strong { color: var(--ok); }
  @media (max-width: 520px) {
    .challenge-drawer { top: 56px; right: 8px; width: calc(100vw - 16px); transform: none; }
    .challenge-tab { min-width: 190px; font-size: .72rem; padding: 7px 11px; }
  }

  /* ===================== СЛУЖЕБНАЯ ПАНЕЛЬ (код полного доступа) ===================== */
  .debug-fab {
    position: fixed; left: 14px !important; right: auto !important; bottom: 14px !important; z-index: 40;
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--line); color: var(--ink);
    font-size: 1.1rem; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 0; text-align: center;
    box-shadow: 0 8px 18px -8px rgba(0,0,0,.5);
  }
  .debug-panel {
    position: fixed; left: 14px; bottom: 60px; z-index: 40;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; max-width: 280px; flex-direction: column; gap: 6px;
    box-shadow: 0 14px 34px -18px rgba(0,0,0,.5); font-size: .78rem;
  }
  .debug-row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .debug-label { color: var(--ink-soft); width: 22px; font-weight: 700; }
  .debug-chip {
    padding: 3px 7px; font-size: .72rem; font-weight: 600;
    background: var(--accent-soft); color: var(--accent); border-radius: 6px;
  }

  /* ===================== ВЕРСИЯ II — компоненты ===================== */
  .locked-box { text-align: center; padding: 26px 10px; }
  .locked-box .big { font-family: var(--display); font-size: 1.6rem; color: var(--accent); }

  .snake-launch { text-align: center; padding: 20px 10px; color: var(--ink-soft); font-size: .92rem; }
  .snake-overlay {
    position: fixed; inset: 0; z-index: 60; background: rgba(10,6,16,.88);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    animation: snakeOverlayIn .34s cubic-bezier(.2,.82,.25,1) both;
    transform-origin: center;
  }
  .snake-overlay.snake-closing { animation: snakeOverlayOut .28s cubic-bezier(.55,.05,.7,.2) forwards; }
  @keyframes snakeOverlayIn {
    from { opacity: 0; transform: scale(.965); filter: blur(7px); }
    60% { opacity: 1; transform: scale(1.012); filter: blur(0); }
    to { opacity: 1; transform: scale(1); filter: blur(0); }
  }
  @keyframes snakeOverlayOut {
    from { opacity: 1; transform: scale(1); filter: blur(0); }
    100% { opacity: 0; transform: scale(.985); filter: blur(5px); }
  }
  .snake-overlay canvas { background: #100a18; border: 2px solid var(--accent); border-radius: 10px; }
  .snake-overlay .score { color: #fff; font-family: var(--display); font-size: 1.3rem; }
  .snake-overlay .msg { color: var(--gold); font-family: var(--display); font-size: 1.2rem; text-align: center; }

  .countdown-box { display: flex; gap: 18px; justify-content: center; margin: 22px 0; flex-wrap: wrap; animation: countdownIn .6s cubic-bezier(.2,.8,.3,1); }
  @keyframes countdownIn { from { opacity: 0; transform: translateY(14px) scale(.92); } to { opacity: 1; transform: none; } }
  .countdown-box .unit { text-align: center; }
  .countdown-box .num { font-family: var(--display); font-size: clamp(2.2rem, 9vw, 3.4rem); font-weight: 700; color: var(--accent); }
  .countdown-box .num.timer-tick { animation: timerTick .34s ease; }
  @keyframes tickPulse { 0% { transform: scale(1.16); opacity: .6; } 100% { transform: scale(1); opacity: 1; } }
  .countdown-box .lbl { font-size: .74rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .05em; }

  /* ===================== ВЕРСИЯ III — мягкая тема ===================== */
  body.v3-theme {
    --bg: #fff6ee;
    --bg-alt: #ffece0;
    --card: #fffaf6;
    --ink: #4a3b34;
    --ink-soft: #8d7669;
    --accent: #e08a5b;
    --accent-soft: #fbe3d2;
    --gold: #f2b705;
    --ok: #7fae86;
    --ok-bg: #eaf3ea;
    --bad: #d98b7a;
    --bad-bg: #fbe9e4;
    --line: #f0ddce;
    --code-bg: #fff1e4;
    --code-ink: #b5651d;
  }

  .v3-wash { position: fixed; inset: 0; z-index: 58; background: #fff; opacity: 0; transition: opacity 4.8s cubic-bezier(.2,.7,.25,1); pointer-events: none; }

  .v3-blob-field { position: fixed; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; }
  .v3-blob { position: absolute; border-radius: 50%; filter: blur(36px); opacity: .78; animation: v3Drift 10s ease-in-out infinite; will-change: transform; }
  .v3-blob.b1 { width: 360px; height: 360px; background: #ffcf9e; top: -90px; left: -80px; animation-duration: 10s; }
  .v3-blob.b2 { width: 330px; height: 330px; background: #ffb6c8; bottom: -90px; right: -70px; animation-duration: 11s; animation-delay: -5s; }
  .v3-blob.b3 { width: 270px; height: 270px; background: #ffe29e; top: 38%; right: 3%; animation-duration: 8.5s; animation-delay: -2s; }
  .v3-blob.b4 { width: 250px; height: 250px; background: #ffd0e8; top: 16%; left: 36%; animation-duration: 12s; animation-delay: -8s; }
  .v3-blob.b5 { width: 220px; height: 220px; background: #ffc89a; bottom: 13%; left: 5%; animation-duration: 9s; animation-delay: -4s; }
  .v3-blob.b6 { width: 190px; height: 190px; background: #ffd9b8; top: 54%; left: 20%; animation-duration: 7.5s; animation-delay: -3s; }
  .v3-blob.b7 { width: 170px; height: 170px; background: #fbc8e6; top: 7%; right: 20%; animation-duration: 9.5s; animation-delay: -6s; }
  @keyframes v3Drift {
    0%, 100% { transform: translate(0,0) scale(1) rotate(0deg); }
    25% { transform: translate(34px,-26px) scale(1.09) rotate(3deg); }
    50% { transform: translate(-26px,30px) scale(.94) rotate(-2deg); }
    75% { transform: translate(20px,10px) scale(1.05) rotate(2deg); }
  }

  body.v3-theme {
    background:
      radial-gradient(circle at 15% 20%, rgba(255,214,173,.34), transparent 34%),
      radial-gradient(circle at 85% 72%, rgba(255,184,211,.30), transparent 34%),
      linear-gradient(120deg, #fff6ee, #fff1e8, #fff8ef, #ffefe4);
    background-size: 100% 100%, 100% 100%, 260% 260%;
    animation: v3BgShift 16s ease-in-out infinite;
  }
  @keyframes v3BgShift { 0%,100% { background-position: 0% 0%, 100% 100%, 0% 50%; } 50% { background-position: 10% 8%, 90% 92%, 100% 50%; } }
  body.v3-theme #app { width: 100%; max-width: 620px; min-height: calc(100vh - 48px); display: flex; align-items: center; justify-content: center; }
  body.v3-theme #app > .v3-transition-text,
  body.v3-theme #app > .v3-card { margin-left: auto; margin-right: auto; }

  .v3-card {
    position: relative; z-index: 2;
    background: rgba(255,255,255,.66); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-radius: 28px; padding: 34px 28px; box-shadow: 0 24px 60px -30px rgba(120,80,50,.35);
    max-width: 32rem; width: 100%; margin: 0 auto; animation: v2Materialize .8s cubic-bezier(.2,.8,.3,1);
  }
  .v3-card .q { text-align: center; font-size: clamp(1.3rem, 5vw, 1.7rem); }

  .floaty { animation: v3Bob 2.6s ease-in-out infinite; }
  @keyframes v3Bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

  .v3-transition-text {
    position: relative; z-index: 2;
    font-family: var(--display); font-size: 1.5rem; text-align: center; max-width: 30rem; margin: 0 auto;
    color: var(--ink); line-height: 1.6; padding: 40px 20px;
    opacity: 0;
    animation: v3TextIn .9s ease 6.4s forwards, v3Float 4s ease-in-out 7.3s infinite;
  }

<script>
/* Аварийные заглушки: вместо «красного экрана» показываем аккуратное окно,
   а сам квест продолжает работать. Прогресс при этом лежит в localStorage. */
(function () {
  var shown = false;
  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }

  window.__showFatal = function (title, details) {
    if (shown) return;
    shown = true;
    var o = document.createElement('div');
    o.setAttribute('style', 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:rgba(20,12,28,.82);display:flex;align-items:center;justify-content:center;padding:20px;font-family:system-ui,sans-serif;');
    o.innerHTML =
      '<div style="background:#fff;color:#2f2038;max-width:440px;width:100%;border-radius:16px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.4);max-height:90vh;overflow:auto">' +
      '<h2 style="margin:0 0 8px;font-size:1.25rem">' + esc(title || 'Что-то пошло не так') + '</h2>' +
      '<p style="margin:0 0 14px;line-height:1.5;font-size:.95rem">Не переживай: твой прогресс сохранён на этом устройстве. Попробуй обновить страницу - ты продолжишь с того же места.</p>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px"></div>' +
      (details ? '<details style="font-size:.78rem;color:#6b5a76"><summary style="cursor:pointer">Технические подробности</summary><pre style="white-space:pre-wrap;word-break:break-word;margin:8px 0 0">' + esc(details) + '</pre></details>' : '') +
      '</div>';
    var row = o.querySelector('div > div');
    function mk(label, primary, fn) {
      var b = document.createElement('button');
      b.textContent = label;
      b.setAttribute('style', 'border:0;border-radius:99px;padding:9px 16px;font-size:.88rem;cursor:pointer;' + (primary ? 'background:#7b3fa0;color:#fff;' : 'background:#efe2f7;color:#7b3fa0;'));
      b.addEventListener('click', fn);
      row.appendChild(b);
    }
    mk('Обновить страницу', true, function () { location.reload(); });
    mk('Закрыть', false, function () { o.remove(); shown = false; });
    document.body.appendChild(o);
  };

  window.__toast = function (text) {
    var t = document.createElement('div');
    t.textContent = text;
    t.setAttribute('style', 'position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:99998;background:rgba(40,28,52,.94);color:#fff;font:13px system-ui,sans-serif;padding:9px 16px;border-radius:12px;max-width:90vw;text-align:center');
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 6000);
  };

  window.addEventListener('error', function (e) {
    console.error('Quest error:', e.message, e.filename, e.lineno, e.colno);
    if (!e.message || /ResizeObserver/.test(e.message)) return;
    if (e.message === 'Script error.' && !e.lineno) return;
    window.__showFatal('Что-то пошло не так', e.message + '\n' + (e.filename || '') + ':' + (e.lineno || '') + ':' + (e.colno || ''));
  });

  window.addEventListener('unhandledrejection', function (e) {
    console.error('Quest promise error:', e.reason);
    var msg = String(e.reason && e.reason.message || e.reason || '');
    if (/Failed to fetch|NetworkError|Load failed|AbortError|aborted/i.test(msg)) return; // сеть — обрабатывается отдельно
    window.__toast('Что-то пошло не так. Если зависло - обнови страницу, прогресс сохранён.');
  });

  // Если основной скрипт так и не дошёл до конца — показываем заглушку.
  setTimeout(function () {
    if (!window.__questBooted) window.__showFatal('Квест не загрузился', 'Основной скрипт не выполнился до конца. Проверь интернет и обнови страницу.');
  }, 10000);
})();

/* =======================================================================
   ВРЕМЯ
   Статический html-файл не может иметь по-настоящему доверенное серверное
   время — это best-effort синхронизация с публичным time-API с откатом на
   локальные часы устройства, если запрос не прошёл (нет сети/офлайн/блок).
   ======================================================================= */
let SERVER_TIME_AT_START = null;
let PERF_TIME_AT_START = null;
let SERVER_TIME_READY = false;
let SERVER_TIME_FAILED = false;

// Apps Script бывает медленным (холодный старт), поэтому таймауты длинные.
async function fetchWithTimeout(url, opts = {}, ms = 20000) {
  const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), ms) : null;
  try {
    return await fetch(url, ctrl ? { ...opts, signal: ctrl.signal } : opts);
  } finally {
    if (timer) clearTimeout(timer);
  }
}

let TIME_RETRY = null;
function scheduleTimeRetry() {
  if (TIME_RETRY) return;
  TIME_RETRY = setTimeout(() => { TIME_RETRY = null; syncTrustedTime(); }, 15000);
}

async function syncTrustedTime() {
  try {
    const res = await fetchWithTimeout(CONFIG.timeEndpoint + '?action=time', {
      cache: 'no-store',
    }, 20000);

    if (!res.ok) {
      throw new Error('Time request failed');
    }

    const data = await res.json();
    const serverTime = Number(data.now);

    if (!Number.isFinite(serverTime)) {
      throw new Error('Invalid server time');
    }

    SERVER_TIME_AT_START = serverTime;
    PERF_TIME_AT_START = performance.now();
    SERVER_TIME_READY = true;
    SERVER_TIME_FAILED = false;

  } catch (e) {
    SERVER_TIME_FAILED = true;
    console.error('Trusted time sync failed:', e);
    scheduleTimeRetry(); // пробуем снова автоматически, пока время не придёт
  }

  if (S.screen === 'v2quiz') {
    render();
  } else if (typeof mountSkipButton === 'function') {
    mountSkipButton();
  }
}

function trustedNowMs() {
  if (!SERVER_TIME_READY) return null;

  return SERVER_TIME_AT_START +
    (performance.now() - PERF_TIME_AT_START);
}

function trustedNow() {
  const ms = trustedNowMs();

  if (ms === null) return null;

  return new Date(ms);
}

/* =======================================================================

   ======================================================================= */
const STORE_PREFIX = 'quest_v1_';

function storeKey(nick) {
  return STORE_PREFIX + nick.trim().toLowerCase().replace(/\s+/g, '_');
}

function makeProgressSnapshot(overrides = {}) {
  return {
    nick: S.nick,
    screen: S.screen,
    index: S.index,
    answers: S.answers,
    unlocked: S.unlocked,
    v2Index: S.v2Index,
    v2Answers: S.v2Answers,
    v2TotalQuestions: V2_QUESTIONS.length,
    preodolevatelPoints: Number(S.preodolevatelPoints) || 0,
    preodolevatelRequiredPoints: Number(CONFIG.preodolevatelRequiredPoints) || 0,
    preodolevatelPassed: !!S.preodolevatelPassed,
    v3Index: S.v3Index,
    v3Answers: S.v3Answers,
    timerRevealed: S.timerRevealed,
    termSeen: S.termSeen,
    updatedAt: Date.now(),
    ...overrides,
  };
}

function applyProgress(saved) {
  if (!saved) return false;
  S.index = saved.index || 0;
  S.answers = saved.answers || {};
  S.unlocked = saved.unlocked || false;
  S.v2Index = saved.v2Index || 0;
  S.v2Answers = saved.v2Answers || {};
  S.preodolevatelPoints = Number(saved.preodolevatelPoints ?? saved.preodolevatelCount) || 0;
  S.preodolevatelPassed = !!saved.preodolevatelPassed;
  S.v3Index = saved.v3Index || 0;
  S.v3Answers = saved.v3Answers || [];
  S.timerRevealed = saved.timerRevealed || false;
  S.termSeen = Array.isArray(saved.termSeen) ? saved.termSeen : [];
  S.screen = saved.screen || 'quiz';
  return true;
}

function loadProgress(nick) {
  try {
    const raw = localStorage.getItem(storeKey(nick));
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function saveProgress() {
  if (!S.nick) return;
  try {
    localStorage.setItem(storeKey(S.nick), JSON.stringify(makeProgressSnapshot()));
  } catch (e) {
    /* приватный режим браузера — квест всё равно работает, просто без локального сохранения */
  }
}

function serverSyncEnabled() {
  return Boolean(CONFIG.serverEndpoint) && !CONFIG.serverEndpoint.includes('YOUR-DEPLOYMENT-ID');
}

function isValidBank(data) {
  return !!(data && data.v1 && data.v1['1'] && data.v2 && data.v2['1'] && data.codes && data.codes.v2Unlock);
}

/* Банк кэшируется в localStorage: у вернувшихся игроков он появляется мгновенно,
   а свежая версия докачивается в фоне и тихо заменяет кэш. Ждать приходится
   только при самом первом визите на устройстве. */
const BANK_CACHE_KEY = 'quest_bank_cache_v1';

function readBankCache() {
  try {
    const raw = localStorage.getItem(BANK_CACHE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    return isValidBank(d) ? d : null;
  } catch (e) { return null; }
}

function writeBankCache(d) {
  try { localStorage.setItem(BANK_CACHE_KEY, JSON.stringify(d)); } catch (e) {}
}

function fetchBankFromNetwork() {
  if (QUESTION_BANK_LOADING) return QUESTION_BANK_LOADING;
  QUESTION_BANK_LOADING = (async () => {
    try {
      const res = await fetchWithTimeout(CONFIG.serverEndpoint + '?action=question_bank', {
        cache: 'no-store',
      }, 20000);
      if (!res.ok) throw new Error('Question bank request failed');
      const data = await res.json();
      if (!isValidBank(data)) throw new Error('Invalid or empty question bank');
      QUESTION_BANK = data;
      QUESTION_BANK_FAILED = false;
      writeBankCache(data);
      return true;
    } catch (e) {
      console.error('Question bank load failed:', e);
      if (!QUESTION_BANK) QUESTION_BANK_FAILED = true;
      return false;
    } finally {
      QUESTION_BANK_LOADING = null;
    }
  })();
  return QUESTION_BANK_LOADING;
}

async function loadQuestionBank() {
  if (!serverSyncEnabled()) return false;
  if (QUESTION_BANK) return true;
  const cached = readBankCache();
  if (cached) {
    QUESTION_BANK = cached;
    QUESTION_BANK_FAILED = false;
    void fetchBankFromNetwork(); // освежаем в фоне
    return true;
  }
  return fetchBankFromNetwork();
}

function bankEntry(version, n) {
  if (!QUESTION_BANK || !QUESTION_BANK[version]) return null;
  return QUESTION_BANK[version][String(n)] || QUESTION_BANK[version][n] || null;
}

function bankData(version, n) {
  const entry = bankEntry(version, n);
  return entry && entry.data ? entry.data : {};
}

function bankMessage(version, n) {
  const entry = bankEntry(version, n);
  return (entry && entry.success) || 'Правильно!';
}

function bankBadMessage(version, n) {
  const entry = bankEntry(version, n);
  return (entry && entry.bad) || 'Неправильно!';
}

function normalizeBankValue(value, mode) {
  if (mode === 'digits') return digits(value);
  if (mode === 'norm') return norm(value);
  return tight(value);
}

function bankCheck(version, n, value) {
  const entry = bankEntry(version, n);
  if (!entry) return false;

  const mode = entry.mode || 'tight';
  const accepted = Array.isArray(entry.accepted) ? entry.accepted : [];

  if (mode === 'free') return String(value || '').trim().length > 0;

  if (mode === 'contains_tight_any') {
    const t = tight(value);
    return accepted.some(x => t.includes(tight(x)));
  }

  if (mode === 'norm_groups' || mode === 'tight_groups') {
    const probe = normalizeBankValue(value, mode === 'norm_groups' ? 'norm' : 'tight');
    return accepted.some(group =>
      Array.isArray(group) && group.some(x => normalizeBankValue(x, mode === 'norm_groups' ? 'norm' : 'tight') === probe)
    );
  }

  const probe = normalizeBankValue(value, mode);
  return accepted.some(x => normalizeBankValue(x, mode) === probe);
}

function bankMatchGroup(version, n, value) {
  const entry = bankEntry(version, n);
  if (!entry) return null;

  const mode = entry.mode;
  if (mode !== 'norm_groups' && mode !== 'tight_groups') return null;

  const probe = normalizeBankValue(value, mode === 'norm_groups' ? 'norm' : 'tight');
  for (let i = 0; i < entry.accepted.length; i++) {
    const group = entry.accepted[i];
    if (Array.isArray(group) && group.some(x =>
      normalizeBankValue(x, mode === 'norm_groups' ? 'norm' : 'tight') === probe
    )) {
      return i;
    }
  }
  return null;
}

/* ---------- Журнал ответов версии I ----------
   Раньше каждый ответ уходил отдельным запросом (лишняя нагрузка на Apps Script).
   Теперь ответы копятся на устройстве и уходят одним пакетом: при завершении v1,
   при закрытии/сворачивании вкладки и при следующем заходе, если что-то осталось. */
const V1LOG_PREFIX = 'quest_v1log_';
const V1LOG = { nick: null, buffer: [], pending: null, inflight: false };

function v1LogKey(nick) { return V1LOG_PREFIX + storeKey(nick); }

function v1LogPersist() {
  if (!V1LOG.nick) return;
  try {
    if (!V1LOG.buffer.length && !V1LOG.pending) localStorage.removeItem(v1LogKey(V1LOG.nick));
    else localStorage.setItem(v1LogKey(V1LOG.nick), JSON.stringify({ buffer: V1LOG.buffer, pending: V1LOG.pending }));
  } catch (e) {}
}

function v1LogLoad(nick) {
  V1LOG.nick = nick;
  V1LOG.buffer = [];
  V1LOG.pending = null;
  try {
    const r = JSON.parse(localStorage.getItem(v1LogKey(nick)) || 'null');
    if (r && typeof r === 'object') {
      V1LOG.buffer = Array.isArray(r.buffer) ? r.buffer : [];
      V1LOG.pending = r.pending && Array.isArray(r.pending.entries) ? r.pending : null;
    }
  } catch (e) {}
}

function recordV1Answer(question, answer, correct, passed, details = {}) {
  if (!S.nick || !serverSyncEnabled()) return Promise.resolve();
  const a = answer == null ? '' : String(answer);
  if (!a) return Promise.resolve();
  if ((CONFIG.v1NoLogQuestions || []).includes(Number(question))) return Promise.resolve();
  if (V1LOG.nick !== S.nick) v1LogLoad(S.nick);
  V1LOG.buffer.push({ q: Number(question), a: a });
  v1LogPersist();
  return Promise.resolve();
}

async function flushV1Log(keepalive) {
  const L = V1LOG;
  if (!L.nick || L.inflight || !serverSyncEnabled()) return;
  if (!L.pending) {
    if (!L.buffer.length) return;
    // id пакета остаётся тем же при повторной отправке — сервер отбросит дубль
    L.pending = {
      id: L.nick + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      entries: L.buffer,
    };
    L.buffer = [];
    v1LogPersist();
  }
  const batch = L.pending;
  L.inflight = true;
  if (!keepalive) SaveBanner.saving();
  try {
    const res = await fetch(CONFIG.serverEndpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'record_v1_answers',
        nick: L.nick,
        batchId: batch.id,
        entries: batch.entries,
        sentAt: Date.now(),
      }),
      cache: 'no-store',
      keepalive: !!keepalive,
    });
    if (!res.ok) throw new Error('v1 log failed: ' + res.status);
    const data = await res.json();
    if (!data || data.ok !== true) throw new Error('v1 log rejected');
    if (L.pending === batch) L.pending = null;
    v1LogPersist();
  } catch (e) {
    /* пакет остаётся на устройстве и уйдёт при следующей попытке */
  } finally {
    L.inflight = false;
    if (!keepalive && !SAVE_Q.busy) SaveBanner.done();
  }
}

function secretCodeType(value) {
  if (!QUESTION_BANK || !QUESTION_BANK.codes) return '';
  if (value === QUESTION_BANK.codes.debug) return 'debug';
  if (value === QUESTION_BANK.codes.v2Unlock) return 'v2';
  return '';
}

// Возвращает: объект игрока | null (игрока нет на сервере) | { __error: true } (сервер не ответил).
// Различие важно: при ошибке сети нельзя считать игрока «новым» и затирать его прогресс.
async function loadServerProgress(nick) {
  if (!serverSyncEnabled()) return null;
  try {
    const url = CONFIG.serverEndpoint + '?action=player&nick=' + encodeURIComponent(nick);
    const res = await fetchWithTimeout(url, { cache: 'no-store' }, 20000);
    if (!res.ok) return { __error: true };
    const data = await res.json();
    return data && data.found ? data.player : null;
  } catch (e) {
    return { __error: true };
  }
}

/* ---------- Предзагрузка прогресса, пока игрок вводит ник ---------- */
const PLAYER_PREFETCH = {};
function prefetchServerProgress(nick) {
  if (!serverSyncEnabled()) return Promise.resolve(null);
  const key = nick.trim().toLowerCase();
  const hit = PLAYER_PREFETCH[key];
  if (hit && Date.now() - hit.at < 60000) return hit.p;
  const p = loadServerProgress(nick).then(r => {
    if (r && r.__error) delete PLAYER_PREFETCH[key]; // ошибку не кэшируем
    return r;
  });
  PLAYER_PREFETCH[key] = { at: Date.now(), p };
  return p;
}

/* ---------- Плашка «идёт сохранение» ---------- */
// Плашку не показываем на версии III и во время заставок/переходов (раскрытие версии II,
// переключение версий, трещины и вспышка), чтобы не ломать атмосферу. Сохранение при этом идёт
// как обычно; если оно ещё не закончилось к концу перехода — плашка появится потом.
function saveBannerSuppressed() {
  const sc = S.screen;
  if (sc === 'v3transition' || sc === 'v3quiz' || sc === 'v3final') return true;
  const b = document.body.classList;
  if (b.contains('v2-reveal-seq') || b.contains('version-switching') || b.contains('version-switch-in')) return true;
  return !!document.querySelector('.crack-overlay, .flash-overlay, .version-switch-overlay');
}

const SaveBanner = (function () {
  let node = null, showTimer = null, hideTimer = null, visible = false;

  function ensure() {
    if (node && node.isConnected) return node;
    if (!document.getElementById('save-banner-css')) {
      const st = document.createElement('style');
      st.id = 'save-banner-css';
      st.textContent = '@keyframes sbspin{to{transform:rotate(360deg)}}' +
        '#save-banner{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:99990;' +
        'display:flex;align-items:center;gap:9px;padding:8px 14px;border-radius:99px;' +
        'font:13px/1.3 system-ui,sans-serif;color:#fff;background:rgba(40,28,52,.92);' +
        'box-shadow:0 6px 20px rgba(0,0,0,.28);max-width:92vw;pointer-events:none;' +
        'transition:opacity .25s;opacity:0}' +
        '#save-banner.on{opacity:1}' +
        '#save-banner.warn{background:rgba(150,70,20,.95)}' +
        '#save-banner .sp{width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,255,255,.35);' +
        'border-top-color:#fff;animation:sbspin .8s linear infinite;flex:none}';
      document.head.appendChild(st);
    }
    node = document.createElement('div');
    node.id = 'save-banner';
    document.body.appendChild(node);
    return node;
  }

  function show(text, warn, spin) {
    const n = ensure();
    n.className = warn ? 'warn' : '';
    n.innerHTML = (spin ? '<span class="sp"></span>' : '') + '<span></span>';
    n.lastChild.textContent = text;
    void n.offsetWidth;
    n.classList.add('on');
    visible = true;
  }

  function hide() {
    if (node) node.classList.remove('on');
    visible = false;
  }

  return {
    saving() {
      clearTimeout(hideTimer);
      if (visible) return;
      if (showTimer) return;
      // быстрые сохранения не мигают — плашка появляется, только если ждать дольше ~0.7 с
      showTimer = setTimeout(() => {
        showTimer = null;
        if (saveBannerSuppressed()) return;
        show('Идёт сохранение данных, не закрывайте страницу', false, true);
      }, 700);
    },
    retry() {
      clearTimeout(showTimer); showTimer = null;
      clearTimeout(hideTimer);
      if (saveBannerSuppressed()) { hide(); return; }
      show('Не удалось сохранить. Пробуем снова. Не закрывайте страницу', true, true);
    },
    done() {
      clearTimeout(showTimer); showTimer = null;
      if (!visible) return;
      if (saveBannerSuppressed()) { hide(); return; }
      show('Всё сохранено ✓', false, false);
      hideTimer = setTimeout(hide, 1500);
    },
    // Вызывается по таймеру: прячет плашку при входе в заставку/версию III и возвращает,
    // если сохранение всё ещё идёт после выхода из неё.
    refresh() {
      if (saveBannerSuppressed()) {
        clearTimeout(showTimer); showTimer = null;
        if (visible) hide();
        return;
      }
      const working = (typeof SAVE_Q !== 'undefined' && (SAVE_Q.busy || SAVE_Q.items.length)) ||
                      (typeof V1LOG !== 'undefined' && V1LOG.inflight);
      if (working && !visible && !showTimer) this.saving();
    },
  };
})();

/* ---------- Очередь сохранений ----------
   Квест не ждёт ответа сервера: снимок прогресса кладётся в очередь и уходит
   в фоне, по одному, с повтором при сбое. Пока в очереди что-то есть, у
   игрока на устройстве стоит метка «dirty» — при следующем заходе локальный
   прогресс не будет затёрт более старой серверной копией. */
const SAVE_Q = { items: [], busy: false, failStreak: 0 };
let LAST_SENT_SIG = '';
function stateSig(state) {
  try { return JSON.stringify({ ...state, updatedAt: 0 }); } catch (e) { return String(Date.now()); }
}

function dirtyKey(nick) { return 'quest_dirty_' + storeKey(nick); }
function markDirty(nick) { try { localStorage.setItem(dirtyKey(nick), String(Date.now())); } catch (e) {} }
function clearDirty(nick) { try { localStorage.removeItem(dirtyKey(nick)); } catch (e) {} }
function isDirty(nick) { try { return !!localStorage.getItem(dirtyKey(nick)); } catch (e) { return false; } }

function syncPlayerToServer(checkpoint, overrides = {}) {
  if (!S.nick || !serverSyncEnabled()) return Promise.resolve(false);
  void flushV1Log(false);
  const nick = S.nick;
  const payload = {
    action: 'save_player',
    nick: nick,
    checkpoint: checkpoint || 'progress',
    state: makeProgressSnapshot(overrides),
    sentAt: Date.now(),
  };
  markDirty(nick);
  return new Promise(resolve => {
    // Два ожидающих сохранения с одним и тем же чекпойнтом схлопываем в последнее.
    const dup = SAVE_Q.items.find(it => !it.sending && it.nick === nick && it.payload.checkpoint === payload.checkpoint);
    if (dup) {
      dup.payload = payload;
      dup.waiters.push(resolve);
    } else {
      SAVE_Q.items.push({ nick, payload, waiters: [resolve], sending: false });
    }
    void pumpSaves();
  });
}

async function sendSaveNow(item) {
  try {
    // Content-Type: text/plain — принципиально важно для Apps Script: запрос с
    // application/json — это "непростой" CORS-запрос, браузер шлёт перед ним
    // preflight OPTIONS, а Apps Script не умеет на него правильно отвечать
    // (запрос молча падает). text/plain не требует preflight; тело всё равно
    // содержит JSON — Code.gs сам парсит e.postData.contents как JSON.
    const res = await fetch(CONFIG.serverEndpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(item.payload),
      cache: 'no-store',
    });
    if (!res.ok) throw new Error('Save failed: ' + res.status);
    const data = await res.json();
    LAST_SENT_SIG = stateSig(item.payload.state);
    if (data && data.player && data.player.state) {
      // Ответ сервера пишем в localStorage, только если он не старее того,
      // что игрок успел наиграть, пока запрос летел.
      const local = loadProgress(item.nick);
      const localAt = (local && local.updatedAt) || 0;
      const srvAt = Number(data.player.state.updatedAt) || 0;
      if (SAVE_Q.items.length <= 1 && srvAt >= localAt) {
        try { localStorage.setItem(storeKey(item.nick), JSON.stringify(data.player.state)); } catch (e) {}
      }
    }
    return true;
  } catch (e) {
    return false;
  }
}

async function pumpSaves() {
  if (SAVE_Q.busy) return;
  SAVE_Q.busy = true;
  let lastNick = null;
  while (SAVE_Q.items.length) {
    const it = SAVE_Q.items[0];
    lastNick = it.nick;
    it.sending = true;
    SaveBanner.saving();
    const ok = await sendSaveNow(it);
    it.sending = false;
    if (ok) {
      SAVE_Q.items.shift();
      SAVE_Q.failStreak = 0;
      it.waiters.forEach(w => w(true));
    } else {
      SAVE_Q.failStreak += 1;
      SaveBanner.retry();
      await new Promise(r => setTimeout(r, Math.min(3000 * SAVE_Q.failStreak, 15000)));
    }
  }
  SAVE_Q.busy = false;
  if (lastNick) clearDirty(lastNick);
  if (!V1LOG.inflight) SaveBanner.done();
}

window.addEventListener('online', () => { void pumpSaves(); void flushV1Log(false); });
setInterval(() => SaveBanner.refresh(), 500);

// Закрытие вкладки при несохранённых данных: спрашиваем подтверждение и,
// если всё-таки закрыли, пытаемся дослать остаток через keepalive-запрос.
window.addEventListener('beforeunload', (e) => {
  if (SAVE_Q.items.length || V1LOG.inflight) { e.preventDefault(); e.returnValue = ''; }
});

/* Версия I не пишет на сервер после каждого ответа. Вместо этого при закрытии или
   сворачивании вкладки (visibilitychange надёжнее beforeunload, особенно на телефонах)
   одним запросом уходят: пакет ответов + текущая позиция в квесте. Если состояние с
   прошлой отправки не менялось — запрос не делается. */
function flushOnHide() {
  if (!S.nick || !serverSyncEnabled()) return;
  void flushV1Log(true);
  if (S.screen === 'quiz') {
    const state = makeProgressSnapshot();
    const sig = stateSig(state);
    if (sig !== LAST_SENT_SIG) {
      LAST_SENT_SIG = sig;
      markDirty(S.nick); // если запрос не дойдёт, при следующем заходе локальный прогресс не потеряется
      try {
        fetch(CONFIG.serverEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'save_player', nick: S.nick, checkpoint: 'v1-exit', state: state, sentAt: Date.now() }),
          cache: 'no-store',
          keepalive: true,
        });
      } catch (e) {}
    }
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flushOnHide();
});
window.addEventListener('pagehide', () => {
  flushOnHide();
  for (const it of SAVE_Q.items) {
    try {
      fetch(CONFIG.serverEndpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(it.payload),
        keepalive: true,
      });
    } catch (e) {}
  }
});

/* =======================================================================
   НОРМАЛИЗАЦИЯ ОТВЕТОВ
   ======================================================================= */
function norm(v) {
  return (v || '').toString().trim().toLowerCase()
    .replace(/ё/g, 'е')
    .replace(/[.,!?;:"'`«»\-–—()]/g, '')
    .replace(/\s+/g, ' ');
}
function tight(v) { return norm(v).replace(/\s+/g, ''); }
function digits(v) { return (v || '').toString().replace(/\D/g, ''); }

/* =======================================================================

function matchSport(value) { return bankMatchGroup('v1', 6, value); }
function matchGame(value) { return bankMatchGroup('v1', 11, value); }

   В HTML их нет, чтобы нельзя было подсмотреть до конца квеста. Сервер отдаёт их, только если

   обычно уже готовы. */
let FINALE = null;
let FINALE_LOADING = null;

function loadFinale() {
  if (FINALE) return Promise.resolve(FINALE);
  if (FINALE_LOADING) return FINALE_LOADING;
  if (!S.nick || !serverSyncEnabled()) return Promise.resolve(null);
  FINALE_LOADING = (async () => {
    try {
      let url = CONFIG.serverEndpoint + '?action=finale&nick=' + encodeURIComponent(S.nick);
      if (S.debugAll && QUESTION_BANK && QUESTION_BANK.codes && QUESTION_BANK.codes.debug) {
        url += '&debug=' + encodeURIComponent(QUESTION_BANK.codes.debug);
      }
      const res = await fetchWithTimeout(url, { cache: 'no-store' }, 15000);
      if (!res.ok) throw new Error('finale request failed');
      const data = await res.json();
      if (data && data.locked === false) { FINALE = data; return data; }
      // Помогает понять, почему не пришло личное сообщение: locked (+reason) или error (старый деплой Code.gs).
      console.warn('Finale not available:', data);
      return null;
    } catch (e) {
      console.warn('Finale request failed:', e);
      return null;
    } finally {
      FINALE_LOADING = null;
    }
  })();
  return FINALE_LOADING;
}

let LIVE_CHALLENGES = null;
let CHALLENGES_LOADING = null;
let CHALLENGES_POLL = null;

function preodolevatelActive() {
  const t = trustedNow();
  if (!t) return false;
  return t >= new Date(CONFIG.preodolevatelStart) && t < new Date(CONFIG.preodolevatelEnd);
}

async function refreshChallengeProgress(force = false) {
  if (!serverSyncEnabled()) return null;
  if (CHALLENGES_LOADING && !force) return CHALLENGES_LOADING;

  CHALLENGES_LOADING = (async () => {
    try {
      const url = CONFIG.serverEndpoint + '?action=challenges';
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('Challenges request failed');
      const data = await res.json();
      if (!data || !Array.isArray(data.items)) throw new Error('Invalid challenges data');

      const oldKey = LIVE_CHALLENGES ? JSON.stringify(LIVE_CHALLENGES) : '';
      LIVE_CHALLENGES = data;
      S.preodolevatelPoints = Number(data.completedPoints ?? data.completedCount) || 0;
      S.preodolevatelPassed =
        S.preodolevatelPoints >= Number(CONFIG.preodolevatelRequiredPoints || 0);
      saveProgress();

      if (oldKey !== JSON.stringify(data) && S.screen === 'v2quiz') render();
      return data;
    } catch (e) {
      console.error('Challenge progress load failed:', e);
      return LIVE_CHALLENGES;
    } finally {
      CHALLENGES_LOADING = null;
    }
  })();

  return CHALLENGES_LOADING;
}

function startChallengePolling() {
  if (CHALLENGES_POLL || !S.nick) return;
  void refreshChallengeProgress(true);
  CHALLENGES_POLL = setInterval(() => {
    if (S.screen !== 'v2intro' && S.screen !== 'v2quiz') {
      clearInterval(CHALLENGES_POLL);
      CHALLENGES_POLL = null;
      return;
    }
    if (preodolevatelActive()) void refreshChallengeProgress(true);
  }, Math.max(10000, Number(CONFIG.preodolevatelRefreshMs) || 30000));
}

function stopChallengePolling() {
  if (CHALLENGES_POLL) {
    clearInterval(CHALLENGES_POLL);
    CHALLENGES_POLL = null;
  }
}

function preodolevatelStatus() {
  const points = Number(
    (LIVE_CHALLENGES && (LIVE_CHALLENGES.completedPoints ?? LIVE_CHALLENGES.completedCount))
      ?? S.preodolevatelPoints ?? 0
  );
  const total = Number((LIVE_CHALLENGES && LIVE_CHALLENGES.total) ?? 0);
  return {
    points,
    total,
    requiredPoints: Number(CONFIG.preodolevatelRequiredPoints) || 0,
    passed: points >= (Number(CONFIG.preodolevatelRequiredPoints) || 0),
  };
}

   Короткие UI-звуки и фон Версии II генерируются через Web Audio API.
   Сюжетный переход I→II и музыка/переход III используют MP3 из CONFIG.

const AUDIO = {
  ctx: null,
  master: null,
  ambient: null,
  ambientPulse: null,
  v3Music: null,
  v3MusicPathIndex: 0,
  v2ToV3Sfx: null,
  v2ToV3SfxPathIndex: 0,
  v2UnlockSfx: {},
};
function preloadV2UnlockSounds() {
  if (!CONFIG.v2UnlockSfx) return;

  Object.keys(CONFIG.v2UnlockSfx).forEach(key => {
    prepareV2UnlockSfx(key);
  });

  if (CONFIG.v2ToV3SfxUrl) {
    prepareV2ToV3Sfx();
  }

    ensureV3Music();
  }
}

function audioCtx() {
  if (AUDIO.ctx) return AUDIO.ctx;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return null;
  try {
    AUDIO.ctx = new Ctx();
    AUDIO.master = AUDIO.ctx.createGain();
    AUDIO.master.gain.value = 0.32;
    AUDIO.master.connect(AUDIO.ctx.destination);
  } catch (_) {
    return null;
  }
  return AUDIO.ctx;
}

function audioResume() {
  const ctx = audioCtx();
  if (!ctx) return null;
  if (ctx.state === 'suspended') ctx.resume().catch(() => {});
  return ctx;
}

function tone(freq, duration, opts = {}) {
  const ctx = audioResume();
  if (!ctx || !AUDIO.master) return;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  const filter = ctx.createBiquadFilter();
  const t = ctx.currentTime;
  const endFreq = Math.max(20, opts.toFreq || freq);
  const volume = opts.volume ?? 0.1;
  const attack = opts.attack ?? 0.012;
  const release = opts.release ?? Math.min(0.22, duration * .55);

  o.type = opts.type || 'sine';
  o.frequency.setValueAtTime(Math.max(20, freq), t);
  if (endFreq !== freq) o.frequency.exponentialRampToValueAtTime(endFreq, t + Math.max(.03, duration));
  filter.type = 'lowpass';
  filter.frequency.value = opts.filter || 3200;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0001, volume), t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(attack + .02, duration - release));

  o.connect(filter).connect(g).connect(AUDIO.master);
  o.start(t);
  o.stop(t + duration + .05);
}

function noise(duration = .12, opts = {}) {
  const ctx = audioResume();
  if (!ctx || !AUDIO.master) return;
  const len = Math.max(1, Math.floor(ctx.sampleRate * duration));
  const buffer = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource();
  const filter = ctx.createBiquadFilter();
  const g = ctx.createGain();
  const t = ctx.currentTime;
  filter.type = opts.filterType || 'bandpass';
  filter.frequency.value = opts.filter || 1800;
  filter.Q.value = opts.q || 0.7;
  const volume = opts.volume ?? 0.035;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(.0001, volume), t + .008);
  g.gain.exponentialRampToValueAtTime(.0001, t + Math.max(.012, duration - .025));
  src.buffer = buffer;
  src.connect(filter).connect(g).connect(AUDIO.master);
  src.start(t);
  src.stop(t + duration + .03);
}

function startV2Ambient() {
  const ctx = audioResume();
  if (!ctx || !AUDIO.master || AUDIO.ambient) return;
  const bus = ctx.createGain();
  bus.gain.value = 0.0001;
  bus.connect(AUDIO.master);
  const low = ctx.createOscillator();
  const high = ctx.createOscillator();
  const lf = ctx.createBiquadFilter();
  const hg = ctx.createGain();
  const lfo = ctx.createOscillator();
  const lfoGain = ctx.createGain();
  const humGain = ctx.createGain();
  const t = ctx.currentTime;
  low.type = 'sawtooth'; low.frequency.value = 52;
  lf.type = 'lowpass'; lf.frequency.value = 360;
  humGain.gain.value = 0.14;
  high.type = 'sine'; high.frequency.value = 104;
  hg.gain.value = 0.035;
  lfo.type = 'sine'; lfo.frequency.value = 0.08;
  lfoGain.gain.value = 0.03;
  humGain.connect(lf).connect(bus);
  hg.connect(bus);
  lfo.connect(lfoGain).connect(humGain.gain);
  low.connect(humGain);
  high.connect(hg);
  low.start(t); high.start(t); lfo.start(t);
  bus.gain.linearRampToValueAtTime(document.hidden ? 0.0001 : 0.15, t + 1.8);
  AUDIO.ambient = { bus, low, high, lfo };

  const pulse = () => {
    if (!AUDIO.ambient || document.hidden || !(S.screen === 'v2intro' || S.screen === 'v2quiz')) return;
    tone(205 + Math.random() * 18, .045, { type: 'sine', volume: .011, toFreq: 185, filter: 900 });
    AUDIO.ambientPulse = setTimeout(pulse, 3200 + Math.random() * 2600);
  };
  AUDIO.ambientPulse = setTimeout(pulse, 2600);
}

function stopV2Ambient() {
  if (AUDIO.ambientPulse) { clearTimeout(AUDIO.ambientPulse); AUDIO.ambientPulse = null; }
  if (!AUDIO.ambient) return;
  const ctx = AUDIO.ctx;
  const a = AUDIO.ambient;
  try {
    const t = ctx.currentTime;
    a.bus.gain.cancelScheduledValues(t);
    a.bus.gain.linearRampToValueAtTime(0.0001, t + .65);
    [a.low, a.high, a.lfo].forEach(n => n.stop(t + .72));
  } catch (_) {}
  AUDIO.ambient = null;
}

function render() {

  app.innerHTML = '';

  document.body.classList.toggle('v3-theme', S.screen === 'v3transition' || S.screen === 'v3quiz' || S.screen === 'v3final');
  if ((S.screen === 'v2intro' || S.screen === 'v2quiz') && !document.body.classList.contains('v2-reveal-seq')) startV2Ambient();
  else stopV2Ambient();
  if (S.screen === 'v3transition') startV3Music();

  mountSkipButton();
  if (S.screen === 'intro') { stopChallengePolling(); renderIntro(); return; }
  if (S.screen === 'final') { stopChallengePolling(); renderFinal(); mountVersionToggle(); mountDebugPanel(); mountGlobalTimer(); return; }
  if (S.screen === 'v2intro') { startChallengePolling(); renderV2Intro(); renderPreodolevatelDrawer(); mountVersionToggle(); mountHudChrome(); mountDebugPanel(); mountGlobalTimer(); return; }
  if (S.screen === 'v2quiz') { startChallengePolling(); renderV2Question(); renderPreodolevatelDrawer(); mountVersionToggle(); mountHudChrome(); mountDebugPanel(); mountGlobalTimer(); return; }
  if (S.screen === 'v3transition') { renderV3Transition(); mountDebugPanel(); mountV3Decor(); return; }

  if (S.screen === 'v3final') { renderV3Final(); mountDebugPanel(); mountV3Decor(); return; }

  mountVersionToggle();
  mountDebugPanel();

}
