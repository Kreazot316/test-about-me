function handleSecretCodeValue(value) {
  const kind = secretCodeType(value);
  if (kind === 'debug') {
    activateDebugMode();
    return;
  }
  if (!S.unlocked && kind === 'v2') {
    triggerV2Unlock();
  }
}

document.addEventListener('input', (e) => {
  const t = e.target;
  if (!t || (t.tagName !== 'INPUT' && t.tagName !== 'TEXTAREA')) return;
  if (t.dataset && t.dataset.nickField) return;

  const v = t.value.trim();
  if (QUESTION_BANK) {
    handleSecretCodeValue(v);
    return;
  }

  // Если игрок успел ввести код во время загрузки Answer Bank,
  // проверим текущее значение сразу после загрузки.
  if (v.length >= 8) {
    void loadQuestionBank().then(() => {
      if (t.isConnected && t.value.trim() === v) handleSecretCodeValue(v);
    });
  }
});

function activateDebugMode() {
  const wasUnlocked = S.unlocked;
  S.unlocked = true;
  S.debugAll = true;
  saveProgress();
  if (!wasUnlocked) render();
  else { mountVersionToggle(); mountHudChrome(); mountDebugPanel(); }
}

function triggerV2Unlock() {
  if (S.unlocked) return;
  S.unlocked = true;
  saveProgress();

  const crackLayer = el('div', 'crack-overlay');
  document.body.appendChild(crackLayer);

  const flash = el('div', 'flash-overlay');
  flash.style.background = '#000';
  flash.style.opacity = '0';
  document.body.appendChild(flash);

  const allTimers = [];

  function addCracks(count, spread, duration, delayStep = 0) {
    const baseAngles = [6, -18, 34, -46, 71, -63, 108, 152, -12, 89, 24, -78, 136, -35, 58, -106, 166, -2, 47, -58];
    for (let i = 0; i < count; i++) {
      allTimers.push(setTimeout(() => {
        const line = el('div', 'crack-line');
        const angle = baseAngles[i % baseAngles.length] + (Math.random() * spread * 2 - spread);
        line.style.transform = 'rotate(' + angle.toFixed(1) + 'deg)';
        line.style.top = (12 + Math.random() * 76) + '%';
        line.style.left = (5 + Math.random() * 70) + '%';
        line.style.animationDuration = duration + 'ms';
        crackLayer.appendChild(line);
      }, delayStep * i));
    }
  }

  function burst(className, at, crackCount, spread, crackDuration, extraClass = '') {
    allTimers.push(setTimeout(() => {
      document.body.classList.add(className);
      if (extraClass) document.body.classList.add(extraClass);
      addCracks(crackCount, spread, crackDuration, className === 'v2-shake-large' ? 32 : 48);
      allTimers.push(setTimeout(() => {
        document.body.classList.remove(className);
        if (extraClass) document.body.classList.remove(extraClass);
      }, className === 'v2-shake-large' ? 1380 : className === 'v2-shake-medium' ? 780 : 520));
    }, at));
  }

  // Этап 1: лёгкие трещины + 1.mp3.
  playV2UnlockSfx('crack1');
  allTimers.push(setTimeout(() => {
    burst('v2-shake-small', 0, 4, 4, 280);
  }, 180));

  // Этап 2: уже серьёзно + 2.mp3.
  allTimers.push(setTimeout(() => {
    playV2UnlockSfx('crack2');
  
    setTimeout(() => {
      burst('v2-shake-medium', 0, 8, 9, 360);
    }, 180);
  }, 1450));

  // Этап 3: большой выброс — много трещин, сильная тряска, глитч и 3.mp3.
  allTimers.push(setTimeout(() => {
    playV2UnlockSfx('crack3');
  
    setTimeout(() => {
      burst('v2-shake-large', 0, 20, 28, 520, 'v2-catastrophe');
    }, 220);
  }, 3150));

  // Этап 4: интерфейс первой версии медленно срывается вниз целыми элементами.
  allTimers.push(setTimeout(() => {
    // Финальный коллапс + 4.mp3.
    playV2UnlockSfx('collapse');
    crackLayer.style.transition = 'opacity .95s ease';
    crackLayer.style.opacity = '1';

    const fallLayer = el('div', 'v1-fall-layer');
    document.body.appendChild(fallLayer);

    const originals = Array.from(app.children);
    const falling = [];

    originals.forEach((original, i) => {
      const rect = original.getBoundingClientRect();
      if (!rect.width || !rect.height) return;

      const copy = original.cloneNode(true);
      copy.classList.add('v1-falling-copy');
      copy.removeAttribute('id');
      copy.style.position = 'fixed';
      copy.style.left = rect.left + 'px';
      copy.style.top = rect.top + 'px';
      copy.style.width = rect.width + 'px';
      copy.style.height = rect.height + 'px';
      copy.style.margin = '0';
      copy.style.boxSizing = 'border-box';
      copy.style.zIndex = String(3 + i);

      // Физика падения: каждому элементу задаём собственную горизонтальную скорость,
      // начальную скорость вверх и постоянное ускорение вниз. Никаких промежуточных
      // keyframe-точек — движение рассчитывается непрерывно каждый кадр.
      const dir = Math.random() < 0.5 ? -1 : 1;
      const vx = dir * (85 + Math.random() * 135); // медленно уходим влево/вправо
      const vy0 = -(720 + Math.random() * 230);       // стартовый импульс вверх
      const gravity = 1550 + Math.random() * 350;    // постоянное ускорение вниз
      const delay = i * 45 + Math.random() * 90;
      const rotation = (Math.random() * 2 - 1) * 9;

      copy.style.transform = 'translate3d(0,0,0) rotate(0deg) scale(1)';
      copy.style.filter = 'blur(0) brightness(1)';
      fallLayer.appendChild(copy);
      falling.push({ copy, rect, vx, vy0, gravity, delay, rotation, startX: rect.left, startY: rect.top, started: false, startTime: 0 });
      original.style.visibility = 'hidden';
    });

    // Запускаем непрерывную физическую траекторию.
    const fallStartedAt = performance.now();
    const animateFalls = (nowTime) => {
      let active = false;
      falling.forEach((item) => {
        const elapsedMs = nowTime - fallStartedAt - item.delay;
        if (elapsedMs < 0) {
          active = true;
          return;
        }
        if (!item.started) {
          item.started = true;
          item.startTime = nowTime;
        }

        const t = (nowTime - item.startTime) / 1000;
        // x = v*t
        // y = v0*t + 1/2*g*t^2
        const x = item.vx * t;
        const y = item.vy0 * t + 0.5 * item.gravity * t * t;
        const rotation = item.rotation * Math.min(1, t / 1.5) + (item.vx < 0 ? -1 : 1) * 2.5 * t;

        item.copy.style.transform = `translate3d(${x.toFixed(2)}px, ${y.toFixed(2)}px, 0) rotate(${rotation.toFixed(2)}deg) scale(${(1 - Math.min(.1, t * .025)).toFixed(3)})`;
        item.copy.style.filter = `blur(${Math.min(3, t * 0.9).toFixed(2)}px) brightness(${Math.max(.68, 1 - t * .14).toFixed(3)})`;

        const stillVisible = item.startY + y < window.innerHeight + 500;
        if (stillVisible) active = true;
      });

      if (active) requestAnimationFrame(animateFalls);
    };

    requestAnimationFrame(animateFalls);

    // Пока интерфейс падает, экран постепенно уходит в чёрный.
    allTimers.push(setTimeout(() => {
      flash.style.transition = 'opacity 2.8s cubic-bezier(.55,0,.22,1)';
      flash.style.opacity = '1';
    }, 1450));

    allTimers.push(setTimeout(() => {
      fallLayer.remove();
      originals.forEach((p) => { p.style.visibility = ''; });
    }, 4200));
  }, 5150));

  // Только после полного затемнения загружаем тему/DOM Версии II.
  // Чёрная заливка уже должна полностью закрыть старый интерфейс.
  allTimers.push(setTimeout(() => {
    document.body.classList.remove('v2-shake-small', 'v2-shake-medium', 'v2-shake-large', 'v2-catastrophe', 'epic-shake');
    document.body.classList.add('v2-theme', 'v2-reveal-seq');
    crackLayer.remove();
    S.screen = 'v2intro';
    render();

    // Пока экран полностью чёрный, проигрываем одноразовый гул перехода (5.mp3).
    // Он остаётся частью самого перехода и не переносится в момент появления UI.
    setTimeout(() => {
      playV2UnlockSfx('blackHum');
    }, 350);

    // Затем начинаем постоянный гул Версии II ещё до появления первого UI-элемента.
    // Он постепенно подмешивается во время затемнения/рассеивания чёрного экрана.
    setTimeout(() => {
      startV2Ambient();
    }, 5200);

    // После нескольких секунд полной темноты начинаем уводить чёрный экран.
    // UI всё ещё скрыт классом v2-reveal-seq и начнёт появляться позже.
    setTimeout(() => {
      flash.style.transition = 'opacity 3.8s cubic-bezier(.2,.75,.25,1)';
      flash.style.opacity = '0';
    }, 3000);

    setTimeout(() => {
      flash.remove();
    }, 6900);

    // Завершаем кинематографичное появление после того, как все элементы успели войти.
    setTimeout(() => {
      document.body.classList.remove('v2-reveal-seq');
      document.body.classList.add('v2-reveal-done');
    }, 14000);
  }, 9500));
}

  'Ты всё ещё здесь. Хорошо.',

const TERM = { timer: null, hideTimer: null, typing: null, log: [], openUntil: 0 };

function termInV2() { return S.screen === 'v2intro' || S.screen === 'v2quiz'; }

function termSchedule(delay) {
  clearTimeout(TERM.timer);
  const d = delay != null ? delay : 120000 + Math.random() * 180000; // 2–5 минут
  TERM.timer = setTimeout(termFire, d);
}

function termFire() {
  // Показываем только в Версии II, на видимой вкладке и не во время заставки появления.
  if (!termInV2() || document.hidden || document.body.classList.contains('v2-reveal-seq') || !document.querySelector('.v2-terminal')) {
    TERM.timer = setTimeout(termFire, 15000);
    return;
  }
  const shown = termEmit(false);
  if (shown !== null) termSchedule(); // null — фразы закончились, больше не планируем
}

// preview=true — тестовый показ из debug-панели (ничего не помечает увиденным)
function termEmit(preview) {
  let text;
  if (preview) {
    text = TERMINAL_MESSAGES[Math.floor(Math.random() * TERMINAL_MESSAGES.length)];
  } else {
    const seen = Array.isArray(S.termSeen) ? S.termSeen : (S.termSeen = []);
    const pool = [];
    for (let i = 0; i < TERMINAL_MESSAGES.length; i++) if (!seen.includes(i)) pool.push(i);
    if (!pool.length) return null;
    const idx = pool[Math.floor(Math.random() * pool.length)];
    seen.push(idx);
    saveProgress();
    text = TERMINAL_MESSAGES[idx];
  }
  TERM.log.push({ text });
  while (TERM.log.length > 3) TERM.log.shift();
  TERM.openUntil = Date.now() + 22000;
  termPaint(true);
  clearTimeout(TERM.hideTimer);
  TERM.hideTimer = setTimeout(() => {
    const t = document.querySelector('.v2-terminal');
    if (t) t.classList.remove('open');
  }, 22000);
  return true;
}

function termPaint(typeLast) {
  const box = document.querySelector('.v2-terminal');
  if (!box) return;
  const log = box.querySelector('.t-log');
  log.innerHTML = '';
  if (TERM.typing) { clearInterval(TERM.typing); TERM.typing = null; }
  TERM.log.forEach((m, i) => {
    const line = el('div', 't-line');
    const txt = document.createElement('span');
    txt.textContent = m.text;
    line.appendChild(txt);
    log.appendChild(line);
    if (typeLast && i === TERM.log.length - 1) {
      let k = 0;
      TERM.typing = setInterval(() => {
        if (!txt.isConnected) { clearInterval(TERM.typing); TERM.typing = null; return; }
        k++;
        txt.textContent = m.text.slice(0, k);
        if (k >= m.text.length) { clearInterval(TERM.typing); TERM.typing = null; }
      }, 45);
    } else {
      txt.textContent = m.text;
    }
  });
  box.classList.add('open');
}

function mountTerminal() {
  if (!document.body.classList.contains('v2-theme')) return;
  if (document.querySelector('.v2-terminal')) return;
  const box = el('div', 'v2-terminal');
  const head = el('div', 't-head');
  head.innerHTML = '&gt;_ TERMINAL <span class="t-cur">█</span>';
  box.appendChild(head);
  box.appendChild(el('div', 't-log'));
  document.body.appendChild(box);
  if (TERM.log.length && Date.now() < TERM.openUntil) termPaint(false); // после перерисовки экрана возвращаем открытое окно
  if (!TERM.timer) termSchedule();
}

function formatTimerParts(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return {
    h: Math.floor(s / 3600),
    m: Math.floor((s % 3600) / 60),
    sec: s % 60,
  };
}

function setTimerPart(node, value, key, state) {
  const text = key === 'h' ? String(value) : String(value).padStart(2, '0');
  if (state[key] !== value) {
    node.textContent = text;
    node.classList.remove('timer-tick');
    void node.offsetWidth;
    node.classList.add('timer-tick');
  }
  state[key] = value;
}

function mountGlobalTimer() {
  if (!S.timerRevealed) return;
  if (S.screen === 'v3transition' || S.screen === 'v3quiz' || S.screen === 'v3final') return;
  if (document.querySelector('.global-timer')) return;
  const start = new Date(CONFIG.birthdayStart);
  const end = new Date(CONFIG.birthdayEnd);
  const bar = el('div', 'global-timer');
  const icon = el('span', null);
  const value = el('span', null);
  bar.appendChild(icon);
  bar.appendChild(value);
  document.body.appendChild(bar);

  value.innerHTML = '<span class="timer-h"></span>:<span class="timer-m"></span>:<span class="timer-sec"></span>';
  const h = value.querySelector('.timer-h');
  const m = value.querySelector('.timer-m');
  const sec = value.querySelector('.timer-sec');
  const state = { h: null, m: null, sec: null, mode: null };

  function tick() {
    if (!document.body.contains(bar)) { clearInterval(globalTimerInterval); globalTimerInterval = null; return; }
    const t = trustedNow();
    if (t >= end) {
      icon.textContent = '';
      value.textContent = 'С днём рождения!';
      value.classList.remove('timer-tick');
      state.mode = 'done';
      return;
    }

    const before = t < start;
    const ms = before ? start - t : end - t;
    const mode = before ? 'before' : 'during';
    if (state.mode !== mode) {
      icon.textContent = before ? '' : '🎉 ';
      state.mode = mode;
      state.h = state.m = state.sec = null;
    }
    const parts = formatTimerParts(ms);
    setTimerPart(h, parts.h, 'h', state);
    setTimerPart(m, parts.m, 'm', state);
    setTimerPart(sec, parts.sec, 'sec', state);
  }
  tick();
  globalTimerInterval = setInterval(tick, 1000);
}

/* ---------- Вступление ---------- */
function renderIntro() {
  const card = el('div', 'card');
  card.appendChild(el('h1', null, 'Привет!'));
  card.appendChild(el('p', 'lead', 'Представляю тебе небольшой интерактивный опросик в честь моего 20-летия.'));
  card.appendChild(el('p', 'lead', 'Надеюсь, тебе понравится!'));

  const label = el('label', 'field');
  label.appendChild(el('span', 'hint', 'Как тебя записать? (ник)'));
  const input = el('input');
  input.type = 'text';
  input.placeholder = 'Твой ник';
  input.style.marginTop = '8px';
  input.dataset.nickField = '1';
  label.appendChild(input);
  card.appendChild(label);

  const note = el('p', 'hint');
  card.appendChild(note);

  const btn = el('button', 'primary wide', 'Начать');
  btn.style.marginTop = '18px';
  btn.disabled = true;
  card.appendChild(btn);

  let prefetchTimer = null;
  input.addEventListener('input', () => {
    const v = input.value.trim();
    btn.disabled = v.length === 0;
    clearTimeout(prefetchTimer);
    if (v.length >= 2) prefetchTimer = setTimeout(() => { void prefetchServerProgress(v); }, 900);
    const saved = v ? loadProgress(v) : null;
    note.textContent = saved
      ? 'С этим ником уже есть прогресс, продолжим с того же места.'
      : 'По нику сохраняется прогресс: сможешь вернуться и продолжить.';
  });

  async function start() {
    const v = input.value.trim();
    if (!v || btn.disabled) return;

    if (tight(v) === 'kreazot316') {
      app.innerHTML = '';
    
      const errorCard = el('div', 'card');
      errorCard.appendChild(el('h1', null, 'Ошибка'));
      errorCard.appendChild(el(
        'p',
        'lead',
        '(секретный код): Моё имя брать нельзя ;P'
      ));
    
      app.appendChild(errorCard);
      return;
    }
    
    btn.disabled = true;
    note.textContent = 'Загружаем данные…';

    const localSaved = loadProgress(v);
    const dirtyAtStart = isDirty(v);

    // Запрос прогресса стартует сразу и идёт параллельно с банком вопросов
    // (часто он уже готов — его запускает ввод ника).
    const serverP = prefetchServerProgress(v);

    if (!await loadQuestionBank()) {
      note.textContent = 'Не удалось загрузить данные квеста. Проверь подключение к серверу.';
      btn.disabled = false;
      return;
    }

    let serverSaved;
    if (localSaved) {
      // Есть локальный прогресс: ждём сервер недолго. Не успел — стартуем с локального,
      // а сверку с сервером доделаем в фоне.
      serverSaved = await Promise.race([serverP, new Promise(r => setTimeout(() => r(undefined), 2500))]);
    } else {
      note.textContent = 'Ищем твой прогресс…';
      serverSaved = await serverP;
    }
    const stillPending = serverSaved === undefined;
    const serverFailed = stillPending || !!(serverSaved && serverSaved.__error);

    if (serverFailed && !localSaved) {
      // Не знаем, есть ли у игрока прогресс на сервере — не создаём «нового», чтобы его не затереть.
      note.textContent = 'Не удаётся связаться с сервером, чтобы проверить твой прогресс. Проверь интернет и попробуй ещё раз.';
      btn.disabled = false;
      return;
    }

    S.nick = v;
    v1LogLoad(v);
    void flushV1Log(false); // догоняем журнал прошлой сессии, если он остался
    if (serverFailed) {
      // Сервер пока не ответил, но на устройстве есть сохранение — продолжаем с него.
      applyProgress(localSaved);
    } else if (serverSaved && serverSaved.state) {
      const srv = serverSaved.state;
      if (localSaved && dirtyAtStart && (Number(localSaved.updatedAt) || 0) >= (Number(srv.updatedAt) || 0)) {
        // Прошлое сохранение не успело уйти на сервер — локальная версия новее.
        applyProgress(localSaved);
        void syncPlayerToServer('resume-local');
      } else {
        // Сервер — основной источник истины при наличии записи.
        applyProgress(srv);
      }
    } else if (localSaved) {
      // Первый запуск новой серверной версии: переносим старый localStorage на сервер (в фоне).
      applyProgress(localSaved);
      void syncPlayerToServer('migration');
    } else {
      S.index = 0;
      S.answers = {};
      S.unlocked = false;
      S.v2Index = 0;
      S.v2Answers = {};
      S.preodolevatelPoints = 0;
      S.preodolevatelPassed = false;
      S.v3Index = 0;
      S.v3Answers = [];
      S.timerRevealed = false;
      S.termSeen = [];
      S.screen = 'quiz';
      saveProgress();
      void syncPlayerToServer('created'); // запись нового игрока — в фоне, квест не ждёт
    }

    render();

    if (stillPending && !dirtyAtStart) {
      // Сервер ответил уже после старта: если там прогресс новее (играли с другого устройства) — предложим его.
      serverP.then(res => {
        if (!res || res.__error || !res.state || S.nick !== v) return;
        const srvAt = Number(res.state.updatedAt) || 0;
        if (srvAt > (Number(localSaved.updatedAt) || 0)) offerServerProgress(res.state);
      });
    }
  }

  function offerServerProgress(srvState) {
    const box = document.createElement('div');
    box.setAttribute('style', 'position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:99991;background:rgba(40,28,52,.96);color:#fff;font:13px/1.35 system-ui,sans-serif;padding:10px 14px;border-radius:14px;max-width:92vw;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center');
    const t = document.createElement('span');
    t.textContent = 'На сервере нашёлся более свежий прогресс (возможно, с другого устройства).';
    box.appendChild(t);
    const mk = (label, primary, fn) => {
      const b = document.createElement('button');
      b.textContent = label;
      b.setAttribute('style', 'border:0;border-radius:99px;padding:6px 12px;font-size:12.5px;cursor:pointer;' + (primary ? 'background:#7b3fa0;color:#fff' : 'background:#efe2f7;color:#7b3fa0'));
      b.addEventListener('click', () => { box.remove(); fn(); });
      box.appendChild(b);
    };
    mk('Загрузить', true, () => { applyProgress(srvState); saveProgress(); render(); });
    mk('Остаться', false, () => {});
    document.body.appendChild(box);
  }

  btn.addEventListener('click', start);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') start(); });

  app.appendChild(card);
  input.focus();
}

/* ---------- Вопрос ---------- */
function renderQuestion() {
  const q = QUESTIONS[S.index];

  const bar = el('div', 'topbar');
  bar.appendChild(el('span', null, 'Вопрос <strong>' + q.n + '</strong> из ' + QUESTIONS.length));
  bar.appendChild(el('span', null, S.nick));
  app.appendChild(bar);

  const track = el('div', 'track');
  const fill = el('div');
  fill.style.width = ((S.index + 1) / QUESTIONS.length * 100) + '%';
  track.appendChild(fill);
  app.appendChild(track);

  const card = el('div', 'card');
  card.appendChild(el('p', 'q', q.textHtml || q.text));
  if (q.hint || q.hintHtml) card.appendChild(el('p', 'hint', q.hintHtml || q.hint));

  const body = el('div');
  card.appendChild(body);
  app.appendChild(card);

  const builders = {
    text: buildText, free: buildText, yesno: buildYesNo,
    sports: buildSports, games: buildGames,
    clicker: buildClicker, confirm: buildConfirm, haystack: buildHaystack,
  };
  builders[q.kind](q, body, card);
  if (q.n === 14) mountSnakeHotkey(q, slot(q.n));
}

function nextButton(label) {
  const btn = el('button', 'primary', label || 'Следующий вопрос');
  btn.addEventListener('click', async () => {
    if (btn.disabled) return;
    if (S.index < QUESTIONS.length - 1) {
      S.index += 1;
      S.screen = 'quiz';
      render();
      return;
    }

    // I-20: профиль уходит на сервер в фоне — финальный экран открывается сразу.
    btn.disabled = true;
    S.screen = 'final';
    saveProgress();
    void syncPlayerToServer('v1-complete', { screen: 'final' });
    render();
  });
  return btn;
}

function verdict(kind, html) {
  return el('p', 'verdict ' + kind, html);
}

/* ---------- Текстовые и свободные вопросы ---------- */
function buildText(q, body, card) {
  const free = q.kind === 'free';
  const st = slot(q.n);

  const label = el('label', 'field');
  const input = el(free ? 'textarea' : 'input');
  if (!free) input.type = 'text';
  input.placeholder = free ? 'Пиши что угодно…' : 'Твой ответ…';
  input.value = st.value || '';
  label.appendChild(input);
  body.appendChild(label);

  const row = el('div', 'row');
  const answerBtn = el('button', 'ghost', 'Ответить');
  row.appendChild(answerBtn);
  body.appendChild(row);

  const out = el('div');
  body.appendChild(out);

  if (q.extra === 'ad' && st.adUnlocked) mountAd(card, st);

  function showVerdict() {
    out.innerHTML = '';
    if (st.lastCorrect === undefined) return;
    if (st.lastCorrect) {
      const html = q.okHtml || (q.ok ? q.ok() : 'Правильно!');
      out.appendChild(verdict(free ? 'neutral' : 'ok', html));
    } else {
      out.appendChild(verdict('bad', q.bad ? q.bad() : 'Неправильно!'));
    }
    if (st.codeShown) out.appendChild(el('div', 'codebox', st.codeShown));
  }

  function submit() {
    const v = input.value;
    st.value = v;
    let correct = true;

    if (free) {
      if (!v.trim()) return;
      st.lastCorrect = true;
      st.passed = true;
      SFX.correctV1();
    } else {
      correct = !!q.check(v);
      st.lastCorrect = correct;
      if (correct) { st.passed = true; SFX.correctV1(); }
      else SFX.wrongV1();
    }

    if (q.extra === 'ad' && !st.adUnlocked) {
      st.adUnlocked = true;
      mountAd(card, st);
    }
    if (!row.contains(nextBtn)) row.appendChild(nextBtn);
    showVerdict();
    saveProgress();
    void recordV1Answer(q.n, v, correct, st.passed);
  }

  const nextBtn = nextButton();
  answerBtn.addEventListener('click', submit);
  if (!free) input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });

  if (st.lastCorrect !== undefined) { row.appendChild(nextBtn); showVerdict(); }
}

/* ---------- Фейковая реклама (вопрос 4) ---------- */
function mountAd(card, st) {
  if (card.querySelector('.ad')) return;

  const adData = bankData('v1', 4);

  ad.addEventListener('click', () => {

}

/* ---------- Вопрос 6: секции ---------- */
function buildSports(q, body) {
  const st = slot(q.n);
  if (!st.found) st.found = [];
  if (!st.log) st.log = [];

  const row = el('div', 'row');
  const input = el('input');
  input.type = 'text';
  input.placeholder = 'Секция или кружок…';
  input.style.flex = '1 1 200px';
  const btn = el('button', 'ghost', 'Угадать');
  row.appendChild(input);
  row.appendChild(btn);
  body.appendChild(row);

  const out = el('div');
  body.appendChild(out);
  const chips = el('div', 'guesses');
  body.appendChild(chips);
  const nav = el('div', 'row');
  nav.appendChild(nextButton());
  body.appendChild(nav);

  function paint() {
    out.innerHTML = '';
    if (st.lastMsg) {
      const v = verdict(st.lastOk ? 'ok' : 'bad', st.lastMsg);
      v.style.cursor = 'help';
      v.addEventListener('mouseenter', () => {
        v.innerHTML = st.found.length + '/10';
      });
      v.addEventListener('mouseleave', () => {
        v.innerHTML = st.lastMsg;
      });
      out.appendChild(v);
    }
    if (st.found.length >= CONFIG.sportsTarget) {
      out.appendChild(verdict('ok', 'Ого. Похоже, ты знаешь обо мне довольно много.'));
      out.appendChild(el('div', 'codebox', 'diversity = bigmak ** 2 - 5'));
    }
    chips.innerHTML = '';
    st.log.slice(-12).forEach(g => {
      chips.appendChild(el('span', 'chip ' + (g.ok ? 'ok' : 'bad'), g.text));
    });
  }

  function guess() {
    const v = input.value.trim();
    if (!v) return;
    const matchId = matchSport(v);
    const isRight = matchId !== null;
    const isNew = isRight && !st.found.includes(matchId);

    if (isNew) {
      st.found.push(matchId);
      st.passed = true;
      st.lastOk = true;
      SFX.correctV1();
      st.lastMsg = st.found.length >= CONFIG.sportsTarget
        ? bankMessage('v1', 6)
        : SPORTS_YES[(st.found.length - 1) % SPORTS_YES.length];
    } else if (isRight) {
      st.lastOk = true;
      st.lastMsg = 'Это ты уже называл :)';
    } else {
      st.lastOk = false;
      st.lastMsg = 'Нет, не угадал.';
      SFX.wrongV1();
    }
    st.log.push({ text: v, ok: isRight });
    input.value = '';
    saveProgress();
    void recordV1Answer(q.n, v, isRight, st.passed, {
      matchId: matchId,
      newMatch: isNew,
    });
    paint();
    input.focus();
  }

  btn.addEventListener('click', guess);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') guess(); });
  paint();
}

/* ---------- Вопрос 11: игры ---------- */
function buildGames(q, body) {
  const st = slot(q.n);
  if (!st.found) st.found = [];
  if (!st.log) st.log = [];

  const row = el('div', 'row');
  const input = el('input');
  input.type = 'text';
  input.placeholder = 'Название игры…';
  input.style.flex = '1 1 200px';
  const btn = el('button', 'ghost', 'Ответить');
  row.appendChild(input);
  row.appendChild(btn);
  body.appendChild(row);

  const counter = el('p', 'counter');
  body.appendChild(counter);
  const out = el('div');
  body.appendChild(out);
  const chips = el('div', 'guesses');
  body.appendChild(chips);
  const nav = el('div', 'row');
  body.appendChild(nav);

  function paint() {
    const left = Math.max(0, CONFIG.gamesTarget - st.found.length);
    counter.textContent = st.found.length >= CONFIG.gamesTarget
      ? 'Названо игр: ' + st.found.length
      : 'Названо: ' + st.found.length + ' из ' + CONFIG.gamesTarget;
    out.innerHTML = '';
    if (st.lastMsg) out.appendChild(verdict(st.lastOk ? 'ok' : 'bad', st.lastMsg));
    chips.innerHTML = '';
    st.log.slice(-12).forEach(g => {
      chips.appendChild(el('span', 'chip ' + (g.ok ? 'ok' : 'bad'), g.text));
    });
    nav.innerHTML = '';
    if (st.passed) {
      nav.appendChild(nextButton());
    } else {
      const locked = el('p', 'hint', 'Осталось назвать ещё ' + left + ', чтобы пройти дальше.');
      nav.appendChild(locked);
    }
  }

  function guess() {
    const v = input.value.trim();
    if (!v) return;
    const idx = matchGame(v);
    const isRight = idx !== null;
    const isNew = isRight && !st.found.includes(idx);

    if (isNew) {
      st.found.push(idx);
      SFX.correctV1();
      const left = CONFIG.gamesTarget - st.found.length;
      if (st.found.length < CONFIG.gamesTarget) {
        st.lastMsg = 'Правильно! Назови ещё ' + left;
      } else if (st.found.length === CONFIG.gamesTarget) {
        st.lastMsg = bankMessage('v1', 11);
        st.passed = true;
      } else {
        st.lastMsg = 'Ещё одна? Круто!';
      }
      st.lastOk = true;
    } else if (isRight) {
      st.lastOk = true;
      st.lastMsg = 'Эту ты уже называл :)';
    } else {
      st.lastOk = false;
      st.lastMsg = 'Нет, не угадал.';
      SFX.wrongV1();
    }
    st.log.push({ text: v, ok: isRight });
    // После первой попытки вопрос можно пропустить независимо от правильности ответа.
    if (st.log.length === 1) st.passed = true;
    input.value = '';
    saveProgress();
    void recordV1Answer(q.n, v, isRight, st.passed, {
      matchId: idx,
      newMatch: isNew,
    });
    paint();
    input.focus();
  }

  btn.addEventListener('click', guess);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') guess(); });
  paint();
}

/* ---------- Вопрос 8: кликер ---------- */
function buildClicker(q, body) {
  const st = slot(q.n);

  const stage = el('div', 'clicker-stage');
  const core = el('div', 'clicker-core');
  const counterEl = el('div', 'clicks', '0');
  const bigBtn = el('button', 'primary bigbutton', 'Жми!');
  const timeEl = el('p', 'hint', CONFIG.clickerSeconds + ' сек');
  core.appendChild(counterEl);
  core.appendChild(bigBtn);
  core.appendChild(timeEl);
  stage.appendChild(core);
  body.appendChild(stage);

  const out = el('div');
  body.appendChild(out);
  const nav = el('div', 'row');
  body.appendChild(nav);

  if (st.done) {
    core.innerHTML = '';
    core.appendChild(el('div', 'clicks', String(st.clicks || 0)));
    core.appendChild(el('p', 'hint', 'нажатий'));
    out.appendChild(verdict(st.clicks > 0 ? 'ok' : 'bad',
      st.clicks > 0 ? 'Отличный результат!' : 'Ну нажми, хоть разочек :('));
    const replay = el('button', 'ghost', 'Сыграть ещё раз');
    replay.addEventListener('click', () => {
      st.done = false;
      saveProgress();
      render();
    });
    nav.appendChild(replay);
    nav.appendChild(nextButton());
    return;
  }

  let clicks = 0;
  let left = CONFIG.clickerSeconds;
  let running = false;
  const timers = [];

  const CORNER_ZONES = [
    { top: [4, 20], left: [2, 20] },
    { top: [4, 20], left: [78, 95] },
    { top: [80, 95], left: [2, 20] },
    { top: [80, 95], left: [78, 95] },
    { top: [42, 58], left: [2, 14] },
    { top: [42, 58], left: [84, 95] },
  ];
  function randIn(range) { return range[0] + Math.random() * (range[1] - range[0]); }

  function spawnNoise(text, opts) {
    const o = opts || {};
    const n = el('div', 'noise' + (o.isCode ? ' code' : ''), text);
    let top, left2;
    if (o.top !== undefined) {
      top = o.top; left2 = o.left;
    } else {
      const zone = CORNER_ZONES[Math.floor(Math.random() * CORNER_ZONES.length)];
      top = randIn(zone.top);
      left2 = randIn(zone.left);
    }
    n.style.top = top + '%';
    n.style.left = Math.max(1, Math.min(62, left2)) + '%';
    if (!o.isCode) {
      n.style.fontSize = (0.8 + Math.random() * 0.75).toFixed(2) + 'rem';
      n.style.transform = 'rotate(' + Math.round(-25 + Math.random() * 50) + 'deg)';
    } else {
      n.style.transform = 'rotate(-13deg)';
    }
    stage.appendChild(n);
    timers.push(setTimeout(() => n.remove(), o.life || 1400));
  }

  function startRun() {
    if (running) return;
    running = true;

    const tick = setInterval(() => {
      left -= 1;
      timeEl.textContent = left + ' сек';
      if (left <= 0) {
        clearInterval(tick);
        finish();
      }
    }, 1000);
    timers.push(tick);

    // мусорные сообщения
    const noiseTimer = setInterval(() => {
      spawnNoise(CLICK_NOISE[Math.floor(Math.random() * CLICK_NOISE.length)], { life: 650 });
    }, 650);
    timers.push(noiseTimer);

    // фрагмент кода: не первым, у края, дважды в одном месте, с разрывом 11 сек
    const codePos = { top: 6, left: 1.5, isCode: true, life: 1000 };
    timers.push(setTimeout(() => spawnNoise('teto = diversity // 5', codePos), 5000));
    timers.push(setTimeout(() => spawnNoise('teto = diversity // 5', codePos), 16000));
  }

  function finish() {
    timers.forEach(t => { clearTimeout(t); clearInterval(t); });
    stage.querySelectorAll('.noise').forEach(n => n.remove());
    st.done = true;
    st.clicks = clicks;
    st.attempts = (st.attempts || 0) + clicks;
    if (clicks > 0) st.passed = true;
    saveProgress();
    void recordV1Answer(q.n, clicks, clicks > 0, st.passed, { clicks: clicks });
    render();
  }

  bigBtn.addEventListener('click', () => {
    startRun();
    clicks += 1;
    counterEl.textContent = String(clicks);
  });
}

/* ---------- Вопрос 10: "Вы уверены?" ---------- */
function buildConfirm(q, body) {
  const st = slot(q.n);
  const step = st.step || 0;

  const titleEl = document.querySelector('.card .q');
  titleEl.textContent = CONFIRM_PHRASES[Math.min(step, CONFIRM_PHRASES.length - 1)];

  const out = el('div');
  const row = el('div', 'row');
  body.appendChild(row);
  body.appendChild(out);

  // провал — показываем сообщение и кнопку перезапуска
  if (st.failed) {
    out.appendChild(verdict('bad', st.failMsg));
    if (st.codeShown) out.appendChild(el('div', 'codebox', st.codeShown));
    const b = el('button', 'ghost', 'Начать заново');
    b.addEventListener('click', () => {
      st.failed = false; st.failMsg = ''; st.step = 0;
      render();
    });
    row.appendChild(b);
    if (st.passed) row.appendChild(nextButton());
    return;
  }

  // пройдено до конца
  if (step >= CONFIRM_PHRASES.length) {
    titleEl.textContent = 'Ты действительно уверен.';
    st.passed = true;
    saveProgress();
    const replay = el('button', 'ghost', 'Прокликать ещё раз');
    replay.addEventListener('click', () => {
      st.step = 0;
      render();
    });
    row.appendChild(replay);
    row.appendChild(nextButton());
    return;
  }

  const counter = el('p', 'counter', 'Шаг ' + (step + 1) + ' из ' + CONFIRM_PHRASES.length);

  const yes = el('button', 'primary', 'Да');
  yes.addEventListener('click', () => {
    st.step = step + 1;
    saveProgress();
    void recordV1Answer(q.n, 'да', null, st.passed, { step: step + 1 });
    render();
  });
  const no = el('button', 'ghost', 'Нет');
  no.addEventListener('click', () => {
    st.failed = true;
    if (step === CONFIRM_TRICK) {
      st.failMsg = 'Ну раз нет…';
      st.codeShown = 'zzz = teto * bigmak + diversity';
    } else {
      st.failMsg = 'Тебе не хватает решительности!';
    }
    saveProgress();
    void recordV1Answer(q.n, 'нет', false, st.passed, { step: step, failed: true });
    render();
  });
  row.appendChild(yes);
  row.appendChild(no);
  if (st.passed) {
    row.appendChild(nextButton());
  }
  body.appendChild(counter);
}

/* ---------- Вопрос 18: скрытые надписи ---------- */
function buildHaystack(q, body) {
  const st = slot(q.n);

  const hay = el('div', 'haystack');

  // размещение по сетке, чтобы надписи не накладывались друг на друга
  const cols = 5, rows = 14;
  const cells = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) cells.push({ r, c });
  }
  // перемешиваем ячейки
  for (let i = cells.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cells[i], cells[j]] = [cells[j], cells[i]];
  }

  // Sparkle — в первой строке (рядом с текстом вопроса), sparxie — в нижней трети
  const topCells = cells.filter(c => c.r === 0);
  const lowCells = cells.filter(c => c.r >= 7);
  const sparkleCell = topCells[0] || cells[0];
  const sparxieCell = lowCells[0] || cells[cells.length - 1];

  const used = new Set([sparkleCell.r + ':' + sparkleCell.c, sparxieCell.r + ':' + sparxieCell.c]);

  function place(text, cell, opts) {
    const o = opts || {};
    const s = el('span', 'straw' + (o.correct ? ' correct-target' : ''), text);
    const jitterR = (Math.random() - 0.5) * (100 / rows) * 0.6;
    const jitterC = (Math.random() - 0.5) * (100 / cols) * 0.5;
    s.style.top = Math.max(1, Math.min(97, cell.r * (100 / rows) + 1 + jitterR)) + '%';
    s.style.left = Math.max(1, Math.min(90, cell.c * (100 / cols) + 1 + jitterC)) + '%';
    s.style.fontSize = o.size || (0.72 + Math.random() * 0.45).toFixed(2) + 'rem';
    s.style.color = o.color || 'rgba(47,32,56,' + (0.012 + Math.random() * 0.045).toFixed(3) + ')';
    if (o.mono) s.style.fontFamily = 'var(--mono)';
    if (o.rotate) s.style.transform = 'rotate(' + o.rotate + 'deg)';
    hay.appendChild(s);
  }

  // Ответ и скрытый фрагмент приходят из Answer Bank.
  const hidden = bankData('v1', 18);
  place(String(hidden.hiddenTarget || ''), sparkleCell, {
    color: 'rgba(47,32,56,0.011)', size: '0.85rem', correct: true
  });
  place(String(hidden.hiddenCode || ''), sparxieCell, {
    color: 'rgba(47,32,56,0.012)', size: '0.7rem', mono: true, correct: true
  });

  let ti = 0;
  cells.forEach(cell => {
    const key = cell.r + ':' + cell.c;
    if (used.has(key)) return;
    if (ti >= STRAW_TEXTS.length) return;
    place(STRAW_TEXTS[ti++], cell, {});
  });

  body.appendChild(hay);
  const label = el('label', 'field');
  const input = el('input');
  input.type = 'text';
  input.placeholder = 'Что ты нашёл?';
  input.value = st.value || '';
  label.appendChild(input);
  body.appendChild(label);

  const row = el('div', 'row');
  const answerBtn = el('button', 'ghost', 'Ответить');
  row.appendChild(answerBtn);
  body.appendChild(row);
  const out = el('div');
  body.appendChild(out);

  const nextBtn = nextButton();

  function showVerdict() {
    out.innerHTML = '';
    if (st.lastCorrect === undefined) return;
    out.appendChild(st.lastCorrect
      ? verdict('ok', q.ok())
      : verdict('bad', 'Неправильно!'));
  }

  function submit() {
    st.value = input.value;
    st.lastCorrect = !!q.check(input.value);
    if (st.lastCorrect) st.passed = true;
    if (!row.contains(nextBtn)) row.appendChild(nextBtn);
    showVerdict();
    saveProgress();
    void recordV1Answer(q.n, input.value, st.lastCorrect, st.passed);
  }

  answerBtn.addEventListener('click', submit);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  if (st.lastCorrect !== undefined) { row.appendChild(nextBtn); showVerdict(); }
}

/* ---------- Финальный экран ---------- */

  return new Intl.DateTimeFormat('ru-RU', {
    day: 'numeric',
    month: 'long',
    hour: '2-digit',
    minute: '2-digit',
    timeZone: 'Europe/Riga',
  }).format(d);
}

function buildV2Text(q, body) {
  const st = v2slot(q.n);

  const label = el('label', 'field');
  const input = el('input');
  input.type = 'text';
  input.placeholder = 'Твой ответ…';
  input.value = st.value || '';
  label.appendChild(input);
  body.appendChild(label);

  const row = el('div', 'row');
  const answerBtn = el('button', 'ghost', 'Ответить');
  row.appendChild(answerBtn);
  body.appendChild(row);
  const out = el('div');
  body.appendChild(out);

  const nb = v2NextButton();

  function paint() {
    out.innerHTML = '';
    if (st.lastCorrect === undefined) return;
    out.appendChild(st.lastCorrect ? verdict('ok', q.ok()) : verdict('bad', 'Неправильно! Попробуй ещё раз.'));
    if (st.passed && !row.contains(nb)) row.appendChild(nb);
  }

  async function submit() {
    st.value = input.value;
    if (String(input.value).trim() !== '') st.history.push(String(input.value));
    st.lastCorrect = !!q.check(input.value);
    if (st.lastCorrect) {
      st.passed = true;
      SFX.correctV2();
    } else {
      SFX.wrongV2();
    }
    saveProgress();
    paint();
    // Синхронизируем и неправильные попытки тоже — backend хранит их
    // в одной клетке соответствующего вопроса.
    void syncPlayerToServer('v2-' + q.n, { screen: 'v2quiz' });
  }
  answerBtn.addEventListener('click', submit);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  if (st.lastCorrect !== undefined) paint();
}

function buildV2Countdown(q, body) {
  const st = v2slot(q.n);
  const start = new Date(CONFIG.birthdayStart);
  const end = new Date(CONFIG.birthdayEnd);

  if (!S.timerRevealed) { S.timerRevealed = true; saveProgress(); }

  const box = el('div', 'countdown-box');
  const label = el('p', 'hint');
  label.style.textAlign = 'center';
  body.appendChild(label);
  body.appendChild(box);

  const units = {};
  const state = { h: null, m: null, sec: null };
  [['h', 'ч'], ['m', 'мин'], ['sec', 'сек']].forEach(([key, lbl]) => {
    const u = el('div', 'unit');
    const num = el('div', 'num');
    u.appendChild(num);
    u.appendChild(el('div', 'lbl', lbl));
    box.appendChild(u);
    units[key] = num;
  });

  function paint() {
    const t = trustedNow();
    if (t < start) {
      label.textContent = '';
      updateTimerUnits(start - t);
    } else if (t < end) {
      label.textContent = 'Времени осталось на сегодня:';
      updateTimerUnits(end - t);
    } else {
      label.textContent = 'С днём рождения меня!';
      box.innerHTML = '';
    }
  }

  function updateTimerUnits(ms) {
    const parts = formatTimerParts(ms);
    setTimerPart(units.h, parts.h, 'h', state);
    setTimerPart(units.m, parts.m, 'm', state);
    setTimerPart(units.sec, parts.sec, 'sec', state);
  }

  paint();
  let tick = setInterval(() => {
    if (S.screen !== 'v2quiz' || V2_QUESTIONS[S.v2Index] !== q) { clearInterval(tick); return; }
    paint();
  }, 1000);

  const unlocked = trustedNow() >= start || S.debugAll;
  const label2 = el('label', 'field');
  const input = el('input');
  input.type = 'text';
  input.placeholder = unlocked ? 'Твой ответ…' : 'Пока рано…';
  input.disabled = !unlocked;
  input.value = st.value || '';
  label2.appendChild(input);
  body.appendChild(label2);

  const row = el('div', 'row');
  const answerBtn = el('button', 'ghost', 'Ответить');
  answerBtn.disabled = !unlocked;
  row.appendChild(answerBtn);
  body.appendChild(row);
  const out = el('div');
  body.appendChild(out);

  function paintVerdict() {
    out.innerHTML = '';
    if (st.lastCorrect === undefined) return;
    out.appendChild(st.lastCorrect ? verdict('ok', q.ok()) : verdict('bad', 'Неправильно! Попробуй ещё раз.'));
  }

  function submit() {
    st.value = input.value;
    if (String(input.value).trim() !== '') st.history.push(String(input.value));
    st.lastCorrect = !!q.check(input.value);
    if (st.lastCorrect) SFX.correctV2();
    else SFX.wrongV2();
    paintVerdict();
    saveProgress();
    // Записываем каждую попытку, включая неправильную.
    void syncPlayerToServer('v2-' + q.n, { screen: 'v2quiz' });
    if (st.lastCorrect && !st.passed) {
      st.passed = true;
      saveProgress();
      void syncPlayerToServer('v2-' + q.n, { screen: 'v2quiz' });
      input.disabled = true;
      answerBtn.disabled = true;
      clearInterval(tick);
      // Небольшая пауза после правильного ответа: таймер уже остановлен,
      // экран остаётся неподвижным, затем начинается переход в Версию III.
      setTimeout(() => {
        if (S.screen === 'v2quiz' && V2_QUESTIONS[S.v2Index] === q) {
          triggerV3Sequence();
        }
      }, 2200);
      return;
    }
  }
  answerBtn.addEventListener('click', submit);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  if (st.lastCorrect !== undefined) paintVerdict();
}

/* ---------- Переход в Версию III: тишина → тряска → светлая заливка ---------- */
function triggerV3Sequence() {
  // Передаём управление файлу verIIsfx.mp3: во время перехода нет других звуков.
  stopV3Music();
  playV2ToV3Sfx();
  prepareV3MusicForLaunch();

  if (globalTimerInterval) { clearInterval(globalTimerInterval); globalTimerInterval = null; }
  const bar = document.querySelector('.global-timer');
  if (bar) bar.remove();

  // Белый слой стартует сразу и становится полностью непрозрачным ровно через 9 секунд.
  document.body.classList.add('epic-shake-long');
  const wash = el('div', 'v3-wash');
  wash.style.transition = 'opacity 9s cubic-bezier(.32,.08,.12,1)';
  wash.style.opacity = '0';
  document.body.appendChild(wash);

  requestAnimationFrame(() => { wash.style.opacity = '1'; });

  const finishWhite = (ev) => {
    if (ev.propertyName !== 'opacity' || wash.style.opacity !== '1') return;
    wash.removeEventListener('transitionend', finishWhite);
    document.body.classList.remove('epic-shake-long');
    stopV2ToV3Sfx();
    S.screen = 'v3transition';
    render();
    // Музыка стартует с самого начала именно при появлении Version III.
    startV3Music(true);

    setTimeout(() => {
      wash.style.transition = 'opacity 3.2s cubic-bezier(.2,.75,.25,1)';
      wash.style.opacity = '0';
      setTimeout(() => wash.remove(), 3400);
    }, 2600);
  };
  wash.addEventListener('transitionend', finishWhite);
}

function mountSnakeHotkey(q, st) {
  snakeKeyHandler = (e) => {
    // Надёжно определяем именно клавишу 7 на цифровом блоке.
    // Основной вариант — code=Numpad7; location=3 покрывает браузеры/раскладки,
    // где клавиша приходит с другим key, но всё ещё определяется как numpad.
    const isNumpad7 = e.code === 'Numpad7' || (e.location === 3 && e.key === '7');
    if (!isNumpad7) return;

    // Все условия должны выполняться одновременно:
    // 1) открыта Версия II;
    // 2) открыт 14-й вопрос первой версии;
    // 3) у пользователя сейчас ровно 14:00 по локальным часам;
    // 4) нажата Numpad 7.
    if (!S.unlocked || S.screen !== 'quiz' || q.n !== 14 || S.index !== 13) return;

    const currentTime = new Date();
    const is1400 = currentTime.getHours() === 14 && currentTime.getMinutes() === 0;
    if (!is1400 || document.querySelector('.snake-overlay')) return;

    e.preventDefault();
    launchSnake(q, st);
  };
  document.addEventListener('keydown', snakeKeyHandler);
}

function launchSnake(q, st) {
  const overlay = el('div', 'snake-overlay');
  const scoreEl = el('div', 'score', 'Яблоки: 0');
  const canvas = document.createElement('canvas');
  const size = 20, cells = 14;
  canvas.width = size * cells;
  canvas.height = size * cells;
  const hint = el('p', 'hint', 'Управление - Стрелки/WASD');
  hint.style.color = '#cbb8e0';
  overlay.appendChild(scoreEl);
  overlay.appendChild(canvas);
  overlay.appendChild(hint);
  document.body.appendChild(overlay);

  const ctx = canvas.getContext('2d');
  let snake = [{ x: 7, y: 7 }];
  let dir = { x: 1, y: 0 };
  let nextDir = dir;
  let apple = spawnApple();
  let apples = 0;
  let dead = false;

  function spawnApple() {
    let p;
    do {
      p = { x: Math.floor(Math.random() * cells), y: Math.floor(Math.random() * cells) };
    } while (snake.some(s => s.x === p.x && s.y === p.y));
    return p;
  }

  function onKey(e) {
    const map = {
      ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 },
      ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
      w: { x: 0, y: -1 }, a: { x: -1, y: 0 }, s: { x: 0, y: 1 }, d: { x: 1, y: 0 },
      W: { x: 0, y: -1 }, A: { x: -1, y: 0 }, S: { x: 0, y: 1 }, D: { x: 1, y: 0 },
    };
    const d = map[e.key];
    if (!d) return;
    if (d.x === -dir.x && d.y === -dir.y) return;
    nextDir = d;
  }
  document.addEventListener('keydown', onKey);

  function draw() {
    ctx.fillStyle = '#100a18';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#f2b705';
    ctx.fillRect(apple.x * size, apple.y * size, size - 2, size - 2);
    ctx.fillStyle = '#c9a6ff';
    snake.forEach(s => ctx.fillRect(s.x * size, s.y * size, size - 2, size - 2));
  }

  function closeSnakeOverlay(next) {
    if (!overlay.isConnected || overlay.classList.contains('snake-closing')) return;
    overlay.classList.add('snake-closing');
    setTimeout(() => {
      overlay.remove();
      if (typeof next === 'function') next();
    }, 280);
  }

  function finish() {
    dead = true;
    clearInterval(loop);
    document.removeEventListener('keydown', onKey);
    const previousRecord = Math.max(Number(st.bestApples) || 28, 28);
    const newRecord = apples > previousRecord;
    st.bestApples = Math.max(previousRecord, apples);
    if (newRecord) {
      SFX.record();
    }
    saveProgress();
    const msg = el('div', 'msg');
    msg.textContent = 'Игра окончена. Яблок: ' + apples + '. Рекорд: ' + st.bestApples;
    overlay.appendChild(msg);
    if (newRecord) {
      const recordData = bankData('v2', 2);
      const recordMsg = el('div', 'msg', String(recordData.recordPrefix || '') + String(recordData.recordLabel || '') + ': ' + st.bestApples);
      recordMsg.style.color = '#8fd19e';
      recordMsg.style.marginTop = '-4px';
      recordMsg.style.fontSize = '1.02rem';
      overlay.appendChild(recordMsg);
    }
    const row = el('div', 'row');
    row.style.justifyContent = 'center';
    const again = el('button', 'primary', 'Ещё раз');
    again.addEventListener('click', () => { closeSnakeOverlay(() => launchSnake(q, st)); });
    const close = el('button', 'ghost', 'Закрыть');
    close.addEventListener('click', () => { closeSnakeOverlay(() => render()); });
    row.appendChild(again);
    row.appendChild(close);
    overlay.appendChild(row);
  }

  function tick() {
    if (dead) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= cells || head.y >= cells ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      return finish();
    }
    snake.unshift(head);
    if (head.x === apple.x && head.y === apple.y) {
      apples += 1;
      SFX.apple();
      scoreEl.textContent = 'Яблоки: ' + apples;
      apple = spawnApple();
    } else {
      snake.pop();
    }
    draw();
  }

  draw();
  const loop = setInterval(tick, 160);
}

    const bar = el('div', 'v3-win-bar', '<span class="dots"><i></i><i></i><i></i></span><span class="ttl"></span>');
    bar.querySelector('.ttl').textContent = 'Вопрос ' + (i + 1);

    const body = el('div', 'v3-win-body');
    const q = el('p', 'v3-win-q');
    q.textContent = question;
    const tag = el('span', 'v3-win-tag');
    tag.textContent = 'мой ответ';
    const a = el('p', 'v3-win-a');
    a.textContent = answer;
    body.append(q, tag, a);

    win.append(bar, body);
    const toggle = () => {
      const was = win.classList.contains('front');
      layer.querySelectorAll('.v3-win.front').forEach(n => n.classList.remove('front'));
      if (!was) win.classList.add('front');
    };
    win.addEventListener('click', (e) => { e.stopPropagation(); toggle(); });
    win.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
    layer.appendChild(win);
  });

  if (!layer.children.length) return;
  wrap.addEventListener('click', () => {
    layer.querySelectorAll('.v3-win.front').forEach(n => n.classList.remove('front'));
  });
  wrap.appendChild(layer);
}

function renderV3Final() {
  const wrap = el('div', 'v3-final-wrap');
  const box = el('div', 'v3-final-msg');
  box.style.whiteSpace = 'pre-line';
  wrap.appendChild(box);

  startV3Music();

  app.appendChild(wrap);

  let windowsBuilt = false;
  const show = (data) => {
    if (!wrap.isConnected) return;
    box.textContent = (data && data.message) || friendMessage(S.nick);
    if (data && !windowsBuilt) {
      windowsBuilt = true;
      buildOwnerWindows(wrap, data.answers);
    }
  };

  if (FINALE) { show(FINALE); return; }
  if (!serverSyncEnabled()) { show(null); return; }

  box.textContent = '…';
  // Данные ещё не пришли: пробуем ещё пару раз (сервер мог не успеть увидеть, что игрок дошёл до III).
  const attempt = (n) => loadFinale().then(d => {
    if (d) show(d);
    else if (n < 2 && wrap.isConnected) setTimeout(() => attempt(n + 1), 2500);
  });
  attempt(0);
  // Если сервер молчит — показываем запасное сообщение; пришедшие позже данные его заменят.
  setTimeout(() => { if (!FINALE && wrap.isConnected && box.textContent === '…') show(null); }, 9000);
}
void loadQuestionBank().then(() => {
  if (S.screen !== 'intro' && !QUESTION_BANK) render();
});
syncTrustedTime();
setTimeout(refreshV2Stats, 3000); // не мешаем банку и времени — статистика нужна позже
render();

// Проверка появления кнопки пропуска (только локально, без запросов).
setInterval(mountSkipButton, 20000);

window.__questBooted = true;
</script>
