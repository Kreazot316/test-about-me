<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Опросик в честь 20-летия</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@400;600;700&family=JetBrains+Mono:wght@400;600&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdf7ef;
    --bg-alt: #f6ecdd;
    --card: #ffffff;
    --ink: #2f2038;
    --ink-soft: #6b5a76;
    --accent: #7b3fa0;
    --accent-soft: #efe2f7;
    --gold: #e0a52e;
    --q14-glow: rgba(224,165,46,.34);
    --q14-glow-soft: rgba(224,165,46,.17);
    --ok: #2f8f5b;
    --ok-bg: #e4f5ea;
    --bad: #c0503f;
    --bad-bg: #fbe8e4;
    --line: #e7dbcb;
    --code-bg: #2f2038;
    --code-ink: #ffd479;
    --display: 'Fraunces', Georgia, serif;
    --body: 'Nunito', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
 
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 12% 8%, rgba(224,165,46,.16), transparent 42%),
      radial-gradient(circle at 88% 4%, rgba(123,63,160,.14), transparent 40%),
      var(--bg);
    color: var(--ink);
    font-family: var(--body);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 64px;
  }

  .wrap { width: 100%; max-width: 620px; }

  .topbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
    font-size: .85rem;
    color: var(--ink-soft);
  }
  .topbar strong { color: var(--accent); font-weight: 700; }

  .track { height: 6px; background: var(--bg-alt); border-radius: 99px; overflow: hidden; margin-bottom: 18px; }
  .track > div { height: 100%; background: linear-gradient(90deg, var(--gold), var(--accent)); border-radius: 99px; transition: width .35s ease; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 28px 26px 26px;
    box-shadow: 0 14px 34px -22px rgba(47,32,56,.4);
    position: relative;
    animation: rise .34s ease;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  h1 { font-family: var(--display); font-size: clamp(1.7rem, 5.5vw, 2.3rem); margin: 0 0 12px; line-height: 1.15; }
  h2 { font-family: var(--display); font-size: clamp(1.25rem, 4.4vw, 1.6rem); margin: 0 0 8px; line-height: 1.25; font-weight: 700; }
  .v2-q-image { display: block; width: 132px; height: 132px; object-fit: contain; margin: 0 auto 14px; }
  .q { font-family: var(--display); font-size: clamp(1.2rem, 4.2vw, 1.5rem); font-weight: 700; line-height: 1.3; margin: 0; }
  .hint { color: var(--ink-soft); font-size: .92rem; margin: 10px 0 0; line-height: 1.5; overflow-wrap: anywhere; }
  p.lead { font-size: 1.02rem; line-height: 1.6; margin: 0 0 6px; }

  label.field { display: block; margin-top: 18px; }
  input[type=text], input[type=password], textarea {
    width: 100%;
    font-family: var(--body);
    font-size: 1rem;
    color: var(--ink);
    background: var(--bg);
    border: 1.5px solid var(--line);
    border-radius: 11px;
    padding: 12px 14px;
    outline: none;
    transition: border-color .18s ease;
  }
  input[type=text]:focus, input[type=password]:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 86px; }

  .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; align-items: center; }

  button {
    font-family: var(--body);
    font-size: .97rem;
    font-weight: 700;
    border: none;
    border-radius: 11px;
    padding: 11px 20px;
    cursor: pointer;
    transition: transform .12s ease, filter .18s ease;
  }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: default; }
  .primary { background: var(--accent); color: #fff; }
  .primary:hover:not(:disabled) { filter: brightness(1.08); }
  .ghost { background: var(--accent-soft); color: var(--accent); }
  .ghost:hover:not(:disabled) { filter: brightness(.97); }
  .wide { width: 100%; }

  .verdict { margin-top: 14px; font-weight: 700; font-size: 1rem; }
  .verdict.ok { color: var(--ok); animation: popIn .4s ease; }
  .verdict.bad { color: var(--bad); animation: shakeX .45s ease; }
  .verdict.neutral { color: var(--accent); animation: popIn .4s ease; }
  @keyframes popIn { 0% { opacity: 0; transform: scale(.85); } 60% { opacity: 1; transform: scale(1.05); } 100% { transform: scale(1); } }
  @keyframes shakeX {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); } 40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); } 80% { transform: translateX(4px); }
  }

  button.q {
    font-family: var(--display); font-weight: 700; line-height: 1.3;
    color: var(--ink); background: none; border: 2px dashed var(--accent); border-radius: 12px;
    padding: 14px 16px; cursor: pointer; display: block; width: 100%; text-align: center;
    transition: background .2s ease, transform .15s ease;
  }
  button.q:hover { background: var(--accent-soft); }
  button.q:active { transform: scale(.98); }

  .stage-stats { font-size: .78rem; color: var(--ink-soft); margin-top: 8px; }

  .stealth { color: var(--card); transition: color .45s ease; cursor: default; }
  .stealth:hover { color: var(--ink); }

  .codebox {
    margin-top: 14px;
    font-family: var(--mono);
    font-size: .88rem;
    background: var(--code-bg);
    color: var(--code-ink);
    border-radius: 10px;
    padding: 12px 14px;
    overflow-x: auto;
    white-space: pre;
  }

  .guesses { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
  .chip { font-size: .82rem; font-weight: 700; padding: 5px 11px; border-radius: 8px; }
  .chip.ok { background: var(--ok-bg); color: var(--ok); }
  .chip.bad { background: var(--bad-bg); color: var(--bad); }
  .counter { margin-top: 12px; font-size: .9rem; color: var(--ink-soft); font-weight: 600; }

  /* Q4 — фейковая реклама */
  .ad {
    position: absolute;
    top: -14px;
    right: -10px;
    background: #d62300;
    color: #ffc72c;
    font-family: var(--body);
    font-weight: 700;
    font-size: .82rem;
    line-height: 1.25;
    text-align: center;
    padding: 9px 13px;
    border-radius: 12px;
    box-shadow: 0 8px 20px -8px rgba(0,0,0,.45);
    cursor: pointer;
    transform: rotate(4deg);
    animation: rise .4s ease;
    z-index: 5;
  }
  .ad span { display: block; font-size: .95rem; letter-spacing: .01em; }
  @media (max-width: 520px) { .ad { top: -12px; right: -4px; font-size: .74rem; padding: 7px 10px; } }

  /* Q8 — кликер */
  .clicker-stage { position: relative; min-height: 360px; margin-top: 16px; overflow: hidden; border-radius: 12px; background: var(--bg-alt); }
  .clicker-core { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 3; }
  .bigbutton {
    width: 118px; height: 118px; border-radius: 50%;
    background: var(--accent);
    color: #fff; font-size: 1.05rem; font-weight: 700;
    box-shadow: 0 10px 22px -10px rgba(123,63,160,.8);
  }
  .clicks { font-family: var(--display); font-size: 2rem; font-weight: 700; }
  .noise { position: absolute; font-family: var(--body); font-weight: 700; color: var(--accent); opacity: .55; pointer-events: none; z-index: 2; white-space: normal; max-width: calc(100% - 16px); overflow-wrap: anywhere; text-align: center; }
  .noise.code { font-family: var(--mono); font-weight: 600; color: var(--ink-soft); opacity: .5; font-size: .78rem; }

  .timer-tick { animation: timerTick .34s ease; }
  @keyframes timerTick {
    0% { opacity: .45; transform: scale(1.08); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* Q18 — скрытые надписи */
  .haystack {
    position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
    grid-auto-flow: row; gap: 3px; align-items: stretch; align-content: stretch;
    min-height: 480px; margin-top: 14px; border-radius: 12px; overflow: hidden;
  }
  .straw {
    position: relative; display: block; align-self: stretch; justify-self: stretch;
    box-sizing: border-box; width: 100%; min-width: 0; min-height: 30px;
    padding: 3px 4px; border-radius: 4px; text-align: center;
    white-space: normal; overflow-wrap: anywhere; word-break: break-word;
    line-height: 1.16; cursor: default;
    transition: color .2s ease, background-color .2s ease, text-shadow .2s ease;
  }
  .straw:hover, .straw.touch-hover {
    color: var(--ink-soft) !important; background: rgba(123,63,160,.045); z-index: 2;
  }
  .straw.correct-target:hover, .straw.correct-target.touch-hover {
    color: rgba(123,63,160,.58) !important;
    background: rgba(123,63,160,.07);
    text-shadow: 0 0 10px rgba(123,63,160,.16);
  }
  body.v2-theme .straw.correct-target:hover, body.v2-theme .straw.correct-target.touch-hover {
    color: rgba(201,166,255,.62) !important;
    background: rgba(201,166,255,.07);
    text-shadow: 0 0 12px rgba(201,166,255,.18);
  }
  @media (max-width: 760px) { .haystack { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (max-width: 520px) { .haystack { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; } .straw { padding: 3px 2px; } }

  .final-secret {
    display: block;
    margin-top: 34px;
    font-family: var(--mono);
    font-size: .74rem;
    line-height: 1.6;
    white-space: pre-wrap;
    color: #fbf6ee;
    transition: color .5s ease;
    cursor: default;
  }
  .final-secret:hover, .final-secret.touch-reveal { color: var(--ink-soft); }

  .final-screen-center {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .final-screen-center .card {
    width: min(620px, 100%);
  }

  .switchline { margin-top: 20px; font-size: .84rem; color: var(--ink-soft); text-align: center; }
  .switchline button { background: none; color: var(--accent); padding: 4px 6px; text-decoration: underline; font-size: .84rem; }

  /* ===================== ВЕРСИЯ II — тёмная тема ===================== */
  body.v2-theme {
    --bg: #17101f;
    --bg-alt: #221733;
    --card: #221733;
    --ink: #f2e9ff;
    --ink-soft: #b6a0cf;
    --accent: #c9a6ff;
    --accent-soft: #33234a;
    --gold: #f2b705;
    --q14-glow: rgba(242,183,5,.42);
    --q14-glow-soft: rgba(242,183,5,.2);
    --ok: #8fd19e;
    --ok-bg: #223529;
    --bad: #e98a7e;
    --bad-bg: #3a2224;
    --line: #3a2850;
    --code-bg: #0f0a17;
    --code-ink: #f2b705;
  }
  body.v2-theme .card {
    box-shadow: 0 18px 40px -20px rgba(0,0,0,.6);
    position: relative;
    animation: v2Materialize .75s cubic-bezier(.2,.8,.3,1);
  }
  body.v2-theme .topbar { animation: v2FadeIn .5s ease; }
  @keyframes v2Materialize {
    0% { opacity: 0; transform: scale(.92) translateY(16px); filter: blur(6px); }
    60% { filter: blur(0); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes v2FadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  body.v2-theme { padding-top: 46px; }
  body.v2-theme .q { text-align: center; font-size: clamp(1.5rem, 6vw, 2.1rem); }
  body.v2-theme .row { justify-content: center; }
  body.v2-theme .hint { text-align: center; }

  /* ===================== ЭПИЧНОЕ РАЗРУШЕНИЕ ===================== */
  @keyframes epicShake {
    0%, 100% { transform: translate(0,0); }
    10% { transform: translate(-4px,3px) rotate(-.18deg); }
    20% { transform: translate(5px,-4px) rotate(.18deg); }
    30% { transform: translate(-7px,2px) rotate(-.24deg); }
    40% { transform: translate(8px,6px) rotate(.22deg); }
    50% { transform: translate(-6px,-7px) rotate(-.18deg); }
    60% { transform: translate(10px,3px) rotate(.28deg); }
    70% { transform: translate(-8px,-5px) rotate(-.2deg); }
    80% { transform: translate(6px,7px) rotate(.16deg); }
    90% { transform: translate(-4px,2px) rotate(-.12deg); }
  }
  body.epic-shake { animation: epicShake .85s linear 1; }
  body.epic-shake-long { animation: epicShake .82s linear infinite; }

  @keyframes v2ShakeSmall {
    0%,100% { transform: translate(0,0) rotate(0); }
    20% { transform: translate(-2px,1px) rotate(-.08deg); }
    40% { transform: translate(3px,-2px) rotate(.09deg); }
    60% { transform: translate(-3px,2px) rotate(-.07deg); }
    80% { transform: translate(2px,1px) rotate(.06deg); }
  }
  @keyframes v2ShakeMedium {
    0%,100% { transform: translate(0,0) rotate(0); }
    16% { transform: translate(-6px,3px) rotate(-.2deg); }
    32% { transform: translate(6px,-5px) rotate(.22deg); }
    48% { transform: translate(-7px,4px) rotate(-.2deg); }
    64% { transform: translate(8px,5px) rotate(.24deg); }
    80% { transform: translate(-5px,-4px) rotate(-.16deg); }
  }
  @keyframes v2ShakeLarge {
    0%,100% { transform: translate(0,0) rotate(0) scale(1); filter: none; }
    10% { transform: translate(-12px,7px) rotate(-.5deg) scale(1.002); filter: contrast(1.08); }
    22% { transform: translate(10px,-9px) rotate(.55deg) scale(.998); }
    34% { transform: translate(-15px,4px) rotate(-.58deg) scale(1.003); filter: saturate(1.35); }
    46% { transform: translate(14px,10px) rotate(.52deg) scale(.998); }
    58% { transform: translate(-11px,-8px) rotate(-.48deg) scale(1.004); filter: contrast(1.18); }
    70% { transform: translate(16px,5px) rotate(.6deg) scale(.997); }
    82% { transform: translate(-9px,8px) rotate(-.42deg) scale(1.003); filter: saturate(1.5) contrast(1.1); }
  }
  body.v2-shake-small { animation: v2ShakeSmall .48s cubic-bezier(.36,.07,.19,.97) 1; }
  body.v2-shake-medium { animation: v2ShakeMedium .72s cubic-bezier(.36,.07,.19,.97) 1; }
  body.v2-shake-large { animation: v2ShakeLarge 1.35s cubic-bezier(.36,.07,.19,.97) 1; }

  /* Третий удар — уже почти поломка: вспышки, цветовой сдвиг и короткие рывки. */
  body.v2-catastrophe {
    animation: v2ShakeLarge 1.35s cubic-bezier(.36,.07,.19,.97) 1, v2Catastrophe .23s steps(2,end) 4;
  }
  body.v2-catastrophe::after {
    content: ''; position: fixed; inset: 0; z-index: 54; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent 0 7px, rgba(255,255,255,.055) 7px 9px);
    mix-blend-mode: screen;
    animation: v2ScanBurst .18s steps(2,end) 6;
  }
  @keyframes v2Catastrophe {
    0%,100% { opacity: 1; }
    50% { opacity: .62; }
  }
  @keyframes v2ScanBurst {
    0%,100% { transform: translateY(0); opacity: .05; }
    50% { transform: translateY(8px); opacity: .7; }
  }

  body.v2-reveal-seq .hud-ticker,
  body.v2-reveal-seq .hud-telemetry,
  body.v2-reveal-seq .hud-wave,
  body.v2-reveal-seq .version-toggle,
  body.v2-reveal-seq .quest-nav-fab,
  body.v2-reveal-seq .quest-nav-panel,
  body.v2-reveal-seq .card,
  body.v2-reveal-seq .topbar,
  body.v2-reveal-seq .global-timer {
    opacity: 0;
    animation-fill-mode: forwards;
  }
  body.v2-reveal-seq .hud-ticker { animation: v2UiIn .9s cubic-bezier(.16,1,.3,1) 7.2s forwards !important; }
  body.v2-reveal-seq .hud-telemetry { animation: v2TelemetryIn 1.1s cubic-bezier(.16,1,.3,1) 7.75s forwards !important; }
  body.v2-reveal-seq .hud-wave { animation: v2WaveIn 1.2s cubic-bezier(.16,1,.3,1) 8.25s forwards !important; }
  body.v2-reveal-seq .version-toggle { animation: v2UiIn .95s cubic-bezier(.16,1,.3,1) 8.75s forwards !important; }
  body.v2-reveal-seq .topbar { animation: v2TopbarIn 1.05s cubic-bezier(.16,1,.3,1) 9.55s forwards !important; }
  body.v2-reveal-seq .card { animation: v2CardIn 1.35s cubic-bezier(.16,1,.3,1) 10.15s forwards !important; }
  body.v2-reveal-seq .global-timer { animation: v2UiIn 1s cubic-bezier(.16,1,.3,1) 10.85s forwards !important; }
  body.v2-reveal-seq .card h1 { opacity: 0; animation: v2TextIn .9s cubic-bezier(.16,1,.3,1) 11.25s forwards !important; }
  body.v2-reveal-seq .card p { opacity: 0; animation: v2TextIn .85s cubic-bezier(.16,1,.3,1) 11.7s forwards !important; }
  body.v2-reveal-seq .card button { opacity: 0; animation: v2ButtonIn 1s cubic-bezier(.16,1,.3,1) 12.25s forwards !important; }
  /* После кинематографичного появления не запускаем базовые анимации повторно при снятии v2-reveal-seq. */
  body.v2-reveal-done .hud-ticker,
  body.v2-reveal-done .hud-telemetry,
  body.v2-reveal-done .hud-wave,
  body.v2-reveal-done .version-toggle,
  body.v2-reveal-done .quest-nav-fab,
  body.v2-reveal-done .quest-nav-panel,
  body.v2-reveal-done .card,
  body.v2-reveal-done .topbar,
  body.v2-reveal-done .global-timer {
    opacity: 1;
    animation: none !important;
  }
  body.v2-reveal-done .hud-wave {
    transform: translateX(-50%) !important;
  }
  body.v2-reveal-done .card h1,
  body.v2-reveal-done .card p,
  body.v2-reveal-done .card button {
    opacity: 1;
    animation: none !important;
    transform: none !important;
    filter: none !important;
    clip-path: none !important;
  }
  @keyframes v2UiIn {
    0% { opacity: 0; transform: translateY(14px) scale(.94); filter: blur(10px); clip-path: inset(0 38% 0 38%); }
    58% { opacity: .92; transform: translateY(-2px) scale(1.015); filter: blur(1px); clip-path: inset(0 0 0 0); }
    78% { transform: translateY(1px) scale(.997); }
    100% { opacity: 1; transform: none; filter: blur(0); clip-path: inset(0 0 0 0); }
  }
  @keyframes v2TelemetryIn {
    0% { opacity: 0; transform: translateX(26px) scaleX(.55); filter: blur(10px); }
    40% { opacity: .75; transform: translateX(-4px) scaleX(1.03); filter: blur(2px); }
    70% { transform: translateX(3px); }
    100% { opacity: 1; transform: none; filter: blur(0); }
  }
  @keyframes v2WaveIn {
    0% { opacity: 0; transform: translateX(-50%) translateY(16px) scale(.75); filter: blur(12px); }
    35% { opacity: 1; transform: translateX(-50%) translateY(-3px) scale(1.08); filter: blur(1px); }
    55% { transform: translateX(-50%) translateY(2px) scale(.98); }
    100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); filter: blur(0); }
  }
  @keyframes v2TopbarIn {
    0% { opacity: 0; transform: translateY(-22px) scaleY(.7); filter: blur(12px); }
    45% { opacity: 1; transform: translateY(3px) scaleY(1.04); filter: blur(2px); }
    65% { transform: translateY(-2px) scaleY(.99); }
    100% { opacity: 1; transform: none; filter: blur(0); }
  }
  @keyframes v2CardIn {
    0% { opacity: 0; transform: perspective(900px) rotateX(7deg) scale(.78) translateY(45px); filter: blur(18px) brightness(.2); box-shadow: 0 0 0 rgba(0,0,0,0); }
    35% { opacity: .45; transform: perspective(900px) rotateX(-2deg) scale(.98) translateY(-8px); filter: blur(5px) brightness(.65); box-shadow: 0 0 55px rgba(201,166,255,.18); }
    62% { opacity: 1; transform: perspective(900px) rotateX(1deg) scale(1.025) translateY(2px); filter: blur(1px) brightness(1.12); box-shadow: 0 0 100px rgba(201,166,255,.22); }
    78% { transform: perspective(900px) rotateX(0) scale(.997); }
    100% { opacity: 1; transform: perspective(900px) rotateX(0) scale(1); filter: blur(0) brightness(1); box-shadow: 0 18px 40px -20px rgba(0,0,0,.6); }
  }
  @keyframes v2TextIn {
    0% { opacity: 0; transform: translateY(18px) scale(.96); filter: blur(10px); }
    55% { opacity: 1; transform: translateY(-3px) scale(1.015); filter: blur(1px); }
    100% { opacity: 1; transform: none; filter: blur(0); }
  }
  @keyframes v2ButtonIn {
    0% { opacity: 0; transform: translateY(16px) scale(.82); filter: blur(8px); }
    45% { opacity: 1; transform: translateY(-5px) scale(1.08); filter: blur(0); }
    68% { transform: translateY(2px) scale(.98); }
    100% { opacity: 1; transform: none; filter: blur(0); }
  }

  .crack-overlay { position: fixed; inset: 0; z-index: 55; pointer-events: none; overflow: hidden; }
  .crack-line {
    position: absolute; height: 3px; width: 0;
    background: linear-gradient(90deg, transparent, #fff, #fff, transparent);
    box-shadow: 0 0 12px 2px rgba(255,255,255,.8);
    transform-origin: left center;
    animation: crackGrow .3s ease-out forwards;
  }
  @keyframes crackGrow { from { width: 0; opacity: 1; } to { width: 150vmax; opacity: .85; } }

  .flash-overlay { position: fixed; inset: 0; z-index: 56; background: #000; opacity: 0; pointer-events: none; }

  /* Медленное падение интерфейса первой версии перед уходом в чёрный экран. */
  .v1-fall-layer {
    position: fixed;
    inset: 0;
    z-index: 55;
    pointer-events: none;
    overflow: hidden;
  }
  .v1-falling-copy {
    will-change: transform, opacity, filter;
    contain: layout style paint;
    transform-origin: 50% 50%;
    pointer-events: none;
    backface-visibility: hidden;
    opacity: 1;
    transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
  }
  .v1-falling-copy-active {
    /* Одна непрерывная траектория: сначала резкий подъём по диагонали,
       затем плавная дуга и без остановки — ускоряющееся падение вниз. */
    animation: v1OvalFall 2.15s linear var(--fall-delay) forwards;
  }
  @keyframes v1OvalFall {
    0% {
      opacity: 1;
      transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
      filter: blur(0) brightness(1);
    }
    16% {
      opacity: 1;
      transform: translate3d(var(--fall-x1), var(--fall-y1), 0) rotate(calc(var(--fall-rotate) * -.18)) scale(1.015);
      filter: blur(0) brightness(1.03);
    }
    32% {
      opacity: 1;
      transform: translate3d(var(--fall-x2), var(--fall-y2), 0) rotate(calc(var(--fall-rotate) * -.35)) scale(1.025);
      filter: blur(0) brightness(1.04);
    }
    48% {
      opacity: .995;
      transform: translate3d(var(--fall-x3), var(--fall-y3), 0) rotate(calc(var(--fall-rotate) * .05)) scale(1.01);
      filter: blur(.15px) brightness(1);
    }
    64% {
      opacity: .985;
      transform: translate3d(var(--fall-x4), var(--fall-y4), 0) rotate(calc(var(--fall-rotate) * .5)) scale(.98);
      filter: blur(.5px) brightness(.92);
    }
    82% {
      opacity: .97;
      transform: translate3d(var(--fall-x5), var(--fall-y5), 0) rotate(calc(var(--fall-rotate) * .78)) scale(.95);
      filter: blur(1px) brightness(.82);
    }
    100% {
      opacity: .92;
      transform: translate3d(var(--fall-x6), var(--fall-distance), 0) rotate(var(--fall-rotate)) scale(.9);
      filter: blur(2.5px) brightness(.68);
    }
  }

  .version-toggle {
    position: fixed; right: 14px; bottom: 14px; z-index: 30;
    background: var(--accent); color: var(--card);
    padding: 9px 16px; border-radius: 99px; font-size: .82rem;
    box-shadow: 0 8px 18px -8px rgba(0,0,0,.4);
  }


  /* ---------- Переход между версиями по кнопке ---------- */
  .version-switch-overlay {
    position: fixed;
    inset: 0;
    z-index: 95;
    pointer-events: none;
    overflow: hidden;
    opacity: 0;
    background:
      radial-gradient(circle at 50% 50%, var(--switch-center, rgba(214,205,224,.92)) 0%, rgba(18,12,27,.82) 42%, rgba(4,3,8,.98) 100%);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }
  .version-switch-overlay::before {
    content: '';
    position: absolute;
    inset: -20%;
    background: repeating-linear-gradient(0deg, transparent 0 5px, rgba(255,255,255,.045) 5px 6px);
    opacity: .35;
    transform: translateY(-100%);
  }
  .version-switch-overlay::after {
    content: '';
    position: absolute;
    width: 22vw; height: 22vw; min-width: 140px; min-height: 140px;
    left: 50%; top: 50%;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.28);
    box-shadow:
      0 0 0 1px rgba(197,157,255,.12),
      0 0 45px rgba(177,118,235,.22),
      inset 0 0 35px rgba(255,255,255,.06);
    transform: translate(-50%,-50%) scale(.05);
    opacity: 0;
  }
  body.version-switching #app {
    animation: none;
    transform: none;
    filter: none;
  }
  body.version-switching .version-switch-overlay {
    animation: versionCurtainIn 1.05s cubic-bezier(.22,.7,.25,1) forwards;
  }
  body.version-switching .version-switch-overlay::before {
    animation: versionScanIn 1.05s cubic-bezier(.22,.7,.25,1) forwards;
  }
  body.version-switching .version-switch-overlay::after {
    animation: versionPulseIn 1.05s cubic-bezier(.2,.8,.25,1) forwards;
  }
  body.version-switch-in #app {
    animation: none;
    transform: none;
    filter: none;
  }
  body.version-switch-in .version-switch-overlay {
    opacity: 1;
    animation: versionCurtainOut 1.15s cubic-bezier(.22,.7,.25,1) .05s forwards;
  }
  body.version-switch-in .version-switch-overlay::before {
    animation: versionScanOut 1.15s cubic-bezier(.22,.7,.25,1) forwards;
  }
  body.version-switch-in .version-switch-overlay::after {
    animation: versionPulseOut 1.15s cubic-bezier(.2,.8,.25,1) forwards;
  }
  @keyframes versionSwitchOut {
    0% { opacity: 1; transform: scale(1) rotate(0deg); filter: blur(0); }
    38% { opacity: .92; transform: scale(.985) rotate(-.25deg); filter: blur(.4px); }
    72% { opacity: .48; transform: scale(.965) rotate(.45deg); filter: blur(2px); }
    100% { opacity: 0; transform: scale(.91) rotate(-.7deg); filter: blur(8px); }
  }
  @keyframes versionCurtainIn {
    0% { opacity: 0; transform: scale(1.08); }
    42% { opacity: .36; transform: scale(1); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes versionScanIn {
    0% { transform: translateY(-100%) skewY(-4deg); opacity: 0; }
    35% { opacity: .65; }
    100% { transform: translateY(100%) skewY(-4deg); opacity: .15; }
  }
  @keyframes versionPulseIn {
    0% { transform: translate(-50%,-50%) scale(.05); opacity: 0; }
    42% { opacity: .8; }
    100% { transform: translate(-50%,-50%) scale(16); opacity: 0; }
  }
  @keyframes versionSwitchIn {
    0% { opacity: 0; transform: scale(1.055) translateY(10px); filter: blur(8px); }
    28% { opacity: .65; transform: scale(1.018) translateY(2px); filter: blur(3px); }
    64% { opacity: 1; transform: scale(.998) translateY(0); filter: blur(.5px); }
    100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
  }
  @keyframes versionCurtainOut {
    0% { opacity: 1; transform: scale(1); }
    38% { opacity: .95; transform: scale(1.01); }
    100% { opacity: 0; transform: scale(1.035); }
  }
  @keyframes versionScanOut {
    0% { transform: translateY(-100%) skewY(-4deg); opacity: .3; }
    100% { transform: translateY(100%) skewY(-4deg); opacity: 0; }
  }
  @keyframes versionPulseOut {
    0% { transform: translate(-50%,-50%) scale(.15); opacity: .7; }
    100% { transform: translate(-50%,-50%) scale(18); opacity: 0; }
  }

  /* ===================== ВЕРСИЯ II — декоративный HUD-мусор ===================== */
  body.v2-theme::before {
    content: ''; position: fixed; inset: 0; z-index: 4; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0px, rgba(255,255,255,.025) 1px, transparent 1px, transparent 3px);
    mix-blend-mode: overlay;
  }
  body.v2-theme .q {
    position: relative;
    animation: glitchFlicker 6.5s infinite;
  }
  @keyframes glitchFlicker {
    0%, 95%, 100% { text-shadow: none; transform: none; }
    96% { text-shadow: -2px 0 #ff5e7a, 2px 0 #5ecbff; transform: translateX(1px); }
    97% { text-shadow: 2px 0 #ff5e7a, -2px 0 #5ecbff; transform: translateX(-1px); }
    98% { text-shadow: -1px 0 #ff5e7a, 1px 0 #5ecbff; transform: translateX(1px); }
    99% { text-shadow: none; transform: none; }
  }

  .hud-ticker {
    position: fixed; top: 0; left: 0; right: 0; z-index: 25;
    background: #0f0a17; color: #8267a8; font-family: var(--mono); font-size: .7rem;
    padding: 5px 0; overflow: hidden; white-space: nowrap; border-bottom: 1px solid var(--line);
  }
  .hud-ticker span { display: inline-block; padding-left: 100%; animation: hudScroll 26s linear infinite; }
  @keyframes hudScroll { from { transform: translateX(0); } to { transform: translateX(-100%); } }

  .hud-telemetry {
    position: fixed; top: 34px; left: 8px; z-index: 25;
    font-family: var(--mono); font-size: .65rem; color: #7a5ea3; line-height: 1.55;
    pointer-events: none; opacity: .85;
  }
  .hud-telemetry b { color: var(--accent); }
  @media (max-width: 640px) { .hud-telemetry { display: none; } }

  .hud-corner { position: absolute; width: 14px; height: 14px; border-color: var(--accent); opacity: .8; pointer-events: none; }
  .hud-tl { top: -2px; left: -2px; border-top: 2px solid; border-left: 2px solid; }
  .hud-tr { top: -2px; right: -2px; border-top: 2px solid; border-right: 2px solid; }
  .hud-bl { bottom: -2px; left: -2px; border-bottom: 2px solid; border-left: 2px solid; }
  .hud-br { bottom: -2px; right: -2px; border-bottom: 2px solid; border-right: 2px solid; }

  .hud-wave {
    position: fixed; left: 50%; bottom: 58px; transform: translateX(-50%); z-index: 22;
    display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; opacity: .85;
  }
  .hud-wave .bars { display: flex; align-items: flex-end; gap: 2px; height: 20px; }
  .hud-wave .bars span { width: 3px; background: var(--accent); border-radius: 2px; animation: waveBounce 1.1s ease-in-out infinite; }
  @keyframes waveBounce { 0%, 100% { height: 4px; } 50% { height: 18px; } }
  .hud-wave .lbl { font-family: var(--mono); font-size: .6rem; color: #7a5ea3; letter-spacing: .04em; }

  .global-timer {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 21;
    background: var(--card); border: 1px solid var(--line); color: var(--ink);
    font-family: var(--mono); font-size: .78rem; padding: 7px 14px; border-radius: 99px;
    box-shadow: 0 8px 18px -8px rgba(0,0,0,.35); white-space: nowrap;
    animation: globalTimerIn .4s ease;
  }
  @keyframes globalTimerIn {
    from { opacity: 0; transform: translate(-50%, 10px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }
  .global-timer span { color: var(--accent); font-weight: 700; display: inline-block; }

  /* I-14 — после 14:00 по локальным часам подсвечиваем поле и кнопку ответа. */
  .card.q14-time-active label.field input[type="text"] {
    border-color: var(--gold);
    box-shadow: 0 0 0 2px var(--q14-glow-soft), 0 0 18px var(--q14-glow);
    animation: q14AnswerGlow 2.2s ease-in-out infinite;
  }
  .card.q14-time-active .row .ghost {
    box-shadow: 0 0 0 1px var(--q14-glow-soft), 0 0 14px var(--q14-glow-soft);
    animation: q14AnswerGlow 2.2s ease-in-out infinite;
    animation-delay: .12s;
  }
  @keyframes q14AnswerGlow {
    0%, 100% { box-shadow: 0 0 0 2px var(--q14-glow-soft), 0 0 10px var(--q14-glow-soft); }
    50% { box-shadow: 0 0 0 4px var(--q14-glow-soft), 0 0 24px var(--q14-glow); }
  }
  @media (prefers-reduced-motion: reduce) {
    .card.q14-time-active label.field input[type="text"],
    .card.q14-time-active .row .ghost { animation: none; }
  }

  /* ===================== ПРЕОДОЛЕВАТЕЛЬ — выпадающая панель Версии II ===================== */
  .challenge-drawer {
    position: fixed;
    top: 64px;
    right: 14px;
    left: auto;
    transform: none;
    width: min(390px, calc(100vw - 28px));
    z-index: 27;
    font-family: var(--body);
    color: var(--ink);
  }
  .challenge-tab {
    width: fit-content;
    min-width: 210px;
    margin-left: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 14px;
    border-radius: 0 0 12px 12px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--ink);
    box-shadow: 0 8px 20px -14px rgba(0,0,0,.65);
    cursor: pointer;
    font-size: .78rem;
    letter-spacing: .02em;
  }
  .challenge-tab strong { color: var(--accent); }
  .challenge-tab .challenge-arrow {
    font-size: .75rem;
    transition: transform .22s ease;
  }
  .challenge-drawer.open .challenge-tab .challenge-arrow { transform: rotate(180deg); }
  .challenge-panel {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    background: var(--card);
    border: 0 solid var(--line);
    border-top: 0;
    border-radius: 0 0 14px 14px;
    box-shadow: 0 18px 36px -20px rgba(0,0,0,.7);
    transition: max-height .28s ease, opacity .2s ease, border-width .2s ease;
  }
  .challenge-drawer.open .challenge-tab { width: 100%; }
  .challenge-drawer.open .challenge-panel {
    max-height: min(65vh, 560px);
    overflow-y: auto;
    opacity: 1;
    border-width: 0 1px 1px;
  }
  .challenge-inner { padding: 12px 14px 14px; }
  .challenge-intro { margin: 0 0 10px; color: var(--ink-soft); font-size: .8rem; line-height: 1.45; }
  .challenge-progress {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 10px; font-size: .78rem; font-weight: 700;
  }
  .challenge-progress strong { color: var(--accent); }
  .challenge-progress-bar {
    height: 5px; flex: 1; background: rgba(127,127,127,.28); border-radius: 99px; overflow: hidden;
  }
  /* Шкала на закрытой карточке II-5: подпись сверху, полоса на всю ширину. */
  .challenge-progress.stacked {
    flex-direction: column; align-items: stretch; gap: 9px;
    max-width: 380px; margin: 18px auto 6px; text-align: center;
  }
  .challenge-progress.stacked .challenge-progress-bar {
    flex: none; width: 100%; height: 12px;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.22);
  }
  .challenge-progress-bar > div {
    height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), var(--accent));
    transition: width .3s ease;
  }
  .challenge-list { display: flex; flex-direction: column; gap: 6px; }
  .challenge-item {
    display: grid;
    grid-template-columns: 22px 28px minmax(0, 1fr) auto;
    gap: 8px;
    padding: 7px 8px;
    border-radius: 9px;
    background: var(--bg);
    font-size: .78rem;
    line-height: 1.4;
  }
  /* Длинные описания не должны растягивать карточку за пределы экрана. */
  .challenge-item > div:nth-child(3) {
    min-width: 0;
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  .challenge-number {
    font-family: var(--mono); font-weight: 700; color: var(--ink-soft); text-align: center;
  }
  .challenge-item.done { background: var(--ok-bg); }
  .challenge-item .mark { font-weight: 800; color: var(--ink-soft); text-align: center; }
  .challenge-item.done .mark { color: var(--ok); }
  .challenge-item .note {
    color: var(--ink-soft);
    font-size: .7rem;
    margin-top: 2px;
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  .challenge-points { font-family: var(--mono); font-weight: 700; color: var(--accent); white-space: nowrap; text-align: right; }
  .challenge-deadline { margin-top: 9px; color: var(--ink-soft); font-family: var(--mono); font-size: .65rem; text-align: center; }
  .challenge-drawer.complete .challenge-tab { border-color: var(--ok); }
  .challenge-drawer.complete .challenge-tab strong { color: var(--ok); }
  @media (max-width: 520px) {
    .challenge-drawer { top: 56px; right: 8px; width: calc(100vw - 16px); transform: none; }
    .challenge-tab { min-width: 190px; font-size: .72rem; padding: 7px 11px; }
  }

  /* ===================== НАВИГАЦИЯ ПО ВОПРОСАМ ===================== */
  .quest-nav-fab {
    /* В обычном состоянии кнопка стоит на одном уровне с переключением версии и пропуском квеста. */
    position: fixed; left: 14px; right: auto; bottom: 14px; z-index: 41;
    padding: 8px 13px; border-radius: 99px;
    background: var(--card); color: var(--ink); border: 1px solid var(--line);
    box-shadow: 0 8px 18px -10px rgba(0,0,0,.5);
    font-size: .78rem; font-weight: 650; letter-spacing: .01em;
  }
  .quest-nav-panel {
    position: fixed; left: 14px; right: auto; bottom: 60px; z-index: 42;
    width: min(310px, calc(100vw - 28px));
    max-height: min(58vh, calc(100dvh - 76px), 490px);
    overflow-y: auto; overscroll-behavior: contain;
    padding: 12px; box-sizing: border-box;
    background: var(--card); color: var(--ink); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: 0 14px 34px -18px rgba(0,0,0,.55);
  }
  /* Когда Mambomode активен, возвращаем навигацию на прежнюю высоту. */
  body.mambo-on .quest-nav-fab { bottom: calc(var(--mambo-bottom, 14px) + 106px); }
  body.mambo-on .quest-nav-panel {
    bottom: calc(var(--mambo-bottom, 14px) + 152px);
    max-height: min(58vh, calc(100dvh - var(--mambo-bottom, 14px) - 180px), 490px);
  }

  /* Если Mambomode раскрыт, поднимаем навигацию, чтобы карточки не наслаивались. */
  .mambo-menu.open ~ .quest-nav-fab { bottom: calc(var(--mambo-bottom, 14px) + 234px); }
  .mambo-menu.open ~ .quest-nav-panel {
    bottom: calc(var(--mambo-bottom, 14px) + 280px);
    max-height: min(42vh, calc(100dvh - var(--mambo-bottom, 14px) - 332px), 490px);
  }
  .quest-nav-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
  .quest-nav-title { font-size: .84rem; font-weight: 750; }
  .quest-nav-close { padding: 2px 7px; background: transparent; color: var(--ink-soft); font-size: 1rem; }
  .quest-nav-note { margin: 0 0 10px; color: var(--ink-soft); font-size: .72rem; line-height: 1.4; }
  .quest-nav-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .quest-nav-chip {
    min-width: 0; padding: 7px 3px; border-radius: 8px;
    background: var(--accent-soft); color: var(--accent); border: 1px solid transparent;
    font-size: .75rem; font-weight: 700; line-height: 1.15; overflow-wrap: anywhere;
  }
  .quest-nav-chip.is-passed { background: var(--ok-bg); color: var(--ok); }
  .quest-nav-chip.is-current { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .quest-nav-chip:focus-visible, .quest-nav-fab:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  @media (max-width: 520px) {
    .quest-nav-fab { left: 10px; bottom: 14px; }
    .quest-nav-panel {
      left: 10px; bottom: 60px;
      width: min(310px, calc(100vw - 20px));
      max-height: min(58vh, calc(100dvh - 76px), 490px);
    }
    body.mambo-on .quest-nav-fab { bottom: calc(var(--mambo-bottom, 58px) + 106px); }
    body.mambo-on .quest-nav-panel {
      bottom: calc(var(--mambo-bottom, 58px) + 152px);
      max-height: min(58vh, calc(100dvh - var(--mambo-bottom, 58px) - 180px), 490px);
    }
    .mambo-menu.open ~ .quest-nav-fab { bottom: calc(var(--mambo-bottom, 58px) + 234px); }
    .mambo-menu.open ~ .quest-nav-panel {
      bottom: calc(var(--mambo-bottom, 58px) + 280px);
      max-height: min(42vh, calc(100dvh - var(--mambo-bottom, 58px) - 332px), 490px);
    }
  }

  /* ===================== ВЕРСИЯ II — компоненты ===================== */
  .locked-box { text-align: center; padding: 26px 10px; }
  .locked-box .big { font-family: var(--display); font-size: 1.6rem; color: var(--accent); }

  .snake-launch { text-align: center; padding: 20px 10px; color: var(--ink-soft); font-size: .92rem; }
  .snake-overlay {
    position: fixed; inset: 0; z-index: 60; background: rgba(10,6,16,.88);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    animation: snakeOverlayIn .34s cubic-bezier(.2,.82,.25,1) both;
    transform-origin: center;
  }
  .snake-overlay.snake-closing { animation: snakeOverlayOut .28s cubic-bezier(.55,.05,.7,.2) forwards; }
  @keyframes snakeOverlayIn {
    from { opacity: 0; transform: scale(.965); filter: blur(7px); }
    60% { opacity: 1; transform: scale(1.012); filter: blur(0); }
    to { opacity: 1; transform: scale(1); filter: blur(0); }
  }
  @keyframes snakeOverlayOut {
    from { opacity: 1; transform: scale(1); filter: blur(0); }
    100% { opacity: 0; transform: scale(.985); filter: blur(5px); }
  }
  .snake-overlay canvas { background: #100a18; border: 2px solid var(--accent); border-radius: 10px; }
  .snake-overlay .score { color: #fff; font-family: var(--display); font-size: 1.3rem; }
  .snake-overlay .msg { color: var(--gold); font-family: var(--display); font-size: 1.2rem; text-align: center; }

  .countdown-box { display: flex; gap: 18px; justify-content: center; margin: 22px 0; flex-wrap: wrap; animation: countdownIn .6s cubic-bezier(.2,.8,.3,1); }
  @keyframes countdownIn { from { opacity: 0; transform: translateY(14px) scale(.92); } to { opacity: 1; transform: none; } }
  .countdown-box .unit { text-align: center; }
  .countdown-box .num { font-family: var(--display); font-size: clamp(2.2rem, 9vw, 3.4rem); font-weight: 700; color: var(--accent); }
  .countdown-box .num.timer-tick { animation: timerTick .34s ease; }
  @keyframes tickPulse { 0% { transform: scale(1.16); opacity: .6; } 100% { transform: scale(1); opacity: 1; } }
  .countdown-box .lbl { font-size: .74rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .05em; }

  /* ===================== ВЕРСИЯ III — мягкая тема ===================== */
  body.v3-theme {
    --bg: #fff6ee;
    --bg-alt: #ffece0;
    --card: #fffaf6;
    --ink: #4a3b34;
    --ink-soft: #8d7669;
    --accent: #e08a5b;
    --accent-soft: #fbe3d2;
    --gold: #f2b705;
    --ok: #7fae86;
    --ok-bg: #eaf3ea;
    --bad: #d98b7a;
    --bad-bg: #fbe9e4;
    --line: #f0ddce;
    --code-bg: #fff1e4;
    --code-ink: #b5651d;
  }

  .v3-wash { position: fixed; inset: 0; z-index: 99999; background: #fff; opacity: 0; pointer-events: auto; will-change: opacity; }
  @keyframes v3TransitionShake { 0%,100% { transform: translate3d(0,0,0); } 18% { transform: translate3d(-5px,2px,0); } 36% { transform: translate3d(5px,-3px,0); } 54% { transform: translate3d(-3px,2px,0); } 72% { transform: translate3d(2px,-1px,0); } }
  #app.v3-transition-shake { animation: v3TransitionShake .78s ease-out 1; }

  .v3-blob-field { position: fixed; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; }
  .v3-blob { position: absolute; border-radius: 50%; filter: blur(36px); opacity: .78; animation: v3Drift 10s ease-in-out infinite; will-change: transform; }
  .v3-blob.b1 { width: 360px; height: 360px; background: #ffcf9e; top: -90px; left: -80px; animation-duration: 10s; }
  .v3-blob.b2 { width: 330px; height: 330px; background: #ffb6c8; bottom: -90px; right: -70px; animation-duration: 11s; animation-delay: -5s; }
  .v3-blob.b3 { width: 270px; height: 270px; background: #ffe29e; top: 38%; right: 3%; animation-duration: 8.5s; animation-delay: -2s; }
  .v3-blob.b4 { width: 250px; height: 250px; background: #ffd0e8; top: 16%; left: 36%; animation-duration: 12s; animation-delay: -8s; }
  .v3-blob.b5 { width: 220px; height: 220px; background: #ffc89a; bottom: 13%; left: 5%; animation-duration: 9s; animation-delay: -4s; }
  .v3-blob.b6 { width: 190px; height: 190px; background: #ffd9b8; top: 54%; left: 20%; animation-duration: 7.5s; animation-delay: -3s; }
  .v3-blob.b7 { width: 170px; height: 170px; background: #fbc8e6; top: 7%; right: 20%; animation-duration: 9.5s; animation-delay: -6s; }
  @keyframes v3Drift {
    0%, 100% { transform: translate(0,0) scale(1) rotate(0deg); }
    25% { transform: translate(34px,-26px) scale(1.09) rotate(3deg); }
    50% { transform: translate(-26px,30px) scale(.94) rotate(-2deg); }
    75% { transform: translate(20px,10px) scale(1.05) rotate(2deg); }
  }

  body.v3-theme {
    background:
      radial-gradient(circle at 15% 20%, rgba(255,214,173,.34), transparent 34%),
      radial-gradient(circle at 85% 72%, rgba(255,184,211,.30), transparent 34%),
      linear-gradient(120deg, #fff6ee, #fff1e8, #fff8ef, #ffefe4);
    background-size: 100% 100%, 100% 100%, 260% 260%;
    animation: v3BgShift 16s ease-in-out infinite;
  }
  @keyframes v3BgShift { 0%,100% { background-position: 0% 0%, 100% 100%, 0% 50%; } 50% { background-position: 10% 8%, 90% 92%, 100% 50%; } }
  body.v3-theme #app { width: 100%; max-width: 620px; min-height: calc(100vh - 48px); display: flex; align-items: center; justify-content: center; }
  body.v3-theme #app > .v3-transition-text,
  body.v3-theme #app > .v3-card { margin-left: auto; margin-right: auto; }

  .v3-card {
    position: relative; z-index: 2;
    background: rgba(255,255,255,.66); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-radius: 28px; padding: 34px 28px; box-shadow: 0 24px 60px -30px rgba(120,80,50,.35);
    max-width: 32rem; width: 100%; margin: 0 auto; animation: v2Materialize .8s cubic-bezier(.2,.8,.3,1);
  }
  .v3-card .q { text-align: center; font-size: clamp(1.3rem, 5vw, 1.7rem); }

  .floaty { animation: v3Bob 2.6s ease-in-out infinite; }
  @keyframes v3Bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

  .v3-transition-text {
    position: relative; z-index: 2;
    font-family: var(--display); font-size: 1.5rem; text-align: center; max-width: 30rem; margin: 0 auto;
    color: var(--ink); line-height: 1.6; padding: 40px 20px;
    opacity: 0;
    animation: v3TextIn .9s ease 6.4s forwards, v3Float 4s ease-in-out 7.3s infinite;
  }
  @keyframes v3TextIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes v3in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes v3Float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes v3out { from { opacity: 1; } to { opacity: 0; } }

  .v3-final-wrap {
    position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    padding: 32px; text-align: center;
    background: linear-gradient(-45deg, #ffb37a, #ff8fa3, #ffd98a, #f7b6d2);
    background-size: 360% 360%;
    animation: sunset 22s ease infinite;
  }
  @keyframes sunset { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
  .v3-final-msg {
    max-width: 34rem; font-family: var(--display); font-size: 1.4rem; line-height: 1.55;
    color: #4a3b34; background: rgba(255,255,255,.72); padding: 30px 26px; border-radius: 18px;
    box-shadow: 0 20px 50px -20px rgba(0,0,0,.35); animation: rise .8s ease;
    position: relative; z-index: 2;
  }

  /* Плавающие окна с вопросами и моими ответами (финал версии III) */
  .v3-float-layer { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
  .v3-win {
    position: absolute; width: min(250px, 46vw); text-align: left; pointer-events: auto; cursor: pointer;
    background: rgba(255,255,255,.62); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.75); border-radius: 16px; overflow: hidden;
    box-shadow: 0 18px 40px -22px rgba(90,50,30,.5);
    color: #4a3b34; font-size: .84rem; line-height: 1.45;
    opacity: 0;
    animation: v3WinIn 1s ease var(--in, 1s) forwards, var(--drift, v3WinDriftA) var(--dur, 16s) ease-in-out var(--delay, 0s) infinite;
    will-change: transform;
  }
  .v3-win-bar {
    display: flex; align-items: center; gap: 8px; padding: 7px 11px;
    background: rgba(255,255,255,.55); border-bottom: 1px solid rgba(224,138,91,.18);
    font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; color: #8d7669;
  }
  .v3-win-bar .dots { display: inline-flex; gap: 4px; }
  .v3-win-bar .dots i { width: 7px; height: 7px; border-radius: 50%; background: #ffb6a0; display: block; }
  .v3-win-bar .dots i:nth-child(2) { background: #ffd98a; }
  .v3-win-bar .dots i:nth-child(3) { background: #bfdcb8; }
  .v3-win-body { padding: 10px 13px 13px; max-height: 30vh; overflow-y: auto; }
  .v3-win-q { margin: 0 0 8px; font-size: .78rem; color: #8d7669; font-style: italic; }
  .v3-win-tag { display: block; margin: 0 0 3px; font-size: .66rem; letter-spacing: .08em; text-transform: uppercase; color: #e08a5b; }
  .v3-win-a { margin: 0; font-family: var(--display); font-size: .98rem; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  .v3-win:hover, .v3-win.front { animation-play-state: running, paused; z-index: 3; background: rgba(255,255,255,.88); box-shadow: 0 24px 50px -18px rgba(90,50,30,.6); }
  .v3-win.front .v3-win-body { max-height: 55vh; }

  .v3-win.w1 { left: 4%;  top: 7%;     --drift: v3WinDriftA; --dur: 17s; --delay: -3s;  --in: .9s; }
  .v3-win.w2 { right: 4%; top: 12%;    --drift: v3WinDriftB; --dur: 19s; --delay: -9s;  --in: 1.5s; }
  .v3-win.w3 { left: 6%;  bottom: 8%;  --drift: v3WinDriftB; --dur: 15s; --delay: -6s;  --in: 2.1s; }
  .v3-win.w4 { right: 5%; bottom: 10%; --drift: v3WinDriftA; --dur: 18s; --delay: -12s; --in: 2.7s; }
  @media (max-width: 640px) {
    .v3-win { width: min(210px, 58vw); font-size: .8rem; }
    .v3-win.w1 { left: 3%;  top: 2%; }
    .v3-win.w2 { right: 3%; top: 15%; }
    .v3-win.w3 { left: 3%;  bottom: 17%; }
    .v3-win.w4 { right: 3%; bottom: 2%; }
    .v3-win-body { max-height: 22vh; }
  }
  @keyframes v3WinIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes v3WinDriftA {
    0%, 100% { transform: translate(0, 0) rotate(-2deg); }
    25% { transform: translate(26px, -18px) rotate(1deg); }
    50% { transform: translate(-14px, 24px) rotate(2deg); }
    75% { transform: translate(-28px, -8px) rotate(-1deg); }
  }
  @keyframes v3WinDriftB {
    0%, 100% { transform: translate(0, 0) rotate(2deg); }
    25% { transform: translate(-24px, 20px) rotate(-1deg); }
    50% { transform: translate(16px, -22px) rotate(-2deg); }
    75% { transform: translate(26px, 10px) rotate(1deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .v3-win { animation: v3WinIn .01s ease forwards !important; }
  }

/* ===================== ПРЕДПОДГОТОВКА АНИМАЦИЙ ===================== */

/* Не задаём will-change: transform всему body: это меняет containing block
   для position:fixed и может сдвигать HUD/оверлеи на мобильных устройствах. */
.crack-overlay,
.crack-line,
.flash-overlay,
.v1-fall-layer,
.v1-falling-copy,
.version-switch-overlay,
.snake-overlay,
.v3-wash {
  will-change: transform, opacity, filter;
}

body.v2-shake-small,
body.v2-shake-medium,
body.v2-shake-large,
body.v2-catastrophe,
body.epic-shake,
body.epic-shake-long {
  will-change: transform, opacity, filter;
}
  

  /* ===================== ПРАВКИ: secret, терминал, пропуск, V3 ===================== */
  /* В покое блок почти не виден; при наведении мыши подсвечиваются все три строки. */
  .final-secret { color: #fbf6ee; cursor: default; word-break: break-word; }
  .final-secret span {
    display: block; padding: 4px 12px; border-radius: 8px;
    border-left: 3px solid transparent; color: #fbf6ee;
    transition: color .35s ease, background-color .35s ease, border-color .35s ease, box-shadow .35s ease;
  }
  .final-secret .sec-line { margin: 8px 0; padding-top: 9px; padding-bottom: 9px; }
  .final-secret:hover span, .final-secret.touch-reveal span {
    color: var(--ink-soft); background: var(--accent-soft); border-left-color: var(--accent);
  }
  .final-secret:hover .sec-line, .final-secret.touch-reveal .sec-line {
    color: var(--accent); font-weight: 700;
    background: linear-gradient(100deg, var(--accent-soft), rgba(224,165,46,.28), var(--accent-soft));
    background-size: 220% 100%;
    animation: secretShimmer 4s linear infinite, secretGlow 2.6s ease-in-out infinite;
  }
  @keyframes secretShimmer { to { background-position: -220% 0; } }
  @keyframes secretGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(123,63,160,0); }
    50% { box-shadow: 0 0 16px 2px rgba(123,63,160,.38); }
  }

  .v3-late { opacity: 0; pointer-events: none; transform: translateY(6px); transition: opacity 1.3s ease, transform 1.3s ease; }
  .v3-late.in { opacity: 1; pointer-events: auto; transform: none; }

  .v2-terminal {
    position: fixed; right: 14px; bottom: 62px; z-index: 24;
    width: min(330px, calc(100vw - 28px));
    font-family: var(--mono); font-size: .68rem; line-height: 1.55;
    color: #b79be0; background: rgba(15,10,23,.93);
    border: 1px solid rgba(130,103,168,.45); border-radius: 8px;
    padding: 6px 10px; pointer-events: none;
  }
  .v2-terminal .t-head { color: #7a5ea3; font-size: .6rem; letter-spacing: .06em; }
  .v2-terminal .t-cur { animation: termBlink 1s steps(2, start) infinite; }
  @keyframes termBlink { to { visibility: hidden; } }
  .v2-terminal .t-log { display: none; margin-top: 5px; }
  .v2-terminal.open .t-log { display: block; }
  .v2-terminal .t-line { white-space: pre-wrap; word-break: break-word; }
  body.v2-reveal-seq .v2-terminal { opacity: 0; animation: v2UiIn .95s cubic-bezier(.16,1,.3,1) 9.3s forwards !important; }
  body.v2-reveal-done .v2-terminal { opacity: 1; animation: none !important; }
  @media (max-width: 640px) { .v2-terminal { bottom: 64px; } }

  .skip-quest {
    position: fixed; left: 50%; bottom: 14px; z-index: 35;
    transform: translateX(-50%);
    padding: 7px 12px; border-radius: 99px; font-size: .72rem;
    background: var(--card); color: var(--ink);
    border: 1px dashed var(--accent);
    box-shadow: 0 8px 18px -10px rgba(0,0,0,.5);
    white-space: nowrap;
  }
  /* ===================== MAMBOMODE ===================== */
  /* Меню — одна карточка внизу слева: шапочка с ушами надета сразу,
     по клику карточка сама раскрывается вверх и сворачивается обратно.
     Палитра взята с арта персонажа: синий берет, золотые глаза, красный корсет,
     тёмно-синяя юбка, тёплые коричневые кожа/сапоги и кремовая блузка. */
  body { --mambo-bottom: 14px; }
  @media (max-width: 640px) {
    body { --mambo-bottom: 58px; }            /* над таймером по центру */
    body.v2-theme { --mambo-bottom: 104px; }  /* и над терминалом версии II */
  }
  .mambo-menu {
    --mb-font: 'Lilita One', 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
    --mb-card: #fff7e6;      /* кремовая блузка */
    --mb-line: #ecd5a0;
    --mb-text: #4a3226;      /* кожа сапог и ремней */
    --mb-soft: #8a7058;
    --mb-navy: #2b3a7a;      /* юбка */
    --mb-blue: #6f84d6;      /* берет */
    --mb-red: #b23a48;       /* корсет */
    --mb-gold: #e3a22c;      /* глаза */
    --mb-g1: #2b3a7a; --mb-g2: #5f78d8; --mb-g3: #b23a48; --mb-g4: #cf8f17;
    --mb-shadow: rgba(74,50,38,.45);
    position: fixed; left: 14px; bottom: var(--mambo-bottom); z-index: 45;
    width: 214px; font-family: var(--body);
    transition: width .4s cubic-bezier(.2,.8,.2,1);
  }
  /* Версия II тёмная: карточка становится ночной, шрифт и градиент светлеют. */
  body.v2-theme .mambo-menu {
    --mb-card: #1d2147; --mb-line: #3d4784;
    --mb-text: #f6ead2; --mb-soft: #aeb6e6;
    --mb-navy: #9fb0ff; --mb-blue: #8fa2f0; --mb-red: #ff8f9a; --mb-gold: #ffd36b;
    --mb-g1: #9fb0ff; --mb-g2: #ffd36b; --mb-g3: #ff8f9a; --mb-g4: #c4d0ff;
    --mb-shadow: rgba(0,0,0,.6);
  }
  .mambo-menu.open { width: min(268px, calc(100vw - 28px)); }
  .mambo-menu.mambo-fading-out { z-index: 96 !important; pointer-events: none !important; animation: mamboMenuFadeOut .66s cubic-bezier(.4,0,.2,1) forwards !important; }
  @keyframes mamboMenuFadeOut {
    from {
      opacity: var(--mambo-exit-opacity, 1);
      transform: var(--mambo-exit-transform, translateY(0) scale(1));
      filter: var(--mambo-exit-filter, blur(0));
    }
    to { opacity: 0; transform: translateY(9px) scale(.97); filter: blur(4px); }
  }
  /* Mambomode остаётся видимым и в версии II, включая заставку перехода. */

  /* Раскладка служебных кнопок: навигация и пропуск квеста остаются снизу. */
  body.has-mambo:not(.v3-theme) .skip-quest {
    left: 50%; bottom: 14px; transform: translateX(-50%);
  }

  .mambo-card {
    position: relative;
    background: var(--mb-card); color: var(--mb-text);
    border: 1.5px solid var(--mb-line); border-radius: 18px;
    box-shadow: 0 14px 30px -20px var(--mb-shadow);
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .mambo-menu.open .mambo-card { box-shadow: 0 18px 40px -22px var(--mb-shadow); }
  .mambo-card:hover { border-color: var(--mb-gold); }

  /* Шапочка с ушками — всегда на карточке, и в свёрнутом, и в раскрытом виде. */
  .mambo-hat {
    position: absolute; left: 62px; top: -46px; z-index: 2;
    width: 104px; height: 66px; transform: translateX(-50%);
    pointer-events: none;
  }
  .mambo-hat svg { width: 100%; height: 100%; display: block; overflow: visible; }

  .mambo-head {
    position: relative; display: flex; align-items: center; justify-content: center;
    width: 100%; padding: 15px 28px 10px; cursor: pointer;
    background: none; border: 0; border-radius: 18px; color: inherit; font: inherit;
  }
  .mambo-head .mambo-dot {
    position: absolute; left: 13px; top: 50%; margin-top: -4px;
    width: 8px; height: 8px; border-radius: 50%; background: var(--mb-soft); opacity: .6;
    transition: background .2s ease, box-shadow .2s ease, opacity .2s ease;
  }
  .mambo-menu.on .mambo-dot { background: var(--mb-gold); opacity: 1; box-shadow: 0 0 8px color-mix(in srgb, var(--mb-gold) 70%, transparent); }
  .mambo-head .mambo-chev {
    position: absolute; right: 12px; top: 50%; margin-top: -6px;
    width: 12px; height: 12px; color: var(--mb-soft);
    transition: transform .4s cubic-bezier(.2,.8,.2,1), color .2s ease;
  }
  .mambo-head:hover .mambo-chev { color: var(--mb-red); }
  .mambo-menu.open .mambo-chev { transform: rotate(180deg); }

  /* Надпись: шрифт и цвета подобраны под персонажа.
     В свёрнутом виде она спокойная, переливается и подпрыгивает только при открытом меню. */
  .mambo-title {
    font-family: var(--mb-font); font-weight: 400; font-size: 1.22rem; letter-spacing: .07em;
    color: var(--mb-g1); text-align: center; white-space: nowrap; width: 100%; line-height: 1.15;
  }
  .mambo-letter {
    display: inline-block; transform-origin: 50% 80%;
    color: var(--mb-g1);
    background-image: linear-gradient(90deg, var(--mb-g1), var(--mb-g2), var(--mb-g3), var(--mb-g4), var(--mb-g1));
    background-size: 130px 100%; background-repeat: repeat-x;
    background-position-x: calc(var(--i, 0) * -15px);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    filter: drop-shadow(0 1px 0 color-mix(in srgb, var(--mb-card) 70%, transparent));
  }
  .mambo-menu.open .mambo-letter {
    animation: mamboLetterWave 1.7s ease-in-out infinite, mamboShimmer 3.4s linear infinite;
    animation-delay: calc(var(--i, 0) * 120ms - 1700ms), 0s;
  }
  @keyframes mamboShimmer {
    from { background-position-x: calc(var(--i, 0) * -15px); }
    to   { background-position-x: calc(var(--i, 0) * -15px + 130px); }
  }

  /* Тело карточки: плавно раскрывается по высоте. */
  .mambo-body {
    display: grid; grid-template-rows: 0fr; opacity: 0;
    transition: grid-template-rows .4s cubic-bezier(.2,.8,.2,1), opacity .25s ease;
  }
  .mambo-menu.open .mambo-body { grid-template-rows: 1fr; opacity: 1; }
  .mambo-body-clip { overflow: hidden; min-height: 0; visibility: hidden; transition: visibility 0s linear .4s; }
  .mambo-menu.open .mambo-body-clip { visibility: visible; transition-delay: 0s; }
  .mambo-body-in { padding: 2px 16px 16px; text-align: center; }

  .mambo-switch {
    display: block; margin: 6px auto 14px; width: 128px; padding: 6px 0 5px;
    background: color-mix(in srgb, var(--mb-gold) 22%, var(--mb-card)); color: var(--mb-navy);
    border: 1.5px solid var(--mb-line); border-radius: 999px;
    font-family: var(--mb-font); font-weight: 400; letter-spacing: .06em; font-size: 1.4rem; cursor: pointer;
    transition: background .2s ease, color .2s ease, border-color .2s ease, transform .15s ease;
  }
  .mambo-menu.on .mambo-switch { background: var(--mb-red); color: #fff7e6; border-color: var(--mb-red); }
  body.v2-theme .mambo-menu.on .mambo-switch { color: #2a1a2e; }
  .mambo-vol {
    display: grid; grid-template-columns: 58px 1fr; align-items: center; gap: 8px;
    font-size: .78rem; font-weight: 600; color: var(--mb-soft); text-align: left;
  }
  .mambo-vol + .mambo-vol { margin-top: 9px; }
  .mambo-vol input { width: 100%; min-width: 0; accent-color: var(--mb-red); }
  .mambo-vol ~ .mambo-vol input { accent-color: var(--mb-blue); }

  /* ---------- Первое появление: вспышка в углу, из которой «вытекает» меню ----------
     0.0–0.4 c  искра собирается (заряд)       0.4 c  яркая вспышка (пик)
     0.4–1.7 c  карточка расходится от угла    0.95 c на неё «надевается» кепка */
  .mambo-flash { position: fixed; left: 36px; bottom: calc(var(--mambo-bottom) + 22px); width: 0; height: 0; z-index: 46; pointer-events: none; }
  .mambo-flash i { position: absolute; left: 0; top: 0; display: block; border-radius: 50%; }
  .mambo-flash .core {
    width: 130px; height: 130px; margin: -65px 0 0 -65px;
    background: radial-gradient(circle, #fff 0 14%, #fff7cf 25%, rgba(255,214,102,.96) 42%, rgba(255,150,70,.5) 62%, rgba(255,110,60,0) 72%);
    animation: mamboFlashCore 1.5s cubic-bezier(.2,.7,.2,1) both;
  }
  .mambo-flash .rays {
    width: 300px; height: 300px; margin: -150px 0 0 -150px;
    background: repeating-conic-gradient(from 0deg, rgba(255,242,190,.95) 0 5deg, rgba(255,242,190,0) 5deg 22deg);
    -webkit-mask-image: radial-gradient(circle, #000 0, rgba(0,0,0,.65) 35%, transparent 70%);
            mask-image: radial-gradient(circle, #000 0, rgba(0,0,0,.65) 35%, transparent 70%);
    animation: mamboFlashRays 1.5s ease-out both;
  }
  .mambo-flash .ring {
    width: 90px; height: 90px; margin: -45px 0 0 -45px; border: 3px solid rgba(255,226,140,.95);
    box-shadow: 0 0 18px 3px rgba(255,200,90,.75), inset 0 0 14px rgba(255,230,150,.6);
    animation: mamboFlashRing 1.15s ease-out .38s both;
  }
  .mambo-dim {
    position: fixed; inset: 0; z-index: 44; pointer-events: none;
    background: radial-gradient(circle at 36px calc(100% - var(--mambo-bottom) - 22px), rgba(24,14,44,0) 0, rgba(24,14,44,.24) 78%);
    animation: mamboDim 1.7s ease-out both;
  }
  @keyframes mamboFlashCore {
    0%   { transform: scale(.05); opacity: 0; }
    16%  { transform: scale(.42); opacity: .95; }
    27%  { transform: scale(1.2); opacity: 1; }
    55%  { transform: scale(2.3); opacity: .72; }
    100% { transform: scale(3.4); opacity: 0; }
  }
  @keyframes mamboFlashRays {
    0%   { transform: scale(.15) rotate(0deg); opacity: 0; }
    27%  { transform: scale(.8) rotate(14deg); opacity: .95; }
    100% { transform: scale(1.35) rotate(55deg); opacity: 0; }
  }
  @keyframes mamboFlashRing {
    0%   { transform: scale(.2); opacity: 0; }
    10%  { opacity: 1; }
    100% { transform: scale(4.4); opacity: 0; }
  }
  @keyframes mamboDim { 0% { opacity: 0; } 14% { opacity: 1; } 100% { opacity: 0; } }

  .mambo-menu.intro-pop .mambo-card { animation: mamboCardFlow 1.35s cubic-bezier(.2,.75,.15,1) .36s both; }
  .mambo-menu.intro-pop .mambo-hat { transform-origin: 50% 100%; animation: mamboHatPop .7s cubic-bezier(.2,1.4,.4,1) .95s both; }
  @keyframes mamboCardFlow {
    0%   { clip-path: circle(0px at 22px calc(100% - 22px)); filter: brightness(3.2) saturate(.4); }
    55%  { filter: brightness(1.7) saturate(1.1); }
    100% { clip-path: circle(165% at 22px calc(100% - 22px)); filter: brightness(1) saturate(1); }
  }
  @keyframes mamboHatPop {
    0%   { opacity: 0; transform: translateX(-50%) translateY(14px) scale(.3) rotate(-14deg); }
    100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1) rotate(0deg); }
  }
  /* Плавная волна: буквы мягко качаются вверх-вниз, каждая следующая чуть позже предыдущей. */
  @keyframes mamboLetterWave {
    0%, 100% { transform: translateY(2px); }
    50% { transform: translateY(-3px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .mambo-menu, .mambo-body, .mambo-body-clip, .mambo-chev { transition: none !important; }
    .mambo-menu.intro-pop .mambo-card, .mambo-menu.intro-pop .mambo-hat { animation: none !important; }
    .mambo-flash, .mambo-dim { display: none !important; }
    .mambo-menu.open .mambo-letter { animation: none !important; }
  }

  /* ушки: бодрые при ON, опущенные при OFF */
  .mambo-ear { transform-box: fill-box; transform-origin: 50% 100%; transition: transform .35s ease; }
  .mambo-menu:not(.on) .mambo-ear.l { transform: rotate(-16deg); }
  .mambo-menu:not(.on) .mambo-ear.r { transform: rotate(16deg); }
  .mambo-menu.on .mambo-ear.l { animation: mamboEarL 1.4s ease-in-out infinite; }
  .mambo-menu.on .mambo-ear.r { animation: mamboEarR 1.4s ease-in-out infinite .35s; }
  .mambo-menu.bump .mambo-ear.l { animation: mamboBump .22s ease; }
  .mambo-menu.bump .mambo-ear.r { animation: mamboBump .22s ease; }
  @keyframes mamboEarL { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-9deg); } }
  @keyframes mamboEarR { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(9deg); } }
  @keyframes mamboBump { 0% { transform: rotate(0deg); } 50% { transform: rotate(-14deg) scale(1.08); } 100% { transform: rotate(0deg); } }

  /* iOS: запрос на включение звука */
  .ios-sound { position: fixed; inset: 0; z-index: 99990; display: flex; align-items: flex-end; justify-content: center;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); background: rgba(20,12,28,.55); font-family: system-ui, sans-serif; }
  .ios-sound-card { width: min(420px, 100%); background: #fff; color: #2f2038; border-radius: 18px; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,.4); }
  .ios-sound-card h3 { margin: 0 0 8px; font-size: 1.15rem; }
  .ios-sound-card p { margin: 0 0 14px; font-size: .92rem; line-height: 1.5; color: #4a3b56; }
  .ios-sound-row { display: flex; gap: 10px; }
  .ios-sound-row button { flex: 1; }

  /* ===================== ТЕЛЕФОНЫ: облегчённые эффекты ===================== */
  /* Те же анимации, но без blur/brightness/box-shadow в кадрах, без mix-blend и backdrop-filter. */
  @media (pointer: coarse), (max-width: 640px) {
    @keyframes v2Materialize {
    0% { opacity: 0; transform: scale(.92) translateY(16px);  }
    60% {  }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
    @keyframes v2ShakeLarge {
    0%,100% { transform: translate(0,0) rotate(0) scale(1);  }
    10% { transform: translate(-12px,7px) rotate(-.5deg) scale(1.002);  }
    22% { transform: translate(10px,-9px) rotate(.55deg) scale(.998); }
    34% { transform: translate(-15px,4px) rotate(-.58deg) scale(1.003);  }
    46% { transform: translate(14px,10px) rotate(.52deg) scale(.998); }
    58% { transform: translate(-11px,-8px) rotate(-.48deg) scale(1.004);  }
    70% { transform: translate(16px,5px) rotate(.6deg) scale(.997); }
    82% { transform: translate(-9px,8px) rotate(-.42deg) scale(1.003);  }
  }
    @keyframes v2UiIn {
    0% { opacity: 0; transform: translateY(14px) scale(.94);  clip-path: inset(0 38% 0 38%); }
    58% { opacity: .92; transform: translateY(-2px) scale(1.015);  clip-path: inset(0 0 0 0); }
    78% { transform: translateY(1px) scale(.997); }
    100% { opacity: 1; transform: none;  clip-path: inset(0 0 0 0); }
  }
    @keyframes v2TelemetryIn {
    0% { opacity: 0; transform: translateX(26px) scaleX(.55);  }
    40% { opacity: .75; transform: translateX(-4px) scaleX(1.03);  }
    70% { transform: translateX(3px); }
    100% { opacity: 1; transform: none;  }
  }
    @keyframes v2WaveIn {
    0% { opacity: 0; transform: translateX(-50%) translateY(16px) scale(.75);  }
    35% { opacity: 1; transform: translateX(-50%) translateY(-3px) scale(1.08);  }
    55% { transform: translateX(-50%) translateY(2px) scale(.98); }
    100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1);  }
  }
    @keyframes v2TopbarIn {
    0% { opacity: 0; transform: translateY(-22px) scaleY(.7);  }
    45% { opacity: 1; transform: translateY(3px) scaleY(1.04);  }
    65% { transform: translateY(-2px) scaleY(.99); }
    100% { opacity: 1; transform: none;  }
  }
    @keyframes v2CardIn {
    0% { opacity: 0; transform: perspective(900px) rotateX(7deg) scale(.78) translateY(45px);   }
    35% { opacity: .45; transform: perspective(900px) rotateX(-2deg) scale(.98) translateY(-8px);   }
    62% { opacity: 1; transform: perspective(900px) rotateX(1deg) scale(1.025) translateY(2px);   }
    78% { transform: perspective(900px) rotateX(0) scale(.997); }
    100% { opacity: 1; transform: perspective(900px) rotateX(0) scale(1);   }
  }
    @keyframes v2TextIn {
    0% { opacity: 0; transform: translateY(18px) scale(.96);  }
    55% { opacity: 1; transform: translateY(-3px) scale(1.015);  }
    100% { opacity: 1; transform: none;  }
  }
    @keyframes v2ButtonIn {
    0% { opacity: 0; transform: translateY(16px) scale(.82);  }
    45% { opacity: 1; transform: translateY(-5px) scale(1.08);  }
    68% { transform: translateY(2px) scale(.98); }
    100% { opacity: 1; transform: none;  }
  }
    @keyframes v1OvalFall {
    0% {
      opacity: 1;
      transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
      
    }
    16% {
      opacity: 1;
      transform: translate3d(var(--fall-x1), var(--fall-y1), 0) rotate(calc(var(--fall-rotate) * -.18)) scale(1.015);
      
    }
    32% {
      opacity: 1;
      transform: translate3d(var(--fall-x2), var(--fall-y2), 0) rotate(calc(var(--fall-rotate) * -.35)) scale(1.025);
      
    }
    48% {
      opacity: .995;
      transform: translate3d(var(--fall-x3), var(--fall-y3), 0) rotate(calc(var(--fall-rotate) * .05)) scale(1.01);
      
    }
    64% {
      opacity: .985;
      transform: translate3d(var(--fall-x4), var(--fall-y4), 0) rotate(calc(var(--fall-rotate) * .5)) scale(.98);
      
    }
    82% {
      opacity: .97;
      transform: translate3d(var(--fall-x5), var(--fall-y5), 0) rotate(calc(var(--fall-rotate) * .78)) scale(.95);
      
    }
    100% {
      opacity: .92;
      transform: translate3d(var(--fall-x6), var(--fall-distance), 0) rotate(var(--fall-rotate)) scale(.9);
      
    }
  }
    @keyframes versionSwitchOut {
    0% { opacity: 1; transform: scale(1) rotate(0deg);  }
    38% { opacity: .92; transform: scale(.985) rotate(-.25deg);  }
    72% { opacity: .48; transform: scale(.965) rotate(.45deg);  }
    100% { opacity: 0; transform: scale(.91) rotate(-.7deg);  }
  }
    @keyframes versionSwitchIn {
    0% { opacity: 0; transform: scale(1.055) translateY(10px);  }
    28% { opacity: .65; transform: scale(1.018) translateY(2px);  }
    64% { opacity: 1; transform: scale(.998) translateY(0);  }
    100% { opacity: 1; transform: scale(1) translateY(0);  }
  }
    @keyframes snakeOverlayIn {
    from { opacity: 0; transform: scale(.965);  }
    60% { opacity: 1; transform: scale(1.012);  }
    to { opacity: 1; transform: scale(1);  }
  }
    @keyframes snakeOverlayOut {
    from { opacity: 1; transform: scale(1);  }
    100% { opacity: 0; transform: scale(.985);  }
  }
    @keyframes secretGlow {
    0%, 100% {  }
    50% {  }
  }
    @keyframes mamboMenuFadeOut {
    from {
      opacity: var(--mambo-exit-opacity, 1);
      transform: var(--mambo-exit-transform, translateY(0) scale(1));
      
    }
    to { opacity: 0; transform: translateY(9px) scale(.97);  }
  }
    @keyframes mamboCardFlow {
    0%   { clip-path: circle(0px at 22px calc(100% - 22px));  }
    55%  {  }
    100% { clip-path: circle(165% at 22px calc(100% - 22px));  }
  }
    body.v2-theme::before { mix-blend-mode: normal; opacity: .55; }
    body.v2-catastrophe::after { mix-blend-mode: normal; }
    .version-switch-overlay { backdrop-filter: none; -webkit-backdrop-filter: none; }
    .v3-card { backdrop-filter: none; -webkit-backdrop-filter: none; background: rgba(255,255,255,.84); }
    .v3-win { backdrop-filter: none; -webkit-backdrop-filter: none; background: rgba(255,255,255,.82); }
    .v3-blob { filter: blur(24px); }
    body.v3-theme { animation: none; }
    /* Закат: вместо анимации background-position (перерисовка каждый кадр) двигаем слой градиента через transform. */
    .v3-final-wrap { animation: none; background: #ffb9a0; overflow: hidden; }
    .v3-final-wrap::before {
      content: ''; position: absolute; inset: -50%; z-index: 0;
      background: linear-gradient(-45deg, #ffb37a, #ff8fa3, #ffd98a, #f7b6d2);
      animation: sunsetMove 22s ease-in-out infinite alternate; will-change: transform;
    }
    @keyframes sunsetMove { from { transform: translate3d(-9%, 0, 0) rotate(0deg); } to { transform: translate3d(9%, 0, 0) rotate(10deg); } }
  }

  /* ===================== ТИТРЫ ===================== */
  @keyframes creditsIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes creditsOut { from { opacity: 1; } to { opacity: 0; } }
  .v3-final-col { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; max-width: 34rem; }
  .v3-final-thanks { font-family: var(--display); font-weight: 700; font-size: 1.05rem; letter-spacing: .02em; color: #4a3b34; margin-bottom: 14px; opacity: .9; animation: rise .8s ease; }
  .credits-screen {
    position: fixed; inset: 0; z-index: 90000; background: #07050c; color: #f3eaff;
    display: flex; flex-direction: column; align-items: center;
    padding-top: env(safe-area-inset-top, 0px); animation: creditsIn 1.2s ease both;
  }
  .credits-video { flex: none; width: 100%; max-width: 920px; padding: 14px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; position: relative; transition: opacity 1.2s ease; }
  .credits-video video { display: block; max-width: 100%; max-height: 46vh; background: #000; border-radius: 18px; overflow: hidden; box-shadow: 0 16px 44px -18px rgba(0,0,0,.85); }
  .credits-play { position: absolute; background: rgba(255,255,255,.92); color: #2f2038; border-radius: 99px; padding: 14px 26px; font-size: 1.05rem; }
  .credits-view {
    position: relative; flex: 1; width: min(640px, 100%); overflow: hidden; transition: opacity 1.2s ease;
    -webkit-mask-image: linear-gradient(transparent, #000 14%, #000 86%, transparent);
    mask-image: linear-gradient(transparent, #000 14%, #000 86%, transparent);
  }
  .credits-roll { position: absolute; top: 100%; left: 0; right: 0; text-align: center; padding: 0 22px 40px; will-change: transform; }
  .c-title { font-family: var(--display); font-size: clamp(1.6rem, 6vw, 2.2rem); font-weight: 700; margin-bottom: 8px; }
  .c-sub { color: #b6a0cf; font-size: .95rem; }
  .c-role { margin-top: 52px; font-size: .74rem; letter-spacing: .2em; text-transform: uppercase; color: #b6a0cf; }
  .c-name { margin-top: 6px; font-family: var(--display); font-size: clamp(1.15rem, 4.6vw, 1.45rem); line-height: 1.35; }
  .c-end { margin-top: 64px; font-family: var(--display); font-size: 1.3rem; color: #e8d6ff; }
  .credits-screen .out { opacity: 0; }
  .credits-skip {
    position: absolute; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 3;
    background: rgba(255,255,255,.12); color: #e8d6ff; border-radius: 99px; padding: 8px 16px; font-size: .82rem;
  }

  /* Доступность: при системной настройке reduced motion убираем интенсивные движения и вспышки. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      scroll-behavior: auto !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      transition-delay: 0ms !important;
      caret-color: auto !important;
    }
    .glitch, .screen-shake, .shake, .flash, .v2-flash, .transition-flash,
    .v3-glitch, .mambo-flash, .mambo-dim { animation: none !important; }
  }

  /* Глобальная система подсказок Версии II — компактная раскрывающаяся панель */
  .v2-hints-panel {
    margin: 12px 0 14px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 13px;
    background: linear-gradient(145deg, rgba(123,63,160,.055), rgba(224,165,46,.06));
    overflow: hidden;
  }
  .v2-hints-toggle {
    width: 100%; min-width: 0; display: flex; align-items: center; justify-content: space-between;
    gap: 9px; padding: 11px 13px; border: 0; border-radius: 0; background: transparent;
    color: var(--ink); cursor: pointer; text-align: left; font: inherit;
  }
  .v2-hints-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
  .v2-hints-toggle-title { font-weight: 850; letter-spacing: .055em; font-size: .82rem; }
  .v2-hints-toggle-meta { margin-left: auto; color: var(--ink-soft); font-size: .78rem; white-space: nowrap; }
  .v2-hints-chevron { flex: none; color: var(--accent); font-size: 1rem; transition: transform .2s ease; }
  .v2-hints-panel.open .v2-hints-chevron { transform: rotate(180deg); }
  .v2-hints-content { padding: 0 13px 14px; }
  .v2-hints-title { font-weight: 800; letter-spacing: .06em; font-size: .86rem; margin: 0; }
  .v2-hints-subtitle { margin: 2px 0 0; color: var(--ink-soft); font-size: .85rem; line-height: 1.45; }
  .v2-hints-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; margin-top: 13px; }
  .v2-hint-tile { min-width: 0; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
  .v2-hint-tile h3 { font-size: 1rem; margin: 0; }
  .v2-hint-cost { color: var(--ink-soft); font-size: .78rem; margin: 5px 0 10px; }
  .v2-hint-button { width: 100%; padding: 9px 10px; font-size: .84rem; line-height: 1.3; }
  .v2-hint-button:disabled { opacity: .48; cursor: not-allowed; }
  .v2-hint-text { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; margin: 11px 0 0; font-size: .92rem; }
  .v2-hint-opener { color: var(--ink-soft); font-size: .78rem; margin: 9px 0 0; }
  .v2-hint-open-mark { display: inline-flex; align-items: center; gap: 5px; color: var(--ok); font-size: .8rem; font-weight: 800; }
  .v2-hint-mechanics-toggle { margin-top: 13px; padding: 8px 0; font-size: .84rem; color: var(--accent); text-align: left; }
  .v2-hint-mechanics { margin-top: 2px; padding: 10px 12px; border-radius: 10px; background: rgba(123,63,160,.06); border: 1px solid var(--line); }
  .v2-hint-mechanics[hidden] { display: none !important; }
  .v2-hint-explanation { margin: 0; color: var(--ink-soft); font-size: .82rem; line-height: 1.5; }
  .v2-hint-loading { padding: 13px 0 0; color: var(--ink-soft); font-size: .88rem; }
  .v2-hint-modal-overlay { position: fixed; inset: 0; z-index: 10050; display: flex; align-items: center; justify-content: center; padding: 18px; background: rgba(18,12,24,.68); backdrop-filter: blur(4px); }
  .v2-hint-dialog { width: 100%; max-width: 430px; padding: 23px; border-radius: 17px; border: 1px solid var(--line); background: var(--card); color: var(--ink); box-shadow: 0 24px 80px rgba(0,0,0,.28); }
  .v2-hint-dialog h2 { margin-bottom: 10px; }
  .v2-hint-dialog p { line-height: 1.55; margin: 0 0 12px; }
  .v2-hint-dialog .row { margin-top: 18px; }
  .v2-hint-dialog-status { color: var(--bad); font-size: .88rem; min-height: 1.2em; }

  /* Встроенная механика II-3 «Рассинхронизация». */
  .v2-sync-challenge {
    margin: 13px 0 15px; padding: 12px; border: 1px solid var(--line); border-radius: 12px;
    background: linear-gradient(145deg, rgba(123,63,160,.055), rgba(224,165,46,.045));

(function () {
  var shown = false;
  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }

  window.__showFatal = function (title, details) {
    if (shown) return;
    shown = true;
    var o = document.createElement('div');
    o.setAttribute('style', 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:rgba(20,12,28,.82);display:flex;align-items:center;justify-content:center;padding:20px;font-family:system-ui,sans-serif;');
