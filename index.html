function renderIntro() {
  const card = el('div', 'card');
  card.appendChild(el('h1', null, 'Привет!'));
  card.appendChild(el('p', 'lead', 'Представляю тебе небольшой интерактивный опросик в честь моего 20-летия.'));
  card.appendChild(el('p', 'lead', 'Надеюсь, тебе понравится!'));

  const label = el('label', 'field');
  label.appendChild(el('span', 'hint', 'Как тебя записать? (ник)'));
  const input = el('input');
  input.type = 'text';
  input.placeholder = 'Твой ник';
  input.style.marginTop = '8px';
  input.dataset.nickField = '1';
  label.appendChild(input);
  card.appendChild(label);

  const note = el('p', 'hint');
  card.appendChild(note);

  const btn = el('button', 'primary wide', 'Начать');
  btn.style.marginTop = '18px';
  btn.disabled = true;
  card.appendChild(btn);

  let prefetchTimer = null;
  input.addEventListener('input', () => {
    const v = input.value.trim();
    btn.disabled = v.length === 0;
    clearTimeout(prefetchTimer);
    if (v.length >= 2) prefetchTimer = setTimeout(() => { void prefetchServerProgress(v); }, 900);
    const saved = v ? loadProgress(v) : null;
    note.textContent = saved
      ? 'С этим ником уже есть прогресс, продолжим с того же места.'
      : 'По нику сохраняется прогресс: сможешь вернуться и продолжить.';
  });

  async function start() {
    const v = input.value.trim();
    if (!v || btn.disabled) return;

    if (tight(v) === 'kreazot316') {
      app.innerHTML = '';
    
      const errorCard = el('div', 'card');
      errorCard.appendChild(el('h1', null, 'Ошибка'));
      errorCard.appendChild(el(
        'p',
        'lead',
        'MS8g0KTQuNC+0LvQtdGC0L7QstGL0LkK: Моё имя брать нельзя ;P'
      ));
    
      app.appendChild(errorCard);
      return;
    }
    
    btn.disabled = true;
    note.textContent = 'Загружаем данные…';

    const localSaved = loadProgress(v);
    const dirtyAtStart = isDirty(v);

    // Запрос прогресса стартует сразу и идёт параллельно с банком вопросов
    // (часто он уже готов — его запускает ввод ника).
    const serverP = prefetchServerProgress(v);

    if (!await loadQuestionBank()) {
      note.textContent = 'Не удалось загрузить данные квеста. Проверь подключение к серверу.';
      btn.disabled = false;
      return;
    }

    let serverSaved;
    if (localSaved) {
      // Есть локальный прогресс: ждём сервер недолго. Не успел — стартуем с локального,
      // а сверку с сервером доделаем в фоне.
      serverSaved = await Promise.race([serverP, new Promise(r => setTimeout(() => r(undefined), 2500))]);
    } else {
      note.textContent = 'Ищем твой прогресс…';
      serverSaved = await serverP;
    }
    const stillPending = serverSaved === undefined;
    const serverFailed = stillPending || !!(serverSaved && serverSaved.__error);

    if (serverFailed && !localSaved) {
      // Не знаем, есть ли у игрока прогресс на сервере — не создаём «нового», чтобы его не затереть.
      note.textContent = 'Не удаётся связаться с сервером, чтобы проверить твой прогресс. Проверь интернет и попробуй ещё раз.';
      btn.disabled = false;
      return;
    }

    S.nick = v;
    v1LogLoad(v);
    void flushV1Log(false); // догоняем журнал прошлой сессии, если он остался
    if (serverFailed) {
      // Сервер пока не ответил, но на устройстве есть сохранение — продолжаем с него.
      applyProgress(localSaved);
    } else if (serverSaved && serverSaved.state) {
      const srv = serverSaved.state;
      const localIsAhead = !!localSaved && progressRouteStage(localSaved) > progressRouteStage(srv);
      if (localIsAhead) {
        // Не откатываем локальный прогресс назад, если старый запрос с сервера
        // пришёл позже (особенно II-5 → III или переходная заставка → III-вопросы).
        applyProgress(localSaved);
        void syncPlayerToServer('resume-local-ahead');
      } else if (localSaved && dirtyAtStart && (Number(localSaved.updatedAt) || 0) >= (Number(srv.updatedAt) || 0)) {
        // Прошлое сохранение не успело уйти на сервер — локальная версия новее.
        applyProgress(localSaved);
        void syncPlayerToServer('resume-local');
      } else {
        // Сервер — основной источник истины при наличии записи.
        applyProgress(srv);
      }
    } else if (localSaved) {
      // Первый запуск новой серверной версии: переносим старый localStorage на сервер (в фоне).
      applyProgress(localSaved);
      void syncPlayerToServer('migration');
    } else {
      S.index = 0;
      S.answers = {};
      S.unlocked = false;
      S.v2Index = 0;
      S.v2Answers = {};
      S.preodolevatelPoints = 0;
      S.preodolevatelPassed = false;
      S.v3Index = 0;
      S.v3Answers = [];
      S.timerRevealed = false;
      S.termSeen = [];
      S.questionNavUnlocked = false;
      S.screen = 'quiz';
      saveProgress();
      void syncPlayerToServer('created'); // запись нового игрока — в фоне, квест не ждёт
    }

    render();

    if (stillPending && !dirtyAtStart) {
      // Сервер ответил уже после старта: если там прогресс новее (играли с другого устройства) — предложим его.
      serverP.then(res => {
        if (!res || res.__error || !res.state || S.nick !== v) return;
        const srvAt = Number(res.state.updatedAt) || 0;
        if (srvAt > (Number(localSaved.updatedAt) || 0)) offerServerProgress(res.state);
      });
    }
  }

  function offerServerProgress(srvState) {
    const box = document.createElement('div');
    box.setAttribute('style', 'position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:99991;background:rgba(40,28,52,.96);color:#fff;font:13px/1.35 system-ui,sans-serif;padding:10px 14px;border-radius:14px;max-width:92vw;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center');
    const t = document.createElement('span');

    box.appendChild(t);
    const mk = (label, primary, fn) => {
      const b = document.createElement('button');
      b.textContent = label;
      b.setAttribute('style', 'border:0;border-radius:99px;padding:6px 12px;font-size:12.5px;cursor:pointer;' + (primary ? 'background:#7b3fa0;color:#fff' : 'background:#efe2f7;color:#7b3fa0'));
      b.addEventListener('click', () => { box.remove(); fn(); });
      box.appendChild(b);
    };
    mk('Загрузить', true, () => { applyProgress(srvState); saveProgress(); render(); });
    mk('Остаться', false, () => {});
    document.body.appendChild(box);
  }

  btn.addEventListener('click', start);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') start(); });

  app.appendChild(card);
  input.focus();
}

function buildText(q, body, card) {
  const free = q.kind === 'free';
  const st = slot(q.n);

  const label = el('label', 'field');
  const input = el(free ? 'textarea' : 'input');
  if (!free) input.type = 'text';
  input.placeholder = free ? 'Пиши что угодно…' : 'Твой ответ…';
  input.value = st.value || '';
  label.appendChild(input);
  body.appendChild(label);

  const row = el('div', 'row');
  const answerBtn = el('button', 'ghost', 'Ответить');
  row.appendChild(answerBtn);
  body.appendChild(row);

  const out = el('div');
  body.appendChild(out);

  if (q.extra === 'ad' && st.adUnlocked) mountAd(card, st);

  function showVerdict() {
    out.innerHTML = '';
    if (st.lastCorrect === undefined) return;
    if (st.lastCorrect) {
      const html = q.okHtml || (q.ok ? q.ok() : 'Правильно!');
      out.appendChild(verdict(free ? 'neutral' : 'ok', html));
    } else {
      out.appendChild(verdict('bad', q.bad ? q.bad() : 'Неправильно!'));
    }
    if (st.codeShown) out.appendChild(el('div', 'codebox', st.codeShown));
  }

  function submit() {
    const v = input.value;
    st.value = v;
    let correct = true;

    if (free) {
      if (!v.trim()) return;
      st.lastCorrect = true;
      st.passed = true;
      SFX.correctV1();
    } else {
      correct = !!q.check(v);
      st.lastCorrect = correct;
      if (correct) { st.passed = true; SFX.correctV1(); }
      else SFX.wrongV1();
    }

    if (q.extra === 'ad' && !st.adUnlocked) {
      st.adUnlocked = true;
      mountAd(card, st);
    }
    if (!row.contains(nextBtn)) row.appendChild(nextBtn);
    showVerdict();
    saveProgress();
    void recordV1Answer(q.n, v, correct, st.passed);
  }

  const nextBtn = nextButton();
  answerBtn.addEventListener('click', submit);
  if (!free) input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });

  if (st.lastCorrect !== undefined) { row.appendChild(nextBtn); showVerdict(); }
}

function buildSports(q, body) {
  const st = slot(q.n);
  if (!st.found) st.found = [];
  if (!st.log) st.log = [];

  const row = el('div', 'row');
  const input = el('input');
  input.type = 'text';
  input.placeholder = 'Секция или кружок…';
  input.style.flex = '1 1 200px';
  const btn = el('button', 'ghost', 'Угадать');
  row.appendChild(input);
  row.appendChild(btn);
  body.appendChild(row);

  const out = el('div');
  body.appendChild(out);
  const chips = el('div', 'guesses');
  body.appendChild(chips);
  const nav = el('div', 'row');
  nav.appendChild(nextButton());
  body.appendChild(nav);

  function paint() {
    out.innerHTML = '';
    if (st.lastMsg) {
      const v = verdict(st.lastOk ? 'ok' : 'bad', st.lastMsg);
      v.style.cursor = 'help';
      v.addEventListener('mouseenter', () => {
        v.innerHTML = st.found.length + '/10';
      });
      v.addEventListener('mouseleave', () => {
        v.innerHTML = st.lastMsg;
      });
      // Телефоны: тап показывает счётчик на пару секунд.
      v.addEventListener('click', () => {
        v.innerHTML = st.found.length + '/10';
        setTimeout(() => { if (v.isConnected) v.innerHTML = st.lastMsg; }, 2500);
      });
      out.appendChild(v);
    }
    if (st.found.length >= CONFIG.sportsTarget) {
      out.appendChild(verdict('ok', bankMessage('v1', 6)));
      out.appendChild(el('div', 'codebox', 'diversity = bigmak ** 2 - 5'));
    }
    chips.innerHTML = '';
    st.log.slice(-12).forEach(g => {
      const chip = el('span', 'chip ' + (g.ok ? 'ok' : 'bad'));
      chip.textContent = String(g.text == null ? '' : g.text);
      chips.appendChild(chip);
    });
  }

  function guess() {
    const v = input.value.trim();
    if (!v) return;
    const matchId = matchSport(v);
    const isRight = matchId !== null;
    const isNew = isRight && !st.found.includes(matchId);

    if (isNew) {
      st.found.push(matchId);
      st.passed = true;
      st.lastOk = true;
      SFX.correctV1();
      st.lastMsg = SPORTS_YES[(st.found.length - 1) % SPORTS_YES.length];
    } else if (isRight) {
      st.lastOk = true;
      st.lastMsg = 'Это ты уже называл :)';
    } else {
      st.lastOk = false;
      st.lastMsg = 'Нет, не угадал.';
      SFX.wrongV1();
    }
    st.log.push({ text: v, ok: isRight });
    input.value = '';
    saveProgress();
    void recordV1Answer(q.n, v, isRight, st.passed, {
      matchId: matchId,
      newMatch: isNew,
    });
    paint();
    input.focus();
  }

  btn.addEventListener('click', guess);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') guess(); });
  paint();
}

function buildGames(q, body) {
  const st = slot(q.n);
  if (!st.found) st.found = [];

  const row = el('div', 'row');

  body.appendChild(counter);
  const out = el('div');
  body.appendChild(out);
  const chips = el('div', 'guesses');
  body.appendChild(chips);
  const nav = el('div', 'row');
  body.appendChild(nav);

  function paint() {
    const left = Math.max(0, CONFIG.gamesTarget - st.found.length);
    counter.textContent = st.found.length >= CONFIG.gamesTarget
      ? 'Названо игр: ' + st.found.length
      : 'Названо: ' + st.found.length + ' из ' + CONFIG.gamesTarget;
    out.innerHTML = '';
    if (st.lastMsg) out.appendChild(verdict(st.lastOk ? 'ok' : 'bad', st.lastMsg));
    chips.innerHTML = '';
    st.log.slice(-12).forEach(g => {
      chips.appendChild(el('span', 'chip ' + (g.ok ? 'ok' : 'bad'), g.text));
    });
    nav.innerHTML = '';
    if (st.passed) {
      nav.appendChild(nextButton());
    } else {
      const locked = el('p', 'hint', 'Осталось назвать ещё ' + left + ', чтобы пройти дальше.');
      nav.appendChild(locked);
    }
  }

  function guess() {
    const v = input.value.trim();
    if (!v) return;
    const idx = matchGame(v);
    const isRight = idx !== null;
    const isNew = isRight && !st.found.includes(idx);

    if (isNew) {
      st.found.push(idx);
      SFX.correctV1();
      const left = CONFIG.gamesTarget - st.found.length;
      if (st.found.length < CONFIG.gamesTarget) {
        st.lastMsg = 'Правильно! Назови ещё ' + left;
      } else if (st.found.length === CONFIG.gamesTarget) {
        st.lastMsg = bankMessage('v1', 11);
        st.passed = true;
      } else {
        st.lastMsg = 'Ещё одна? Круто!';
      }
      st.lastOk = true;
    } else if (isRight) {
      st.lastOk = true;
      st.lastMsg = 'Эту ты уже называл :)';
    } else {
      st.lastOk = false;
      st.lastMsg = 'Нет, не угадал.';
      SFX.wrongV1();
    }
    st.log.push({ text: v, ok: isRight });
    // После первой попытки вопрос можно пропустить независимо от правильности ответа.
    if (st.log.length === 1) st.passed = true;
    input.value = '';

    void recordV1Answer(q.n, v, isRight, st.passed, {
      matchId: idx,
      newMatch: isNew,
    });
    paint();
    input.focus();
  }

  btn.addEventListener('click', guess);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') guess(); });
  paint();
}

/* ---------- Вопрос 8: кликер ---------- */
function buildClicker(q, body) {
  const st = slot(q.n);

  const stage = el('div', 'clicker-stage');
  const core = el('div', 'clicker-core');
  const counterEl = el('div', 'clicks', '0');
  const bigBtn = el('button', 'primary bigbutton', 'Жми!');
  const timeEl = el('p', 'hint', CONFIG.clickerSeconds + ' сек');
  core.appendChild(counterEl);
  core.appendChild(bigBtn);
  core.appendChild(timeEl);
  stage.appendChild(core);
  body.appendChild(stage);

  const out = el('div');
  body.appendChild(out);
  const nav = el('div', 'row');
  body.appendChild(nav);

  if (st.done) {
    core.innerHTML = '';
    core.appendChild(el('div', 'clicks', String(st.clicks || 0)));
    core.appendChild(el('p', 'hint', 'нажатий'));
    out.appendChild(verdict(st.clicks > 0 ? 'ok' : 'bad',
      st.clicks > 0 ? 'Отличный результат!' : 'Ну нажми, хоть разочек :('));
    const replay = el('button', 'ghost', 'Сыграть ещё раз');
    replay.addEventListener('click', () => {
      st.done = false;
      saveProgress();
      render();
    });
    nav.appendChild(replay);
    nav.appendChild(nextButton());
    return;
  }

  let clicks = 0;
  let left = CONFIG.clickerSeconds;
  let running = false;
  const timers = [];

  const CORNER_ZONES = [
    { top: [4, 20], left: [2, 20] },
    { top: [4, 20], left: [78, 95] },
    { top: [80, 95], left: [2, 20] },
    { top: [80, 95], left: [78, 95] },
    { top: [42, 58], left: [2, 14] },
    { top: [42, 58], left: [84, 95] },
  ];
  function randIn(range) { return range[0] + Math.random() * (range[1] - range[0]); }

  function spawnNoise(text, opts) {
    const o = opts || {};
    const n = el('div', 'noise' + (o.isCode ? ' code' : ''), text);
    let top, left2;
    if (o.top !== undefined) {
      top = o.top; left2 = o.left;
    } else {
      const zone = CORNER_ZONES[Math.floor(Math.random() * CORNER_ZONES.length)];
      top = randIn(zone.top);
      left2 = randIn(zone.left);
    }
    n.style.top = top + '%';
    n.style.left = Math.max(1, Math.min(62, left2)) + '%';
    if (!o.isCode) {
      n.style.fontSize = (0.8 + Math.random() * 0.75).toFixed(2) + 'rem';
      n.style.transform = 'rotate(' + Math.round(-25 + Math.random() * 50) + 'deg)';
    } else {
      n.style.transform = 'rotate(-13deg)';
    }
    stage.appendChild(n);
    timers.push(setTimeout(() => n.remove(), o.life || 1400));
  }

  function startRun() {
    if (running) return;
    running = true;

    const tick = setInterval(() => {
      left -= 1;
      timeEl.textContent = left + ' сек';
      if (left <= 0) {
        clearInterval(tick);
        finish();
      }
    }, 1000);
    timers.push(tick);

    // мусорные сообщения
    const noiseTimer = setInterval(() => {
      spawnNoise(CLICK_NOISE[Math.floor(Math.random() * CLICK_NOISE.length)], { life: 650 });
    }, 650);
    timers.push(noiseTimer);

    // фрагмент кода: не первым, у края, дважды в одном месте, с разрывом 11 сек
    const codePos = { top: 6, left: 1.5, isCode: true, life: 1000 };
    timers.push(setTimeout(() => spawnNoise('teto = diversity // 5', codePos), 5000));
    timers.push(setTimeout(() => spawnNoise('teto = diversity // 5', codePos), 16000));
  }

  function finish() {
    timers.forEach(t => { clearTimeout(t); clearInterval(t); });
    stage.querySelectorAll('.noise').forEach(n => n.remove());
    st.done = true;
    st.clicks = clicks;
    st.attempts = (st.attempts || 0) + clicks;
    if (clicks > 0) st.passed = true;
    saveProgress();
    void recordV1Answer(q.n, clicks, clicks > 0, st.passed, { clicks: clicks });
    render();
  }

  bigBtn.addEventListener('click', () => {
    startRun();
    clicks += 1;
    counterEl.textContent = String(clicks);
  });
}

/* ---------- Вопрос 18: скрытые надписи ---------- */
function buildHaystack(q, body) {
  const st = slot(q.n);

  const hay = el('div', 'haystack');

  // Настоящая сетка: каждый фрагмент занимает собственную ячейку,
  // длинный текст переносится, а высота строки подстраивается под содержимое.
  const cols = window.matchMedia('(max-width: 520px)').matches ? 3
    : window.matchMedia('(max-width: 760px)').matches ? 4 : 5;
  const rows = Math.max(14, Math.ceil((STRAW_TEXTS.length + 2) / cols));
  hay.style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0, 1fr))';
  hay.style.gridTemplateRows = 'repeat(' + rows + ', minmax(30px, auto))';
  hay.style.setProperty('--haystack-rows', String(rows));

  const cells = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) cells.push({ r, c });
  }
  // Перемешиваем ячейки, чтобы поле оставалось визуально хаотичным.
  for (let i = cells.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cells[i], cells[j]] = [cells[j], cells[i]];
  }

  // Sparkle — в первой строке, sparxie — ниже середины поля.
  const topCells = cells.filter(c => c.r === 0);
  const lowCells = cells.filter(c => c.r >= Math.floor(rows * 0.55));
  const sparkleCell = topCells[0] || cells[0];
  const sparxieCell = lowCells[0] || cells[cells.length - 1];
  const used = new Set([sparkleCell.r + ':' + sparkleCell.c, sparxieCell.r + ':' + sparxieCell.c]);

  function place(text, cell, opts) {
    const o = opts || {};
    const s = el('span', 'straw' + (o.correct ? ' correct-target' : ''), text);
    s.style.gridRow = String(cell.r + 1);
    s.style.gridColumn = String(cell.c + 1);
    s.style.fontSize = o.size || (0.60 + Math.random() * 0.13).toFixed(2) + 'rem';
    s.style.color = o.color || 'rgba(47,32,56,' + (0.012 + Math.random() * 0.045).toFixed(3) + ')';
    if (o.mono) s.style.fontFamily = 'var(--mono)';
    if (o.rotate != null) s.style.transform = 'rotate(' + o.rotate + 'deg)';
    hay.appendChild(s);
  }

  // Ответ и скрытый фрагмент приходят из Answer Bank.
  const hidden = bankData('v1', 18);
  place(String(hidden.hiddenTarget || ''), sparkleCell, {
    color: 'rgba(47,32,56,0.011)', size: '0.85rem', correct: true
  });
  place(String(hidden.hiddenCode || ''), sparxieCell, {
    color: 'rgba(47,32,56,0.012)', size: '0.7rem', mono: true, correct: true
  });

  let ti = 0;
  cells.forEach(cell => {
    const key = cell.r + ':' + cell.c;
    if (used.has(key)) return;
    if (ti >= STRAW_TEXTS.length) return;
    place(STRAW_TEXTS[ti++], cell, {});
  });

  body.appendChild(hay);

  // Телефоны: палец подсвечивает надписи рядом с собой (аналог наведения мыши).
  let touchClear = null;
  const flashAt = (x, y) => {
    hay.querySelectorAll('.straw').forEach(sw => {
      const r = sw.getBoundingClientRect();
      const dx = Math.max(r.left - x, 0, x - r.right);
      const dy = Math.max(r.top - y, 0, y - r.bottom);
      sw.classList.toggle('touch-hover', dx * dx + dy * dy < 34 * 34);
    });
  };
  const onTouch = (e) => {
    if (touchClear) { clearTimeout(touchClear); touchClear = null; }
    const t = e.touches[0];
    if (t) flashAt(t.clientX, t.clientY);
  };
  const onTouchEnd = () => {
    touchClear = setTimeout(() => hay.querySelectorAll('.touch-hover').forEach(n => n.classList.remove('touch-hover')), 2200);
  };
  hay.addEventListener('touchstart', onTouch, { passive: true });
  hay.addEventListener('touchmove', onTouch, { passive: true });
  hay.addEventListener('touchend', onTouchEnd, { passive: true });
  hay.addEventListener('touchcancel', onTouchEnd, { passive: true });

  const label = el('label', 'field');
  const input = el('input');
  input.type = 'text';
  input.placeholder = 'Что ты нашёл?';
  input.value = st.value || '';
  label.appendChild(input);
  body.appendChild(label);

  const row = el('div', 'row');
  const answerBtn = el('button', 'ghost', 'Ответить');
  row.appendChild(answerBtn);
  body.appendChild(row);
  const out = el('div');
  body.appendChild(out);

  const nextBtn = nextButton();

  function showVerdict() {
    out.innerHTML = '';
    if (st.lastCorrect === undefined) return;
    out.appendChild(st.lastCorrect
      ? verdict('ok', q.ok())
      : verdict('bad', 'Неправильно!'));
  }

  function submit() {
    st.value = input.value;
    st.lastCorrect = !!q.check(input.value);
    if (st.lastCorrect) st.passed = true;
    if (!row.contains(nextBtn)) row.appendChild(nextBtn);
    showVerdict();
    saveProgress();
    void recordV1Answer(q.n, input.value, st.lastCorrect, st.passed);
  }

  answerBtn.addEventListener('click', submit);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  if (st.lastCorrect !== undefined) { row.appendChild(nextBtn); showVerdict(); }
}

function v2KeyWord(amount) {
  const n = Math.abs(Number(amount) || 0);
  const lastTwo = n % 100;
  const last = n % 10;
  if (lastTwo >= 11 && lastTwo <= 14) return 'ключей';
  if (last === 1) return 'ключ';
  if (last >= 2 && last <= 4) return 'ключа';
  return 'ключей';
}

function startV2HintsPolling() {
  if (!S.nick || !serverSyncEnabled()) return;
  if (!LIVE_V2_HINTS && !V2_HINTS_LOADING) void refreshV2Hints();
  if (V2_HINTS_POLL) return;
  V2_HINTS_POLL = setInterval(() => {
    if (S.screen === 'v2quiz' && !document.hidden) void refreshV2Hints();
  }, 30000);
}

function stopV2HintsPolling() {
  if (V2_HINTS_POLL) {
    clearInterval(V2_HINTS_POLL);
    V2_HINTS_POLL = null;
  }
}

async function refreshV2Hints() {
  if (!S.nick || !serverSyncEnabled()) return null;
  if (V2_HINTS_LOADING) return V2_HINTS_LOADING;
  V2_HINTS_LOADING = (async () => {
    try {
      const res = await fetchWithTimeout(CONFIG.serverEndpoint + '?action=v2_hints', { cache: 'no-store' }, 20000);
      if (!res.ok) throw new Error('V2 hints request failed: ' + res.status);
      const data = await res.json();
      if (!data || data.ok !== true || !data.questions) throw new Error((data && data.error) || 'Invalid V2 hint state');
      const old = LIVE_V2_HINTS ? JSON.stringify(LIVE_V2_HINTS) : '';
      LIVE_V2_HINTS = data;
      V2_HINTS_LAST_ERROR = '';
      if (old !== JSON.stringify(data) && S.screen === 'v2quiz' && !document.querySelector('.v2-hint-modal-overlay')) render();
      return data;
    } catch (error) {
      V2_HINTS_LAST_ERROR = 'Не удалось синхронизировать общие подсказки. Проверь подключение.';
      console.warn('V2 hint sync failed:', error);
      if (!LIVE_V2_HINTS && S.screen === 'v2quiz' && !document.querySelector('.v2-hint-modal-overlay')) render();
      return LIVE_V2_HINTS;
    } finally {
      V2_HINTS_LOADING = null;
    }
  })();
  return V2_HINTS_LOADING;
}

function showV2HintConfirmation(question, type, hint) {
  if (!S.nick) return;
  const meta = V2_HINT_META[type];
  const cost = Math.max(0, Number(hint.cost) || 0);
  const overlay = el('div', 'v2-hint-modal-overlay');
  overlay.setAttribute('role', 'presentation');
  const dialog = el('section', 'v2-hint-dialog');
  dialog.setAttribute('role', 'dialog');
  dialog.setAttribute('aria-modal', 'true');
  dialog.setAttribute('aria-labelledby', 'v2-hint-confirm-title');
  const title = el('h2', null, 'Открыть подсказку?');
  title.id = 'v2-hint-confirm-title';
  const message = el('p');
  message.textContent = 'Подсказка «' + meta.label + '» к вопросу II-' + question + ' потратит ' + cost + ' ' + v2KeyWord(cost) + ' из общего запаса команды. После открытия она станет доступна всем игрокам. Это действие нельзя отменить. Продолжить?';
  const status = el('p', 'v2-hint-dialog-status');
  status.setAttribute('aria-live', 'polite');
  const row = el('div', 'row');
  const cancel = el('button', 'ghost', 'Отмена');
  const confirm = el('button', 'primary', 'Потратить ключи');
  row.append(cancel, confirm);
  dialog.append(title, message, status, row);
  overlay.appendChild(dialog);
  document.body.appendChild(overlay);

  let onEscape = null;
  const close = (refresh = false) => {
    overlay.remove();
    if (onEscape) document.removeEventListener('keydown', onEscape);
    if (refresh && S.screen === 'v2quiz') render();
  };
  cancel.addEventListener('click', () => close(true));
  overlay.addEventListener('click', event => { if (event.target === overlay && !confirm.disabled) close(true); });
  onEscape = event => { if (event.key === 'Escape' && !confirm.disabled) close(true); };
  document.addEventListener('keydown', onEscape);
  confirm.addEventListener('click', async () => {
    if (confirm.disabled) return;
    confirm.disabled = true;
    cancel.disabled = true;
    status.style.color = 'var(--ink-soft)';
    status.textContent = 'Обновляем общий запас ключей…';
    try {
      const res = await fetchWithTimeout(CONFIG.serverEndpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'open_v2_hint', nick: S.nick, question: Number(question), hintType: type }),
        cache: 'no-store'
      }, 25000);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (data && data.state) LIVE_V2_HINTS = data.state;
      if (!data || data.ok !== true) {
        status.style.color = 'var(--bad)';
        status.textContent = data && data.message ? data.message : 'Не удалось открыть подсказку. Попробуй ещё раз.';
        confirm.disabled = false;
        cancel.disabled = false;
        return;
      }
      close(false);
      if (S.screen === 'v2quiz') render();
    } catch (error) {
      status.style.color = 'var(--bad)';
      status.textContent = 'Не удалось подтвердить результат сервера. Повтори попытку: повторный запрос не спишет ключ второй раз, если подсказка уже открылась.';
      confirm.disabled = false;
      cancel.disabled = false;
      console.warn('Opening V2 hint failed:', error);
    }
  });
  confirm.focus();
}

function v2SyncKeyForNick(nick) {
  // У каждого ника свой стабильный ключ; одинаковый ник даёт одинаковый результат.
  // Без A-C: в каждой строке ключа ещё три разных символа должны стоять в алфавите раньше буквы ключа.
  const alphabet = 'DEFGHIJKLMNOPQRSTUVWXYZ';
  const source = String(nick || '').trim().toLowerCase() || 'guest';
  let seed = 2166136261;
  for (let i = 0; i < source.length; i++) {
    seed ^= source.charCodeAt(i);
    seed = Math.imul(seed, 16777619) >>> 0;
  }
  let key = '';
  for (let i = 0; i < 5; i++) {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    key += alphabet[seed % alphabet.length];
  }
  return key;
}

function isCorrectV2SyncKey(value) {
  return !!S.nick && tight(value).toUpperCase() === v2SyncKeyForNick(S.nick);
}

function v2SyncRng(nick) {
  // Отдельный генератор для раскладки таблицы: ключ он не меняет.
  const source = 'sync-layout:' + (String(nick || '').trim().toLowerCase() || 'guest');
  let seed = 2166136261;
  for (let i = 0; i < source.length; i++) {
    seed ^= source.charCodeAt(i);
    seed = Math.imul(seed, 16777619) >>> 0;
  }
  return () => {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  };
}

function renderV2SyncChallenge() {
  const panel = el('section', 'v2-sync-challenge');
  panel.setAttribute('aria-label', 'Журнал синхронизации пакета');

  const ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const rng = v2SyncRng(S.nick);
  const pick = n => Math.floor(rng() * n);
  const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = pick(i + 1); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  const rand = () => ABC[1 + pick(24)];                 // B..Y
  const fmt = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');

  // 9 записей с неравными промежутками, время переходит через 22:00. Пять из них несут ключ,
  // в них все 4 канала различны, а ключевой символ стоит в алфавите позже остальных.
  // В остальных четырёх каналы частично или полностью совпадают (пакет подтверждён).
  const key = v2SyncKeyForNick(S.nick);
  let minutes = 21 * 60 + 56;
  const times = [];
  for (let i = 0; i < 9; i++) { times.push(minutes); minutes += 1 + pick(2); }
  const keyRows = shuffle([0, 1, 2, 3, 4, 5, 6, 7, 8]).slice(0, 5).sort((a, b) => a - b);

  let keyN = 0, decoyN = 0;
  const records = times.map((t, i) => {
    let cells;
    if (keyRows.includes(i)) {
      const ki = ABC.indexOf(key[keyN++]);
      const lower = [];
      for (let j = Math.max(0, ki - 7); j < ki; j++) lower.push(ABC[j]);
      cells = shuffle(lower).slice(0, 3);
      cells.splice(pick(4), 0, ABC[ki]);
    } else {
      const x = rand();
      let y = rand(); while (y === x) y = rand();
      let z = rand(); while (z === x || z === y) z = rand();
      const type = decoyN++ % 3;
      cells = type === 0 ? [x, x, x, x] : type === 1 ? [x, y, x, y] : [x, x, y, z];
      shuffle(cells);
    }
    return { t, cells };
  });
  shuffle(records); // время в таблице намеренно перемешано

  const wrap = el('div', 'v2-sync-table-wrap');
  const table = el('table', 'v2-sync-table');
  const thead = el('thead');
  const headRow = el('tr');
  ['ВРЕМЯ', 'A<br>АРХИВ', 'B<br>ПРИЁМ', 'C<br>ЗЕРКАЛО', 'D<br>РЕЗЕРВ'].forEach(label => {
    headRow.appendChild(el('th', null, label));
  });
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = el('tbody');
  records.forEach(record => {
    const row = el('tr');
    row.appendChild(el('td', 'v2-sync-time', fmt(record.t)));
    record.cells.forEach(ch => {
      const cell = el('td');
      cell.appendChild(el('span', 'v2-sync-symbol', ch));
      row.appendChild(cell);
    });
    tbody.appendChild(row);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  panel.appendChild(wrap);
  return panel;
}

function buildV2Text(q, body) {
  const st = v2slot(q.n);

  const label = el('label', 'field');
  const input = el('input');
  input.type = 'text';
  input.placeholder = 'Твой ответ…';
  input.value = st.value || '';
  label.appendChild(input);
  body.appendChild(label);

  const row = el('div', 'row');
  const answerBtn = el('button', 'ghost', 'Ответить');
  row.appendChild(answerBtn);
  body.appendChild(row);
  const out = el('div');
  body.appendChild(out);

  const nb = v2NextButton();

  function paint() {
    out.innerHTML = '';
    if (st.lastCorrect === undefined) return;
    out.appendChild(st.lastCorrect ? verdict('ok', q.ok()) : verdict('bad', 'Неправильно! Попробуй ещё раз.'));
    if (st.passed && !row.contains(nb)) row.appendChild(nb);
  }

  async function submit() {
    st.value = input.value;
    if (String(input.value).trim() !== '') st.history.push(String(input.value));
    st.lastCorrect = !!q.check(input.value);
    if (st.lastCorrect) {
      st.passed = true;
      SFX.correctV2();
    } else {
      SFX.wrongV2();
    }
    saveProgress();
    paint();
    refreshQuestionNavigator();
    // Синхронизируем и неправильные попытки тоже — backend хранит их
    // в одной клетке соответствующего вопроса.
    void syncPlayerToServer('v2-' + q.n, { screen: 'v2quiz' });
  }
  answerBtn.addEventListener('click', submit);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  if (st.lastCorrect !== undefined) paint();
}

  if (!S.timerRevealed) { S.timerRevealed = true; saveProgress(); }

  const box = el('div', 'countdown-box');
  const label = el('p', 'hint');
  label.style.textAlign = 'center';
  body.appendChild(label);
  body.appendChild(box);

  const units = {};
  const state = { h: null, m: null, sec: null };
  [['h', 'ч'], ['m', 'мин'], ['sec', 'сек']].forEach(([key, lbl]) => {
    const u = el('div', 'unit');
    const num = el('div', 'num');
    u.appendChild(num);
    u.appendChild(el('div', 'lbl', lbl));
    box.appendChild(u);
    units[key] = num;
  });

  function paint() {
    const t = trustedNow();
    if (t < start) {
      label.textContent = '';
      updateTimerUnits(start - t);
    } else if (t < end) {
      label.textContent = 'Времени осталось на сегодня:';
      updateTimerUnits(end - t);
    } else {
      label.textContent = 'С днём рождения меня!';
      box.innerHTML = '';
    }
  }

  function updateTimerUnits(ms) {
    const parts = formatTimerParts(ms);
    setTimerPart(units.h, parts.h, 'h', state);
    setTimerPart(units.m, parts.m, 'm', state);
    setTimerPart(units.sec, parts.sec, 'sec', state);
  }

  paint();
  let tick = setInterval(() => {
    if (S.screen !== 'v2quiz' || V2_QUESTIONS[S.v2Index] !== q) { clearInterval(tick); return; }
    paint();
  }, 1000);

  const unlocked = trustedNow() >= start;
  const label2 = el('label', 'field');
  const input = el('input');
  input.type = 'text';
  input.placeholder = unlocked ? 'Твой ответ…' : 'Пока рано…';
  input.disabled = !unlocked;
  input.value = st.value || '';
  label2.appendChild(input);
  body.appendChild(label2);

  const row = el('div', 'row');
  const answerBtn = el('button', 'ghost', 'Ответить');
  answerBtn.disabled = !unlocked;
  row.appendChild(answerBtn);
  body.appendChild(row);
  const out = el('div');
  body.appendChild(out);

  function paintVerdict() {
    out.innerHTML = '';
    if (st.lastCorrect === undefined) return;
    out.appendChild(st.lastCorrect ? verdict('ok', q.ok()) : verdict('bad', 'Неправильно! Попробуй ещё раз.'));
  }

  function submit() {
    st.value = input.value;
    if (String(input.value).trim() !== '') st.history.push(String(input.value));
    st.lastCorrect = !!q.check(input.value);
    if (st.lastCorrect) SFX.correctV2();
    else SFX.wrongV2();
    paintVerdict();
    saveProgress();
    // Записываем каждую попытку, включая неправильную.
    void syncPlayerToServer('v2-' + q.n, { screen: 'v2quiz' });
    if (st.lastCorrect && !st.passed) {
      st.passed = true;
      saveProgress();
      refreshQuestionNavigator();
      void syncPlayerToServer('v2-' + q.n, { screen: 'v2quiz' });
      input.disabled = true;
      answerBtn.disabled = true;
      clearInterval(tick);
      // Небольшая пауза после правильного ответа: таймер уже остановлен,
      // экран остаётся неподвижным, затем начинается переход в Версию III.
      setTimeout(() => {
        if (S.screen === 'v2quiz' && V2_QUESTIONS[S.v2Index] === q) {
          triggerV3Sequence();
        }
      }, 2200);
      return;
    }
  }
  answerBtn.addEventListener('click', submit);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  if (st.lastCorrect !== undefined) paintVerdict();
}

/* ---------- Переход в Версию III: короткая тряска → плавная белая заливка с резервным завершением ---------- */
function triggerV3Sequence() {
  if (V3_TRANSITION_RUNNING) return;
  V3_TRANSITION_RUNNING = true;
  closeSoftKeyboard();
  SaveBanner.refresh();
  hideMamboForTransition(true);
  ensureMemories();
  stopV3Music();
  playV2ToV3Sfx();
  prepareV3MusicForLaunch();

  if (globalTimerInterval) { clearInterval(globalTimerInterval); globalTimerInterval = null; }
  const bar = document.querySelector('.global-timer');
  if (bar) bar.remove();

  // Фиксируем переход сразу. Если вкладку перезагрузят во время заливки,
  // сохранение уже укажет на Version III, а не на решённый II-5.
  S.screen = 'v3transition';
  S.v3Index = 0;
  saveProgress();
  void syncPlayerToServer('v3-transition-start', { screen: 'v3transition', v3Index: 0 });

  const wash = el('div', 'v3-wash');
  wash.style.opacity = '0';
  document.body.appendChild(wash);

  const reducedMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const fadeInDuration = reducedMotion ? 2400 : 8500;
  const fadeOutDuration = reducedMotion ? 1000 : 2500;
  let fadeInAnimation = null;
  let finishTimer = null;
  let fadeOutTimer = null;
  let finished = false;
  let removed = false;

  const removeWash = () => {
    if (removed) return;
    removed = true;
    if (fadeOutTimer) clearTimeout(fadeOutTimer);
    wash.remove();
    V3_TRANSITION_RUNNING = false;
  };

  const beginFadeOut = () => {
    wash.style.opacity = '1';
    if (typeof wash.animate === 'function') {
      const fadeOut = wash.animate(
        [{ opacity: 1 }, { opacity: 0 }],
        { duration: fadeOutDuration, easing: 'cubic-bezier(.2,.75,.25,1)', fill: 'forwards' }
      );
      fadeOut.addEventListener('finish', removeWash, { once: true });
      fadeOutTimer = setTimeout(removeWash, fadeOutDuration + 400);
    } else {
      wash.style.transition = 'opacity ' + fadeOutDuration + 'ms cubic-bezier(.2,.75,.25,1)';
      requestAnimationFrame(() => { wash.style.opacity = '0'; });
      fadeOutTimer = setTimeout(removeWash, fadeOutDuration + 400);
    }
  };

  const finishWhite = () => {
    if (finished) return;
    finished = true;
    if (finishTimer) clearTimeout(finishTimer);
    // Убираем анимацию заливки, сохранив белый фон, перед перерисовкой интерфейса III.
    wash.style.opacity = '1';
    if (fadeInAnimation) { try { fadeInAnimation.cancel(); } catch (_) {} }
    app.classList.remove('v3-transition-shake');
    document.body.classList.remove('epic-shake-long', 'epic-shake');
    stopV2ToV3Sfx();
    render();
    startV3Music(true);
    setTimeout(beginFadeOut, 900);
  };

  if (!reducedMotion && !LITE) {
    app.classList.remove('v3-transition-shake');
    void app.offsetWidth;
    app.classList.add('v3-transition-shake');
    setTimeout(() => app.classList.remove('v3-transition-shake'), 900);
  }

  if (typeof wash.animate === 'function') {
    fadeInAnimation = wash.animate(
      [{ opacity: 0 }, { opacity: 1 }],
      { duration: fadeInDuration, easing: 'cubic-bezier(.32,.08,.12,1)', fill: 'forwards' }
    );
    fadeInAnimation.addEventListener('finish', finishWhite, { once: true });
  } else {
    wash.style.transition = 'opacity ' + fadeInDuration + 'ms cubic-bezier(.32,.08,.12,1)';
    requestAnimationFrame(() => { wash.style.opacity = '1'; });
    wash.addEventListener('transitionend', event => {
      if (event.propertyName === 'opacity' && wash.style.opacity === '1') finishWhite();
    });
  }
  // Event/fallback pair prevents reduced-motion rules or a paused animation from stranding the player.
  finishTimer = setTimeout(finishWhite, fadeInDuration + 500);
}

// Подсветка I-14 доступна только после разблокировки Версии II.
// Она активна в течение минуты 14:00 по локальным часам устройства и повторяется ежедневно.
function mountQ14TimeCue(card) {

    if (!card.isConnected) {

      return;
    }

    const now = new Date();
    const shouldGlow = S.unlocked && now.getHours() === 14 && now.getMinutes() === 0;

function mountSnakeHotkey(q, st) {
  snakeKeyHandler = (e) => {
    // Надёжно определяем именно клавишу 7 на цифровом блоке.
    // Основной вариант — code=Numpad7; location=3 покрывает браузеры/раскладки,
    // где клавиша приходит с другим key, но всё ещё определяется как numpad.
    const isNumpad7 = e.code === 'Numpad7' || (e.location === 3 && e.key === '7');
    if (!isNumpad7) return;

    // Все условия должны выполняться одновременно:
    // 1) открыта Версия II;
    // 2) открыт 14-й вопрос первой версии;
    // 3) у пользователя сейчас ровно 14:00 по локальным часам;
    // 4) нажата Numpad 7.
    if (!S.unlocked || S.screen !== 'quiz' || q.n !== 14 || S.index !== 13) return;

    const currentTime = new Date();
    const is1400 = currentTime.getHours() === 14 && currentTime.getMinutes() === 0;
    if (!is1400 || document.querySelector('.snake-overlay')) return;

    e.preventDefault();
    launchSnake(q, st);
  };
  document.addEventListener('keydown', snakeKeyHandler);

  // Телефоны: экранная клавиатура не шлёт Numpad7, поэтому просто «7» в поле ответа
  // (те же условия: 14-й вопрос и ровно 14:00). Только для сенсорных устройств.
  const isPhone = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  if (isPhone) {
    const field = app.querySelector('input[type="text"]');
    if (field) {
      field.addEventListener('input', () => {
        if (field.value.trim() !== '7') return;
        if (!S.unlocked || S.screen !== 'quiz' || q.n !== 14 || S.index !== 13) return;
        const t = new Date();
        if (!(t.getHours() === 14 && t.getMinutes() === 0) || document.querySelector('.snake-overlay')) return;
        field.value = '';
        field.blur();
        launchSnake(q, st);
      });
    }
  }
}

function launchSnake(q, st) {
  const overlay = el('div', 'snake-overlay');
  const scoreEl = el('div', 'score', 'Яблоки: 0');
  const canvas = document.createElement('canvas');
  const size = 20, cells = 14;
  canvas.width = size * cells;
  canvas.height = size * cells;
  const hint = el('p', 'hint', 'Управление - Стрелки/WASD или свайпы пальцем по экрану');
  hint.style.color = '#cbb8e0';
  overlay.appendChild(scoreEl);
  overlay.appendChild(canvas);
  overlay.appendChild(hint);
  document.body.appendChild(overlay);

  const ctx = canvas.getContext('2d');
  let snake = [{ x: 7, y: 7 }];
  let dir = { x: 1, y: 0 };
  let nextDir = dir;
  let apple = spawnApple();
  let apples = 0;
  let dead = false;

  function spawnApple() {
    let p;
    do {
      p = { x: Math.floor(Math.random() * cells), y: Math.floor(Math.random() * cells) };
    } while (snake.some(s => s.x === p.x && s.y === p.y));
    return p;
  }

  function onKey(e) {
    const map = {
      ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 },
      ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
      w: { x: 0, y: -1 }, a: { x: -1, y: 0 }, s: { x: 0, y: 1 }, d: { x: 1, y: 0 },
      W: { x: 0, y: -1 }, A: { x: -1, y: 0 }, S: { x: 0, y: 1 }, D: { x: 1, y: 0 },
    };
    const d = map[e.key];
    if (!d) return;
    if (d.x === -dir.x && d.y === -dir.y) return;
    nextDir = d;
  }
  document.addEventListener('keydown', onKey);

  // Сенсорное управление: свайп пальцем в любом месте экрана меняет направление.
  let touchX = null, touchY = null;
  overlay.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    touchX = t.clientX; touchY = t.clientY;
  }, { passive: true });
  overlay.addEventListener('touchmove', (e) => {
    e.preventDefault(); // не даём странице прокручиваться / обновляться свайпом
    if (touchX === null || dead) return;
    const t = e.touches[0];
    const dx = t.clientX - touchX, dy = t.clientY - touchY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    const d = Math.abs(dx) > Math.abs(dy)
      ? { x: dx > 0 ? 1 : -1, y: 0 }
      : { x: 0, y: dy > 0 ? 1 : -1 };
    if (!(d.x === -dir.x && d.y === -dir.y)) nextDir = d;
    touchX = t.clientX; touchY = t.clientY; // следующий свайп можно начать, не отрывая палец
  }, { passive: false });
  overlay.addEventListener('touchend', () => { touchX = touchY = null; }, { passive: true });
  overlay.style.touchAction = 'none';

  function draw() {
    ctx.fillStyle = '#100a18';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#f2b705';
    ctx.fillRect(apple.x * size, apple.y * size, size - 2, size - 2);
    ctx.fillStyle = '#c9a6ff';
    snake.forEach(s => ctx.fillRect(s.x * size, s.y * size, size - 2, size - 2));
  }

  function closeSnakeOverlay(next) {
    if (!overlay.isConnected || overlay.classList.contains('snake-closing')) return;
    overlay.classList.add('snake-closing');
    setTimeout(() => {
      overlay.remove();
      if (typeof next === 'function') next();
    }, 280);
  }

  function finish() {
    dead = true;
    clearInterval(loop);
    document.removeEventListener('keydown', onKey);
    const previousRecord = Math.max(Number(st.bestApples) || 28, 28);
    const newRecord = apples > previousRecord;
    st.bestApples = Math.max(previousRecord, apples);
    if (newRecord) {
      SFX.record();
    }
    saveProgress();
    const msg = el('div', 'msg');
    msg.textContent = 'Игра окончена. Яблок: ' + apples + '. Рекорд: ' + st.bestApples;
    overlay.appendChild(msg);
    if (newRecord) {
      const recordData = bankData('v2', 2);
      const recordMsg = el('div', 'msg', String(recordData.recordPrefix || '') + String(recordData.recordLabel || '') + ': ' + st.bestApples);
      recordMsg.style.color = '#8fd19e';
      recordMsg.style.marginTop = '-4px';
      recordMsg.style.fontSize = '1.02rem';
      overlay.appendChild(recordMsg);
    }
    const row = el('div', 'row');
    row.style.justifyContent = 'center';
    const again = el('button', 'primary', 'Ещё раз');
    again.addEventListener('click', () => { closeSnakeOverlay(() => launchSnake(q, st)); });
    const close = el('button', 'ghost', 'Закрыть');
    close.addEventListener('click', () => { closeSnakeOverlay(() => render()); });
    row.appendChild(again);
    row.appendChild(close);
    overlay.appendChild(row);
  }

  function tick() {
    if (dead) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= cells || head.y >= cells ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      return finish();
    }
    snake.unshift(head);
    if (head.x === apple.x && head.y === apple.y) {
      apples += 1;
      SFX.apple();
      scoreEl.textContent = 'Яблоки: ' + apples;
      apple = spawnApple();
    } else {
      snake.pop();
    }
    draw();
  }

  draw();
  const loop = setInterval(tick, 160);
}

function buildOwnerWindows(wrap, answers) {

  const layer = el('div', 'v3-float-layer');

  V3_QUESTIONS.forEach((question, i) => {
    const answer = String(answers[i] == null ? '' : answers[i]).trim();
    if (!answer) return;

    const win = el('div', 'v3-win w' + (i + 1));
    win.tabIndex = 0;

    const bar = el('div', 'v3-win-bar', '<span class="dots"><i></i><i></i><i></i></span><span class="ttl"></span>');
    bar.querySelector('.ttl').textContent = 'Вопрос ' + (i + 1);

    const body = el('div', 'v3-win-body');
    const q = el('p', 'v3-win-q');
    q.textContent = question;
    const tag = el('span', 'v3-win-tag');
    tag.textContent = 'мой ответ';
    const a = el('p', 'v3-win-a');
    a.textContent = answer;
    body.append(q, tag, a);

    win.append(bar, body);
    const toggle = () => {
      const was = win.classList.contains('front');
      layer.querySelectorAll('.v3-win.front').forEach(n => n.classList.remove('front'));
      if (!was) win.classList.add('front');
    };
    win.addEventListener('click', (e) => { e.stopPropagation(); toggle(); });

      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
    layer.appendChild(win);
  });

  if (!layer.children.length) return;
  wrap.addEventListener('click', () => {
    layer.querySelectorAll('.v3-win.front').forEach(n => n.classList.remove('front'));

/* ---------- Титры: видео сверху, медленные титры снизу ---------- */
let CREDITS_PENDING = false;
function startCredits(onDone) {
  if (document.querySelector('.credits-screen')) return;
  const ov = el('div', 'credits-screen');
  const vbox = el('div', 'credits-video');
  const video = document.createElement('video');
  video.playsInline = true; video.setAttribute('playsinline', ''); video.setAttribute('webkit-playsinline', '');
  video.preload = 'auto';
  vbox.appendChild(video);
  const view = el('div', 'credits-view');
  const roll = el('div', 'credits-roll');
  const line = (cls, t) => { const d = el('div', cls); d.textContent = t; roll.appendChild(d); return d; };
  line('c-title', CONFIG.creditsTitle);
  (CONFIG.creditsRoles || []).forEach(r => { line('c-role', r[0]); line('c-name', r[1]); });
  // Ники других игроков (из таблицы, поле players). Ник самого игрока сюда не попадает - он в «Отдельное спасибо».
  const rawPlayers = CONFIG.creditsInspirers === 'auto'
    ? ((FINALE && Array.isArray(FINALE.players)) ? FINALE.players : [])
    : (Array.isArray(CONFIG.creditsInspirers) ? CONFIG.creditsInspirers : []);
  const skipNicks = new Set((CONFIG.creditsExclude || []).concat([S.nick || '']).map(tight));
  const seenNicks = new Set();
  const players = rawPlayers.map(n => String(n == null ? '' : n).trim()).filter(n => {
    const k = tight(n);
    if (!k || skipNicks.has(k) || seenNicks.has(k)) return false;
    seenNicks.add(k);
    return true;
  });
  const secs = CONFIG.creditsSections || [];
  if (players.length && !secs.some(x => x[0] === 'В ролях')) { line('c-role', 'В ролях'); players.forEach(n => line('c-name', n)); }
  let thanksDone = false;
  secs.forEach(sec => {
    // Блок «В ролях»: при 'auto' берём настоящие ники; если они не пришли - блок целиком пропускаем (без заглушек).
    const isCast = sec[0] === 'В ролях' && CONFIG.creditsInspirers === 'auto';
    if (isCast && !players.length) return;
    line('c-role', sec[0]);
    (isCast ? players : sec.slice(1)).forEach(t => line('c-name', t));
    if (sec[0] === 'Отдельное спасибо') { line('c-name', S.nick || 'Тебе'); thanksDone = true; }
  });
  if (!thanksDone) { line('c-role', 'Отдельное спасибо'); line('c-name', S.nick || 'Тебе'); }
  const endEl = line('c-end', 'Спасибо, что ты здесь 💜');
  view.appendChild(roll);
  ov.append(vbox, view);

  let hasVideo = !!CONFIG.creditsVideoUrl, rollAnim = null, rollDone = false, videoDone = false, finished = false;
  const skip = el('button', 'credits-skip', 'Пропустить ›');
  skip.style.display = 'none';
  ov.appendChild(skip);
  setTimeout(() => { if (!finished) skip.style.display = ''; }, 4000);

  function finish() {
    if (finished) return;
    finished = true;
    try { video.pause(); } catch (_) {}
    if (rollAnim) rollAnim.cancel();
    skip.remove();
    if (onDone) onDone(); // под титрами уже появляется личное сообщение
    ov.style.animation = 'creditsOut 1.6s ease forwards';
    setTimeout(() => ov.remove(), 1700);
  }
  const tryFinish = () => { if (rollDone && (videoDone || !hasVideo)) finish(); };
  function startRoll(secs) {
    if (rollAnim || finished) return;
    // Титры ползут почти всю длину видео и останавливаются, когда последняя строка стоит по центру.
    // Большой отступ перед последней строкой: когда она по центру, все остальные титры уже ушли за экран.
    endEl.style.marginTop = Math.round(view.clientHeight * 0.65) + 'px';
    const dist = view.clientHeight / 2 + endEl.offsetTop + endEl.offsetHeight / 2;
    const dur = Math.max(secs - 6, secs * 0.8); // последние секунды: пауза на последней строке и медленное затухание
    rollAnim = roll.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-' + dist + 'px)' }], { duration: dur * 1000, easing: 'linear', fill: 'forwards' });
    rollAnim.onfinish = () => {
      endEl.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 3500, delay: 1200, easing: 'ease-in', fill: 'forwards' });
      // С видео ждём его конца; без видео - пока строка не угаснет.
      setTimeout(() => { rollDone = true; tryFinish(); }, hasVideo ? 0 : 4800);
    };
  }

  document.body.appendChild(ov);
  stopV3Music(); // у видео своя музыка
  stopMemories();

  if (!hasVideo) { setTimeout(() => startRoll(CONFIG.creditsFallbackSeconds), 60); return; }
  video.addEventListener('playing', () => startRoll(isFinite(video.duration) && video.duration > 5 ? video.duration : CONFIG.creditsFallbackSeconds), { once: true });
  // Рамка ровно по размеру видео (без чёрных полей): считаем размер по пропорциям ролика.
  video.addEventListener('loadedmetadata', () => {
    if (!video.videoWidth || !video.videoHeight) return;
    const r = video.videoWidth / video.videoHeight;
    video.style.aspectRatio = String(r);
    video.style.height = 'auto';
    video.style.width = 'min(100%, ' + (46 * r).toFixed(2) + 'vh)';
  });
  video.addEventListener('ended', () => { videoDone = true; tryFinish(); });
  video.addEventListener('error', () => { hasVideo = false; vbox.style.display = 'none'; startRoll(CONFIG.creditsFallbackSeconds); });
  skip.addEventListener('click', finish);
  video.src = CONFIG.creditsVideoUrl;
  const pr = video.play();
  if (pr && pr.catch) pr.catch(() => {
    const b = el('button', 'credits-play', '▶ Запустить'); // браузер не дал автозапуск со звуком
    b.addEventListener('click', () => { b.remove(); video.play().catch(() => {}); });
    vbox.appendChild(b);
  });
}

function renderV3Final() {
  const first = CREDITS_PENDING;
  CREDITS_PENDING = false;
  const wrap = el('div', 'v3-final-wrap');
  const col = el('div', 'v3-final-col');
  const thanks = el('div', 'v3-final-thanks');
  thanks.textContent = 'Спасибо за прохождение!';
  const box = el('div', 'v3-final-msg');
  box.style.whiteSpace = 'pre-line';
  col.append(thanks, box);
  wrap.appendChild(col);

  let windowsBuilt = false;
  const show = (data) => {
    if (!wrap.isConnected) return;
    box.textContent = (data && data.message) || friendMessage(S.nick);
    if (data && !windowsBuilt) {
      windowsBuilt = true;
      buildOwnerWindows(wrap, data.answers);
    }
  };

  const boot = () => {
    startMemories(first);
    if (FINALE) { show(FINALE); return; }
    if (!serverSyncEnabled()) { show(null); return; }

    box.textContent = '…';
    // Данные ещё не пришли: пробуем ещё пару раз (сервер мог не успеть увидеть, что игрок дошёл до III).
    const attempt = (n) => loadFinale().then(d => {
      if (d) show(d);
      else if (n < 2 && wrap.isConnected) setTimeout(() => attempt(n + 1), 2500);
    });
    attempt(0);
    // Если сервер молчит — показываем запасное сообщение; пришедшие позже данные его заменят.
    setTimeout(() => { if (!FINALE && wrap.isConnected && box.textContent === '…') show(null); }, 9000);
  };

  if (first) startCredits(() => { app.appendChild(wrap); boot(); }); // финал появляется, когда титры заканчиваются
  else { app.appendChild(wrap); boot(); }
}
// Пока проверяется сохранённый пароль, показываем нейтральный экран проверки.
// Если сохранённого пароля нет, появится форма ввода. Поле ника до авторизации не создаётся.
showAccessChecking('Проверяем, есть ли сохранённый доступ…');

async function bootQuestAfterAccess() {
  await ensureSiteAccess();
  void loadQuestionBank().then(() => {
    if (S.screen !== 'intro' && !QUESTION_BANK) render();
  });
  if (!SERVER_TIME_READY) syncTrustedTime();
  setTimeout(refreshV2Stats, 3000); // не мешаем банку и времени — статистика нужна позже
  render();
}

void bootQuestAfterAccess();

// Проверка появления кнопки пропуска (только локально, без запросов).
setInterval(mountSkipButton, 20000);

window.__questBooted = true;
</script>
